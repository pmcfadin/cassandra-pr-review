# Refresh reports for open apache/cassandra PRs with the cheap pipeline only: ingest, requirement
# checks, static analysis, triage, lab plan. No AI lenses, no builds, no PR comments. Publishes to
# the gh-pages branch with the default token.
name: poll

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most PRs to refresh in this run"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: pr-polling
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the published site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Week key for the clone cache
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # A cache miss is fine: cpr makes the clone itself.
      - uses: actions/cache@v4
        with:
          path: .work/cassandra
          key: cassandra-clone-${{ steps.week.outputs.iso }}
          restore-keys: cassandra-clone-

      - uses: actions/cache@v4
        with:
          path: .work/tools
          key: cpr-tools-${{ hashFiles('cpr/config/static.json') }}

      - name: Install analysis tools
        run: bin/cpr tools install

      - name: Refresh reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
        run: bin/cpr poll --run --site site --limit "$LIMIT"

      - name: Publish to gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged"
            exit 0
          fi
          git commit -m "Refresh PR review reports"
          git push origin HEAD:gh-pages
