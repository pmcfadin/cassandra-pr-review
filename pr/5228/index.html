    var sug = cx.suggested_reviewers || [], already = cx.already_reviewing || [];
    if (!sug.length && !already.length) {
      append(card, h("p", "muted", cx.new_files_only ? "The PR only adds new files, so there is no prior history for the changed code."
        : "No committer has recent history with the changed files."));
    } else {
      if (sug.length) append(card, list(sug, personLine));
      if (already.length) {
        append(card, h("div", "eyebrow", "Already involved"));
        append(card, list(already, personLine));
      }
    }
    var cl = h("a", null, "Context details");
    cl.href = "#context";
    append(card, h("p", null, cl));
    return card;
  }

  function renderContext() {
    var cx = M.context || {};
    var out = [];
    if (cx.status !== "ok") {
      out.push(h("div", "notice s-unknown", cx.reason || "Reviewer context is not available."));
      out.push(docsBlock(sectionById.context));
      return out;
    }
    if (cx.new_files_only) out.push(h("div", "notice s-info", "The PR only adds new files, so there is no prior history for the changed code."));
    var b = cx.budget || {};
    if (b.hunks_skipped || b.files_skipped) {
      out.push(h("div", "notice s-info", "Work was bounded on this large PR: blamed " + b.hunks_blamed + " of " + b.hunks_total +
        " hunks (" + b.hunks_skipped + " skipped) and read history for " + b.files_logged + " of " + b.files_total + " files (" + b.files_skipped + " skipped). Production files were done first."));
    }
    if (cx.tickets_error) out.push(h("div", "notice s-unknown", "Ticket details could not be fetched: " + cx.tickets_error));

    var sug = cx.suggested_reviewers || [];
    out.push(block("Suggested reviewers", [sug.length ? table(["Committer", "Score", "Patches", "Reviews", "Latest", "Files"], sug.map(function (p) {
      return { cells: [h("span", null, [h("strong", null, p.name), p.asf_id ? h("span", "mono muted", " " + p.asf_id) : null]),
        { num: true, node: String(p.score) }, { num: true, node: String(p.patches) }, { num: true, node: String(p.reviews) }, p.latest,
        h("span", "mono", p.files.map(function (f) { return f.split("/").pop(); }).join(", "))] };
    })) : empty("No committer has recent history with the changed files.")].concat(
      (cx.already_reviewing || []).length ? [h("p", "muted", "Already involved (Reviewers field or ticket comments): " + cx.already_reviewing.map(function (p) { return p.name; }).join(", "))] : []), sug.length));

    var rt = cx.related_tickets || [];
    out.push(block("Tickets that last changed this code", [rt.length ? table(["Ticket", "Summary", "Status", "Lines", "Last changed"], rt.map(function (t) {
      var commits = details(plural(t.commits.length, "commit"), list(t.commits, function (c) { return [h("span", "mono", c.sha.slice(0, 10)), " " + c.date + " " + c.subject]; }));
      return { cells: [link(t.url, t.key, "mono"), h("div", null, [t.summary || h("span", "muted", "summary unavailable"), commits]),
        t.status ? t.status + (t.resolution ? " (" + t.resolution + ")" : "") : "", { num: true, node: String(t.lines) }, t.last_changed] };
    })) : empty("No earlier tickets own the changed lines.")], rt.length));

    var li = cx.linked_issues || [];
    if (li.length) out.push(block("Issues linked to this ticket", [table(["Relation", "Ticket", "Summary", "Status"], li.map(function (l) {
      return { cells: [l.relation || "", link(l.url, l.key, "mono"), l.summary || "", l.status || ""] };
    }))], li.length));

    var un = cx.untracked_commits || [];
    if (un.length) out.push(block("Commits without a ticket", [table(["Commit", "Date", "Subject", "Author", "Lines"], un.map(function (u) {
      return { cells: [h("span", "mono", u.sha.slice(0, 10)), u.date, u.subject, u.author, { num: true, node: String(u.lines) }] };
    }))], un.length));

    var ex = cx.experts || {};
    var paths = Object.keys(ex);
    out.push(block("Most experienced with each file", [paths.length ? h("div", null, paths.map(function (p) {
      var from = (cx.experts_from || {})[p];
      return h("div", "panel expert", [h("div", null, [h("span", "mono", p), from ? h("span", "muted", " · history from " + from) : null]), ex[p].length ? list(ex[p], function (x) {
        return [h("strong", null, x.name), x.asf_id ? h("span", "mono muted", " " + x.asf_id) : h("span", "muted", " (not matched to a committer)"),
          h("span", "muted", " · score " + x.score + " · " + x.patches + " authored, " + x.reviews + " reviewed · latest " + x.latest)];
      }) : h("p", "muted", "No commits in the last 5 years.")]);
    })) : empty("No existing files changed.")], paths.length));

    out.push(docsBlock(sectionById.context));
    return out;
  }

  function renderTriage() {
    var tr = M.triage || {};
    var out = [];
    out.push(block("Rating", [h("div", "panel", fields([
      ["Rating", h("strong", null, tr.rating || "unknown")],
      ["Points", String(tr.points || 0)],
      ["Forced to hard by", tr.forced_by || "nothing; rated by points"],
      ["Counted lines", tr.lines === undefined ? null : String(tr.lines)],
      ["Counted files", tr.files === undefined ? null : String(tr.files)]
    ]))]));
    out.push(block("Signals", [table(["Signal", "Value", "Points", "Why"], (tr.signals || []).map(function (s) {
      return { cls: s.points ? null : null, cells: [s.signal, String(s.value), { num: true, node: String(s.points || 0) }, s.why || ""] };
    }))], (tr.signals || []).length));
    var sp = tr.split_suggestion;
    if (sp) {
      out.push(block("Consider splitting", [h("div", "notice s-warn", [
        "This patch changes " + sp.src_lines + " production lines, over the " + sp.threshold + "-line threshold. The largest files:",
        list(sp.largest || [], function (f) { return [h("span", "mono", f.path), h("span", "muted", " · " + plural(f.lines, "line"))]; })
      ])]));
    }
    out.push(docsBlock(sectionById.triage));
    return out;
  }

  var SEV_ORDER = { blocker: 0, major: 1, minor: 2, nit: 3 };
  var SEV_STATUS = { blocker: "fail", major: "fail", minor: "warn", nit: "info" };
  function impactTags(x) {
    var tags = [];
    if (x.impact) tags.push(h("span", "tag impact", "impact: " + x.impact));
    if (x.confidence) tags.push(h("span", "tag confidence", "confidence: " + x.confidence));
    if (x.severity_corrected) tags.push(h("span", "tag corrected", "was " + x.severity_corrected.from));
    return tags;
  }
  function issueCard(i) {
    var card = h("article", "check issue s-" + (SEV_STATUS[i.severity] || "unknown"));
    card.setAttribute("data-issue", i.id);
    append(card, h("div", "check-head", [badge(SEV_STATUS[i.severity] || "unknown", i.severity), h("span", "ct", i.rule), h("span", "cid", i.id),
      h("span", "spacer"), (i.lenses || []).map(function (l) { return h("span", "tag lens-chip", l); })]));
    var meta = impactTags(i);
    if (meta.length) append(card, h("div", "check-head", meta));
    var locs = i.locations && i.locations.length ? i.locations : [i.location];
    append(card, h("p", "muted", locs.map(function (l, n) { return [n ? ", " : "", h("span", "mono", l)]; })));
    append(card, mdInline("p", i.problem, "csum"));
    append(card, h("div", "next", [h("span", "lead", "Fix"), mdInline("span", i.fix)]));
    (i.also_fixes || []).forEach(function (a) {
      append(card, h("div", "next also-fix", [h("span", "lead", "Also suggested by " + a.lens), mdInline("span", a.fix)]));
    });
    return card;
  }
  function reviewHeadline() {
    var rv = M.review || {};
    if (rv.status !== "ran" || !rv.issues) return null;
    var c = rv.counts || {};
    var findings = (c.blocker || 0) + (c.major || 0) + (c.minor || 0) + (c.nit || 0);
    var reporting = (rv.lenses || []).filter(function (l) { return (l.findings || []).length; }).length;
    return plural(rv.issues.length, "issue") + " (" + plural(findings, "finding") + " from " + plural(reporting, "lens").replace(/lenss$/, "lenses") + ")";
  }

  function renderReview() {
    var rv = M.review || {};
    var out = [];
    if (rv.status === "not-run" || !rv.status) {
      out.push(h("div", "notice s-unknown", [h("strong", null, "Not run in this version. "),
        "No code review lens has read this patch. The recommendation cannot go past “requirements met, unreviewed” until one does."]));
    } else {
      var lenses = rv.lenses || [];
      if (!lenses.length) out.push(empty("No lenses reported."));
      var counts = rv.counts || {};
      var panelState = !rv.complete ? "unknown" : (rv.approved ? "pass" : "fail");
      var panelText = !rv.complete ? "Panel incomplete: a lens is missing or returned invalid output, so this cannot count as an approval."
        : (rv.approved ? "Every lens approved with no blocker or major findings." : "At least one lens did not approve, or a blocker/major finding was reported.");
      out.push(h("div", "notice s-" + panelState, [badge(panelState, !rv.complete ? "incomplete" : (rv.approved ? "approved" : "not approved")), " ", panelText,
        h("span", "muted", " Findings: " + ["blocker", "major", "minor", "nit"].map(function (k) { return (counts[k] || 0) + " " + k; }).join(", ") + ".")]));
      if (rv.checklists && rv.checklists.sha)
        out.push(h("p", "muted checklists", "checklists: apache/cassandra trunk @ " + short(rv.checklists.sha, 10)));
      var issues = rv.issues || [];
      if (rv.issues) {
        out.push(block("Issues", issues.length ? [h("div", "checks issues", issues.map(issueCard))]
          : [empty("No issues reported.")], issues.length));
      }
      var detail = [];
      lenses.forEach(function (lens) {
        var fs = (lens.findings || []).slice().sort(function (a, b) { return (SEV_ORDER[a.severity] - SEV_ORDER[b.severity]); });
        var lst = lens.status !== "ran" ? "unknown" : (lens.approve ? "pass" : "fail");
        var lword = lens.status !== "ran" ? lens.status : (lens.approve ? "approved" : "declined");
        var head = h("div", "lens-head", [badge(lst, lword), h("span", "mono muted", " " + (lens.agent || ""))]);
        var intro = [head];
        if (lens.error) intro.push(h("p", "csum", "Error: " + lens.error));
        if (lens.summary) intro.push(mdInline("p", lens.summary, "csum"));
        if (lens.status === "ran" && lens.tests_detail) intro.push(h("p", "muted", "Tests: " + (lens.tests_ran || "") + " — " + lens.tests_detail));
        if (lens.status !== "ran") { detail.push(block(lens.name, intro, 0)); return; }
        detail.push(block(lens.name, intro.concat([fs.length ? h("div", "checks", fs.map(function (f) {
          return h("article", "check s-" + (SEV_STATUS[f.severity] || "unknown"), [
            h("div", "check-head", [badge(SEV_STATUS[f.severity] || "unknown", f.severity), h("span", "ct", f.rule), h("span", "cid", f.id),
              impactTags(f), h("span", "spacer"), h("span", "mono muted", f.location)]),
            mdInline("p", f.problem, "csum"),
            h("div", "next", [h("span", "lead", "Fix"), mdInline("span", f.fix)])
          ]);
        })) : empty("No findings from this lens.")]), fs.length));
      });
      out.push(h("h3", "lens-detail-title", "Per-lens detail"));
      out = out.concat(detail);
    }
    out.push(docsBlock(sectionById.review));
    return out;
  }

  function decodeB64Utf8(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function renderChanges() {
    var dv = M.diffview || {};
    var files = M.files || [];
    var out = [];
    var ok = dv.status === "ok" && dv.html_b64;
    if (ok) {
      var frame = document.createElement("iframe");
      frame.className = "diff-frame";
      frame.setAttribute("sandbox", "allow-scripts");
      frame.setAttribute("title", "Diff view for PR #" + pr.number);
      frame.setAttribute("referrerpolicy", "no-referrer");
      try {
        frame.srcdoc = decodeB64Utf8(String(dv.html_b64));
        out.push(frame);
      } catch (e) {
        ok = false;
        out.push(h("div", "notice s-unknown", [h("strong", null, "Diff view could not be decoded. "), "The file list below is shown instead."]));
      }
      if (dv.version) out.push(h("p", "muted no-print", "Diff view from ide-explain " + dv.version + "."));
    } else {
      out.push(h("div", "notice s-unknown", [h("strong", null, "Diff view unavailable. "), dv.reason || "No reason recorded."]));
    }
    var om = dv.omitted || [];
    if (om.length) out.push(block("Left out of the diff view", [list(om, function (o) { return mdInline("span", typeof o === "string" ? o : JSON.stringify(o)); })], om.length));
    var ft = details("Files changed (" + files.length + ")", fileTable(files), { open: !ok });
    ft.id = "changes-files";
    out.push(h("div", "block", ft));
    out.push(docsBlock(sectionById.changes));
    return out;
  }

  function renderAbout() {
    var a = M.about || {};
    var inp = a.inputs || {};
    var tool = M.tool || {};
    var out = [];
    out.push(block("This report", [h("div", "panel", fields([
      ["Tool", (tool.name || "") + " " + (tool.version || "")],
      ["Generated", M.generated_at],
      ["Model schema", String(M.schema)]
    ].concat(Object.keys(inp).map(function (k) {
      var v = inp[k];
      var label = k.replace(/_/g, " ");
      label = label.charAt(0).toUpperCase() + label.slice(1);
      return [label, v === null || v === undefined ? null : h("span", /sha|merge_base/.test(k) ? "mono" : null, String(v))];
    }))))]));
    out.push(block("Not checked by this tool", [list(a.not_checked || [], function (x) { return mdInline("span", x); })], (a.not_checked || []).length));
    out.push(block("Needs a human", [list(a.human_only || [], function (x) { return mdInline("span", x); })], (a.human_only || []).length));
    return out;
  }

  function renderGeneric(sec) { return [checksBlock(sec), docsBlock(sec)]; }

  var RENDERERS = {
    summary: function (s) { return renderSummary().concat([docsBlock(s)]); },
    ticket: function (s) { return renderTicket().concat([docsBlock(s)]); },
    ci: renderCi, testing: renderTesting, commits: renderCommits, compatibility: renderCompat,
    votes: renderVotes, triage: renderTriage, context: renderContext, review: renderReview, changes: renderChanges, about: renderAbout
  };

  // -------------------------------------------------------------------------
  // Build page
  // -------------------------------------------------------------------------
  document.title = "PR #" + pr.number + ": " + (pr.title || "") + " — Cassandra PR review";
  var navPr = document.getElementById("nav-pr");
  append(navPr, link(pr.url, "PR #" + pr.number));
  append(document.getElementById("nav-verdict"), badge(verdictStatus, (M.recommendation && M.recommendation.verdict || "").replace(/-/g, " ")));
  append(document.getElementById("nav-foot"), [(M.tool && M.tool.name) + " " + (M.tool && M.tool.version), h("br"), "Generated " + (M.generated_at || "")]);

  var navList = document.getElementById("nav-list");
  var content = document.getElementById("content");
  var navLinks = {}, sectionEls = {};
  M.sections.forEach(function (s) {
    var a = h("a", null, [h("span", null, s.title), badge(s.status)]);
    a.href = "#" + s.id;
    a.setAttribute("aria-label", s.title + ", status " + STATUS[st(s.status)].w);
    navLinks[s.id] = a;
    navList.appendChild(h("li", null, a));

    var el = h("section", "report-section");
    el.id = "section-" + s.id;
    el.setAttribute("data-section", s.id);
    el.setAttribute("aria-labelledby", "h-" + s.id);
    var h2 = h("h2", null, s.title);
    h2.id = "h-" + s.id;
    h2.tabIndex = -1;
    append(el, h("div", "sec-head", [h2, badge(s.status)]));
    var body;
    try {
      body = (RENDERERS[s.id] || renderGeneric)(s);
    } catch (e) {
      if (typeof console !== "undefined") console.error(e);
      body = [h("div", "notice s-fail", [h("strong", null, "This section failed to render. "), String(e && e.message || e)])];
    }
    append(el, body.filter(Boolean));
    content.appendChild(el);
    sectionEls[s.id] = el;
  });

  // -------------------------------------------------------------------------
  // Routing: one section at a time, current section in location.hash.
  // -------------------------------------------------------------------------
  var crumb = document.getElementById("crumb");
  var current = null, pendingCheck = null, focusHeading = false;
  function show(id) {
    if (!sectionEls[id]) id = sectionEls.summary ? "summary" : sectionIds[0];
    if (current !== id) {
      Object.keys(sectionEls).forEach(function (k) {
        sectionEls[k].classList.toggle("active", k === id);
        if (k === id) navLinks[k].setAttribute("aria-current", "page"); else navLinks[k].removeAttribute("aria-current");
      });
      current = id;
      crumb.textContent = "";
      append(crumb, ["PR #" + pr.number + " · ", h("strong", null, sectionById[id].title)]);
      window.scrollTo(0, 0);
    }
    if (pendingCheck) {
      var card = document.getElementById("check-" + pendingCheck);
      pendingCheck = null;
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.classList.add("flash");
        setTimeout(function () { card.classList.remove("flash"); }, 1600);
      }
    } else if (focusHeading) {
      var hd = document.getElementById("h-" + id);
      if (hd) hd.focus({ preventScroll: true });
    }
    focusHeading = false;
  }
  function route() { show(decodeURIComponent((location.hash || "").replace(/^#/, ""))); }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a) return;
    pendingCheck = a.getAttribute("data-check");
    focusHeading = true;
    closeNav();
    if (a.getAttribute("href") === location.hash) { ev.preventDefault(); show(location.hash.slice(1)); }
  });
  if (!location.hash || !sectionEls[location.hash.slice(1)]) {
    try { history.replaceState(null, "", "#summary"); } catch (e) { /* file:// in some browsers */ }
  }
  route();

  // -------------------------------------------------------------------------
  // Narrow-screen nav
  // -------------------------------------------------------------------------
  var navToggle = document.getElementById("nav-toggle");
  var scrim = null;
  function openNav() {
    document.body.classList.add("nav-open");
    navToggle.setAttribute("aria-expanded", "true");
    scrim = h("div");
    scrim.id = "nav-scrim";
    scrim.addEventListener("click", closeNav);
    document.body.appendChild(scrim);
    var cur = navLinks[current];
    if (cur) cur.focus();
  }
  function closeNav() {
    if (!document.body.classList.contains("nav-open")) return;
    document.body.classList.remove("nav-open");
    navToggle.setAttribute("aria-expanded", "false");
    if (scrim) { scrim.remove(); scrim = null; }
  }
  navToggle.addEventListener("click", function () {
    if (document.body.classList.contains("nav-open")) { closeNav(); navToggle.focus(); } else openNav();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && document.body.classList.contains("nav-open")) { closeNav(); navToggle.focus(); }
  });

  // -------------------------------------------------------------------------
  // Theme: system -> light -> dark, remembered per browser.
  // -------------------------------------------------------------------------
  var THEMES = ["system", "light", "dark"];
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = "Theme: " + t;
    themeBtn.setAttribute("aria-label", "Colour theme: " + t + ". Activate to change.");
  }
  var theme = "system";
  try { theme = localStorage.getItem("cpr-theme") || "system"; } catch (e) { /* storage blocked */ }
  if (THEMES.indexOf(theme) < 0) theme = "system";
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    try { localStorage.setItem("cpr-theme", theme); } catch (e) { /* storage blocked */ }
  });

  // -------------------------------------------------------------------------
  // Print: open every <details> while printing, then restore.
  // -------------------------------------------------------------------------
  var reopened = [];
  window.addEventListener("beforeprint", function () {
    reopened = Array.prototype.filter.call(document.querySelectorAll("details:not([open])"), function (d) { d.open = true; return true; });
  });
  window.addEventListener("afterprint", function () {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  });
})();
</script>
</body>
