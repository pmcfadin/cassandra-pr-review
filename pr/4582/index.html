<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cassandra PR review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Design tokens and shared components. One source for the report and the site index: render.py
   inlines this file into both. Colours come from the owner's design (docs/design/report-v2.dc.html).
   No other hex value appears anywhere else in either page. Light theme only. Fonts load from Google
   Fonts when online; the system fallbacks keep both pages readable offline.
   --------------------------------------------------------------------------- */
:root {
  /* Surfaces and ink */
  --bg: #F3F5F8; --panel: #FFFFFF; --soft: #F8FAFC; --soft-2: #F4F6FA; --code-bg: #F0F3F7;
  --ink: #0F2236; --ink-2: #34445A; --ink-3: #56657A;
  --rule: #D9DEE5; --rule-2: #E4E8EE; --rule-3: #EEF1F5; --chip-line: #C9D1DC; --bar-off: #DDE1E7;
  --link: #0B5CAD; --link-hover: #083F78; --hover: #F3F6FA; --flash: rgba(11, 92, 173, .35);

  /* Navigation (dark column) */
  --navy: #0F2236; --navy-active: #1F3A5C; --navy-hover: #172C45; --navy-line: #3A5373;
  --navy-ink: #D3DDEA; --navy-mute: #9DB0C7; --navy-dot: #7E94AF; --on-navy: #FFFFFF;
  --nav-fail: #FF8A5C; --nav-should: #F2C14E; --nav-note: #8FB8EA; --nav-unknown: #C9BDF2; --nav-pass: #4FD1C0; --nav-na: #8A9BB0;

  /* Status chips: text on tint is at least 4.5:1. icon is the stroke colour on light backgrounds. */
  --fail-fg: #8A2606; --fail-bg: #FDEDE6; --fail-icon: #C0360C;
  --should-fg: #5E4300; --should-bg: #FBF3DC; --should-icon: #8C6400;
  --note-fg: #083F78; --note-bg: #E6EEF8; --note-icon: #0B5CAD;
  --pass-fg: #005A52; --pass-bg: #E3F4F1; --pass-icon: #00766C;
  --unknown-fg: #4B3A8C; --unknown-bg: #ECE8F6; --unknown-icon: #5B49A8;
  --na-fg: #56657A; --na-bg: #EEF1F5; --na-icon: #6B7684;

  /* Type scale */
  --sans: 'Red Hat Text', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: 'Red Hat Mono', ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 17px; --fs-h2: 22px; --fs-h1: 24px; --fs-verdict: 26px;

  /* Spacing and radii (chips 3px, cards 6px, buttons 8px) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --r-chip: 3px; --r-card: 6px; --r-btn: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-base)/1.55 var(--sans); }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: var(--link-hover); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: var(--r-card); }
code, .mono { font-family: var(--mono); font-size: 0.9em; overflow-wrap: anywhere; }
code { background: var(--code-bg); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
p { margin: 6px 0; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
svg { flex: none; }
[hidden] { display: none !important; }

/* Cards, status chips, counts, tags, buttons: the pieces both pages share */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-card); overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; padding: 3px 10px; border-radius: var(--r-chip); white-space: nowrap; color: var(--c-fg); background: var(--c-bg); }
.chip.wide { width: 104px; flex: none; }
.s-fail { --c-fg: var(--fail-fg); --c-bg: var(--fail-bg); --c-icon: var(--fail-icon); }
.s-should { --c-fg: var(--should-fg); --c-bg: var(--should-bg); --c-icon: var(--should-icon); }
.s-note { --c-fg: var(--note-fg); --c-bg: var(--note-bg); --c-icon: var(--note-icon); }
.s-pass { --c-fg: var(--pass-fg); --c-bg: var(--pass-bg); --c-icon: var(--pass-icon); }
.s-unknown { --c-fg: var(--unknown-fg); --c-bg: var(--unknown-bg); --c-icon: var(--unknown-icon); }
.s-na { --c-fg: var(--na-fg); --c-bg: var(--na-bg); --c-icon: var(--na-icon); }
.tag { display: inline-block; font-size: var(--fs-xs); color: var(--ink-3); border: 1px solid var(--rule); border-radius: var(--r-chip); padding: 1px 8px; white-space: nowrap; height: fit-content; }
.tag.strong { color: var(--ink); border-color: var(--ink-3); }
.count { min-width: 22px; text-align: center; font-size: var(--fs-sm); font-weight: 600; padding: 1px 6px; border-radius: var(--r-chip); color: var(--na-fg); background: var(--na-bg); }
.count.must { color: var(--fail-fg); background: var(--fail-bg); }
.outline-btn { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-md); font-weight: 500; color: var(--link); padding: 10px 14px; min-height: 44px; border: 1px solid var(--chip-line); border-radius: var(--r-btn); background: var(--panel); text-decoration: none; }
.outline-btn:hover { background: var(--hover); color: var(--link); }
.linkbtn { font-size: var(--fs-md); font-weight: 500; color: var(--link); min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.linkbtn:hover { color: var(--link-hover); text-decoration: underline; }
.notice { border: 1px solid var(--rule); border-left-width: 4px; border-radius: var(--r-card); padding: 10px 14px; background: var(--panel); margin: 6px 0; font-size: 15px; overflow-wrap: anywhere; }
.notice.s-fail { border-left-color: var(--fail-icon); } .notice.s-should { border-left-color: var(--should-icon); }
.notice.s-unknown { border-left-color: var(--unknown-icon); } .notice.s-note { border-left-color: var(--note-icon); }
.notice.s-pass { border-left-color: var(--pass-icon); } .notice.s-na { border-left-color: var(--na-icon); }
.notice .why { display: block; color: var(--ink-3); font-size: var(--fs-md); margin-top: 2px; }
.empty { color: var(--ink-3); font-style: italic; }
</style>
<style>
pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; background: var(--soft); border: 1px solid var(--rule-2);
  border-radius: var(--r-card); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; max-width: 100%; }
pre code { background: none; border: 0; padding: 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.chev { transition: transform .15s; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev { transform: rotate(180deg); }
.row:hover { background: var(--hover); }
.stack > *, .gx > *, .cc-body > *, .bg-card > *, .blk, .group-body, .card { min-width: 0; max-width: 100%; }

/* ---------------------------------------------------------------------------
   Shell: dark nav on the left, one scrolling column on the right
   --------------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.navcol { background: var(--navy); }
#nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 24px 14px 24px; display: flex; flex-direction: column; gap: 22px; }
.nav-head { padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-mute); }
.nav-pr { font-size: 22px; font-weight: 700; color: var(--on-navy); text-decoration: none; letter-spacing: -0.01em; }
.nav-pr:hover { color: var(--on-navy); text-decoration: underline; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 3px; }
#nav-toggle { display: none; color: var(--navy-ink); border: 1px solid var(--navy-line); border-radius: 6px; min-height: 44px; padding: 0 14px; align-items: center; gap: 8px; font-size: 15px; }
#nav-body { display: flex; flex-direction: column; gap: 22px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group .eyebrow { padding: 0 8px 6px; }
.nav-link { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 3px; text-decoration: none; font-size: 15px; color: var(--navy-ink); }
.nav-link:hover { background: var(--navy-hover); color: var(--on-navy); }
.nav-link[aria-current="location"] { background: var(--navy-active); color: var(--on-navy); font-weight: 600; }
.nav-link:focus-visible { outline-color: var(--on-navy); }
.nav-link .lbl { flex: 1; min-width: 0; }
.nav-link .cnt { font-size: 12px; color: var(--navy-mute); }
.nav-ic.nav-fail { color: var(--nav-fail); } .nav-ic.nav-should { color: var(--nav-should); } .nav-ic.nav-note { color: var(--nav-note); }
.nav-ic.nav-unknown { color: var(--nav-unknown); } .nav-ic.nav-pass { color: var(--nav-pass); } .nav-ic.nav-na { color: var(--nav-na); }
.nav-dot { flex: none; width: 14px; display: flex; justify-content: center; }
.nav-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-dot); display: block; }
.nav-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--navy-mute); display: flex; flex-direction: column; gap: 2px; }

.col { min-width: 0; }
header.pr { background: var(--panel); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
header.pr .wrap { padding-top: 22px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-3); }
.facts .mono { font-size: 13px; color: var(--ink); }
.facts .tag { font-size: 12px; }
.add { color: var(--pass-icon); } .del { color: var(--fail-icon); }
h1.title { font-size: 24px; font-weight: 600; max-width: 52ch; overflow-wrap: anywhere; }
.ticket-line { margin: 0; font-size: 14px; color: var(--ink-3); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 36px; }
section[id], div[id^="sec-"], div[id^="bg-"], div[id^="check-"], li[id^="check-"] { scroll-margin-top: 12px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-head > div { display: flex; flex-direction: column; gap: 4px; }
h2.sec { font-size: 22px; font-weight: 600; }
.sub { margin: 0; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 16px; }
/* ---------------------------------------------------------------------------
   Verdict and To do
   --------------------------------------------------------------------------- */
.verdict { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding: 18px 24px; }
.verdict-main { display: flex; gap: 14px; align-items: center; flex: 1 1 340px; min-width: 0; }
.v-icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--c-fg); background: var(--c-bg); }
.v-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.v-text h2 { font-size: 26px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.v-text p { margin: 0; color: var(--ink-2); }
.v-text p.note { font-size: 14px; color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
.steps li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 3px; font-size: 14px; font-weight: 500; margin: 0; color: var(--c-fg); background: var(--c-bg); }
.v-extra { border-top: 1px solid var(--rule-2); padding: 0 24px 4px; }
.todo { border-top: 1px solid var(--rule-2); }
.todo-head { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 24px; min-height: 48px; background: var(--soft); }
.todo-head .t { font-weight: 600; }
.todo-head .r { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink-2); }
.todo-head .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--link); }
.role { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule-2); }
.role-name { flex: 0 0 170px; padding: 14px 20px; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; }
.role-name small { font-weight: 400; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.role ul { list-style: none; margin: 0; padding: 0; flex: 1 1 360px; min-width: 0; }
.role li { margin: 0; }
.todo-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 20px 10px 0; min-height: 44px; }
.todo-item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; }
.todo-item .tt { font-weight: 500; }
.todo-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--ink-3); }
.todo-item .loc { font-family: var(--mono); font-size: 12.5px; }
.todo-item .src { padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; font-size: 12px; color: var(--ink-2); }
.todo-item .step-mark { display: inline-flex; color: var(--na-icon); }
.role-name .phase { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.todo-detail { padding: 0 20px 12px 24px; font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.todo-detail p { margin: 0; }
.todo-detail .tg { font-size: 12px; color: var(--ink-3); }
.todo:not(.show-opt) .opt { display: none; }
.todo:not(.show-opt) .role.only-opt { display: none; }
#opt-toggle { width: 100%; padding: 12px 20px; min-height: 44px; font-size: 14px; font-weight: 500; color: var(--link); background: var(--soft); border-top: 1px solid var(--rule-2); }

/* ---------------------------------------------------------------------------
   Check groups
   --------------------------------------------------------------------------- */
.group { border-bottom: 1px solid var(--rule-2); }
.group:last-child { border-bottom: 0; }
.group-head { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px 20px; min-height: 56px; }
.group-head .l { display: flex; align-items: center; gap: 12px; flex: 1 1 280px; min-width: 0; font-weight: 600; font-size: 16px; }
.group-head .r { flex: 999 1 280px; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 15px; }
.group-head .r .sum { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.group-head .r .n { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.group-body { background: var(--soft); padding: 4px 20px 18px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist > li { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: 4px; background: var(--panel); margin: 0; }
.ck-icon { flex: none; margin-top: 2px; width: 20px; display: flex; justify-content: center; }
.ck-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ck-title { font-weight: 500; overflow-wrap: anywhere; }
.ck-sum { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.ck-ev { margin: 2px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.ck-ev.capped:not(.all) > li.more { display: none; }
.ev-more { align-self: flex-start; min-height: 40px; }
.howfix { margin-top: 6px; font-size: 14px; background: var(--soft-2); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.ck-tags { flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ck-flash { box-shadow: 0 0 0 3px var(--flash); }
.gx { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.gx .blk > h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.gx .blk > h3 .count { font-size: 12px; }
.gx .blk h4 { font-size: var(--fs-md); font-weight: 600; margin: 14px 0 6px; }
.gx .blk > h4 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 16px; }
/* Tables (.dtable), field lists, details */
.pm-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
.pm-cat { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--r-card); background: var(--c-bg); color: var(--c-fg); border-left: 3px solid var(--c-icon); min-width: 0; }
.pm-cat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.pm-cat span { font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pm-cat.zero { opacity: .55; }
.pm-table table { table-layout: fixed; }
.pm-table th:nth-child(2) { width: 150px; } .pm-table th:nth-child(3) { width: 100px; } .pm-table th:nth-child(4) { width: 100px; }
.pm-table .mono { overflow-wrap: anywhere; word-break: break-all; }
.pm-rule { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; }
.pm-locs { list-style: none; margin: 4px 0 0; padding: 0; font-size: var(--fs-sm); }
.pm-locs li { padding: 3px 0; border-top: 1px solid var(--rule-2); overflow-wrap: anywhere; }
.pm-locs .mono { font-size: var(--fs-sm); }
.pm-base { font-size: var(--fs-sm); color: var(--ink-2); margin: 8px 0; }
.pm-house, .pm-usual { margin-top: 12px; }
.pm-table tr.pm-untyped td { opacity: .55; }
.pm-table tr.pm-untyped .pm-rule { text-decoration: line-through; text-decoration-thickness: 1px; }
.pm-need { font-size: var(--fs-sm); color: var(--ink-2); }
@media (max-width: 640px) { .pm-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pm-table th:nth-child(n) { width: auto; } }
.cx-score { display: inline-block; min-width: 34px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--r-chip); color: var(--c-fg); background: var(--c-bg); border-left: 3px solid var(--c-icon); }
.cx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); margin: 6px 0 10px; }
.cx-table td:first-child { width: 64px; }
.cx-table .tag { margin-left: 8px; }
.s-crit { --c-fg: var(--on-navy); --c-bg: var(--fail-icon); --c-icon: var(--fail-fg); }
.cx-faded td { opacity: .55; }
.cx-split td { background: var(--soft, transparent); font-size: var(--fs-sm); padding-top: 12px; }
.cx-up { color: var(--fail-fg); font-weight: 600; } .cx-down { color: var(--pass-fg); font-weight: 600; }
.cx-file { font-size: var(--fs-sm); margin-top: 2px; overflow-wrap: anywhere; }
.cx-table td:nth-child(2) { width: 90px; }
.dtable { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--panel); max-width: 100%; }
.dtable table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
.dtable th, .dtable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; overflow-wrap: break-word; }
.dtable th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); background: var(--soft); white-space: nowrap; }
.dtable tbody tr:last-child td { border-bottom: 0; }
.dtable td.num, .dtable th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtable .mono { font-size: var(--fs-sm); overflow-wrap: break-word; }
.dtable tr.self td { background: var(--note-bg); }
.dtable.capped:not(.all) tr.more { display: none; }
.dtable .dt-more { display: flex; width: 100%; justify-content: center; border-top: 1px solid var(--rule-2); background: var(--soft); min-height: 44px; }
.dtable .ck-title { font-weight: 500; }
.dtable .paths { display: flex; flex-direction: column; gap: 2px; }
.nowrap { white-space: nowrap; }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: var(--fs-md); }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--panel); margin: 8px 0; }

<script id="report-model">window.REPORT_MODEL = {"schema":1,"generated_at":"2026-10-09 13:26 UTC","tool":{"name":"cassandra-pr-review","version":"0.1.0"},"pr":{"number":4582,"url":"https://github.com/apache/cassandra/pull/4582","title":"CEP-38: Management API MVP Implementation [CASSANDRA-19476]","body":"# CEP-38: Management API MVP Implementation\r\n\r\n## Summary\r\n\r\nThis PR implements the mvp of CEP-38, enabling server-side execution of ops commands via a native management transport and CQL interface. This eliminates the need for external JMX connections.\r\n\r\nSee: https://cwiki.apache.org/confluence/display/CASSANDRA/CEP-38%3A+CQL+Management+API\r\n\r\n## Key Features\r\n\r\n### 1. Management API Infrastructure\r\n\r\n- **CommandInvokerService**: Central service managing command registry lifecycle and execution\r\n- **Command Registry**: Hierarchical command registry supporting nested commands\r\n- **Command Metadata**: Structured metadata for commands, options, and parameters\r\n- **Execution Context**: Server-side execution context with `NodeProbe` integration for in-process MBean access\r\n\r\n### 2. Native Management Transport\r\n\r\n- **NativeTransportManagementService**: Separate native transport server on port 11211 (configurable via `native_transport_management_port`)\r\n- **Dedicated Executor**: Management connections use a separate thread pool (`managementExecutor`) for isolation and prioritization\r\n- **Connection Flagging**: Management connections are flagged at connection setup and routed to the management executor\r\n- **Request Validation**: Only `COMMAND` statements are allowed on management connections; other CQL operations are rejected\r\n\r\n### 3. CQL Command Execution\r\n\r\n- **ExecuteCommandStatement**: New CQL statement syntax: `COMMAND \u003ccommandName> [WITH key1 = value1 AND key2 = value2]`\r\n- **Result Format**: Commands return a result set with `execution_id` (UUID) and `output` (String) columns\r\n- **Argument Parsing**: Supports CQL string literals, lists, and proper escaping\r\n- **Error Handling**: Structured exceptions for validation, authorization, and execution errors\r\n\r\n### 4. Picocli Integration\r\n\r\n- **PicocliCommandsProvider**: Automatically discovers and registers all nodetool commands\r\n- **Command Adapters**: `PicocliCommandAdapter` and `PicocliCommandRegistryAdapter` bridge picocli commands to the management API\r\n- **Metadata Extraction**: Automatic extraction of command metadata from picocli annotations\r\n- **Argument Conversion**: Bidirectional conversion between picocli command objects and `CommandExecutionArgs`\r\n\r\n### 5. Server-Side Execution\r\n\r\n- **InternalNodeMBeanAccessor**: In-process MBean accessor eliminating JMX/RMI overhead\r\n- **Direct Instance Access**: Direct access to singleton instances\r\n- **Performance Benefits**: No serialization/deserialization, no network overhead, better performance\r\n- **NodeProbe Integration**: `NodeProbe` supports remote jmx and server-side in-process execution modes\r\n\r\n### 6. JMX/Dynamic MBean Support\r\n\r\n- **CommandMBean**: Each command is exposed as an dynamic MBean for JMX access and for auditing exections\r\n- **MBean Registration**: Commands are automatically registered as MBeans under `org.apache.cassandra.management:type=Command,name=\u003ccommandName>`\r\n\r\n### 7. Nodetool Integration\r\n\r\n- **CqlCommandExecutionStrategy**: New execution strategy allowing nodetool to execute commands via CQL\r\n- **Protocol-Aware Execution**: Nodetool can choose between JMX, CQL, or other protocols based on connection configuration\r\n- **Seamless Integration**: Existing nodetool commands work without modification\r\n\r\n## Configuration\r\n\r\n- `start_native_management_transport`: Enable/disable management transport (default disabled - `false`)\r\n- `native_transport_management_port`: Port for management transport (default: `11211`)\r\n- `native_transport_management_max_threads`: Thread pool size for management operations\r\n\r\n## Limitations\r\n\r\n- **Authentication**: Currently only supported with `AllowAllAuthenticator` (authentication disabled). Full authentication and authorization support is planned for future releases.\r\n- **CQL Commands**: `DESCRIBE COMMAND` will be introduces later\r\n- **Virtual Tables**: Visibility will be introduced later\r\n\r\n## Related\r\n\r\n- CEP-38: https://cwiki.apache.org/confluence/display/CASSANDRA/CEP-38%3A+CQL+Management+API\r\n- Builds on existing nodetool command infrastructure\r\n- Integrates with existing native transport and CQL infrastructure\r\n\r\n## Example Usage\r\n\r\n```\r\n > ./nodetool -Dcassandra.cli.execution.protocol=cql status\r\nConnecting to 127.0.0.1:11211 via CQL...\r\nDatacenter: datacenter1\r\n=======================\r\nStatus=Up/Down\r\n|/ State=Normal/Leaving/Joining/Moving\r\n--  Address    Load        Tokens  Owns (effective)  Host ID                               Rack \r\nUN  127.0.0.1  189,06 KiB  16      100,0%            6d194555-f6eb-41d0-c000-000000000001  rack1\r\n\r\n\r\nCommand execution id: 44bea459-d884-4433-9da3-ad14b42ca942\r\n```\r\n\r\n```\r\n> ./cqlsh 127.0.0.1 11211\r\nConnected to Test Cluster at 127.0.0.1:11211\r\n[cqlsh 6.3.0 | Cassandra 5.1-SNAPSHOT | CQL spec 3.4.8 | Native protocol v5]\r\nUse HELP for help.\r\ncqlsh> COMMAND status;\r\n\r\n execution_id                         | output\r\n--------------------------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\r\n cf30c137-88d7-4422-8248-d571093872f3 | Datacenter: datacenter1\\n=======================\\nStatus=Up/Down\\n|/ State=Normal/Leaving/Joining/Moving\\n--  Address    Load        Tokens  Owns (effective)  Host ID                               Rack \\nUN  127.0.0.1  139,76 KiB  16      100,0%            6d194555-f6eb-41d0-c000-000000000001  rack1\\n\\n\r\n\r\ncqlsh> \r\n```\r\n\r\n```\r\n-- Execute a command via CQL\r\nINVOKE COMMAND status;\r\n\r\n-- Execute a command with parameters\r\nINVOKE COMMAND forcecompact WITH \"keyspace\" = 'mykeyspace' AND \"table\" = 'mytable' AND keys = ['key1', 'key2'];\r\n```\r\n","author":"Mmuzaf","author_association":"CONTRIBUTOR","base":"trunk","head_ref":"cassandra-19476","head_repo":"Mmuzaf/cassandra","head_sha":"9f110e9abd64afd95992215bd490195cc4f1caf7","draft":false,"state":"open","labels":["needs-committer"],"created_at":"2026-01-26T09:54:24Z","updated_at":"2026-09-30T14:26:30Z","additions":11031,"deletions":1245,"changed_files":178},"jira_key":{"key":"CASSANDRA-19476","sources":["title","branch","commits"],"conflicts":[],"mentioned":["CASSANDRA-19476"]},"jira":{"status":"ok","error":null,"ticket":{"key":"CASSANDRA-19476","url":"https://issues.apache.org/jira/browse/CASSANDRA-19476","summary":"MVP CQL Management API","status":"Patch Available","resolution":null,"issuetype":"Improvement","components":["CQL/Interpreter","CQL/Syntax","Tool/nodetool"],"fix_versions":["7.x"],"since_versions":[],"reviewers":[],"authors":[{"name":"mmuzaf","display":"Maxim Muzafarov"}],"assignee":[{"name":"mmuzaf","display":"Maxim Muzafarov"}],"test_doc_plan":"https://cwiki.apache.org/confluence/display/CASSANDRA/CEP-38%3A+CQL+Management+API","impacts":["None"],"description":"We want to run management commands via CQL.\r\nThe goals are:\r\n* To provide a way to run predefined management commands via CQL;\r\n* To provide a mechanism for retrieving command definitions and metadata via CQL;\r\n* To provide information on all available management commands via virtual tables;\r\n* To provide a registry that stores all C* commands and their metadata accordingly;\r\n* To internal instrumentation and a reasonable plan for migrating cluster management from JMX to CQL, taking into account backward compatibility and adopted deprecation policies;\r\n\r\nThe discussion on the ML:\r\nhttps://lists.apache.org/thread/pow83q92m666nqtwyw4m3b18nnkgj2y8\r\n\r\nThe design document:\r\nhttps://cwiki.apache.org/confluence/display/CASSANDRA/CEP-38%3A+CQL+Management+API","comments":[{"id":"17837675","author":"mmuzaf","display":"Maxim Muzafarov","created":"2024-04-16T11:09:34.305+0000","body":"I've spent some time prototyping the changes and the plan may be the following, splitting by the issues:\r\n # _Replace the airline with the picocli._ CASSANDRA-17445 The airlift library is now used to expose the management commands via the CLI. We can reuse this approach to keep the number of changes low, however, we need to replace the library with the picocli as the airlift has drawbacks. It prevents us from building JMX and CQL APIs in follows:\r\n ## The airlift library is no longer supported. It doesn't make sense to build a new code on top of deprecated annotations;\r\n ## The library handles the `[\u003ckeyspace> \u003ctables>...]` as a single input argument, but we need to handle it independently as two input arguments `keyspace` and `tables` to build JMX and CQL APIs;\r\n ## All commands right now have host, port, username, and password options etc. which are not relevant to other types of public APIs;\r\n # {_}Create an adapter that builds dynamic JMX MBeans{_}, and parses the picocli annotations of the commands we already have. This will expose these commands with the same parameters and options that they have in the CLI, matching the nodetool CLI input. The management MBeans of the internal components e.g. StorageServiceMBean can be injected into the commands directly when the command context is initialized.\r\n # _Create a CQL command adapter._ Based on the commands annotations we can create a new adapter that handles command parameters received from the binary protocol, this is basically the same as new dynamic MBeans with the caveat that the binary protocol have to be improved to support new operation types.\r\n\r\nOptions 2 and 3 can be implemented independently.","url":"https://issues.apache.org/jira/browse/CASSANDRA-19476?focusedCommentId=17837675"},{"id":"18055238","author":"jeremiah","display":"Jeremiah Jordan","created":"2026-01-29T17:03:56.823+0000","body":"I see in the PR that a \"Native Management Transport\" is being added. \u00a0One thing we implemented at DataStax when we did our \"management api\" was to expose the access through a UNIX socket rather than a new TCP/IP port.\r\n\r\n[https://github.com/k8ssandra/management-api-for-apache-cassandra/blob/master/management-api-agent-5.1.x/src/main/java/org/apache/cassandra/transport/UnixSocketServer51x.java|https://github.com/k8ssandra/management-api-for-apache-cassandra/blob/master/management-api-agent-5.1.x/src/main/java/org/apache/cassandra/transport/UnixSocketServer51x.java#L39]\r\n\r\nIf there is going to be another transport added, it may make sense to have that as an option. \u00a0The unix socket is nice because it means you can setup the permissions access through the unix layer and then the cassandra process can be accessed securely before setting up other auth inside Cassandra.","url":"https://issues.apache.org/jira/browse/CASSANDRA-19476?focusedCommentId=18055238"},{"id":"18055285","author":"mmuzaf","display":"Maxim Muzafarov","created":"2026-01-29T21:18:48.619+0000","body":"Thanks for taking a look, Jeremiah! I thought we had already discussed this, but then I found that it was Jake, who had [mentioned Unix sockets in the discussion|https://lists.apache.org/thread/4oz0795rlp4gmggzdz8tgks4bp69xsg4]. Yes, it's a great idea and it is still in my plan.\r\n\r\nI'm trying to come up with a strategy for the review and how to break this PR down so that it doesn't bring 15k lines to the community. But so far, it seems that the savings will not be significant. Anyway changes still require a lot of polishing before a review can be initiated.","url":"https://issues.apache.org/jira/browse/CASSANDRA-19476?focusedCommentId=18055285"},{"id":"18067507","author":"mmuzaf","display":"Maxim Muzafarov","created":"2026-03-22T20:26:59.877+0000","body":"dtests:\r\nhttps://github.com/apache/cassandra-dtest/pull/288/changes\r\n\r\ncassandra-trunk:\r\nhttps://github.com/apache/cassandra/pull/4582\r\n\r\nCI:\r\nhttps://pre-ci.cassandra.apache.org/job/cassandra/492/#showFailuresLink","url":"https://issues.apache.org/jira/browse/CASSANDRA-19476?focusedCommentId=18067507"}],"comment_count":4}},"branches":[{"branch":"trunk","pr_number":4582,"pr_url":"https://github.com/apache/cassandra/pull/4582","title":"CEP-38: Management API MVP Implementation [CASSANDRA-19476]","is_self":true,"state":"open","draft":false,"head_sha":"9f110e9abd64afd95992215bd490195cc4f1caf7","ci":null}],"ci_unmapped":[],"ci_archives":[],"commits":[{"sha":"5497d905584b16d7d0496694d826e26de911e6b9","message":"Add CQL-based Management API for nodetool commands CASSANDRA-19476\n\nIntroduce a native CQL transport-based management interface as an alternative to JMX for executing nodetool commands. Adds the INVOKE COMMAND CQL statement, a dedicated management transport listene (configurable via native_transport_management_port), a command registry backed by picocli metadata, and protocol-aware execution strategies (JMX, CQL, MBean) so nodetool can operate over either protocol.\n\nRefactors NodeProbe into a RemoteJmxMBeanAccessor and introduces MBeanAccessor/CommandMBeanAdapter abstractions to decouple command execution from the transport layer. Includes comprehensive unit and integration tests for command parsing, dispatching, and multi-protocol nodetool execution.","author_name":"Maxim Muzafarov","login":"Mmuzaf","trailers":[],"url":"https://github.com/apache/cassandra/pull/4582/commits/5497d905584b16d7d0496694d826e26de911e6b9"},{"sha":"dab9bee80591e4847e0a23c1c8e2518e97b00630","message":"javadoc simplify added comments","author_name":"Maxim Muzafarov","login":"Mmuzaf","trailers":[],"url":"htt pache.org/_/development/how_to_commit.html).\n- Fix the oldest applicable branch first, then merge forward: `cassandra-4.0 \u2192 cassandra-4.1 \u2192 cassandra-5.0 \u2192 cassandra-6.0 \u2192 trunk`. Contributors should say which versions they verified as affected, patch the lowest branch, and check the patch merges cleanly upward. Sources: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html); [Contributing code changes](https://cassandra.apache.org/_/development/patches.html), \"Bug Fixes\" (that page lists old branch names; follow its intent).\n- Patch releases on GA branches take bug fixes only. Improvements and features go to trunk only. Source: [Release Lifecycle](https://cwiki.apache.org/confluence/spaces/CASSANDRA/pages/132320437/Release+Lifecycle).\n- CI must cover all affected branches before commit. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\n### `branches.coverage`\n\nAdvisory. Owner: contributor.\n\nEach Fix Version is mapped to a branch the same way as in the JIRA aspect (`5.0.x` \u2192 `cassandra-5.0`; a version with no release branch, such as `7.x`, \u2192 `trunk`). A branch is covered when this PR or an **open** sibling PR targets it.\n\n- **unknown**: JIRA could not be reached.\n- **not-applicable**: no ticket was read, or Fix Version is empty, so the expected branches are unknown.\n- **warn**: at least one Fix Version branch has no PR. Moves the recommendation to \"needs work\".\n- **pass**: every Fix Version branch has a PR.\n\n## How to fix\n\n- Open a PR against each missing branch, using a branch name like `\u003cyou>/CASSANDRA-12345/cassandra-5.0`, and put the ticket key in each PR title so the tool and the ASF bot link them.\n- Backports often differ from the trunk patch. Make each PR apply cleanly to its own base.\n- If a branch does not need the fix (the bug is not present there, or the change is a feature for trunk only), remove that Fix Version from the ticket or explain on the ticket. The check will keep warning until the Fix Versions match the PRs.\n- If a sibling PR exists but is not found, make sure its title or branch carries the same ticket key.\n\n## Limits\n\n- Closed sibling PRs do not count. After a committer pushes one branch and closes its PR, the check may warn for that branch.\n- Patches offered as fork compare links or branch names in JIRA comments, not as PRs, are not found.\n- Fix Versions are taken as the truth. If the ticket's Fix Versions are wrong, the check is wrong in the same way.\n- The check does not judge whether a branch should get the change (bug fix versus feature, end-of-life branches). That decision belongs to the committer.\n- It does not test whether the patch merges forward cleanly.\n","build":"# Build & coverage\n\n## What is checked\n\nThree checks read the result of `cpr build \u003cN>`, which builds the PR head, runs a selection of unit tests with JaCoCo, and saves the outcome for that exact head sha. `cpr review` never builds; it only reads the saved result.\n\n- `build.compiles`: did the PR branch compile.\n- `build.tests-pass`: did the selected unit tests pass.\n- `build.changed-line-coverage`: did the lines the PR added under `src/java` run under those tests.\n\nThe section also shows the tests table (classes, run, failed, errors, skipped, failures), coverage per file with the missed line numbers, the list of selected test classes with the reason each was picked, and any failure we blame on the sandbox rather than on the PR.\n\n**Who gets built.** Building runs the PR author's code, so it is limited. A PR is built automatically only when its author is on the committer roster. For any other PR the section says \"Not built for this head\" until the owner approves that exact head with `cpr build \u003cN> --approve`. Approval covers one head sha; a push needs a new approval.\n\n**The sandbox.** Every step that runs the author's code runs inside macOS `sandbox-exec`: no external network, writes only to the run directory, and no read access to credential directories (`~/.ssh`, `~/.aws`, `~/.gnupg`, GitHub and Claude configuration, the keychain). The build works in a throwaway clone with its own copy of the Maven cache. Only dependency resolution uses the network, and it uses the base commit's build file, which the PR cannot change. Some tests fail only because of the sandbox (for example `transferTo0: Operation not permitted` in streaming tests). Those are reported as unknown, not as failures of the PR.\n\n**Reading the numbers.** Line coverage shows which changed lines ran under the selected tests; it does not show that the fix's behaviour is tested. Read with the test regime lens. The selection is a heuristic (tests the PR changes, name matches, references to changed classes and methods; at most 25 classes; no dtests, long, burn or simulator tests), so a missed line can mean \"the right test was not selected\".\n\n## Why\n\n- Reviewers are asked to confirm that the patch builds and that \"tests exist, are comprehensive, and actually exercise the behaviour\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), section Testing. CI results attached to JIRA say this for the committer's own run; this section says it for the head the reviewer is looking at.\n- Changed-line coverage is a cheap, objective hint about the second half of that sentence: an added line that no selected test reaches is a line to ask about. In the research run on PR 5212, all 10 added executable lines were missed, which pointed at interrupt-handling code that no test triggers. Source: `docs/research/build-and-coverage.md`, section 4.\n- The owner decided that automatic builds are for committers' PRs only, always sandboxed, because building is executing someone else's code. Source: the `build-and-coverage` OpenSpec change.\n\n## How each status is decided\n\nThe saved result has a `status`: `pass`, `tests-failed`, `build-failed`, `timeout`, `unknown` or `not-built`. The checks use it with the test and coverage data in the same file.\n\nA result counts only if its `head` equals the PR's current head sha. A result for an older head, or no result at all, is treated as not built: all three checks are not-applicable with the reason \"not built\", the section shows no old numbers, and nothing blocks. Unknown results never block either.\n\n### `build.compiles`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: `status` is `build-failed`. The evidence lists the compile error lines (file, line, message) from the run.\n- **pass**: the build ran: status `pass` or `tests-failed`, or status `unknown` with test results recorded (tests cannot run without a build).\n- **unknown**: status `timeout`, or status `unknown` with no test results (the build outcome was never seen). Does not block.\n- **not-applicable**: not built for this head.\n\n### `build.tests-pass`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: status `tests-failed` and at least one failure that is not a sandbox artifact. The evidence names each failing class and method with its first message line.\n- **pass**: status `pass` with tests run and no failures or errors.\n- **unknown**: status `timeout`; status `unknown`; only sandbox artifacts failed; or no test results were recorded. Does not block.\n- **not-applicable**: not built for this head, or the build failed so no tests ran.\n\n### `build.changed-line-coverage`\n\n**Advisory.** Owner: contributor. A warning here is a note and does not move the verdict.\n\n- **warn**: at least one added executable line did not run. The evidence has one row per file, \"covered N/M, missed lines ...\". A line that ran only partly (some branches or instructions never ran) counts as covered and is flagged \"partly\".\n- **pass**: every added executable line ran.\n- **unknown**: coverage was not measured, or a changed file is missing from the JaCoCo report. Does not block.\n- **not-applicable**: not built, the build failed, or the PR adds no executable line under `src/java` (tests, docs and comments only).\n\n## How to fix\n\n- **Compile errors**: fix them and run `ant jar` and `ant build-test` on the branch.\n- **Failing tests**: run the named class with `ant testsome -Dtest.name=\u003cclass> -Dtest.methods=\u003cmethod>`. If it also fails on the base branch, say so on the ticket.\n- **Missed lines**: add a test that reaches them, in the lowest suite that can (see the Testing aspect). If a missed line is deliberately untestable, say why in the PR.\n- **Not built, committer's PR**: run `cpr build \u003cN>`. The `/review-pr` skill does this for you.\n- **Not built, other authors**: the owner runs `cpr build \u003cN> --approve` after reading the diff, then re-renders.\n- **Timeout or unknown**: read the reason shown in the banner; it names a missing JDK (with the install command), a network problem, or a sandbox artifact.\n\n## Limits\n\n- **Selected tests only.** At most 25 unit test classes run. Passing them says nothing about the rest of the suite, dtests, upgrade tests or the simulator.\n- **Coverage is not proof.** A line can run under a test that does not assert anything about it.\n- **Sandbox artifacts are guessed from known messages.** A real failure that looks like a sandbox error is reported as unknown, never as a pass.\n- **One run per head.** Flaky tests are not rerun in this version; a single failure is reported as failed.\n- **macOS only.** The sandbox and JDK handling are for the owner's machine. Builds do not run in the GitHub Action.\n- **Committers' PRs by default.** For every other PR the section is empty until the owner approves a head.\n","changes":"# Changes\n\n## What is checked\n\nThis section shows the PR's diff. It is a viewer, not a check. The diff runs from the merge base of the PR and its base branch to the PR head, with the PR's GitHub review comments attached to their lines.\n\nThe view is produced by the ide-explain generator from the rustyrazorblade `dev-skills` plugin: a file tree on the left, the diff top right, and an explanation pane bottom right. Files that a check flagged (a fail or warn whose evidence names a file) carry a note in the explanation pane listing the check and what it found.\n\n## Why\n\nReviewers need the code next to the results. A contributor looking at a warning such as \"banned API at line 42\" can open that file and line here. ide-explain is used rather than a custom viewer so that improvements to the plugin reach the report without changes to this tool.\n\n## How each status is decided\n\nThe section badge is **info** when the diff view was produced and **unknown** when it was not.\n\nHow the view is produced:\n\n1. The tool finds the newest installed generator under `~/.claude/plugins/cache/rustyrazorblade-plugins/dev-skills/\u003cversion>/skills/ide-explain/scripts/generate-explain.py`. The environment variable `CPR_IDE_EXPLAIN` overrides the path. The version used is recorded in About.\n2. It runs the generator inside the local clone of apache/cassandra with the merge base, the PR head, the PR number (for review comments), and a per-file notes map built from the check results.\n3. **Size budget**: if the output is larger than 8 MB, the generator runs again limited to `src/`, and the section notes that tests and other files appear only in the file table. If the `src/`-only view is still over 8 MB, no view is embedded.\n4. **Safety**: the output is checked for external scripts, external stylesheets, `@import`, and `fetch(`. If any is found, the view is not embedded. Otherwise the page is stored base64-encoded in the report and loaded into an `\u003ciframe sandbox=\"allow-scripts\">` through `srcdoc`. Without `allow-same-origin`, the embedded page cannot read or change the rest of the report.\n\nWhen there is no view (plugin not installed, the generator failed, too large, or network references found), the section shows a plain list of changed files with additions and deletions, and the reason. The rest of the report is unaffected.\n\n## How to fix\n\nNothing for contributors. If you generate reports yourself and the view is missing, install the `dev-skills` plugin from rustyrazorblade-plugins in Claude Code, or set `CPR_IDE_EXPLAIN` to the path of `generate-explain.py`, then run `cpr review \u003cN>` again.\n\n## Limits\n\n- The view depends on a plugin installed on the machine that built the report. Reports built elsewhere may lack it.\n- On very large PRs only `src/` is shown.\n- The diff is against the merge base, so it can differ from GitHub's \"Files changed\" tab when the base branch has moved.\n- Review comments are those on GitHub when the report was built. JIRA comments are in the JIRA section.\n- Notes come only from checks whose evidence names a file. Checks about the PR as a whole (votes, CI) add no notes.\n","ci":"# CI\n\n## What is checked\n\nWhether pre-commit CI has run for every branch this patch targets, whether it ran on the current PR head, whether it used a profile that covers the change, and how many tests failed.\n\napache/cassandra runs no CI checks on pull requests. CI evidence is the `ci_summary*.html` file that `.build/run-ci` produces and that someone attaches to the JIRA ticket. The tool downloads every attachment whose name contains `ci_summary` and ends in `.html`, and reads the tested commit sha, the branch, the profile, and the pass, fail, and skip counts from it.\n\nEach summary is assigned to a base branch: first by matching its sha to the head sha of this PR or a sibling PR, otherwise by a version (`4.0`, `4.1`, `5.0`, `6.0`) or `trunk` in the branch name it records or in the attachment's file name. When a branch has several summaries, the newest attachment wins.\n\nThe **target branches** are this PR's base plus the base of every open sibling PR (other PRs for the same ticket). The Branches aspect explains how siblings are found.\n\n## Why\n\n- \"Code must not be committed before CI results have been provided for all affected branches.\" Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n- Every patch is expected to carry its CI artifacts, attached to the ticket. Contributors without CI access say so on the ticket and a reviewer or committer runs CI. Sources: [CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md), \"Continuous Integration\"; [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) step 4; [CI page](https://cassandra.apache.org/_/development/ci.html).\n- Reviewers check for \"pre-commit CI results attached to the ticket, for all affected branches (up to trunk, if applicable)\" and ask \"are there any regressions?\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), Testing.\n- The `pre-commit w/ upgrades` profile is required whenever the patch could affect upgrades, serialization, or on-disk formats. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Profiles\".\n- Failures are triaged against [Butler](https://butler.cassandra.apache.org) and JIRA to separate new regressions from known flaky tests. A pre-commit run with a few failures is normal if they are shown to be pre-existing or flaky. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Post-commit CI\".\n\n## How each status is decided\n\nThe first three checks share a rule: with no ticket key, a ticket that does not exist, or JIRA unreachable, they report **unknown**, because there is nowhere to read CI from.\n\n### `ci.evidence`\n\n**Blocking.** Owner: committer.\n\n- **unknown**: no ticket to read (see above). The recommendation becomes \"insufficient evidence\".\n- **fail**: at least one target branch has no parsed summary assigned to it (\"CI not yet run\"). The recommendation becomes \"blocked\".\n- **pass**: every target branch has a summary.\n\nSummaries that could not be downloaded, could not be parsed, or could not be assigned to a branch are listed as evidence but do not count.\n\n### `ci.freshness`\n\nAdvisory. Owner: committer.\n\nCompares, for each target branch with a summary, the sha CI tested against that branch's PR head sha.\n\n- **unknown**: no ticket to read.\n- **not-applicable**: no target branch has a summary.\n- **warn** (needs action): CI ran on an older commit for at least one branch. Moves the recommendation to \"needs work\".\n- **warn** (informational): the summary recorded no usable sha (some `run-ci` versions write a placeholder). Shown, but does not change the recommendation.\n- **pass**: every summary's sha matches its PR head.\n\n### `ci.profile`\n\n**Blocking.** Owner: committer.\n\nA file is upgrade-sensitive when it is under `src/java/` and either its path is in messaging (`net/`), SSTable format (`io/sstable/format/`, or `io/sstable/` files named `*Version*`, `*Descriptor*`, `*Component*`, `*Metadata*`), commit log, hints, `SchemaKeyspace`, `SystemKeyspace`, any `*Serializer.java`, or a serializer under `db/rows/`; or its added lines implement `IVersionedSerializer`, `IVersionedAsymmetricSerializer`, or `IPartitionerDependentSerializer`.\n\n- **not-applicable**: no upgrade-sensitive file changed; `pre-commit` is enough.\n- **unknown**: upgrade-sensitive files changed, but there is no ticket to read or no parsed summary for any branch.\n- **fail**: upgrade-sensitive files changed and at least one branch's summary shows no upgrade tests. A summary counts as having upgrade tests when its text mentions `upgrade-dtest`, `upgrade_dtest`, `upgrade-jdk`, or `upgrade_jdk`. The recommendation becomes \"blocked\".\n- **pass**: every branch with a summary ran upgrade tests.\n\n### `ci.failures`\n\nAdvisory. Owner: reviewer.\n\n- **not-applicable**: no parsed summary.\n- **warn**: the newest summaries report one or more failed tests in total. Up to five failing test names per branch are listed. Failures are not yet compared with known flaky tests. Moves the recommendation to \"needs work\".\n- **pass**: zero failures across all summaries.\n\n## How to fix\n\n**Run pre-commit CI for each target branch.** Use `.build/run-ci` against your own Jenkins (`.build/run-ci --only-setup` creates one in your Kubernetes cluster), the project's pre-commit Jenkins, or an employer's. Options and profiles are described in `.build/run-ci.d/README.md` and on the [CI page](https://cassandra.apache.org/_/development/ci.html).\n\nChoose the profile:\n\n- `pre-commit`: the minimum for code changes.\n- `pre-commit w/ upgrades`: when the change touches messaging, serialization, SSTable or commit log formats, hints, or system tables.\n- `packaging`: build or packaging-only changes.\n\n**Attach the results to the JIRA ticket**, one pair per branch: the `ci_summary` HTML file and the `results_details` archive. Open the ticket, choose More \u2192 Attach files (or drag the files onto the ticket). Keep the branch in the file name, for example `ci_summary_\u003cfork>_CASSANDRA-12345-5.0_\u003cbuild>.html`, so the branch can be identified even if the sha does not match. Then add a comment with the totals per branch and an explanation of each failure: pre-existing (link the Butler entry or JIRA ticket), flaky, or fixed in a later commit.\n\n**No CI access?** Say so in a comment on the ticket and ask a committer to run it. `ci.evidence` stays failed until someone attaches results.\n\n**Stale CI**: re-run CI on the current head, or say on the ticket why the later commits do not need it (for example, a comment-only change).\n\n## Limits\n\n- Only `ci_summary` HTML attachments on JIRA are read. Results posted as links (CircleCI workflows, ci-cassandra.apache.org builds), pasted as text in comments, or reported on the fork's GitHub Actions are not seen.\n- A summary whose sha does not match any sibling PR and whose branch and file name contain no version is not assigned to a branch, so it does not count.\n- If a summary's failure count is missing, it is treated as zero failures.\n- Upgrade-test detection is a text search of the summary page. A profile name that does not contain those words is missed.\n- The upgrade-sensitive file list is a path heuristic. Changes to serialization code in other places are missed, and a rename-only change to a `*Serializer.java` file is flagged.\n- Failures are counted, not triaged. A PR with only known flaky failures still gets a warn until Butler comparison is added.\n- Target branches come from open PRs. A branch that needs CI but has no PR yet is covered by the Branches aspect, not here.\n","code-review":"# Code review\n\n## What is checked\n\nA panel of six review lenses reads the patch. Each lens is an AI reviewer focused on one concern, and each returns findings in the same format. The panel is defined in `cpr/config/panel.json`; every lens is a project agent, so nothing depends on an outside plugin:\n\n| Lens | Focus |\n|---|---|\n| cassandra-standards | The patch against its JIRA ticket (does it do what the ticket asks, and only that) and Cassandra's contribution standards: error handling, project executors and clocks, version gating, backport rules, NEWS.txt. It also runs a security check (auth, roles and permissions, TLS, JMX exposure, UDFs, secrets in logs or virtual tables) that reports nothing when the diff touches no security surface, and it reports PR edits to `.claude/` or `AGENTS.md` |\n| cass-logic-boundary | Conditions and predicates, boundaries and numbers, null and type safety, validation of input |\n| cass-concurrency-lifecycle | Locking and shared state, ordering and lifecycle, cleanup of state and resources |\n| cass-persistence-compat | Serialization and versioning, I/O and crash safety, whether new failure paths are logged at the right level and metrics stay symmetric |\n| cass-completeness-symmetry | Missing counterparts (the read path without the write path, the new option without its docs or tests), API contracts, what a refactor left behind |\n| cass-test-regime | Whether the tests fit Cassandra's testing regime: the right suite for the change, whether the test fails without the fix, whether timing-sensitive tests need repeated runs |\n\nReviewers judge correctness, error handling, testing, logging, and compatibility, and the lenses follow the same list.\n\n**Trusted checklists.** The five `cass-*` lenses work from the checklists the Cassandra project keeps in its own `.claude/skills/` directory. Those are read from `origin/trunk`, resolved to one commit for the whole run, and only from a fixed list of paths. They are never read from the PR's branch or from the base branch, so a patch cannot change how it is reviewed. The report names the commit as \"checklists: apache/cassandra trunk @ \u003csha>\". If a listed file is missing at that commit, the lens that needs it is reported as **missing**; there is no fallback to another copy.\n\n**Tiers.** The amount of checklist each lens receives depends on how many non-test lines the patch changes:\n\n| Tier | Changed non-test lines | What each lens gets |\n|---|---|---|\n| docs-only | Only documentation changed | No lenses run |\n| small | Under 50 | Its shallow checklist |\n| medium | 50 to 1,000 | Shallow checklists plus the targeted categories whose diff signals match the patch (at most 8 across the panel) |\n| large | Over 1,000 | Deep checklists plus a list of focus files ranked by risk; the lens summary names the files it did not review |\n\nEach lens summary states which checklists were applied and what was not reviewed.\n\nThe panel runs only through `/review-pr \u003cN>` in Claude Code. A report made with `cpr review \u003cN>` alone says \"Not run\".\n\n## Why\n\n- Reviewers judge correctness, error handling, testing, logging, and compatibility. Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html).\n- The checklists come from apache/cassandra itself, so the lenses ask the questions the project's own review skills ask. Pinning to a commit makes a report reproducible; reading only from trunk keeps a patch from editing its own reviewer.\n- Several lenses often notice the same defect. Merging their findings stops one problem from being counted and listed four times.\n- Two committer +1s are still required whatever an automated review says. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\nEach finding has these fields:\n\n| Field | Meaning |\n|---|---|\n| `id` | Identifier of the finding |\n| `severity` | `blocker`, `major`, `minor`, or `nit` |\n| `location` | File and line in the new file, for example `src/java/org/apache/cassandra/db/Foo.java:42` |\n| `rule` | The rule, standard, or ticket requirement broken |\n| `problem` | What is wrong |\n| `fix` | The smallest change that resolves it |\n| `impact` | Optional. `data-loss`, `crash`, `hang`, `mixed-version-break`, `silent-wrong-result`, `performance`, or `cosmetic` |\n| `confidence` | Optional. `high`, `medium`, or `low`: how sure the lens is that the failure can happen |\n\n**Severity comes from impact and confidence.** When a finding names an impact, `cpr/review.py` sets the severity from this table, whatever severity the lens wrote. If they differ, the report keeps the lens's value as \"was \u003cseverity>\". A finding with no impact keeps its own severity.\n\n| Impact | High confidence | Medium | Low |\n|---|---|---|---|\n| data-loss, crash, hang, mixed-version-break | blocker | major | minor |\n| silent-wrong-result | major | major | minor |\n| performance | minor | minor | nit |\n| cosmetic | nit | nit | nit |\n\nA finding with no concrete way to trigger it is dropped by the lens, not reported as a nit.\n\n**Merging.** Findings from different lenses that describe the same problem are merged into one **issue**. For each pair of findings from different lenses the merger scores how much their problem texts share code identifiers (such as `FileUtils.delete`) and ordinary words, and how much their fixes share identifiers. Findings in the same file get a bonus that is larger the closer the lines are (within 3 lines, within 10 lines); findings at a place that is not a file line, such as the ticket, get a small fixed bonus. Two findings merge only when the text score reaches a floor and the total reaches a threshold, so two different problems on the same line stay separate. Pairs are joined strongest first, and an issue never holds two findings from one lens. The weights, bonuses, line distances, floor, and threshold are in `cpr/config/merge.json`.\n\nAn issue takes the highest severity of its members and lists every lens that reported it, every location, and the member findings. The wording, fix, rule, impact, and confidence come from the most severe member (ties go to the one naming the most identifiers). Fixes from other members that differ are kept as \"also suggested\".\n\nPanel rules (`cpr/review.py`):\n\n- A lens with no output is **missing**; one whose output is not valid JSON in the schema is **invalid**. Neither ever counts as approval.\n- A lens that declines to approve without a blocker or major finding gets a synthesized **major** finding, rule `unexplained-non-approval`. Declining is a verdict and has to be justified.\n- The panel **approves** only when every lens ran, every lens approved, and there is no blocker or major finding. Merging does not change this.\n\nThe report headline reads \"N issues (M findings from K lenses)\", where K counts the lenses that reported at least one finding. \"Must fix\" counts issues, not findings.\n\nEffect on the recommendation: any blocker or major issue gives \"needs contributor work\"; an incomplete panel keeps \"requirements met, code not yet reviewed\"; an approving panel with every requirement met gives \"ready to merge\".\n\nSection badge: unknown when the panel did not run or did not complete, fail when there is a blocker or major issue, warn when there are only minor or nit findings, pass when there are none.\n\nThe Code review section lists the issues first, then each lens's status, approval, summary, and raw findings. Issues with a file location also appear in the Changes view, once per file, naming every lens that reported them.\n\n## How to fix\n\nStart with blocker and major issues. Each names its locations and the smallest fix. If you think an issue is wrong, say why on the JIRA ticket or the PR; the lenses advise reviewers and do not decide anything.\n\n## Limits\n\n- Lenses read the code; they do not build it or run tests. Test evidence comes from CI attached to the ticket.\n- Lenses can be wrong in both directions: they can miss real problems and report false ones. Each issue shows its lenses, rule, and location so a reviewer can check it quickly.\n- Merging is a text-overlap heuristic. Its thresholds were tuned on one real PR (apache/cassandra#5201, where 11 findings became 5 issues), so it can leave a duplicate unmerged or, rarely, join two different problems. The member findings stay visible under each lens.\n- Checklists are upstream's. If trunk changes a checklist, reports made later follow it; the sha in the report says which version was used. Items about APIs that do not exist on a release branch are told to be ignored, but a lens can still apply one.\n- The PR's own files, including apache/cassandra's `CLAUDE.md`, `AGENTS.md`, and `.claude/` skills, are treated as untrusted data. Text that tries to steer the review is reported as a finding, rule `review-steering`.\n- Design acceptability, backport scope, and the merge decision stay with committers.\n","commits":"# Commits and changelog\n\n## What is checked\n\nThe PR's commit messages, their trailers (`Co-authored-by:`, `Assisted-by:`, and similar), signs of undisclosed AI assistance, and whether `CHANGES.txt` has an entry when production code changed, and, for performance PRs, whether the benchmark commit comes before the change.\n\n## Why\n\nThe commit message format is:\n\n```\n\u003cOne sentence description, usually the Jira title or CHANGES.txt summary, no Jira id>\n\n\u003cOptional longer description>\n\npatch by \u003cAuthors>; reviewed by \u003cReviewers> for CASSANDRA-#####\n\nCo-authored-by: Name \u003cemail>\nAssisted-by: AGENT_NAME:MODEL_VERSION\n```\n\nSources: [.github/pull_request_template.md](https://github.com/apache/cassandra/blob/trunk/.github/pull_request_template.md); [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html), \"Commit Message\"; [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), \"Git Workflow\", which adds \"no jira id\" on the first line and the `Assisted-by` trailer.\n\n- Use `TBD` for reviewers until review finishes. Squash to one commit per branch once the patch has its +1; several commits are fine during review. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) steps 6 and 8.\n- The ASF requires contributors using generative tools to check the tool's terms and the output's provenance, and recommends a `Generated-by:` token. Source: [ASF Generative Tooling Guidance](https://www.apache.org/legal/generative-tooling.html). Cassandra's form is `Assisted-by: AGENT_NAME:MODEL_VERSION`. Source: [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md).\n- Add a `CHANGES.txt` entry at the top of the version section for the branch, as ` * \u003csummary> (CASSANDRA-NNNNN)`. Only user-impacting changes need one; test-only fixes do not. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) step 7. Committers often add or fix the entry at commit time.\n\n- A performance change should be measurable on both sides: put the JMH benchmark (under `test/microbench/`) in an earlier commit than the change, so it can run at the parent commit and at the PR head. This is the project owner's convention; most PRs do not follow it yet (a single commit with code and benchmark together is the common case), so only the wrong order asks for action. Source: the static-analysis change design in this repository.\n\n## How each status is decided\n\n### `commits.message-format`\n\nAdvisory and informational: a warn here never changes the recommendation. Owner: contributor.\n\nEvery commit in the PR is checked. A commit has a problem when its first line contains the PR's ticket key, when it has no line matching `patch by \u2026; reviewed by \u2026 for CASSANDRA-N` (case-insensitive, semicolon required), or when that line names a different ticket than the PR.\n\n- **unknown**: the PR has no commits.\n- **warn**: at least one commit has a problem. Each commit is listed with its problems.\n- **pass**: every commit follows the format.\n\n### `commit.perf-structure`\n\nAdvisory. Owner: contributor. Only the wrong order moves the recommendation.\n\nA PR counts as a performance PR when a strong signal fires, or two medium ones do. Strong: a changed file under `test/microbench/`; a JIRA label `performance`; a JIRA component `Test/benchmark`. Medium: the PR title or JIRA summary has a performance keyword (perf, performance, faster, speed up, latency, throughput, allocation, optimize, and similar); the PR description mentions JMH or a benchmark. The evidence names every signal that fired. Commit order comes from the PR's commits, oldest first, ignoring `fixup!` and `squash!` commits; the first commit touching `test/microbench/` is compared with the first touching `src/java/`.\n\n- **not-applicable**: not a performance PR (one medium signal is not enough), or a performance PR with no `src/java` change.\n- **unknown**: the commit list is unavailable (static analysis did not run).\n- **warn** (needs action): the benchmark commit comes after the change.\n- **warn** (note): benchmark and change share a commit, or the PR changes `src/java` with no benchmark.\n- **pass**: the benchmark commit comes first.\n\n### `commits.provenance`\n\nAdvisory. Owner: contributor.\n\nSigns of AI assistance are a head branch starting with `claude/`, `copilot/`, `codex/`, or `cursor/`, or a PR description that mentions `claude`, `copilot`, `chatgpt`, `gpt-N`, `codex`, `cursor`, `gemini`, `llm`, `AI-generated`, or `AI-assisted`.\n\n- **warn**: at least one sign is present and no commit has an `Assisted-by:` or `Generated-by:` trailer. Moves the recommendation to \"needs work\".\n- **pass**: otherwise. All trailers found are listed. No trailer is required when there are no signs.\n\n### `changelog.entry`\n\nAdvisory. Owner: contributor.\n\n- **not-applicable**: no production code changed (nothing under `src/java/` or `pylib/` outside test directories).\n- **warn**: production code changed but `CHANGES.txt` has no added lines; or added lines exist but none matches ` * \u003csummary> (CASSANDRA-N)` (one or more comma-separated keys in the parentheses); or a matching line exists but does not mention the PR's ticket. Moves the recommendation to \"needs work\".\n- **pass**: a well-formed added line names the PR's ticket.\n\n## How to fix\n\nFor a performance PR, reorder with an interactive rebase so the benchmark commit comes first, or split a combined commit in two.\n\nReword the final commit (`git commit --amend`, or squash with `git rebase` before the last push):\n\n```\nFix NPE when reading an empty partition with a static column\n\npatch by Jane Doe; reviewed by TBD for CASSANDRA-12345\n```\n\n- Keep the ticket key out of the first line; it belongs in the `patch by` line.\n- If an AI tool helped write the patch, add a trailer per tool, for example `Assisted-by: Claude Code:claude-opus-5`, and say so in the PR description.\n- Add co-authors with `Co-authored-by: Name \u003cemail>`.\n\nFor `CHANGES.txt`, add a line at the top of the section for your branch's version:\n\n```\n * Fix NPE when reading an empty partition with a static column (CASSANDRA-12345)\n```\n\nIf you agreed with a reviewer that the committer will add the entry, say so on the PR.\n\n## Limits\n\n- `commit.perf-structure` judges the PR branch's commits, not what lands: committers squash at merge. It does not judge whether a benchmark is meaningful. A benchmark touched again in a later commit does not change the order. The JIRA `performance` label is rarely used, so detection leans on paths and keywords, and keyword matches can misfire.\n\n- Committers usually rewrite the commit message when they commit, so `commits.message-format` is informational.\n- The `patch by` pattern needs a semicolon before `reviewed by`. Lenient variants seen in history (`, reviewed by`) are flagged.\n- Every commit is checked, including review fix-ups that will be squashed away.\n- AI detection reads only the branch name and the PR description, not commit messages. Common Cassandra words such as \"cursor\" (cursor-based compaction) trigger it, so the warning can be a false positive. A `Co-authored-by:` trailer naming an AI tool does not satisfy it.\n- `changelog.entry` does not check that the line is at the top of the right version section, and it asks for an entry for every production change, including refactors that are not user-impacting.\n- NEWS.txt is not checked. Update it yourself when a change affects defaults, upgrade steps, deprecations, or user-visible features.\n","compatibility":"# Compatibility\n\n## What is checked\n\nWhich public or on-disk surfaces the PR touches, and a few mechanical rules around them: both yaml files change together, system properties go through `CassandraRelevantProperties`, and nodetool changes update the help fixtures.\n\nThe surfaces, by changed path:\n\n| Surface | Paths |\n|---|---|\n| config | `conf/cassandra*.yaml`, `config/Config.java` |\n| native protocol | `transport/`, `doc/native_protocol*` |\n| CQL grammar | `src/antlr/` |\n| CQL semantics | `cql3/` |\n| messaging | `net/` |\n| sstable format | `io/sstable/` |\n| commitlog / hints | `db/commitlog/`, `hints/` |\n| schema / system tables | `schema/`, `db/SystemKeyspace*` |\n| nodetool | `tools/nodetool/` |\n| JMX | any `*MBean.java` |\n| metrics | `metrics/` |\n| virtual tables | `db/virtual/` |\n| guardrails | `db/guardrails/` |\n| dependencies | `.build/*.xml`, `build.xml`, `lib/` |\n\nJava paths are under `src/java/org/apache/cassandra/`.\n\n## Why\n\n- \"Changes must not break compatibility between different Cassandra versions.\" Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html).\n- CQL, virtual tables, JMX, yaml, and system properties are public APIs. Changes must follow the approach of existing APIs, and plans to change an API go to dev@. Source: [Code style](https://cassandra.apache.org/_/development/code_style.html), \"Public APIs\".\n- Both `conf/cassandra.yaml` and `conf/cassandra_latest.yaml` ship with Cassandra (5.0 and later). Renamed settings need `@Replaces` and converters so old yaml keeps loading; `ConfigCompatibilityTest` and `LoadOldYAMLBackwardCompatibilityTest` guard this. Source: [conf/](https://github.com/apache/cassandra/tree/trunk/conf) and the tests named.\n- System properties must be declared in `CassandraRelevantProperties`; checkstyle bans direct `System.getProperty` and friends. Source: [.build/checkstyle.xml](https://github.com/apache/cassandra/blob/trunk/.build/checkstyle.xml).\n- nodetool help output is pinned by fixtures under `test/resources/nodetool/help/`, checked by `NodetoolHelpCommandsOutputTest`.\n- Reviewers check that NEWS.txt, the CQL docs, and the native protocol spec (`doc/native_protocol_v*.spec`) are updated when needed, and that the ticket's Impacts field is set. Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), Documentation.\n- Changes that could affect upgrades, serialization, or on-disk formats need upgrade tests and the `pre-commit w/ upgrades` CI profile. Source: [CI page](https://cassandra.apache.org/_/development/ci.html).\n\n## How each status is decided\n\n### `compat.config-pairing`\n\n**Blocking.** Owner: contributor.\n\n- **not-applicable**: none of `conf/cassandra.yaml`, `conf/cassandra_latest.yaml`, or `Config.java` changed.\n- **fail**: one yaml file changed and the other did not. The recommendation becomes \"blocked\".\n- **warn** (informational): `Config.java` changed and neither yaml file did. Shown, but does not change the recommendation.\n- **pass**: both yaml files changed.\n\n### `compat.system-properties`\n\nAdvisory. Owner: contributor.\n\nScans added lines under `src/java/` (except `CassandraRelevantProperties.java` itself, and lines starting with `//` or `*`) for `System.getProperty`, `System.setProperty`, `System.getenv`, `Integer.getInteger`, `Long.getLong`, or `Boolean.getBoolean`.\n\n- **warn**: at least one hit. Moves the recommendation to \"needs work\".\n- **pass**: none.\n\n### `compat.nodetool-help`\n\nAdvisory. Owner: contributor.\n\n- **not-applicable**: nothing under `src/java/org/apache/cassandra/tools/nodetool/` changed.\n- **warn** (informational): nodetool code changed and no file under `test/resources/nodetool/help/` did. Shown, but does not change the recommendation.\n- **pass**: a help fixture changed too.\n\n### `compat.surfaces`\n\nAdvisory. Owner: reviewer.\n\n- **warn** (informational): at least one surface in the table above is touched. Each surface lists up to five files. Shown, but does not change the recommendation. It tells reviewers where to look.\n- **pass**: no surface touched.\n\n## How to fix\n\n- **Config**: add or change the setting in `Config.java`, document it in both `conf/cassandra.yaml` and `conf/cassandra_latest.yaml`, and use `@Replaces` with a converter for a rename. Run `ConfigCompatibilityTest`.\n- **System property**: add an entry to `CassandraRelevantProperties` and read it from there.\n- **nodetool**: if options or help text changed, regenerate the fixtures under `test/resources/nodetool/help/`, run `NodetoolHelpCommandsOutputTest`, and update the nodetool docs.\n- **Messaging, SSTable, commit log, hints, schema**: gate new behaviour on the messaging or SSTable version so mixed-version clusters work, add serialization and upgrade tests, and run CI with `pre-commit w/ upgrades`.\n- **Native protocol**: gate on `ProtocolVersion`, update `doc/native_protocol_v*.spec`, and set the ticket's Impacts field to Clients.\n- **CQL**: update the CQL docs; for grammar changes, check reserved keywords and discuss on dev@ first.\n- **JMX and metrics**: do not rename or remove silently. Deprecate with `@Deprecated(since = \"X.Y\")` and note it in NEWS.txt.\n- **Defaults and guardrails**: add a NEWS.txt \"Upgrading\" note when a default or a guardrail's meaning changes.\n- **Dependencies**: start a dev@ `[DISCUSS]` thread.\n\n## Limits\n\n- Surfaces are detected by path. A compatibility change in a file outside these paths is not seen, and a harmless edit inside them (a comment, a test helper) is flagged.\n- `compat.config-pairing` treats any change to one yaml file as needing the same change in the other. Changes that belong in only one file (a default that differs in `cassandra_latest.yaml` on purpose) are failed, and on 4.0 and 4.1, which have no `cassandra_latest.yaml`, any `cassandra.yaml` change fails. A reviewer must override in those cases.\n- The `dependencies` surface matches every XML file under `.build/`, including checkstyle config.\n- `compat.system-properties` overlaps with `static.banned-api`, so one line can be reported twice.\n- Whether a change is version-gated, has upgrade tests, or needs NEWS.txt is a reviewer's judgement; no check reads the code for it.\n","context":"# Context\n\n## What is checked\n\nNothing here passes or fails. This section gives a reviewer the history behind the code the patch changes and the people who know it best:\n\n- **Tickets that last changed this code.** `git blame`, run against the PR's mer
