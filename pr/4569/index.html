me from one batched JIRA query.\n- **Commits without a ticket.** Blamed commits whose message names no ticket.\n- **Issues linked to this ticket.** The JIRA issue links on the PR's own ticket (for example \"is caused by\", \"relates to\").\n- **Most experienced with each file.** The top 3 people per changed file, from that file's history over the last 5 years.\n- **Suggested reviewers.** Up to 5 committers with the highest combined score across the changed files.\n\n## Why\n\nReviewers read the history of the code a patch touches to understand why it is written the way it is. A patch that changes code written for an earlier ticket should be checked against that ticket's reasoning. Finding that history by hand means running `git blame` and `git log` file by file.\n\nReviews go faster with people who know the code. The [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance) page requires two committer +1s, and the [how to review](https://cassandra.apache.org/_/development/how_to_review.html) page asks reviewers to judge correctness in context. Both favour reviewers who have worked on the same files.\n\nAuthorship comes from commit messages, not from the git author. Committers merge other people's patches, so the git author is often the committer. The project's commit format records the real contributors: `patch by \u003cauthors>; reviewed by \u003creviewers> for CASSANDRA-N` ([how to commit](https://cassandra.apache.org/_/development/how_to_commit.html)).\n\n## How each status is decided\n\nThis section has no checks. Its navigation badge is info when the context was computed and unknown when it was not, for example on a report built from data gathered before this feature existed.\n\n**Credit lines.** A message is parsed for `patch by \u003cnames>` followed by `;` or `,` and `reviewed by \u003cnames>`. Matching is case-insensitive, tolerates lines wrapped mid-credit, and accepts the verb typos found in history (`review by`, `reviwed by`, `reivewed by`). Names are split on `,`, `and`, `&`, and `+`; `TBD` is ignored. A commit without a credit line counts its git author as the patch author.\n\n**Names.** Each name is matched, ignoring case and accents, to an ASF committer by, in order: the git author's `@apache.org` email, the aliases file `cpr/data/people-aliases.json`, an ASF id written as a name (`Patch by marcuse`), or the committer's display name on the ASF roster. Names that do not match stay as written and are marked \"not matched to a committer\".\n\n**Scores.** Each authored patch counts 1.0 and each review 0.6, halved for every 2 years of age. Commits older than 5 years are ignored. The constants are in `cpr/config/context.json`.\n\n**Suggestions.** Only matched committers are suggested. The PR author is excluded. Anyone already in the ticket's Reviewers field, or who has commented on the ticket, is listed as \"already involved\" instead.\n\n**Budgets.** At most 300 hunks are blamed and 25 files' histories are read, production code first and largest first. The section says what was skipped.\n\n## How to fix\n\nNothing to fix. To ask someone for a review, mention them on the JIRA ticket or the dev@ list.\n\nIf one person shows up twice under different names, add both spellings to `cpr/data/people-aliases.json` with their ASF id.\n\n## Limits\n\n- Blame finds the last change to a line. A mass reformat or a file move can hide older, more meaningful history.\n- People who reviewed only on the mailing list or JIRA, with no credit line, are not counted.\n- Old, stable code can have few recent commits. The experts list for it may be empty, though people who know it well still exist.\n- Suggestions favour volume of recent work, not depth of knowledge. Treat them as a starting point.\n","jira":"# JIRA ticket\n\n## What is checked\n\nWhether the PR names a CASSANDRA ticket, whether that ticket exists, whether the PR's title and branch agree on which ticket it is, whether the ticket is still open, and whether its Fix Version covers the PR's base branch.\n\nThe tool looks for a key matching `CASSANDRA-NNNNN` (also `CASSANDRA_NNNNN`, `CASSANDRA NNNNN`, any case, 3 to 6 digits) in four places, in this order: PR title, head branch name, PR body, commit messages. In the branch name a bare 4 to 6 digit number also counts (`mck/21649/trunk`). The first key found, in that order, is the PR's ticket. The ticket is read anonymously from the [ASF JIRA](https://issues.apache.org/jira/projects/CASSANDRA).\n\n## Why\n\n- Find or create a JIRA ticket before doing the work. Sources: [CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md) step 1; [Contributing code changes](https://cassandra.apache.org/_/development/patches.html), \"Before You Start Coding\".\n- The ticket is where the project records the review: Reviewers, Authors, Fix Versions, CI results, and +1 votes. Committers find PRs through it. Source: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html).\n- The suggested branch name is `\u003cname>/CASSANDRA-NNNNN/\u003cbase-branch>`. Source: [CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md).\n- Fix Version records which release lines get the change. Patch releases on GA branches take bug fixes only; improvements and features go to trunk. Source: [Release Lifecycle](https://cwiki.apache.org/confluence/spaces/CASSANDRA/pages/132320437/Release+Lifecycle).\n- PRs are never merged on GitHub; a committer pushes the commit and closes the PR. A Resolved ticket usually means the work already landed. Source: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html).\n\n## How each status is decided\n\nWhen JIRA cannot be reached, every check below that needs the ticket reports **unknown** with the error.\n\n### `jira.key-present`\n\n**Blocking** on release branches, advisory on feature branches. Owner: contributor.\n\n- **pass**: a key was found. The summary lists where.\n- **warn** (advisory): no key, and the base branch is a feature branch, meaning anything other than `trunk` or `cassandra-X.Y`. Feature-branch work often has no ticket. This warn moves the recommendation to \"needs work\".\n- **fail**: no key, and the base is `trunk` or a `cassandra-X.Y` branch. The recommendation becomes \"blocked\".\n\n### `jira.ticket-exists`\n\n**Blocking.** Owner: contributor.\n\n- **not-applicable**: no key was found.\n- **unknown**: JIRA could not be reached. The recommendation becomes \"insufficient evidence\".\n- **fail**: JIRA says the ticket does not exist.\n- **pass**: the ticket was read. The summary shows its title and status.\n\n### `jira.key-consistent`\n\nAdvisory. Owner: contributor.\n\n- **not-applicable**: no key was found.\n- **warn**: a different CASSANDRA key also appears in the title or the branch name. Keys in the body or commits do not count, since they often cite related tickets. Moves the recommendation to \"needs work\".\n- **pass**: only one key appears across title and branch.\n\n### `jira.not-resolved`\n\nAdvisory. Owner: reviewer.\n\n- **not-applicable**: no ticket was read (no key, or the ticket does not exist).\n- **unknown**: JIRA could not be reached.\n- **warn**: the ticket status is Resolved or Closed. The patch may already have landed or been superseded. Moves the recommendation to \"needs work\".\n- **pass**: any other status.\n\n### `jira.fix-version`\n\nAdvisory. Owner: contributor.\n\nEach Fix Version maps to a branch: `5.0.10`, `5.0.x`, and `5.0` map to `cassandra-5.0`; `6.x` maps to the newest `cassandra-6.Y` branch; a version with no matching release branch (for example `7.0` or `7.x` today) maps to `trunk`.\n\n- **not-applicable**: no ticket was read, or the base is a feature branch.\n- **unknown**: JIRA could not be reached.\n- **warn**: Fix Version is empty, or no Fix Version maps to the PR's base branch. Moves the recommendation to \"needs work\".\n- **pass**: one of the Fix Versions maps to the base branch.\n\n## How to fix\n\n- **No key**: put it at the start of the PR title, `CASSANDRA-12345: \u003csummary>`, and name the branch `\u003cyou>/CASSANDRA-12345/\u003cbase>`. If no ticket exists, create one at [issues.apache.org/jira](https://issues.apache.org/jira/projects/CASSANDRA) first. An ASF JIRA account is free.\n- **Ticket does not exist**: correct the typo in the key.\n- **Two keys**: rename the PR title or open a new branch so both name the same ticket.\n- **Ticket resolved**: check the ticket's Source Control Link and comments (\"Committed as \u2026\"). If the change landed, close the PR. If the work continues, ask on the ticket to reopen it or open a follow-up ticket.\n- **Fix Version**: set Fix Version on the ticket for every branch the patch should reach (for an unreleased line, use the `.x` form, for example `5.0.x`). If you lack JIRA permission, ask in a comment. If the base branch is wrong, retarget the PR.\n\n## Limits\n\n- Key detection is pattern matching. A bare number in a branch name (`fix-12345`) is read as a ticket key, and a key mentioned only in passing in the title wins over the real one in the branch.\n- A PR whose ticket key appears only in the body or commits still passes `jira.key-present`.\n- \"Feature branch\" means any base other than `trunk` or `cassandra-X.Y`. End-of-life branches such as `cassandra-3.11` count as release branches; nothing flags them as unlikely to accept changes.\n- The Fix Version mapping assumes the newest release line without a branch is trunk. A Fix Version for a line whose branch does not exist yet, such as a future `6.1`, maps to trunk.\n- The checks do not read the ticket's Component, Impacts, Since Version, Reviewers, or Test and Documentation Plan fields, though the report shows some of them.\n- JIRA is read anonymously and cached. Changes on the ticket after the fetch time (shown in About) are not reflected.\n","labplan":"# Lab plan\n\n## What is checked\n\nNothing is checked. This section is informational: it never affects the verdict. It shows a ready-to-read plan for trying the PR on a real cluster with [easy-db-lab](https://github.com/rustyrazorblade/easy-db-lab): build the merge-base and the PR head, run a workload that fits the change, and compare. The plan is generated from the diff by fixed rules (no model call), and it is **never run** by this tool. The report shows a \"Not run\" banner, the rendered plan, and Copy and Download buttons. `cpr review` also writes the same text next to the report as `plan.md`.\n\nThe plan follows easy-db-lab's plan format: Objective, Cluster Name, Datacenters, Environment, Artifacts under test, numbered Steps (a bash block plus Pass and Fail lines), a results table, and Notes. Steps build both commits with the `build-cassandra-ref.yml` workflow of a cassandra-builds repo, provision 3 database nodes and 1 application node (`i4i.xlarge`), install both builds side by side, calibrate, run the scenario in the order base, head, head, base, and tear down.\n\nScenarios the rules can choose:\n\n| Scenario | Chosen when changed production code is under | Workload |\n|---|---|---|\n| kill -9 during compaction | `db/commitlog/`, `db/lifecycle/`, `hints/`, or `io/sstable/` when the title or ticket mentions crash, delete, corrupt, ordering | write load, repeated kill and restart |\n| Accord against LWT | `service/accord/` | `TxnCounter` with `LWT` as control |\n| LWT contention | `service/paxos/`, conditional statements | `LWT`, `Locking` |\n| compaction | `db/compaction/` | `RandomPartitionAccess` |\n| repair and streaming | `repair/`, `streaming/`, `ActiveRepairService` | `KeyValue` with a node down 10 minutes, then repair |\n| mixed-version ring | serialization, messaging, or sstable format code (the CI profile check's list) | `KeyValue` against a ring with one upgraded node |\n| write path | `db/memtable/`, `io/sstable/` (not delete-only), `io/compress/`, `db/rows/`, `db/partitions/`, `db/view/` | `KeyValue -r 0` |\n| read path | read commands, `cache/`, `service/reads/` | `KeyValue -r .95` |\n| index | `index/` | `SAI` |\n| mixed read and write | `utils/`, `concurrent/`, `tcm/`, `gms/` | `KeyValue -r .5 -t 200` |\n| smoke | `transport/`, `cql3/`, nodetool, `metrics/`, virtual tables, guardrails, `auth/`, or any server code no rule matched | `KeyValue -r .5` on the PR build only |\n\nThe rules, workloads, durations, instance type and caps live in `cpr/config/labplan.json`.\n\n## Why\n\n- Reviewers are asked to judge performance and stability claims with evidence, and \"performance claims must be measurable\" with repeated, before-and-after runs. Sources: [testing page](https://cassandra.apache.org/_/development/testing.html), section Performance Testing; [How to review](https://cassandra.apache.org/_/development/how_to_review.html).\n- Crash and recovery bugs need a control arm that can fail: if the base build never shows the failure, a clean head run proves nothing. The plan says so and marks that outcome inconclusive.\n- Both arms run on one cluster, in the order base, head, head, base, after two calibration runs. That cancels hardware and drift, and a delta counts only if it exceeds twice the calibration spread.\n- The plan builds the merge-base, not the branch tip, so the only difference between arms is the PR's own diff.\n- Generating the plan is cheap and deterministic; running it costs AWS money and hours. The owner decided that this tool generates and embeds plans only.\n\n## How each status is decided\n\nThe section has no checks. Its status badge is one of:\n\n- **info**: a plan was generated. The summary names the scenarios and says \"not run\".\n- **not-applicable**: no plan, with the reason in the section. Reasons: documentation-only; tests-only; dependency change; build or CI change; generated files only; no server code under `src/java` changed; more than 300 production files changed (an A-B run would not isolate anything); or the head repository or commits cannot be used safely.\n\nHow the scenarios are chosen: each rule matches changed production files by path (and, for some rules, by keywords in the PR title and ticket summary, or by the CI profile check's upgrade-sensitive list). A rule counts only if it covers at least its minimum number of changed lines. Matching scenarios are ranked by rule priority, then by changed lines covered, and at most two are kept. If no rule matches, the plan is a smoke test of the PR build. The plan's Notes name the rule that chose each scenario and any scenario dropped by the cap.\n\nText from the PR reaches the plan only as a sanitised title (letters, digits, spaces and `-_.:()`, at most 80 characters) in the heading, plus validated repository names, branch names and SHAs. Titles never appear inside a code block. Every `easy-db-lab` command in a plan is checked in the test suite against a stored copy of the `easy-db-lab commands` listing.\n\n## How to fix\n\nThere is nothing to fix. To use a plan:\n\n1. Read it, and edit it: the plan says which rule chose each scenario, and a reviewer knows the change better than a path rule.\n2. Decide which cassandra-builds repo builds the two commits (`BUILDS` in step 1). The default repo may not let you run its workflows; use your own fork.\n3. Run it from a cluster directory with the easy-db-lab plugin: `/easy-db-lab:run plan.md \u003ccluster-dir>`. The runner confirms each step and logs to `journal.md`.\n4. Fill the results table, apply the decision rule from the Objective, and post the result on the ticket.\n\n## Limits\n\n- **Never run.** Commands are checked for spelling only. Items marked \"Unverified until run\" (systemd unit name, data directory path, whether `stress start` returns before the job ends, how `nt` handles dash arguments) come from the plugin documentation, not from a run.\n- **Path rules, not understanding.** A subtle change can match the wrong scenario, or none, and fall back to a smoke test. Docs and tests are ignored.\n- **Two scenarios at most**, and none above 300 production files.\n- **Estimates only.** Wall-clock hours and cost are rough; the first real run should correct them.\n- **One cluster shape.** The plan always uses 3 database nodes and 1 application node on `i4i.xlarge`; changes that need other topologies (multiple datacenters, vnodes, very large data) are not covered.\n- **Branch assumptions.** The JDK comes from the target branch (4.0 and 4.1: 11, 5.0: 17, newer: 21). The Accord scenario assumes the build contains Accord.\n","static":"# Code style\n\n## What is checked\n\nReal checkstyle, cognitive complexity (PMD), and duplicate-code (CPD) results for the PR's changed Java files, each split into what the PR introduced and what was already there. Checkstyle uses the base branch's own `.build` configs; the tools are pinned and installed with `cpr tools install`, and their versions are shown in each result. If the tools did not run, those checks are `unknown`, never `pass`.\n\nPMD also runs its whole Java rule catalog (296 rules in 8 categories: Error Prone, Multithreading, Security, Performance, Best Practices, Design, Code Style, Documentation) on the same files, and the report's **PMD rules** block lists the violations the PR introduces, rule by rule. The three complexity rules are left to the Method complexity table.\n\nAlongside them is a fast approximation of the project's static checks, run on the lines the PR adds: APIs that checkstyle bans, licence headers on new files, edits to generated code or bundled jars, and `@Deprecated` without `since`. These checks read the diff only. They do not compile code or run `ant check`, which stays authoritative.\n\nThe banned-API rules are read from `.build/checkstyle.xml` on the PR's base branch, so they follow the project as it changes.\n\n## Why\n\n- Checkstyle errors fail CI's `ant check`, so an error the PR introduces is something the contributor must fix. Errors already in a touched file are counted but not blamed on the PR.\n- Cognitive complexity above 15 is the default threshold of the complexity-reduction skill the owner uses; the report lists every changed method with its base and head score so a simplification (6 to 2) is visible, and flags only methods the PR made newly or more complex.\n- A PMD rule that fires in a quarter or more of the base branch's own files is one the code does not follow (`CommentRequired`, `MethodArgumentCouldBeFinal`, `LocalVariableCouldBeFinal` and the like). The report counts those under \"House style differs\" and does not list them line by line, or judge the PR by them. The threshold comes from the code, not from a hand-kept list. Source: [PMD rules](https://pmd.github.io/pmd/pmd_rules_java.html).\n- Duplicated blocks of 100 or more tokens (PMD CPD default) are flagged when the PR adds one. Source: [PMD CPD](https://pmd.github.io/pmd/pmd_userdocs_cpd.html).\n- `ant check` runs `rat-check` (licence headers), `checkstyle` (main code), and `checkstyle-test` (tests). It also runs on every push to a fork through GitHub Actions on JDK 11 and 17, and checkstyle runs during `ant build` and `ant jar`. Sources: `build.xml`; [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), \"Linting\"; [Code style](https://cassandra.apache.org/_/development/code_style.html), \"Checkstyle\".\n- [.build/checkstyle.xml](https://github.com/apache/cassandra/blob/trunk/.build/checkstyle.xml) bans APIs that bypass Cassandra's own abstractions, for example `System.currentTimeMillis` (use `Clock.Global`), `Executors.new*` (use `ExecutorFactory.Global`), `java.io.File` (use `org.apache.cassandra.io.util.File`), `toLowerCase` (use `LocalizeString`), and `System.getProperty` (use `CassandraRelevantProperties`). It also requires `@Deprecated` to carry `since=`.\n- Every new file needs the Apache licence header; the template is `.build/header.txt`. Source: [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), \"Code Style\".\n- Never modify `src/gen-java/` (generated from `src/antlr/`) or files in `lib/`. Ask before changing `src/antlr/Cql.g`. Never bypass checkstyle without a suppression comment that explains why. Source: [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md).\n- New dependencies need a `[DISCUSS]` thread and consensus on dev@. Since 5.0 they are declared in the `.build/*-template.xml` POMs. Source: [Dependencies](https://cassandra.apache.org/_/development/dependencies.html).\n\n## How each status is decided\n\nAll checks are advisory. Unless noted, a warn moves the recommendation to \"needs work\".\n\nA finding is **introduced** when it is in a new file, a new method, a method whose score got worse, a method that crossed the threshold, or (checkstyle) on a changed line or with no equal error at base. It is **pre-existing** when it was already there (touched, untouched, or improved), and **fixed** when it is gone. Matching uses the base path (through renames), class, method signature, and rule, never the line number alone.\n\n### `static.checkstyle`\n\nAdvisory. Owner: contributor.\n\nRuns checkstyle on the changed Java files, `.build/checkstyle.xml` for `src/java` and `checkstyle_test.xml` for `test/`, both taken from the base branch. Branch families pick the version: trunk and 5.0 use 10.26.1, 4.1 uses 8.40, 4.0 has no config.\n\n- **unknown**: the base branch has no checkstyle config (`cassandra-4.0`; no other branch's config is borrowed), the tool or a JDK is missing, it crashed, or its output omits a changed file (the count not analyzed is named). The reason is shown with the tool version.\n- **not-applicable**: no changed Java files, or the tool does not apply.\n- **warn** (needs action): at least one introduced error. Each shows file, line, rule, and message (up to 50), plus counts of pre-existing and fixed errors.\n- **pass**: checkstyle ran on every changed file and nothing was introduced.\n\n### `static.complexity`\n\nAdvisory and informational: a warn here is a note and does not change the recommendation. Owner: contributor.\n\nEvidence always lists every changed method as `Class.method(signature): base \u2192 head` cognitive complexity (`new \u2192 N` for added methods, `N \u2192 removed` for deleted ones), introduced methods first.\n\n- **unknown**: PMD is missing or failed, or it did not analyze every changed file.\n- **warn** (note): a method scoring 15 or more that is new, got worse, or crossed the threshold.\n- **pass**: no such method. A method that got simpler, or an old complex method left alone, passes.\n\n### `static.pmd-rules`\n\nAdvisory. Owner: contributor.\n\nRuns every non-deprecated rule of PMD's eight Java categories on the head and base of the changed files in the same PMD pass as the complexity scores. A violation is **introduced** when its first line is an added line of the head file, or the file is new; a modified file without a line map falls back to the head count of a rule minus its base count. A rule is **house style** when it fires in at least 25% of the base branch's `src/java` files (the baseline: the whole branch is scored once and cached by branch tip). House-style rules are counted and collapsed, never listed per line and never part of the verdict.\n\nA second test catches rules Cassandra breaks on purpose but rarely per file (`DoNotUseThreads`, `AvoidUsingVolatile`, `NullAssignment` and the like). The baseline also records each rule's violation count and the lines it scanned. For a PR, a rule's expected count is the base branch's rate (violations per non-blank line) times the PR's added production lines. A rule is **usual for Cassandra** when the PR's production count is not significantly above that expectation (one-sided Poisson test, p of at least 0.01). The block lists such rules in a collapsed section with observed against expected, and the check ignores them. A rule the base branch never breaks is never usual, and test-file violations are not rate-tested. The bands are red for Error Prone, Multithreading and Security, yellow for Performance, Best Practices and Design, green for Code Style and Documentation.\n\nWhen a saved build of this head keeps its classes and jars they go to PMD as `--aux-classpath`, so rules that resolve types are reliable. `cpr build` keeps them for the five most recent runs (hard links inside the run directory, about 200 MB each). Otherwise PMD runs without type info, and the block and the check say so. Rules that need type resolution (`cpr/config/pmd-type-rules.json`: taken from PMD's rule text, then confirmed by running the same files with and without a classpath) are then shown greyed as \"needs compiled classes\" and the check ignores them.\n\n- **unknown**: PMD or its rule catalog did not run, or PMD could not read some changed files and found nothing red in the rest (the skipped files are named).\n- **warn** (note): at least one red-band violation is introduced in production code, outside house style, not usual for Cassandra, and not a type-dependent rule that ran without classes. The summary names the top rules; tests are counted in the block but not in the verdict.\n- **pass**: PMD ran on every changed file and introduced no such red-band violation. Yellow and green counts are shown in the summary and in the block.\n\n### `static.duplication`\n\nAdvisory and informational. Owner: contributor.\n\nCPD with 100 tokens minimum over the changed files.\n\n- **unknown**: CPD is missing or failed.\n- **warn** (note): an introduced duplicate, listed with every occurrence (file and line range).\n- **pass**: none introduced.\n\n### `static.banned-api`\n\nAdvisory. Owner: contributor.\n\nWhen real checkstyle ran on the PR this check is **not-applicable** (\"superseded by static.checkstyle\"). Otherwise it is an approximation of checkstyle, and its summary says so. Rules come from three checkstyle modules: `RegexpSinglelineJava` (the regex as written), `IllegalImport` (listed classes and packages), and `IllegalInstantiation` (`new` of listed classes). Only added lines in `src/java/**/*.java` are scanned. A line is skipped when it starts with `//`, `/*`, or `*`, when it contains `checkstyle: permit`, or when the added line before it does.\n\n- **not-applicable**: the base branch has no `.build/checkstyle.xml` (older branches).\n- **unknown**: the file exists but no rule could be read from it. Informational only.\n- **warn**: at least one added line matches a rule. Each hit shows file, line, rule, and the project's message (up to 50 hits).\n- **pass**: no added line matches.\n\n### `static.license-header`\n\nAdvisory. Owner: contributor.\n\nNew files ending in `.java`, `.py`, `.sh`, `.xml`, `.g`, `.yaml`, `.yml`, or `.properties`, outside `test/resources/`, must contain \"Licensed to the Apache Software Foundation\" in their first 30 lines.\n\n- **warn**: at least one such new file lacks it.\n- **pass**: all have it, or there are no such new files.\n\n### `static.protected-paths`\n\nAdvisory. Owner: contributor.\n\n- **warn** (needs action): a file under `src/gen-java/` or `lib/` changed. Grammar files are listed too if present.\n- **warn** (informational): only CQL grammar files under `src/antlr/` changed. Shown, but does not change the recommendation; the grammar change needs a dev@ discussion and a CQL docs update.\n- **pass**: none of these paths changed.\n\n### `static.deprecated-since`\n\nAdvisory. Owner: contributor.\n\nScans added lines in every `.java` file, including tests, for `@Deprecated` not immediately followed by `(since`. Comment lines are skipped. Like `static.banned-api`, it is **not-applicable** (superseded by `static.checkstyle`) when real checkstyle ran, and otherwise labelled an approximation.\n\n- **warn**: at least one such annotation.\n- **pass**: none.\n\n## How to fix\n\nRun the real checks locally before pushing:\n\n```\nant checkstyle          # main code\nant checkstyle-test     # test code\nant check               # checkstyle, checkstyle-test, and RAT licence check\n.build/docker/check-code.sh 11   # the same in Docker, as CI runs it\n```\n\n- **Banned API**: use the replacement named in the message. If the call is truly needed, add a suppression comment that explains why, as checkstyle's `SuppressWithNearbyCommentFilter` expects.\n- **Licence header**: copy `.build/header.txt` (or the header of any existing source file) to the top of the new file.\n- **Generated code**: change the source (`src/antlr/*.g`) and let the build regenerate `src/gen-java/`.\n- **`lib/`**: dependencies are declared in the `.build/*-template.xml` POMs and need a dev@ `[DISCUSS]` thread first.\n- **Grammar**: start a dev@ thread, and update the CQL docs and reserved keywords if needed.\n- **Deprecation**: write `@Deprecated(since = \"5.0\")`.\n\n## Limits\n\n- Real analysis covers changed Java files only, excluding `src/gen-java/` and `modules/accord/`. Over 400 changed files PMD is skipped (`unknown`); each tool has a 120 s cap and a PR a 300 s cap.\n- `cassandra-4.0` has no checkstyle config, so `static.checkstyle` is `unknown` there and the diff approximations below keep running.\n- Results are computed when the PR is fetched and stored in the evidence bundle; an offline re-render replays them and runs no tool. The report shows the tool versions used.\n- The first PR against a branch builds the baseline (about four and a half minutes for trunk on four threads; its own 900 s cap) and later PRs reuse it. A baseline for the same branch built less than seven days ago is reused when the tip moved. If the baseline cannot be built, house style falls back to the density of each rule in the base versions of the touched files, which the block states.\n- PMD without type info can misfire on rules that resolve types, for example `WrongTestAnnotation` and `CloseResource`. The block says whether type info was used, and greys those rules when it was not. Only a PR that was built (committer PRs, or an owner-approved build) has type info.\n- The usual-for-Cassandra test uses the base branch's overall rate, not the rate of the touched packages, and a small PR has little power to show a rule is unusual: expect one or two violations of a common rule to count as usual.\n- Complexity matching is by signature; a method moved between classes may be reported as new or removed, or labelled \"moved\".\n- A tool that is missing or crashes shows `unknown` with the reason; it is never counted as clean.\n- The diff-based checks (banned API, licence header, `@Deprecated`) approximate `ant check` from the diff. The report's About section lists `ant check` as not run.\n- `.build/checkstyle_suppressions.xml` is not applied, so files the project exempts can be flagged. Test code (`checkstyle_test.xml`) is not scanned for banned APIs.\n- Rules that need a parse tree are not checked: import order, unused or star imports, the `var` ban, and `MissingDeprecated`.\n- A multi-line statement is checked line by line, so a banned call split across lines is missed.\n- `@Deprecated(forRemoval = true, since = \"5.0\")` is flagged, because `since` is not first.\n- The licence check flags new `.yaml` and `.xml` files that RAT itself excludes (for example `cassandra*.yaml`).\n- The human style rules on the [Code style](https://cassandra.apache.org/_/development/code_style.html) page (braces, naming, `final` on locals, exception handling, logging) are not checked.\n","summary":"# Summary and recommendation\n\n## What is checked\n\nThe summary page collects the result of every other section: the PR's title, number, author, base branch, and JIRA key and status; one recommendation with the reasons for it and who it is waiting on; the triage rating; and a grid of every requirement check with its status. Blocking failures come first, each with the next action.\n\nThe recommendation is computed from the check results. It is not a merge decision. Committers make that.\n\n## Why\n\nThe project's merge preconditions are spread over several pages: a ticket ([CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md)), CI for every affected branch and two committer +1s ([Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance)), tests ([AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md)), and the reviewer checklist ([How to review](https://cassandra.apache.org/_/development/how_to_review.html)). The summary puts them in one place and says what is missing and whose move it is.\n\n## How each status is decided\n\nEvery check has a status (pass, fail, warn, unknown, not-applicable), is either **blocking** or **advisory**, and names an owner: contributor, reviewer, or committer. A warn either needs action or is informational; each aspect page says which.\n\nThe recommendation applies these rules in order. The first rule that matches wins. Who acts decides the result: contributor items come first, because they are the only ones the contributor can move.\n\n| Order | Condition | Recommendation |\n|---|---|---|\n| 1 | The PR is a GitHub draft. | **Draft**: checks are early feedback only; blocking failures are still listed. |\n| 2 | A blocking check owned by the contributor failed, or a code review issue (findings from all lenses, merged) is a blocker or major. | **Needs contributor work** |\n| 3 | An advisory warning owned by the contributor needs action. | **Needs work**: contributor fixes requested |\n| 4 | A blocking check is unknown (an input such as JIRA or the committer roster could not be read). | **Insufficient evidence** |\n| 5 | What remains is owned by reviewers or committers: committer +1s, CI that a committer runs, explaining CI failures. | **Awaiting review**: the contributor's part is done |\n| 6 | Every blocking check passes, but the code review panel has not run or did not complete. | **Requirements met, code not yet reviewed** |\n| 7 | Every blocking check passes and every lens ran and approved with no blocker or major finding. | **Ready to merge** |\n\nThe reasons listed are the checks or findings that triggered the rule, plus anything owned by others that is still open. \"Waiting on\" is the set of owners of those reasons.\n\n**Ready to merge** needs the full code review panel (`/review-pr`). A report made with `cpr review` alone stops at rule 6.\n\nThe summary's navigation badge follows the recommendation: needs contributor work is fail, needs work is warn, insufficient evidence is unknown, awaiting review and draft are info, requirements met and ready are pass.\n\nOther sections take the worst status of their checks, ignoring not-applicable, in the order fail, unknown, warn, pass. A section with no applicable checks shows info.\n\n## How to fix\n\nWork through the reasons from the top. Blocking failures stop everything else, so fix those first; each one links to its section and names the action. For anything owned by a reviewer or committer, your step is usually to ask on the JIRA ticket. Then regenerate the report.\n\n## Limits\n\n- Rule 3 counts every contributor-owned warning that needs action, so one small issue (for example a missing `CHANGES.txt` line) gives \"needs work\" even when all blocking checks pass.\n- A check that crashes reports unknown. When that check is blocking, the result is \"insufficient evidence\", not a pass.\n- The recommendation knows only what the checks can see. Design, scope, backport choices, and dev@ consensus are left to people; the About section lists them.\n- Data is a snapshot from the fetch time shown in About.\n","testing":"# Testing\n\n## What is checked\n\nOne automated check runs in this version: when a PR changes production code, does it also change test code? It looks only at which files changed. It does not build, run, or read the tests, and it cannot tell a good test from a weak one.\n\nThe rest of this page explains what the Cassandra project expects from tests, so you can meet the standard that reviewers apply by hand.\n\n### The test suites\n\nEvery suite below lives in `apache/cassandra` except the Python dtests. Run any of them with `.build/run-tests.sh -a \u003ctype>`.\n\n| Suite | Where | `-a` type | Use it for |\n|---|---|---|---|\n| Unit and single-node integration (JUnit, `CQLTester`) | `test/unit` | `test` (variants: `test-latest`, `test-cdc`, `test-compression`, `test-oa`, `test-tries`, `test-system-keyspace-directory`) | Almost every change. Logic, state transitions, CQL behaviour on one node. |\n| In-JVM distributed tests | `test/distributed` (`org.apache.cassandra.distributed.test`) | `jvm-dtest`, `jvm-dtest-novnode` | Behaviour that needs more than one node: messaging, repair, streaming, gossip, cluster metadata, consistency. |\n| In-JVM upgrade tests | `test/distributed` (`org.apache.cassandra.distributed.upgrade`) | `jvm-dtest-upgrade` | Mixed-version clusters and upgrading with data written by an older version. Needs `ant dtest-jar` built for each version. |\n| Python dtests | separate repo [apache/cassandra-dtest](https://github.com/apache/cassandra-dtest), driven by ccm | `dtest`, `dtest-novnode`, `dtest-offheap`, `dtest-large`, `dtest-upgrade` | Black-box cluster and client contracts, tools, and upgrade paths that are awkward to reach from the in-JVM framework. |\n| Fuzz and Harry | `test/distributed/org/apache/cassandra/fuzz`, `test/harry` | (run with the in-JVM dtests) | Property-based and model-based checking of reads and writes against a reference model. |\n| Simulator | `test/simulator` | `simulator-dtest` | Deterministic simulation of concurrent and distributed protocols (Accord, cluster metadata). |\n| Burn | `test/burn` | `test-burn` | Sustained randomised load on one component. |\n| Long | `test/long` | `long-test` | Tests too slow for pre-commit. They run post-commit only. |\n| Microbenchmarks (JMH) | `test/microbench` | `microbench-test` (compile and smoke run); full run with `ant microbench -Dbenchmark.name=\u003cName>` | Performance claims and hot-path changes. |\n| cqlsh | `pylib/cqlshlib/test` | `cqlsh-test` | Changes to cqlsh (`pylib/`). |\n| Tools | `tools/stress`, fqltool, sstableloader | `stress-test`, `fqltool-test`, `sstableloader-test` | Changes to those tools. |\n\nSources: [testing page](https://cassandra.apache.org/_/development/testing.html), [.build/README.md](https://github.com/apache/cassandra/blob/trunk/.build/README.md), `TARGET_TYPES` in `.build/run-tests.sh`.\n\n### Which suite fits which change\n\n- **A bug fix**: a regression test that fails without the fix and passes with it. Put it in the lowest suite that can reproduce the bug, usually `test/unit`.\n- **Single-node logic or CQL behaviour**: a unit test, using `CQLTester` for anything that goes through CQL.\n- **Behaviour across nodes** (messaging, repair, streaming, bootstrap, consistency levels, schema or cluster metadata): an in-JVM dtest in `test/distributed`. Add a Python dtest only when the in-JVM framework cannot reach the behaviour, and still add the granular Java tests.\n- **Serialization, messaging versions, SSTable, commit log, hints, or system tables**: an upgrade test (in-JVM `upgrade` package or a Python upgrade dtest), serialization tests such as `*SerializationsTest`, and CI with the `pre-commit w/ upgrades` profile (see the CI aspect).\n- **Concurrency or distributed protocols** (Paxos, Accord, cluster metadata): consider the simulator or a fuzz test in addition to targeted tests.\n- **Long-running behaviour** (compaction over time, resource leaks): a long or burn test.\n- **Read or write path performance**: a JMH benchmark in `test/microbench` or `cassandra-stress` numbers, before and after.\n- **Config**: `ConfigCompatibilityTest` and `LoadOldYAMLBackwardCompatibilityTest` already guard yaml compatibility. Add a test for the new setting's behaviour.\n- **nodetool**: update the help fixtures under `test/resources/nodetool/help/` that `NodetoolHelpCommandsOutputTest` checks.\n\n## Why\n\n- \"When fixing a bug, write the regression test first\" and \"provide test coverage for all new or modified code.\" Source: [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), section Testing.\n- Reviewers check that \"tests exist, are comprehensive, and actually exercise the behaviour\", that tests reuse `CQLTester`, dtest, and ccm helpers, that multi-node behaviour has in-JVM or Python dtests, and that long-running behaviour has long or fuzz tests. Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), section Testing.\n- Python dtests \"are not a replacement for proper functional java tests\". Systems that dtests cover also need granular Java tests. Distributed components should be testable in JUnit with injected dependencies, and global state \"is not an excuse to not test something\". Source: [TESTING.md](https://github.com/apache/cassandra/blob/trunk/TESTING.md).\n- Unit tests should cover every state transition, illegal transitions (which must throw), all conditional branches, range boundaries, and exception handling, without testing implementation details. Integration tests should cover messages sent and received, side effects, restart after clean and unclean shutdown, and upgrade with data from a previous version. Structure each test as setup, precondition assert, action, postcondition assert. Source: [TESTING.md](https://github.com/apache/cassandra/blob/trunk/TESTING.md).\n- Test debt should be paid down in proportion to the change. Refactor-heavy, test-light patches \"are not likely to get committed\". Source: [TESTING.md](https://github.com/apache/cassandra/blob/trunk/TESTING.md).\n- How much testing a change needs depends on its stability risk: tooling needs less than the storage engine. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html).\n- Performance claims \"must be measurable\" (JMH, cassandra-stress, NoSQLBench), and read or write path changes should be tested for regressions under several workloads. Sources: [testing page](https://cassandra.apache.org/_/development/testing.html), section Performance Testing; [How to review](https://cassandra.apache.org/_/development/how_to_review.html).\n- Repeated runs: new or changed tests that depend on timing (dtests, tests with timeouts, sleeps, or races) are often flaky. Reviewers commonly ask for evidence that such tests pass many times in a row. The legacy CircleCI config repeated changed tests automatically; the current Jenkins pre-commit profiles do not, so you run the repeats yourself. This is project convention; no current page makes it a written rule. Sources: [.build/README.md](https://github.com/apache/cassandra/blob/trunk/.build/README.md), section \"Repeating tests\"; `.circleci/readme.md`.\n\n## How each status is decided\n\n### `tests.present`\n\n**Blocking.** Owner: contributor.\n\nThe check sorts changed files into production and test code by path:\n\n- **Production code** is any path under `src/java/` or `pylib/` that is not a test path.\n- **Test code** is any path under `test/`, any path containing `/test/`, and `pylib/cqlshlib/test/`. Each test file is assigned a suite from its directory (`unit`, `distributed`, `burn`, `long`, `microbench`, `simulator`, `harry`, `memory`, `anttasks`, `cqlsh`), or `other` for any other test path.\n\nThen:\n\n- **not-applicable**: no production lines changed (additions plus deletions in production files is zero). Docs-only, build-only, and test-only PRs land here.\n- **fail**: production code changed and no test file of any suite changed.\n- **pass**: production code changed and at least one test file changed. The summary names the suites touched and the ratio of test lines to production lines. Lines under `test/resources/`, `test/data/`, and `test/conf/` do not count toward the ratio, but they do count as a test change.\n- The check never returns warn or unknown. If it crashes, it reports unknown, which as a blocking check makes the recommendation \"insufficient evidence\".\n\nA fail makes the recommendation **blocked**. The triage rating also adds one point for production code without tests.\n\n## How to fix\n\n**Write the test before the fix.** For a bug, reproduce it in a test first, watch it fail, then apply the fix and watch it pass. Say in the PR or on the ticket that the test fails without the fix.\n\n**Pick the suite** from the table above. Start with the lowest level that can show the behaviour.\n\n**Run it locally.** For one class:\n\n```\nant testsome -Dtest.name=org.apache.cassandra.db.SomeTest\n.build/run-tests.sh -a test -t SomeTest\n.build/run-tests.sh -a jvm-dtest -t SomeDistributedTest\n```\n\n**Repeat timing-sensitive tests.** For a new or changed test that uses timeouts, sleeps, several nodes, or background threads, run it many times and post the result on the ticket:\n\n```\n.build/run-tests.sh -a test-repeat -t SomeTest -e REPEATED_TESTS_COUNT=500\n.build/run-tests.sh -a jvm-dtest-repeat -t SomeDistributedTest -e REPEATED_TESTS_COUNT=100\n```\n\n**Then:**\n\n- **Python dtests**: open a PR against [apache/cassandra-dtest](https://github.com/apache/cassandra-dtest) on the same ticket, link it from the JIRA ticket and the PR description, and point CI at your dtest fork and branch.\n- **Upgrade-sensitive changes**: add an in-JVM upgrade test or a Python upgrade dtest, and run CI with the `pre-commit w/ upgrades` profile.\n- **Performance changes**: attach JMH or `cassandra-stress` results, before and after, to the ticket.\n- **If no test is possible**, explain why on the ticket and in the PR description. The check will still fail; a reviewer decides whether the explanation is enough.\n- Fill in the ticket's **Test and Documentation Plan** field with what you tested and how.\n\nThe Cassandra repo ships agent skills for this work in `.claude/skills/`: `write-reproducer` and `cassandra-injvm-dtest`.\n\n## Limits\n\n- **Presence only.** The check sees that a test file changed. It does not know whether that test covers the change, fails without the fix, or passes at all. A one-line edit to an unrelated test satisfies it.\n- **Deleting or touching test data counts.** A PR that only deletes a test, or only edits a file under `test/resources/`, passes.\n- **Python dtests are invisible.** Tests in `cassandra-dtest` live in another repo, so a PR whose only test is a dtest PR fails this check. A reviewer can accept the linked dtest PR.\n- **Narrow definition of production code.** Only `src/java/` and `pylib/` count. Changes under `tools/` (for example `tools/stress`), `conf/`, `src/resources/`, or `src/antlr/` alone make this check not-applicable, even when they change behaviour.\n- **Tests are not run.** This version runs no tests. Test results come only from CI summaries attached to JIRA (see the CI aspect), and repeated runs are not detected at all.\n- **No judgement of fit.** The check does not ask whether multi-node behaviour has a dtest, whether an on-disk format change has an upgrade test, or whether a performance claim has numbers. Reviewers judge these. Review lenses that do this are planned, not built.\n","triage":"# Triage\n\n## What is checked\n\nHow hard the PR is to review: **easy**, **moderate**, or **hard**. The rating is a sum of points from fixed signals in the diff. It says nothing about whether the code is good. Its purpose is to help reviewers choose what to pick up and to tell authors when a patch might be easier to review in pieces.\n\nThresholds and path lists live in `cpr/config/triage.json`.\n\n## Why\n\n- Less complex patches are reviewed faster; large work should be split. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html).\n- A patch's scope should be the minimum necessary. Source: [Code style](https://cassandra.apache.org/_/development/code_style.html).\n- How much care a change needs depends on its stability risk; tooling needs less than the storage engine. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html).\n- Changes to serialization or on-disk formats need upgrade testing and break mixed-version clusters when wrong. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Profiles\".\n- The project's own review skills pick a method by size: shallow review for small patches, targeted review for 50 to 1000 lines, mega review above 1000. Source: `.claude/skills/` in [apache/cassandra](https://github.com/apache/cassandra/tree/trunk/.claude/skills).\n\n## How each status is decided\n\nLine and file counts skip generated files (`src/gen-java/`, `*.db`, `*.bin`, `/gen/`), test data (`test/resources/`, `test/data/`, `test/conf/`), and binary files. Test code is counted. Production files are those under `src/java/` and `pylib/` outside test directories.\n\n| Signal | Points |\n|---|---|\n| Changed lines (additions plus deletions) | over 1000: 4 (very large); over 400: 2 (large); over 100: 1 (medium) |\n| Changed files | over 30: 2; over 10: 1 |\n| Subsystems touched (top-level packages under `org/apache/cassandra/` in production files) | over 4: 2; over 2: 1 |\n| Compatibility surfaces touched (see the Compatibility aspect) | 1 per surface |\n| High-risk surfaces among them: messaging, sstable format, commitlog / hints, native protocol, schema / system tables | 1 more per surface |\n| Concurrency-sensitive paths: `concurrent/`, `db/compaction/`, `service/paxos/`, `service/accord/`, `utils/concurrent/`, `tcm/`, `streaming/` | 2 if any production file is under one |\n| Target branches (this PR plus open sibling PRs) | over 2: 1 |\n| Production code changed with no test file changed | 1 |\n\n**Rating**: 5 points or more is hard, 2 to 4 is moderate, 0 or 1 is easy.\n\n**Forced hard**: if any upgrade-sensitive file changed (the same list the CI aspect uses for `ci.profile`: messaging, SSTable format, commit log, hints, schema and system keyspace, serializers), the rating is hard whatever the points, and the report says which files forced it.\n\n**Split suggestion**: when production lines changed exceed 1000, the report suggests splitting and lists the five largest changed files.\n\nTriage has no checks and no pass or fail. Its section badge is always info.\n\n## How to fix\n\nThere is nothing to fix. To make review easier:\n\n- Split unrelated changes, refactors, and whitespace fixes into separate tickets and PRs.\n- For large features, land the work in reviewable steps, or discuss the plan on dev@ or in a CEP first.\n- Explain in the PR description where to start reading and what is mechanical (renames, generated code).\n- Include tests; a missing test adds a point.\n\n## Limits\n\n- Points measure size and risk areas, not difficulty. A one-line change to a Paxos invariant can be harder than 2,000 lines of new tooling.\n- Surfaces and concurrency areas are matched by path prefix.\n- Compatibility surfaces are counted over all changed files, including generated and test-data files that the line count skips.\n- The five largest files in a split suggestion can include tests, even though the threshold counts only production lines.\n- Thresholds are set by this tool, not by the Cassandra project.\n","votes":"# Reviews and votes\n\n## What is checked\n\nHow many Cassandra committers have given the patch a +1, from GitHub reviews and JIRA comments, against the number the project's governance requires.\n\n## Why\n\n- \"Code modifications must have been reviewed by at least one other contributor.\"\n- \"Code modifications require two +1 committer votes (can be author + reviewer).\" A patch from a non-committer needs two committer +1s; a committer's own patch needs one other committer's +1.\n- \"Modifications involving only test code require one +1 vote from a non-author committer.\"\n- Code must not be committed while under active discussion, while a committer has asked for time to review, or with an unresolved reasoned committer -1.\n\nSource for all four: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\nReviewers usually give their +1 in a JIRA comment, and the ticket's Reviewers field names them. Some approve on GitHub instead. The committer list comes from the ASF: [projects.apache.org](https://projects.apache.org/committee.html?cassandra).\n\n## How each status is decided\n\n### `votes.committer-plus-ones`\n\n**Blocking.** Owner: reviewer.\n\n**What counts as a +1**: a GitHub review in state APPROVED, or a JIRA comment containing `+1` as a separate token (`+1`, `(+1`, `[+1`, but not `+10`).\n\n**Who counts as a committer**, checked in this order and shown next to each vote:\n\n1. An entry in `cpr/data/committer-overrides.json` maps the GitHub or JIRA user to an ASF id on the roster.\n2. JIRA: the commenter's JIRA username is an ASF id on the Cassandra committer roster.\n3. GitHub: the user has authored commits as `\u003casf-id>@apache.org` and that id is on the roster.\n4. GitHub: the review's author association is MEMBER or OWNER (apache organisation members).\n\nThe roster is the `cassandra` group in the ASF's public LDAP data, cached for 24 hours. Each committer counts once, even if they approve on GitHub and comment on JIRA.\n\n**How many are needed**: one if every changed file is a test file, otherwise two. When the PR author is a committer and the change is not test-only, the author counts as one vote.\n\n- **unknown**: the roster could not be loaded and no vote was matched by another rule. Raw +1s are listed. The recommendation becomes \"insufficient evidence\".\n- **fail**: fewer committer +1s than needed. The recommendation becomes \"blocked\".\n- **pass**: enough committer +1s. Non-committer +1s are listed but not counted.\n\nEven with enough votes, the recommendation cannot pass \"requirements met, code not yet reviewed\" in this version.\n\n## How to fix\n\n- Ask for review on the JIRA ticket: set it to Patch Available (\"Submit Patch\") and ask in a comment. If nobody responds, ask on the dev@cassandra.apache.org mailing list or in the #cassandra-dev channel on the ASF Slack.\n- Address review comments, then ask the reviewer to record their +1 on the ticket.\n- If a committer's +1 is not counted, their JIRA username or GitHub account could not be matched to an ASF id. Add a mapping in `cpr/data/committer-overrides.json`.\n- Contributors cannot fix this alone. A fail here is normal for a new PR.\n\n## Limits\n\n- `+1` is found by pattern. \"+1 to the idea\", \"+1 (nb)\", or a quoted +1 from someone else count as votes if the commenter is a committer. Every counted vote links to its source so a human can check it.\n- -1 votes, requests for time to review, and ongoing discussion are not detected.\n- GitHub MEMBER and OWNER mean apache organisation member, which includes committers of other ASF projects. They are counted as `github:\u003clogin>`, so the same person approving on GitHub and commenting on JIRA can be counted twice when no `@apache.org` commit email links the two.\n- A committer whose JIRA username differs from their ASF id is not matched unless an override exists.\n- For test-only changes, the rule needs a non-author committer; the check does not exclude a +1 the author left on their own ticket.\n- Votes on sibling PRs for other branches are not read; only this PR's GitHub reviews and the shared JIRA ticket.\n"},"diffview":{"status":"unavailable","reason":"The rustyrazorblade dev-skills plugin (ide-explain) is not installed.","version":null,"html_b64":null,"omitted":[]},"about":{"not_checked":["`ant check` (checkstyle and RAT) was not run; the static checks here approximate it from the diff.","Tests are built and run only for committers' PRs (or a PR the owner approved) and only a selection of unit tests; otherwise CI evidence comes only from summaries attached to JIRA.","CI failures are counted, not compared against known flaky tests (Butler) yet.","Code review lenses read the diff; they do not build or run tests."     }
    append(body, docsBlock(sec));
    append(c, [head, body]);
    collapsible(head, body, false);
    return c;
  }

  function renderBackground() {
    var sec = h("section", "stack");
    sec.id = "background";
    sec.setAttribute("aria-labelledby", "bg-h");
    var h2 = h("h2", "sec", "Background for reviewers");
    h2.id = "bg-h";
    append(sec, h("div", "sec-head", h("div", null, [h2, h("p", "sub", "Information only. Nothing here passes or fails.")])));
    var grid = h("div", "bg-grid");
    [effortCard, peopleCard, historyCard, filesCard, labplanCard].forEach(function (fn) {
      try { grid.appendChild(fn()); } catch (e) {
        if (typeof console !== "undefined") console.error(e);
        grid.appendChild(h("div", "bg-card full", h("div", "notice s-fail", [h("strong", null, "This card failed to render. "), String(e && e.message || e)])));
      }
    });
    sec.appendChild(grid);
    return sec;
  }

  // -------------------------------------------------------------------------
  // Glossary and footer (About lives here)
  // -------------------------------------------------------------------------
  var GLOSSARY = [
    ["Must fix", "The PR cannot merge until this is done."],
    ["Should fix", "Not required to merge, but reviewers will likely ask for it."],
    ["Note", "Worth knowing. Nobody has to act on it."],
    ["Unknown", "The tool could not read what it needed, so it cannot say."],
    ["Not needed", "The check does not apply to this change."],
    ["Committer", "A project member who can merge code and run CI."],
    ["+1 vote", "A committer says “I approve this change.” Two are needed."],
    ["CI", "Continuous integration: the full automated test run."],
    ["Fix Version", "The release versions in JIRA where this fix will ship."],
    ["Blocker / major / minor", "How serious a code review finding is. Blockers and majors must be fixed."],
    ["Lens", "One automated reviewer that looks at the code for one kind of problem."],
    ["Review effort", "How much work a human review will take: easy, moderate or hard."],
    ["Lab plan", "A generated plan for trying the change on a test cluster. It is not run for you."],
    ["Diff view", "The code changes with the tool's notes beside them."]
  ];
  function renderGlossary() {
    var sec = h("section", "card");
    sec.id = "glossary";
    sec.setAttribute("aria-labelledby", "gl-h");
    var head = h("button", "cc-head row", [h("span", "tt", [h("b", null, "Words used in this report"), h("span", null, "Short explanations of project terms")]), chev(16)]);
    head.type = "button";
    head.querySelector(".tt b").id = "gl-h";
    var dl = h("dl", "gloss", GLOSSARY.map(function (g) { return h("div", null, [h("dt", null, g[0]), h("dd", null, g[1])]); }));
    append(sec, [head, dl]);
    collapsible(head, dl, false);
    return sec;
  }
  function renderFooter() {
    var tool = M.tool || {};
    var a = M.about || {};
    var inp = a.inputs || {};
    var f = h("footer", "ft");
    append(f, h("div", "line", [
      h("span", null, "Made by " + (tool.name || "cassandra-pr-review") + " " + (tool.version || "") + " on " + (M.generated_at || "")),
      h("span", null, ["Reviewed commit ", h("span", "mono", short(pr.head_sha, 7))]),
      h("span", null, "This tool only reads. It never changes GitHub or JIRA.")]));
    var body = h("div", "cc-body");
    append(body, h("div", "panel", fields([
      ["Tool", (tool.name || "") + " " + (tool.version || "")], ["Generated", M.generated_at], ["Model schema", String(M.schema)]
    ].concat(Object.keys(inp).map(function (k) {
      var v = inp[k];
      var label = k.replace(/_/g, " ");
      label = label.charAt(0).toUpperCase() + label.slice(1);
      return [label, v === null || v === undefined ? null : h("span", /sha|merge_base/.test(k) ? "mono" : null, String(v))];
    })))));
    append(body, gblock("Not checked by this tool", [list(a.not_checked || [], function (x) { return mdInline("span", x); })], (a.not_checked || []).length));
    append(body, gblock("Needs a human", [list(a.human_only || [], function (x) { return mdInline("span", x); })], (a.human_only || []).length));
    var btn = h("button", "linkbtn", [h("span", null, "About this report"), chev(14)]);
    btn.type = "button";
    btn.id = "about-toggle";
    append(f, [btn, body]);
    body.id = "about";
    collapsible(btn, body, false);
    return f;
  }

  // -------------------------------------------------------------------------
  // Build the page
  // -------------------------------------------------------------------------
  document.title = "PR #" + pr.number + ": " + (pr.title || "") + " — Cassandra PR review";
  append(document.getElementById("nav-pr"), (function () { var a = link(pr.url, "PR #" + pr.number, "nav-pr"); return a; })());
  append(document.getElementById("nav-pill"), h("span", "chip pill s-" + vKind, verdict.headline));

  renderHeader();
  var mainEl = document.getElementById("main");
  var renderers = [renderStatus, renderChecks, renderFindings, renderBackground, renderGlossary];
  renderers.forEach(function (fn) {
    try { mainEl.appendChild(fn()); } catch (e) {
      if (typeof console !== "undefined") console.error(e);
      mainEl.appendChild(h("div", "notice s-fail", [h("strong", null, "A section failed to render. "), String(e && e.message || e)]));
    }
  });
  mainEl.appendChild(renderFooter());

  // -------------------------------------------------------------------------
  // Navigation: grouped links with status icons
  // -------------------------------------------------------------------------
  var navLinks = {};
  var navOrder = [];
  function navItem(id, label, href, kind, count) {
    var a = h("a", "nav-link");
    a.href = href;
    var mark;
    if (kind) {
      mark = svg(kind, 14, 3.2, wordOfKind(kind));
      mark.setAttribute("class", "nav-ic nav-" + kind);
    } else mark = h("span", "nav-dot", h("i"));
    append(a, [mark, h("span", "lbl", label), count ? h("span", "cnt", String(count)) : null]);
    navLinks[id] = a;
    navOrder.push({ id: id, el: null, href: href });
    return a;
  }
  var navBody = document.getElementById("nav-body");
  function navGroup(label, items) {
    navBody.appendChild(h("div", "nav-group", [h("div", "eyebrow", label)].concat(items)));
  }
  var todoMust = (V.todo && V.todo.must_count) || 0;
  navGroup("Overview", [navItem("status", "Status", "#status"), navItem("next", "To do", "#next", null, todoMust || "")]);
  navGroup("Checks", (V.groups || []).map(function (g) {
    var n = g.is_review ? ((M.review || {}).issues || []).length : ((sectionById[g.id] || {}).checks || []).length;
    return navItem("g-" + g.id, g.title, g.is_review ? "#findings" : "#sec-" + g.id, kindOfWord(g.word), g.is_review && (M.review || {}).status !== "ran" ? "" : n);
  }));
  navGroup("Background", [
    navItem("bg-effort", "Review effort", "#bg-effort", null, (M.triage || {}).rating ? (M.triage.rating.charAt(0).toUpperCase() + M.triage.rating.slice(1)) : ""),
    navItem("bg-people", "Who knows this code", "#bg-people"),
    navItem("bg-history", "History", "#bg-history"),
    navItem("changes", "Files changed", "#changes", null, (M.files || []).length),
    navItem("labplan", "Lab plan", "#labplan")
  ]);
  navGroup("Help", [navItem("glossary", "Words used here", "#glossary")]);
  var foot = h("div", "nav-foot", [h("span", null, "Made " + (M.generated_at || "")), h("span", null, ["Commit ", h("span", "mono", short(pr.head_sha, 7))])]);
  navBody.appendChild(foot);
  navOrder.forEach(function (n) { n.el = document.getElementById(n.href.slice(1)); });
  navOrder = navOrder.filter(function (n) { return n.el; });

  // Narrow screens: the nav is a top bar; the Sections button shows or hides its list.
  var navEl = document.getElementById("nav");
  var navToggle = document.getElementById("nav-toggle");
  navToggle.addEventListener("click", function () {
    var on = !navEl.classList.contains("open");
    navEl.classList.toggle("open", on);
    navToggle.setAttribute("aria-expanded", on ? "true" : "false");
  });
  function closeNav() {
    navEl.classList.remove("open");
    navToggle.setAttribute("aria-expanded", "false");
  }

  // -------------------------------------------------------------------------
  // Deep links (D3). A hash opens its target and everything around it.
  // -------------------------------------------------------------------------
  var LEGACY = { summary: "status", review: "findings", triage: "bg-effort", context: "bg-people", about: "about",
    ticket: "sec-ticket", ci: "sec-ci", testing: "sec-testing", build: "sec-build", commits: "sec-commits", static: "sec-static",
    compatibility: "sec-compatibility", votes: "sec-votes", labplan: "labplan", changes: "changes" };
  var spyLockUntil = 0;
  function setActive(id) {
    Object.keys(navLinks).forEach(function (k) {
      if (k === id) navLinks[k].setAttribute("aria-current", "location"); else navLinks[k].removeAttribute("aria-current");
    });
  }
  function keyForHref(href) {
    var key = null;
    Object.keys(navLinks).forEach(function (k) { if (navLinks[k].getAttribute("href") === href) key = k; });
    return key;
  }
  function go(raw) {
    var id = decodeURIComponent(String(raw || "").replace(/^#/, ""));
    if (!id) return;
    if (!document.getElementById(id) && LEGACY[id]) id = LEGACY[id];
    var el = document.getElementById(id);
    if (!el) return;
    openAncestors(el);
    if (el._ctl) el._ctl.set(true);
    var own = el.matches(".group, .bg-card, #glossary, #next") ? el.querySelector(":scope > .cbody") : null; // a group, the lab plan, the glossary or the To do panel
    if (own && own._ctl) own._ctl.set(true);
    if (id === "changes") openDiff();
    el.scrollIntoView({ block: "start" });
    if (el.tagName === "LI") { el.classList.add("ck-flash"); setTimeout(function () { el.classList.remove("ck-flash"); }, 1600); }
    var hit = null;
    navOrder.forEach(function (n) { if (n.el === el || n.el.contains(el)) hit = n; });
    var key = hit && keyForHref(hit.href);
    if (key) { spyLockUntil = Date.now() + 800; setActive(key); }
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a || a.getAttribute("href") === "#") return;
    ev.preventDefault();
    var href = a.getAttribute("href");
    closeNav();
    try { if (location.hash !== href) history.pushState(null, "", href); } catch (e) { location.hash = href; return; }
    go(href);
  });
  window.addEventListener("hashchange", function () { go(location.hash); });

  // Scroll-spy: highlight the last target whose top has passed 30% of the viewport.
  function spy() {
    if (Date.now() < spyLockUntil) return;
    var line = window.innerHeight * 0.3, cur = navOrder.length ? navOrder[0] : null;
    navOrder.forEach(function (n) { if (n.el.getBoundingClientRect().top <= line) cur = n; });
    // At the very bottom the last items can never reach the line; the last one is current then.
    if (navOrder.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) cur = navOrder[navOrder.length - 1];
    if (!cur) return;
    var key = keyForHref(cur.href);
    if (key) setActive(key);
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function () { spy(); }, { rootMargin: "0px 0px -70% 0px", threshold: [0, 1] });
    navOrder.forEach(function (n) { io.observe(n.el); });
  }
  window.addEventListener("scroll", function () { if (Date.now() >= spyLockUntil) spy(); }, { passive: true });
  setActive("status");
  if (location.hash && location.hash.length > 1) go(location.hash); else spy();

  // Print: open every <details> while printing, then restore.
  var reopened = [];
  window.addEventListener("beforeprint", function () {
    reopened = Array.prototype.filter.call(document.querySelectorAll("details:not([open])"), function (d) { d.open = true; return true; });
  });
  window.addEventListener("afterprint", function () {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  });
})();
</script>
</body>
</html>
