<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cassandra PR review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Design tokens and shared components. One source for the report and the site index: render.py
   inlines this file into both. Colours come from the owner's design (docs/design/report-v2.dc.html).
   No other hex value appears anywhere else in either page. Light theme only. Fonts load from Google
   Fonts when online; the system fallbacks keep both pages readable offline.
   --------------------------------------------------------------------------- */
:root {
  /* Surfaces and ink */
  --bg: #F3F5F8; --panel: #FFFFFF; --soft: #F8FAFC; --soft-2: #F4F6FA; --code-bg: #F0F3F7;
  --ink: #0F2236; --ink-2: #34445A; --ink-3: #56657A;
  --rule: #D9DEE5; --rule-2: #E4E8EE; --rule-3: #EEF1F5; --chip-line: #C9D1DC; --bar-off: #DDE1E7;
  --link: #0B5CAD; --link-hover: #083F78; --hover: #F3F6FA; --flash: rgba(11, 92, 173, .35);

  /* Navigation (dark column) */
  --navy: #0F2236; --navy-active: #1F3A5C; --navy-hover: #172C45; --navy-line: #3A5373;
  --navy-ink: #D3DDEA; --navy-mute: #9DB0C7; --navy-dot: #7E94AF; --on-navy: #FFFFFF;
  --nav-fail: #FF8A5C; --nav-should: #F2C14E; --nav-note: #8FB8EA; --nav-unknown: #C9BDF2; --nav-pass: #4FD1C0; --nav-na: #8A9BB0;

  /* Status chips: text on tint is at least 4.5:1. icon is the stroke colour on light backgrounds. */
  --fail-fg: #8A2606; --fail-bg: #FDEDE6; --fail-icon: #C0360C;
  --should-fg: #5E4300; --should-bg: #FBF3DC; --should-icon: #8C6400;
  --note-fg: #083F78; --note-bg: #E6EEF8; --note-icon: #0B5CAD;
  --pass-fg: #005A52; --pass-bg: #E3F4F1; --pass-icon: #00766C;
  --unknown-fg: #4B3A8C; --unknown-bg: #ECE8F6; --unknown-icon: #5B49A8;
  --na-fg: #56657A; --na-bg: #EEF1F5; --na-icon: #6B7684;

  /* Type scale */
  --sans: 'Red Hat Text', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: 'Red Hat Mono', ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 17px; --fs-h2: 22px; --fs-h1: 24px; --fs-verdict: 26px;

  /* Spacing and radii (chips 3px, cards 6px, buttons 8px) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --r-chip: 3px; --r-card: 6px; --r-btn: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-base)/1.55 var(--sans); }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: var(--link-hover); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: var(--r-card); }
code, .mono { font-family: var(--mono); font-size: 0.9em; overflow-wrap: anywhere; }
code { background: var(--code-bg); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
p { margin: 6px 0; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
svg { flex: none; }
[hidden] { display: none !important; }

/* Cards, status chips, counts, tags, buttons: the pieces both pages share */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-card); overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; padding: 3px 10px; border-radius: var(--r-chip); white-space: nowrap; color: var(--c-fg); background: var(--c-bg); }
.chip.wide { width: 104px; flex: none; }
.s-fail { --c-fg: var(--fail-fg); --c-bg: var(--fail-bg); --c-icon: var(--fail-icon); }
.s-should { --c-fg: var(--should-fg); --c-bg: var(--should-bg); --c-icon: var(--should-icon); }
.s-note { --c-fg: var(--note-fg); --c-bg: var(--note-bg); --c-icon: var(--note-icon); }
.s-pass { --c-fg: var(--pass-fg); --c-bg: var(--pass-bg); --c-icon: var(--pass-icon); }
.s-unknown { --c-fg: var(--unknown-fg); --c-bg: var(--unknown-bg); --c-icon: var(--unknown-icon); }
.s-na { --c-fg: var(--na-fg); --c-bg: var(--na-bg); --c-icon: var(--na-icon); }
.tag { display: inline-block; font-size: var(--fs-xs); color: var(--ink-3); border: 1px solid var(--rule); border-radius: var(--r-chip); padding: 1px 8px; white-space: nowrap; height: fit-content; }
.tag.strong { color: var(--ink); border-color: var(--ink-3); }
.count { min-width: 22px; text-align: center; font-size: var(--fs-sm); font-weight: 600; padding: 1px 6px; border-radius: var(--r-chip); color: var(--na-fg); background: var(--na-bg); }
.count.must { color: var(--fail-fg); background: var(--fail-bg); }
.outline-btn { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-md); font-weight: 500; color: var(--link); padding: 10px 14px; min-height: 44px; border: 1px solid var(--chip-line); border-radius: var(--r-btn); background: var(--panel); text-decoration: none; }
.outline-btn:hover { background: var(--hover); color: var(--link); }
.linkbtn { font-size: var(--fs-md); font-weight: 500; color: var(--link); min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.linkbtn:hover { color: var(--link-hover); text-decoration: underline; }
.notice { border: 1px solid var(--rule); border-left-width: 4px; border-radius: var(--r-card); padding: 10px 14px; background: var(--panel); margin: 6px 0; font-size: 15px; overflow-wrap: anywhere; }
.notice.s-fail { border-left-color: var(--fail-icon); } .notice.s-should { border-left-color: var(--should-icon); }
.notice.s-unknown { border-left-color: var(--unknown-icon); } .notice.s-note { border-left-color: var(--note-icon); }
.notice.s-pass { border-left-color: var(--pass-icon); } .notice.s-na { border-left-color: var(--na-icon); }
.notice .why { display: block; color: var(--ink-3); font-size: var(--fs-md); margin-top: 2px; }
.empty { color: var(--ink-3); font-style: italic; }
</style>
<style>
pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; background: var(--soft); border: 1px solid var(--rule-2);
  border-radius: var(--r-card); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; max-width: 100%; }
pre code { background: none; border: 0; padding: 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.chev { transition: transform .15s; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev { transform: rotate(180deg); }
.row:hover { background: var(--hover); }
.stack > *, .gx > *, .cc-body > *, .bg-card > *, .blk, .group-body, .card { min-width: 0; max-width: 100%; }

/* ---------------------------------------------------------------------------
   Shell: dark nav on the left, one scrolling column on the right
   --------------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.navcol { background: var(--navy); }
#nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 24px 14px 24px; display: flex; flex-direction: column; gap: 22px; }
.nav-head { padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-mute); }
.nav-pr { font-size: 22px; font-weight: 700; color: var(--on-navy); text-decoration: none; letter-spacing: -0.01em; }
.nav-pr:hover { color: var(--on-navy); text-decoration: underline; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 3px; }
#nav-toggle { display: none; color: var(--navy-ink); border: 1px solid var(--navy-line); border-radius: 6px; min-height: 44px; padding: 0 14px; align-items: center; gap: 8px; font-size: 15px; }
#nav-body { display: flex; flex-direction: column; gap: 22px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group .eyebrow { padding: 0 8px 6px; }
.nav-link { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 3px; text-decoration: none; font-size: 15px; color: var(--navy-ink); }
.nav-link:hover { background: var(--navy-hover); color: var(--on-navy); }
.nav-link[aria-current="location"] { background: var(--navy-active); color: var(--on-navy); font-weight: 600; }
.nav-link:focus-visible { outline-color: var(--on-navy); }
.nav-link .lbl { flex: 1; min-width: 0; }
.nav-link .cnt { font-size: 12px; color: var(--navy-mute); }
.nav-ic.nav-fail { color: var(--nav-fail); } .nav-ic.nav-should { color: var(--nav-should); } .nav-ic.nav-note { color: var(--nav-note); }
.nav-ic.nav-unknown { color: var(--nav-unknown); } .nav-ic.nav-pass { color: var(--nav-pass); } .nav-ic.nav-na { color: var(--nav-na); }
.nav-dot { flex: none; width: 14px; display: flex; justify-content: center; }
.nav-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-dot); display: block; }
.nav-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--navy-mute); display: flex; flex-direction: column; gap: 2px; }

.col { min-width: 0; }
header.pr { background: var(--panel); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
header.pr .wrap { padding-top: 22px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-3); }
.facts .mono { font-size: 13px; color: var(--ink); }
.facts .tag { font-size: 12px; }
.add { color: var(--pass-icon); } .del { color: var(--fail-icon); }
h1.title { font-size: 24px; font-weight: 600; max-width: 52ch; overflow-wrap: anywhere; }
.ticket-line { margin: 0; font-size: 14px; color: var(--ink-3); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 36px; }
section[id], div[id^="sec-"], div[id^="bg-"], div[id^="check-"], li[id^="check-"] { scroll-margin-top: 12px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-head > div { display: flex; flex-direction: column; gap: 4px; }
h2.sec { font-size: 22px; font-weight: 600; }
.sub { margin: 0; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 16px; }
/* ---------------------------------------------------------------------------
   Verdict and To do
   --------------------------------------------------------------------------- */
.verdict { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding: 18px 24px; }
.verdict-main { display: flex; gap: 14px; align-items: center; flex: 1 1 340px; min-width: 0; }
.v-icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--c-fg); background: var(--c-bg); }
.v-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.v-text h2 { font-size: 26px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.v-text p { margin: 0; color: var(--ink-2); }
.v-text p.note { font-size: 14px; color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
.steps li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 3px; font-size: 14px; font-weight: 500; margin: 0; color: var(--c-fg); background: var(--c-bg); }
.v-extra { border-top: 1px solid var(--rule-2); padding: 0 24px 4px; }
.todo { border-top: 1px solid var(--rule-2); }
.todo-head { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 24px; min-height: 48px; background: var(--soft); }
.todo-head .t { font-weight: 600; }
.todo-head .r { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink-2); }
.todo-head .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--link); }
.role { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule-2); }
.role-name { flex: 0 0 170px; padding: 14px 20px; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; }
.role-name small { font-weight: 400; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.role ul { list-style: none; margin: 0; padding: 0; flex: 1 1 360px; min-width: 0; }
.role li { margin: 0; }
.todo-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 20px 10px 0; min-height: 44px; }
.todo-item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; }
.todo-item .tt { font-weight: 500; }
.todo-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--ink-3); }
.todo-item .loc { font-family: var(--mono); font-size: 12.5px; }
.todo-item .src { padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; font-size: 12px; color: var(--ink-2); }
.todo-item .step-mark { display: inline-flex; color: var(--na-icon); }
.role-name .phase { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.todo-detail { padding: 0 20px 12px 24px; font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.todo-detail p { margin: 0; }
.todo-detail .tg { font-size: 12px; color: var(--ink-3); }
.todo:not(.show-opt) .opt { display: none; }
.todo:not(.show-opt) .role.only-opt { display: none; }
#opt-toggle { width: 100%; padding: 12px 20px; min-height: 44px; font-size: 14px; font-weight: 500; color: var(--link); background: var(--soft); border-top: 1px solid var(--rule-2); }

/* ---------------------------------------------------------------------------
   Check groups
   --------------------------------------------------------------------------- */
.group { border-bottom: 1px solid var(--rule-2); }
.group:last-child { border-bottom: 0; }
.group-head { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px 20px; min-height: 56px; }
.group-head .l { display: flex; align-items: center; gap: 12px; flex: 1 1 280px; min-width: 0; font-weight: 600; font-size: 16px; }
.group-head .r { flex: 999 1 280px; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 15px; }
.group-head .r .sum { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.group-head .r .n { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.group-body { background: var(--soft); padding: 4px 20px 18px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist > li { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: 4px; background: var(--panel); margin: 0; }
.ck-icon { flex: none; margin-top: 2px; width: 20px; display: flex; justify-content: center; }
.ck-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ck-title { font-weight: 500; overflow-wrap: anywhere; }
.ck-sum { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.ck-ev { margin: 2px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.ck-ev.capped:not(.all) > li.more { display: none; }
.ev-more { align-self: flex-start; min-height: 40px; }
.howfix { margin-top: 6px; font-size: 14px; background: var(--soft-2); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.ck-tags { flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ck-flash { box-shadow: 0 0 0 3px var(--flash); }
.gx { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.gx .blk > h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.gx .blk > h3 .count { font-size: 12px; }
.gx .blk h4 { font-size: var(--fs-md); font-weight: 600; margin: 14px 0 6px; }
.gx .blk > h4 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 16px; }
/* Tables (.dtable), field lists, details */
.pm-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
.pm-cat { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--r-card); background: var(--c-bg); color: var(--c-fg); border-left: 3px solid var(--c-icon); min-width: 0; }
.pm-cat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.pm-cat span { font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pm-cat.zero { opacity: .55; }
.pm-table table { table-layout: fixed; }
.pm-table th:nth-child(2) { width: 150px; } .pm-table th:nth-child(3) { width: 100px; } .pm-table th:nth-child(4) { width: 100px; }
.pm-table .mono { overflow-wrap: anywhere; word-break: break-all; }
.pm-rule { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; }
.pm-locs { list-style: none; margin: 4px 0 0; padding: 0; font-size: var(--fs-sm); }
.pm-locs li { padding: 3px 0; border-top: 1px solid var(--rule-2); overflow-wrap: anywhere; }
.pm-locs .mono { font-size: var(--fs-sm); }
.pm-base { font-size: var(--fs-sm); color: var(--ink-2); margin: 8px 0; }
.pm-house, .pm-usual { margin-top: 12px; }
.pm-table tr.pm-untyped td { opacity: .55; }
.pm-table tr.pm-untyped .pm-rule { text-decoration: line-through; text-decoration-thickness: 1px; }
.pm-need { font-size: var(--fs-sm); color: var(--ink-2); }
@media (max-width: 640px) { .pm-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pm-table th:nth-child(n) { width: auto; } }
.cx-score { display: inline-block; min-width: 34px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--r-chip); color: var(--c-fg); background: var(--c-bg); border-left: 3px solid var(--c-icon); }
.cx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); margin: 6px 0 10px; }
.cx-table td:first-child { width: 64px; }
.cx-table .tag { margin-left: 8px; }
.s-crit { --c-fg: var(--on-navy); --c-bg: var(--fail-icon); --c-icon: var(--fail-fg); }
.cx-faded td { opacity: .55; }
.cx-split td { background: var(--soft, transparent); font-size: var(--fs-sm); padding-top: 12px; }
.cx-up { color: var(--fail-fg); font-weight: 600; } .cx-down { color: var(--pass-fg); font-weight: 600; }
.cx-file { font-size: var(--fs-sm); margin-top: 2px; overflow-wrap: anywhere; }
.cx-table td:nth-child(2) { width: 90px; }
.dtable { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--panel); max-width: 100%; }
.dtable table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
.dtable th, .dtable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; overflow-wrap: break-word; }
.dtable th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); background: var(--soft); white-space: nowrap; }
.dtable tbody tr:last-child td { border-bottom: 0; }
.dtable td.num, .dtable th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtable .mono { font-size: var(--fs-sm); overflow-wrap: break-word; }
.dtable tr.self td { background: var(--note-bg); }
.dtable.capped:not(.all) tr.more { display: none; }
.dtable .dt-more { display: flex; width: 100%; justify-content: center; border-top: 1px solid var(--rule-2); background: var(--soft); min-height: 44px; }
.dtable .ck-title { font-weight: 500; }
.dtable .paths { display: flex; flex-direction: column; gap: 2px; }
.nowrap { white-space: nowrap; }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: var(--fs-md); }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--panel); margin: 8px 0; }

url":"https://github.com/apache/cassandra/pull/2023/commits/7f8c76dc5702c3e22f5de27ce93459dcb36e6142"},{"sha":"905e457fce0860658643533964b4baad387c000b","message":"Add getType to SSTableFormat","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/905e457fce0860658643533964b4baad387c000b"},{"sha":"4651651fa3bd6b8cf79ed2909b7cf70138754249","message":"Remove getIndexSerializer from SSTableFormat\n\nIts creation has been pulled down to the places where it was called","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/4651651fa3bd6b8cf79ed2909b7cf70138754249"},{"sha":"c95091d764668aa5766612bc1c44d801babba3f4","message":"Pull down rowIndexEntrySerializer field\n\n...from SSTableReader and SSTableWriter to their BIG-specific subclasses\n\nNote that we pull down RowIndexEntrySerializer as it is BIG-specific class","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/c95091d764668aa5766612bc1c44d801babba3f4"},{"sha":"40595cda57112c42f73a1d6cfc2268e7fb3e2255","message":"Moved RowIndexEntry\n\nRowIndexEntry has been moved to the package o.a.io.sstable.format.big\n\nCurrent implementation of RowIndexEntry is specific to BIG format","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/40595cda57112c42f73a1d6cfc2268e7fb3e2255"},{"sha":"0826352405be86694835f6985ebf107703e79b7e","message":"Reduce usages of RowIndexEntry\n\nSSTableReader getPosition will return long position with negative value meaning that no key was found.\nAll places where only the position, or the key existence information is needed are refactored according to that change.\n\nThe original getPosition method has been renamed to getRowIndexEntry","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/0826352405be86694835f6985ebf107703e79b7e"},{"sha":"9d37e072cf047f1d2935fcdad9064ca64d0bb702","message":"Refactor CacheService to support for different key cache values\n\nCacheService now supports arbitrary IRowIndexEntry implementation\nas a key cache value. In order to do that, a new version of auto-saving\ncache was created (\"g\") because some information about the type\nof serialized row index entry needs to be known before it is\ndeserialized (or skipped). Therefore, instead of some unused boolean\nvalue, SSTableFormat type ordinal number is stored, which is\nsufficient because IRowIndexEntry serializer is specific to\nthe sstable format type.\n\nSome other minor cosmetic refactorings has been made to simplify\nthe code. Also, getting the lower bound prefix from cache has been\nmoved to SSTableReader.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/9d37e072cf047f1d2935fcdad9064ca64d0bb702"},{"sha":"d95a9baffba702b810da98fd40aec9d6303687af","message":"Minor refactoring of ColumnIndex","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/d95a9baffba702b810da98fd40aec9d6303687af"},{"sha":"3ecd8c79977620d895e42bc3ba8f5cc3c40e88bf","message":"Just moved AbstractSSTableIterator to o.a.c.io.sstable.format\n\nand extracted IndexState out of it","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/3ecd8c79977620d895e42bc3ba8f5cc3c40e88bf"},{"sha":"89e19ee99018cb6b86f72a10245a4c8016f73992","message":"Refactored AbstractSSTableIterator\n\nAbstractSSTableIterator is now generalized and does not depend on implementation specific IRowIndexEntry.\nExtracted Reader interface while the current Reader was renamed to AbstractReader. Reader is very generic\nand since it is an interface it does not allow for direct access to any internals of the reader.\n\nForwardReader was moved from SSTableIterator to AbstractSSTableIterator as it seems generic enough - it\noperates only on the data file.\n\nSSTableIterator and SSTableReversedIterator as BIG-specific implementations of AbstractSSTableIterator\nwere moved to o.a.c.io.sstable.format.big","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/89e19ee99018cb6b86f72a10245a4c8016f73992"},{"sha":"46daaf04a7737b3839394a7d0d25e1f864b793cd","message":"Extracted IScrubber and IVerifier interfaces\n\nThe current implementations have been moved to o.a.c.io.sstable.format.big\n\nFor scrubber, there has been IScrubber.Options extracted, which plays\na similar role as IVerifier.Options.\n\nCreation of IScrubber and IVerifier was moved to SSTableReader as\nthose tools always work on a particular reader, and the actual\nimplementation of scrubber/verifier is specific to sstable format.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/46daaf04a7737b3839394a7d0d25e1f864b793cd"},{"sha":"78a089fdbb540263d095b8a4c3c06c791117bafa","message":"Push down implementation of SSTableReader.firstKeyBeyond","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/78a089fdbb540263d095b8a4c3c06c791117bafa"},{"sha":"88cb4f58812daeca88fc7af69b1faef660470d03","message":"Moved SSTableReader.getSampleIndexesForRanges to IndexSummary","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/88cb4f58812daeca88fc7af69b1faef660470d03"},{"sha":"aaa9bc3f53e4a6ec66410dd33b71a7be1a36d162","message":"Moved SSTableReader.getKeySamples implementation to IndexSummary","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/aaa9bc3f53e4a6ec66410dd33b71a7be1a36d162"},{"sha":"58be33ff3f75df55ebca8d26a23f11a86fab6abb","message":"Refactor InstanceTidier so that it is more generic\n\nIn particular we want it to handle subclasses with various set of components to be closed without sharing implementation details with those subclasses.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/58be33ff3f75df55ebca8d26a23f11a86fab6abb"},{"sha":"d2027580619c44684ea20f360e98ccc72ad588d3","message":"Refactor dropping page cache\n\nActually removed redundant DropPageCache class","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/d2027580619c44684ea20f360e98ccc72ad588d3"},{"sha":"1f2472554bcf5104afa33e90bc3cbaedf1a37fa1","message":"Refactor sstable metrics\n\nIn particular added the ability for a certain format to register gauges which are specific only to that format and make no sense for others;","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/1f2472554bcf5104afa33e90bc3cbaedf1a37fa1"},{"sha":"e2b200e5ce4f475c7239eaa81d5d37cd1befacb1","message":"Getting rid of index summary in SSTableReader (part 1)\n\nAdded an interface IndexSummarySupport which has one at the moment - getIndexSummary. The interface is implemented by SSTableReaders which include index summary.\nAll the methods in index summary classes have been refactored to support just readers which are of SSTableReader & IndexSummarySupport type.\n\nTherefore, we will no longer need to assume that the generic SSTableReader has anything to do with index summary.\n\nThere are still some leftovers - methods to clone the reader with modified summary - that is going to be addressed in later commits.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/e2b200e5ce4f475c7239eaa81d5d37cd1befacb1"},{"sha":"193d3c3f89ea1181f6ec93c3eaade7dc3d51f582","message":"Getting rid of index summary in SSTableReader (part 2)\n\nRemoved some minor static methods","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/193d3c3f89ea1181f6ec93c3eaade7dc3d51f582"},{"sha":"56f0b0741574ce782fdf61efe9a2a92e98681f6e","message":"Removed direct usages of primary index from SSTableReader","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/56f0b0741574ce782fdf61efe9a2a92e98681f6e"},{"sha":"01c598bc67c7dd15085ea986fb08cb71be555185","message":"Refactor KeyIterator so that it is sstable format agnostic","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/01c598bc67c7dd15085ea986fb08cb71be555185"},{"sha":"9232153c16e280fb550ed9e9b59ed39ba186960c","message":"Remove explicit usage of Components outside of format specific classes","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/9232153c16e280fb550ed9e9b59ed39ba186960c"},{"sha":"6a5a9c185c2274fde0bb569afa74f81606a6344d","message":"Move clone methods implementation from SSTableReader to BigTableReader\n\nwhile keeping abstract methods in SSTableReader","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/6a5a9c185c2274fde0bb569afa74f81606a6344d"},{"sha":"49ad0eb0babedd0539848f45570b8b4a1cd362e1","message":"Move saveIndexSummary and saveBloomFilter to SSTableReaderBuilder","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/49ad0eb0babedd0539848f45570b8b4a1cd362e1"},{"sha":"491b02a8c9e0c0918c0f590e0825f5558b289180","message":"Moved indexSummary field to BigTableReader and made it private","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/491b02a8c9e0c0918c0f590e0825f5558b289180"},{"sha":"b2778cc1074ef9ea86f4a223ff82e1c25917ef1d","message":"Moved ifile field to BigTableReader and made it private","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/b2778cc1074ef9ea86f4a223ff82e1c25917ef1d"},{"sha":"7093bf5693700345e5209b392cd09ad1e3363e4d","message":"Moved static open methods for BigTableReader to the reader factory","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/7093bf5693700345e5209b392cd09ad1e3363e4d"},{"sha":"7e5e6fcffcc4fbd570eb2de5614d1cf8bf4479d3","message":"Minor refactoring around IFilter and its serialization\n\nIn particular, added serialize method to the IFilter interface,\nand moved loadin/saving logic to a separate utility class FilterComponent","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/7e5e6fcffcc4fbd570eb2de5614d1cf8bf4479d3"},{"sha":"1d41b6033026422db4a9c8b32ac464e90c0a3d48","message":"Minor refactorings around IndexSummary\n\nSimilarly to FilterComponent, there is also IndexSummaryComponent extracted\nIt encloses data fields which are contained in the index summary filter\n(note that aside of index summary itself, the file includes first and last\npartition of the sstable as well).\n\nIndexSummaryComponent has been extracted to deal with those fields and have\nthat logic in a single place.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/1d41b6033026422db4a9c8b32ac464e90c0a3d48"},{"sha":"487a749a18ae171d0e43c7b07ac1c7a87f95e972","message":"Extracted TOCComponent class to deal with TOC file\n\nMethods to read and write TOC file were moved to that class","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/487a749a18ae171d0e43c7b07ac1c7a87f95e972"},{"sha":"274f3593b70fc3b109a11f5cbb4ead2c7c8e2c82","message":"Extracted CompressionInfoComponent class\n\nIt includes methods to load and verify the CompressionMetadata\n\nAlso, refactored a bit FileHandle class as it implicitly assumed that if compression is enabled, it must use pertain to data file.","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/274f3593b70fc3b109a11f5cbb4ead2c7c8e2c82"},{"sha":"2202191e600a9f97ba2bddc42a572627a18f0115","message":"Extracted StatsComponent as a helper for elements of SSTable metadata","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/2202191e600a9f97ba2bddc42a572627a18f0115"},{"sha":"28db9d7823e2f4c566fad9060347f45b536ed4d4","message":"Fix SSTable.getMinimalKey","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/28db9d7823e2f4c566fad9060347f45b536ed4d4"},{"sha":"2c4fff8fdd5ef6f7b80c9b0a948602a17cb27099","message":"Refactor FileHandle so that it is no longer closable","author_name":"Jacek Lewandowski","login":"jacek-lewandowski","trailers":[],"url":"https://github.com/apache/cassandra/pull/2023/commits/2c4fff8fdd5ef6f7b80c9b0a948602a17cb27099"},{"sha":"3a2a59aaac1a364b9247ee2b99bc8a7b98fac5ea","message":"wrapping rebufferer","author_name":"Jacek Lewandowski","login":"jacek-lewando 5},"tickets_error":null},"github_reviews":[],"lab_plan":{"status":"plan","reason":null,"markdown":"# Lab Plan: PR 2023 CASSANDRA-17056 SSTable API (trunk)\n\n> **Not run.** Generated by cassandra-pr-review 0.1.0 from the PR diff on 2026-10-11. No cluster was created, no AWS resource touched, and no command below was executed. Commands are checked against `easy-db-lab commands` (version 12) only for spelling. Review before running.\n\n## Objective\n**1. Kill -9 during compaction.** Hypothesis: on the base build, `kill -9` during compaction can leave state that fails recovery at restart (a node that will not start, or error lines in `system.log`); on the PR build it never does. Success: head restarts cleanly in every cycle and base reproduces the failure at least once.\n\n**2. Compaction under write load.** Hypothesis: the changed compaction code keeps write throughput, pending compactions, bytes compacted and disk use at or better than the merge-base. Success: head p99 \u003c= base p99 + 2x the calibration spread and ops/s >= base - 2x the spread, in both A-B pairs; otherwise report no detectable difference.\n\n## Cluster Name\npr2023-b2ae8cc\n\n## Datacenters\nsingle\n\n## Environment\n3 db + 1 app, i4i.xlarge, trunk (JDK 21). Base = 5825a14f73bc (apache/cassandra); head = b2ae8cc01e76 (jacek-lewandowski/cassandra).\n\n## Artifacts under test\n| | base | head |\n|---|---|---|\n| repo / ref | apache/cassandra @ 5825a14f73bc3cfa8d32d7f74833a64d9fff4ad3 | jacek-lewandowski/cassandra @ b2ae8cc01e7676e72d5f88880f9ed6937b79ed0f |\n| build | `build-cassandra-ref.yml` | `build-cassandra-ref.yml` |\n| installed as | `pr2023-base` | `pr2023-head` |\n\n## Steps\n\n### 1. Build both refs (owner's machine)\nBuilds run in a cassandra-builds repo whose workflows you can dispatch. The repo below is the default; change `BUILDS` to your fork if you cannot dispatch there. Both refs are full SHAs, never branch names.\n```bash\nBUILDS=rustyrazorblade/cassandra-builds\ngh workflow run build-cassandra-ref.yml -R $BUILDS -f repo=apache/cassandra -f ref=5825a14f73bc3cfa8d32d7f74833a64d9fff4ad3\ngh workflow run build-cassandra-ref.yml -R $BUILDS -f repo=jacek-lewandowski/cassandra -f ref=b2ae8cc01e7676e72d5f88880f9ed6937b79ed0f\ngh run list -R $BUILDS -w build-cassandra-ref.yml -L 2\n```\n**Pass:** both runs show `success`, and `gh release view \u003csha> -R $BUILDS` lists a `-bin.tar.gz` for each SHA.\n**Fail:** either run fails; stop here.\n\n### 2. Provision\n```bash\n$EDB init pr2023-b2ae8cc --db.count 3 --app.count 1 --db.instance-type i4i.xlarge --app.instance-type i4i.xlarge --up\n$EDB status\n```\n**Pass:** all nodes are up.\n\n### 3. Install both builds on all nodes\n```bash\nURL_BASE=$(gh release view 5825a14f73bc3cfa8d32d7f74833a64d9fff4ad3 -R $BUILDS --json assets --jq '.assets[] | select(.name | endswith(\"-bin.tar.gz\")) | .url')\nURL_HEAD=$(gh release view b2ae8cc01e7676e72d5f88880f9ed6937b79ed0f -R $BUILDS --json assets --jq '.assets[] | select(.name | endswith(\"-bin.tar.gz\")) | .url')\n$EDB cassandra install pr2023-base --java 21 --url \"$URL_BASE\"\n$EDB cassandra install pr2023-head --java 21 --url \"$URL_HEAD\"\n```\n**Pass:** both directories exist on db0, db1, db2 (`ssh -F \"$(dirname \"$EDB\")/sshConfig\" db0 ls /usr/local/cassandra`).\n\n### 4. Calibrate (base, 2 x 5 min)\nTwo identical runs on the base build give the error bar for every delta below.\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr2023-base\n$EDB cassandra start\n$EDB cassandra nt status\nfor k in 1 2; do\n  $EDB cassandra stress start --name cal-$k --tags \"arm=base,phase=cal,pr=2023\" -- KeyValue -r .5 -t 64 -d 5m\n  sleep 360   # stress start returns before the job ends (unverified)\n  $EDB cassandra stress logs cal-$k --tail 40\ndone\n```\n**Record:** ops/s and p99 of both runs. Spread = the difference between them; it is the error bar.\n\n### 5. Arm A (base): start and crash 30 times\nTiny sstables and aggressive compaction maximise obsolete-sstable deletions per minute; each cycle flushes, compacts, then kills the process on one node and restarts it.\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr2023-base\n$EDB cassandra start\n$EDB cassandra nt status\n$EDB cassandra cql \"CREATE KEYSPACE IF NOT EXISTS crash WITH replication={'class':'SimpleStrategy','replication_factor':3}\"\n$EDB cassandra stress start --name base-load --tags \"arm=base,pr=2023\" -- KeyValue -d 40m -t 64 --rate 30k -r .1 --compaction \"{'class':'SizeTieredCompactionStrategy','min_threshold':2}\"\nfor i in $(seq 1 30); do\n  $EDB cassandra nt --hosts db1 flush\n  $EDB cassandra nt --hosts db1 compact\n  sleep $((RANDOM % 8))\n  $EDB exec run -t cassandra --hosts db1 bash -c \"sudo systemctl kill -s KILL cassandra; exit 0\"\n  $EDB cassandra start --hosts db1\n  $EDB exec run -t cassandra --hosts db1 bash -c \"grep -E -c 'ERROR|Unexpected files detected' /mnt/db1/cassandra/logs/system.log; exit 0\"\ndone\n```\n**Record:** cycles where db1 did not return to UN, and the count of matching log lines per cycle.\n**Unverified until run:** the systemd unit name `cassandra`, whether `start --hosts` waits for UN, and the log path.\n\n### 6. Arm B (head): reset, switch builds, crash 30 times\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr2023-head\n$EDB cassandra start\n$EDB cassandra nt status\n$EDB cassandra cql \"CREATE KEYSPACE IF NOT EXISTS crash WITH replication={'class':'SimpleStrategy','replication_factor':3}\"\n$EDB cassandra stress start --name head-load --tags \"arm=head,pr=2023\" -- KeyValue -d 40m -t 64 --rate 30k -r .1 --compaction \"{'class':'SizeTieredCompactionStrategy','min_threshold':2}\"\nfor i in $(seq 1 30); do\n  $EDB cassandra nt --hosts db1 flush\n  $EDB cassandra nt --hosts db1 compact\n  sleep $((RANDOM % 8))\n  $EDB exec run -t cassandra --hosts db1 bash -c \"sudo systemctl kill -s KILL cassandra; exit 0\"\n  $EDB cassandra start --hosts db1\n  $EDB exec run -t cassandra --hosts db1 bash -c \"grep -E -c 'ERROR|Unexpected files detected' /mnt/db1/cassandra/logs/system.log; exit 0\"\ndone\n```\n**Pass:** head restarts in 30/30 cycles with 0 matching log lines, and base showed at least one failure.\n**Fail:** any failed restart or matching log line on head.\n**Inconclusive:** base shows 0 failures in 30 cycles (the control cannot fail); extend to 100 cycles or mark the result not informative. Do not report this as fixed.\n\n### 7. Measured runs, order A B B A (compaction under write load)\nData is wiped between arms. Each job is tagged with its arm and run number.\n```bash\nk=0\nfor arm in base head head base; do\n  k=$((k+1))\n  $EDB cassandra stop\n  $EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n  $EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n  $EDB cassandra use pr2023-$arm\n  $EDB cassandra start\n  $EDB cassandra nt status\n  $EDB cassandra stress start --name compaction-$arm-$k --tags \"arm=$arm,run=$k,pr=2023\" -- RandomPartitionAccess -r .1 -p 10m -t 64 -d 20m\n  sleep 1260   # job length plus a minute; stress start returns early (unverified)\n  $EDB cassandra stress logs compaction-$arm-$k --tail 40\n  $EDB cassandra nt gcstats\n  $EDB cassandra nt tpstats\n  $EDB cassandra nt compactionstats\n  $EDB exec run -t cassandra bash -c \"grep -c ERROR /mnt/db1/cassandra/logs/system.log; exit 0\"\n  $EDB cassandra stress stop --all --force\ndone\n```\n**Pass:** for every workload, head ops/s and p99 are within 2x the calibration spread of base in both A-B pairs, and head logs no new `ERROR` lines.\n**Fail:** head is outside that spread in both pairs, or logs new errors or timeouts.\n**No detectable difference:** a delta below 2x the calibration spread, or in only one pair.\n**Unverified until run:** the data directory path and whether `stress start` returns before the job ends.\n\n### 8. Collect results\nFill the results table below from the job logs and `nt` output, apply the decision rule from the Objective, and write the verdict (fixed, no detectable difference, regression, or inconclusive) next to it.\n```bash\n$EDB cassandra nt status\n$EDB cassandra stress status\n```\n\n### 9. Teardown\n```bash\n$EDB down --auto-approve\ngh release delete 5825a14f73bc3cfa8d32d7f74833a64d9fff4ad3 -R $BUILDS --cleanup-tag --yes\ngh release delete b2ae8cc01e7676e72d5f88880f9ed6937b79ed0f -R $BUILDS --cleanup-tag --yes\n```\nPer-SHA releases accumulate; skip the last two lines if another plan uses the same SHA.\n\n## Results table (fill in)\n| arm | run | ops/s | p99 ms | GC ms/s | pending compactions | errors |\n|---|---|---|---|---|---|---|\n| base | 1 |  |  |  |  |  |\n| head | 2 |  |  |  |  |  |\n| head | 3 |  |  |  |  |  |\n| base | 4 |  |  |  |  |  |\n\n## Notes\nScenario **kill -9 during compaction** was chosen by rule `crash-recovery` (6 production files, 57 changed lines).\nScenario **compaction under write load** was chosen by rule `compaction` (13 production files, 1881 changed lines).\nChanged paths behind the first scenario: `src/java/org/apache/cassandra/db/lifecycle/View.java`, `src/java/org/apache/cassandra/db/lifecycle/LogFile.java`, `src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java`, `src/java/org/apache/cassandra/db/lifecycle/Helpers.java`, `src/java/org/apache/cassandra/db/l d":"ci","title":"Branches & CI","status":"fail","docs":["ci","branches"],"checks":["ci.evidence","ci.freshness","ci.profile","ci.failures","branches.coverage"]},{"id":"testing","title":"Testing","status":"pass","docs":["testing"],"checks":["tests.present"]},{"id":"build","title":"Build & coverage","status":"not-applicable","docs":["build"],"checks":["build.compiles","build.tests-pass","build.changed-line-coverage"]},{"id":"labplan","title":"Lab plan","status":"info","docs":["labplan"],"checks":[],"summary":"Plan for kill -9 during compaction and compaction under write load (not run)"},{"id":"commits","title":"Commits & changelog","status":"warn","docs":["commits"],"checks":["commits.message-format","commits.provenance","changelog.entry","commit.perf-structure"]},{"id":"static","title":"Code style","status":"warn","docs":["static"],"checks":["static.checkstyle","static.complexity","static.pmd-rules","static.duplication","static.banned-api","static.license-header","static.protected-paths","static.deprecated-since"]},{"id":"compatibility","title":"Compatibility","status":"warn","docs":["compatibility"],"checks":["compat.config-pairing","compat.system-properties","compat.nodetool-help","compat.surfaces"]},{"id":"votes","title":"Reviews & votes","status":"fail","docs":["votes"],"checks":["votes.committer-plus-ones"]},{"id":"triage","title":"Triage","status":"info","docs":["triage"],"checks":[]},{"id":"context","title":"Context","status":"info","docs":["context"],"checks":[]},{"id":"review","title":"Code review","status":"unknown","docs":["code-review"],"checks":[]},{"id":"changes","title":"Changes","status":"unknown","docs":["changes"],"checks":[]},{"id":"about","title":"About","status":"info","docs":[],"checks":[]}],"docs":{"branches":"# Branches\n\n## What is checked\n\nWhether every branch named by the ticket's Fix Versions has a PR. The Branches & CI table shows one row per PR for this ticket (this PR and its siblings): base branch, PR, state, head sha, and the CI summary assigned to that branch, if any.\n\nSibling PRs are found two ways: GitHub PR links recorded on the JIRA ticket, and a GitHub search for the ticket key in apache/cassandra. A found PR counts as a sibling only if its own title, branch, or body resolves to the same ticket key.\n\n## Why\n\n- Open **one PR per target branch**. A fix for several release lines arrives as one PR per branch, linked by the ticket key. Source: observed practice, and the merge workflow in [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html).\n- Fix the oldest applicable branch first, then merge forward: `cassandra-4.0 \u2192 cassandra-4.1 \u2192 cassandra-5.0 \u2192 cassandra-6.0 \u2192 trunk`. Contributors should say which versions they verified as affected, patch the lowest branch, and check the patch merges cleanly upward. Sources: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html); [Contributing code changes](https://cassandra.apache.org/_/development/patches.html), \"Bug Fixes\" (that page lists old branch names; follow its intent).\n- Patch releases on GA branches take bug fixes only. Improvements and features go to trunk only. Source: [Release Lifecycle](https://cwiki.apache.org/confluence/spaces/CASSANDRA/pages/132320437/Release+Lifecycle).\n- CI must cover all affected branches before commit. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\n### `branches.coverage`\n\nAdvisory. Owner: contributor.\n\nEach Fix Version is mapped to a branch the same way as in the JIRA aspect (`5.0.x` \u2192 `cassandra-5.0`; a version with no release branch, such as `7.x`, \u2192 `trunk`). A branch is covered when this PR or an **open** sibling PR targets it.\n\n- **unknown**: JIRA could not be reached.\n- **not-applicable**: no ticket was read, or Fix Version is empty, so the expected branches are unknown.\n- **warn**: at least one Fix Version branch has no PR. Moves the recommendation to \"needs work\".\n- **pass**: every Fix Version branch has a PR.\n\n## How to fix\n\n- Open a PR against each missing branch, using a branch name like `\u003cyou>/CASSANDRA-12345/cassandra-5.0`, and put the ticket key in each PR title so the tool and the ASF bot link them.\n- Backports often differ from the trunk patch. Make each PR apply cleanly to its own base.\n- If a branch does not need the fix (the bug is not present there, or the change is a feature for trunk only), remove that Fix Version from the ticket or explain on the ticket. The check will keep warning until the Fix Versions match the PRs.\n- If a sibling PR exists but is not found, make sure its title or branch carries the same ticket key.\n\n## Limits\n\n- Closed sibling PRs do not count. After a committer pushes one branch and closes its PR, the check may warn for that branch.\n- Patches offered as fork compare links or branch names in JIRA comments, not as PRs, are not found.\n- Fix Versions are taken as the truth. If the ticket's Fix Versions are wrong, the check is wrong in the same way.\n- The check does not judge whether a branch should get the change (bug fix versus feature, end-of-life branches). That decision belongs to the committer.\n- It does not test whether the patch merges forward cleanly.\n","build":"# Build & coverage\n\n## What is checked\n\nThree checks read the result of `cpr build \u003cN>`, which builds the PR head, runs a selection of unit tests with JaCoCo, and saves the outcome for that exact head sha. `cpr review` never builds; it only reads the saved result.\n\n- `build.compiles`: did the PR branch compile.\n- `build.tests-pass`: did the selected unit tests pass.\n- `build.changed-line-coverage`: did the lines the PR added under `src/java` run under those tests.\n\nThe section also shows the tests table (classes, run, failed, errors, skipped, failures), coverage per file with the missed line numbers, the list of selected test classes with the reason each was picked, and any failure we blame on the sandbox rather than on the PR.\n\n**Who gets built.** Building runs the PR author's code, so it is limited. A PR is built automatically only when its author is on the committer roster. For any other PR the section says \"Not built for this head\" until the owner approves that exact head with `cpr build \u003cN> --approve`. Approval covers one head sha; a push needs a new approval.\n\n**The sandbox.** Every step that runs the author's code runs inside macOS `sandbox-exec`: no external network, writes only to the run directory, and no read access to credential directories (`~/.ssh`, `~/.aws`, `~/.gnupg`, GitHub and Claude configuration, the keychain). The build works in a throwaway clone with its own copy of the Maven cache. Only dependency resolution uses the network, and it uses the base commit's build file, which the PR cannot change. Some tests fail only because of the sandbox (for example `transferTo0: Operation not permitted` in streaming tests). Those are reported as unknown, not as failures of the PR.\n\n**Reading the numbers.** Line coverage shows which changed lines ran under the selected tests; it does not show that the fix's behaviour is tested. Read with the test regime lens. The selection is a heuristic (tests the PR changes, name matches, references to changed classes and methods; at most 25 classes; no dtests, long, burn or simulator tests), so a missed line can mean \"the right test was not selected\".\n\n## Why\n\n- Reviewers are asked to confirm that the patch builds and that \"tests exist, are comprehensive, and actually exercise the behaviour\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), section Testing. CI results attached to JIRA say this for the committer's own run; this section says it for the head the reviewer is looking at.\n- Changed-line coverage is a cheap, objective hint about the second half of that sentence: an added line that no selected test reaches is a line to ask about. In the research run on PR 5212, all 10 added executable lines were missed, which pointed at interrupt-handling code that no test triggers. Source: `docs/research/build-and-coverage.md`, section 4.\n- The owner decided that automatic builds are for committers' PRs only, always sandboxed, because building is executing someone else's code. Source: the `build-and-coverage` OpenSpec change.\n\n## How each status is decided\n\nThe saved result has a `status`: `pass`, `tests-failed`, `build-failed`, `timeout`, `unknown` or `not-built`. The checks use it with the test and coverage data in the same file.\n\nA result counts only if its `head` equals the PR's current head sha. A result for an older head, or no result at all, is treated as not built: all three checks are not-applicable with the reason \"not built\", the section shows no old numbers, and nothing blocks. Unknown results never block either.\n\n### `build.compiles`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: `status` is `build-failed`. The evidence lists the compile error lines (file, line, message) from the run.\n- **pass**: the build ran: status `pass` or `tests-failed`, or status `unknown` with test results recorded (tests cannot run without a build).\n- **unknown**: status `timeout`, or status `unknown` with no test results (the build outcome was never seen). Does not block.\n- **not-applicable**: not built for this head.\n\n### `build.tests-pass`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: status `tests-failed` and at least one failure that is not a sandbox artifact. The evidence names each failing class and method with its first message line.\n- **pass**: status `pass` with tests run and no failures or errors.\n- **unknown**: status `timeout`; status `unknown`; only sandbox artifacts failed; or no test results were recorded. Does not block.\n- **not-applicable**: not built for this head, or the build failed so no tests ran.\n\n### `build.changed-line-coverage`\n\n**Advisory.** Owner: contributor. A warning here is a note and does not move the verdict.\n\n- **warn**: at least one added executable line did not run. The evidence has one row per file, \"covered N/M, missed lines ...\". A line that ran only partly (some branches or instructions never ran) counts as covered and is flagged \"partly\".\n- **pass**: every added executable line ran.\n- **unknown**: coverage was not measured, or a changed file is missing from the JaCoCo report. Does not block.\n- **not-applicable**: not built, the build failed, or the PR adds no executable line under `src/java` (tests, docs and comments only).\n\n## How to fix\n\n- **Compile errors**: fix them and run `ant jar` and `ant build-test` on the branch.\n- **Failing tests**: run the named class with `ant testsome -Dtest.name=\u003cclass> -Dtest.methods=\u003cmethod>`. If it also fails on the base branch, say so on the ticket.\n- **Missed lines**: add a test that reaches them, in the lowest suite that can (see the Testing aspect). If a missed line is deliberately untestable, say why in the PR.\n- **Not built, committer's PR**: run `cpr build \u003cN>`. The `/review-pr` skill does this for you.\n- **Not built, other authors**: the owner runs `cpr build \u003cN> --approve` after reading the diff, then re-renders.\n- **Timeout or unknown**: read the reason shown in the banner; it names a missing JDK (with the install command), a network problem, or a sandbox artifact.\n\n## Limits\n\n- **Selected tests only.** At most 25 unit test classes run. Passing them says nothing about the rest of the suite, dtests, upgrade tests or the simulator.\n- **Coverage is not proof.** A line can run under a test that does not assert anything about it.\n- **Sandbox artifacts are guessed from known messages.** A real failure that looks like a sandbox error is reported as unknown, never as a pass.\n- **One run per head.** Flaky tests are not rerun in this version; a single failure is reported as failed.\n- **macOS only.** The sandbox and JDK handling are for the owner's machine. Builds do not run in the GitHub Action.\n- **Committers' PRs by default.** For every other PR the section is empty until the owner approves a head.\n","changes":"# Changes\n\n## What is checked\n\nThis section shows the PR's diff. It is a viewer, not a check. The diff runs from the merge base of the PR and its base branch to the PR head, with the PR's GitHub review comments attached to their lines.\n\nThe view is produced by the ide-explain generator from the rustyrazorblade `dev-skills` plugin: a file tree on the left, the diff top right, and an explanation pane bottom right. Files that a check flagged (a fail or warn whose evidence names a file) carry a note in the explanation pane listing the check and what it found.\n\n## Why\n\nReviewers need the code next to the results. A contributor looking at a warning such as \"banned API at line 42\" can open that file and line here. ide-explain is used rather than a custom viewer so that improvements to the plugin reach the report without changes to this tool.\n\n## How each status is decided\n\nThe section badge is **info** when the diff view was produced and **unknown** when it was not.\n\nHow the view is produced:\n\n1. The tool finds the newest installed generator under `~/.claude/plugins/cache/rustyrazorblade-plugins/dev-skills/\u003cversion>/skills/ide-explain/scripts/generate-explain.py`. The environment variable `CPR_IDE_EXPLAIN` overrides the path. The version used is recorded in About.\n2. It runs the generator inside the local clone of apache/cassandra with the merge base, the PR head, the PR number (for review comments), and a per-file notes map built from the check results.\n3. **Size budget**: if the output is larger than 8 MB, the generator runs again limited to `src/`, and the section notes that tests and other files appear only in the file table. If the `src/`-only view is still over 8 MB, no view is embedded.\n4. **Safety**: the output is checked for external scripts, external stylesheets, `@import`, and `fetch(`. If any is found, the view is not embedded. Otherwise the page is stored base64-encoded in the report and loaded into an `\u003ciframe sandbox=\"allow-scripts\">` through `srcdoc`. Without `allow-same-origin`, the embedded page cannot read or change the rest of the report.\n\nWhen there is no view (plugin not installed, the generator failed, too large, or network references found), the section shows a plain list of changed files with additions and deletions, and the reason. The rest of the report is unaffected.\n\n## How to fix\n\nNothing for contributors. If you generate reports yourself and the view is missing, install the `dev-skills` plugin from rustyrazorblade-plugins in Claude Code, or set `CPR_IDE_EXPLAIN` to the path of `generate-explain.py`, then run `cpr review \u003cN>` again.\n\n## Limits\n\n- The view depends on a plugin installed on the machine that built the report. Reports built elsewhere may lack it.\n- On very large PRs only `src/` is shown.\n- The diff is against the merge base, so it can differ from GitHub's \"Files changed\" tab when the base branch has moved.\n- Review comments are those on GitHub when the report was built. JIRA comments are in the JIRA section.\n- Notes come only from checks whose evidence names a file. Checks about the PR as a whole (votes, CI) add no notes.\n","ci":"# CI\n\n## What is checked\n\nWhether pre-commit CI has run for every branch this patch targets, whether it ran on the current PR head, whether it used a profile that covers the change, and how many tests failed.\n\napache/cassandra runs no CI checks on pull requests. CI evidence is the `ci_summary*.html` file that `.build/run-ci` produces and that someone attaches to the JIRA ticket. The tool downloads every attachment whose name contains `ci_summary` and ends in `.html`, and reads the tested commit sha, the branch, the profile, and the pass, fail, and skip counts from it.\n\nEach summary is assigned to a base branch: first by matching its sha to the head sha of this PR or a sibling PR, otherwise by a version (`4.0`, `4.1`, `5.0`, `6.0`) or `trunk` in the branch name it records or in the attachment's file name. When a branch has several summaries, the newest attachment wins.\n\nThe **target branches** are this PR's base plus the base of every open sibling PR (other PRs for the same ticket). The Branches aspect explains how siblings are found.\n\n## Why\n\n- \"Code must not be committed before CI results have been provided for all affected branches.\" Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n- Every patch is expected to carry its CI artifacts, attached to the ticket. Contributors without CI access say so on the ticket and a reviewer or committer runs CI. Sources: [CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md), \"Continuous Integration\"; [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) step 4; [CI page](https://cassandra.apache.org/_/development/ci.html).\n- Reviewers check for \"pre-commit CI results attached to the ticket, for all affected branches (up to trunk, if applicable)\" and ask \"are there any regressions?\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), Testing.\n- The `pre-commit w/ upgrades` profile is required whenever the patch could affect upgrades, serialization, or on-disk formats. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Profiles\".\n- Failures are triaged against [Butler](https://butler.cassandra.apache.org) and JIRA to separate new regressions from known flaky tests. A pre-commit run with a few failures is normal if they are shown to be pre-existing or flaky. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Post-commit CI\".\n\n## How each status is decided\n\nThe first three checks share a rule: with no ticket key, a ticket that does not exist, or JIRA unreachable, they report **unknown**, because there is nowhere to read CI from.\n\n### `ci.evidence`\n\n**Blocking.** Owner: committer.\n\n- **unknown**: no ticket to read (see above). The recommendation becomes \"insufficient evidence\".\n- **fail**: at least one target branch has no parsed summary assigned to it (\"CI not yet run\"). The recommendation becomes \"blocked\".\n- **pass**: every target branch has a summary.\n\nSummaries that could not be downloaded, could not be parsed, or could not be assigned to a branch are listed as evidence but do not count.\n\n### `ci.freshness`\n\nAdvisory. Owner: committer.\n\nCompares, for each target branch with a summary, the sha CI tested against that branch's PR head sha.\n\n- **unknown**: no ticket to read.\n- **not-applicable**: no target branch has a summary.\n- **warn** (needs action): CI ran on an older commit for at least one branch. Moves the recommendation to \"needs work\".\n- **warn** (informational): the summary recorded no usable sha (some `run-ci` versions write a placeholder). Shown, but does not change the recommendation.\n- **pass**: every summary's sha matches its PR head.\n\n### `ci.profile`\n\n**Blocking.** Owner: committer.\n\nA file is upgrade-sensitive when it is under `src/java/` and either its path is in messaging (`net/`), SSTable format (`io/sstable/format/`, or `io/sstable/` files named `*Version*`, `*Descriptor*`, `*Component*`, `*Metadata*`), commit log, hints, `SchemaKeyspace`, `SystemKeyspace`, any `*Serializer.java`, or a serializer under `db/rows/`; or its added lines implement `IVersionedSerializer`, `IVersionedAsymmetricSerializer`, or `IPartitionerDependentSerializer`.\n\n- **not-applicable**: no upgrade-sensitive file changed; `pre-commit` is enough.\n- **unknown**: upgrade-sensitive files changed, but there is no ticket to read or no parsed summary for any branch.\n- **fail**: upgrade-sensitive files changed and at least one branch's summary shows no upgrade tests. A summary counts as having upgrade tests when its text mentions `upgrade-dtest`, `upgrade_dtest`, `upgrade-jdk`, or `upgrade_jdk`. The recommendation becomes \"blocked\".\n- **pass**: every branch with a summary ran upgrade tests.\n\n### `ci.failures`\n\nAdvisory. Owner: reviewer.\n\n- **not-applicable**: no parsed summary.\n- **warn**: the newest summaries report one or more failed tests in total. Up to five failing test names per branch are listed. Failures are not yet compared with known flaky tests. Moves the recommendation to \"needs work\".\n- **pass**: zero failures across all summaries.\n\n## How to fix\n\n**Run pre-commit CI for each target branch.** Use `.build/run-ci` against your own Jenkins (`.build/run-ci --only-setup` creates one in your Kubernetes cluster), the project's pre-commit Jenkins, or an employer's. Options and profiles are described in `.build/run-ci.d/README.md` and on the [CI page](https://cassandra.apache.org/_/development/ci.html).\n\nChoose the profile:\n\n- `pre-commit`: the minimum for code changes.\n- `pre-commit w/ upgrades`: when the change touches messaging, serialization, SSTable or commit log formats, hints, or system tables.\n- `packaging`: build or packaging-only changes.\n\n**Attach the results to the JIRA ticket**, one pair per branch: the `ci_summary` HTML file and the `results_details` archive. Open the ticket, choose More \u2192 Attach files (or drag the files onto the ticket). Keep the branch in the file name, for example `ci_summary_\u003cfork>_CASSANDRA-12345-5.0_\u003cbuild>.html`, so the branch can be identified even if the sha does not match. Then add a comment with the totals per branch and an explanation of each failure: pre-existing (link the Butler entry or JIRA ticket), flaky, or fixed in a later commit.\n\n**No CI access?** Say so in a comment on the ticket and ask a committer to run it. `ci.evidence` stays failed until someone attaches results.\n\n**Stale CI**: re-run CI on the current head, or say on the ticket why the later commits do not need it (for example, a comment-only change).\n\n## Limits\n\n- Only `ci_summary` HTML attachments on JIRA are read. Results posted as links (CircleCI workflows, ci-cassandra.apache.org builds), pasted as text in comments, or reported on the fork's GitHub Actions are not seen.\n- A summary whose sha does not match any sibling PR and whose branch and file name contain no version is not assigned to a branch, so it does not count.\n- If a summary's failure count is missing, it is treated as zero failures.\n- Upgrade-test detection is a text search of the summary page. A profile name that does not contain those words is missed.\n- The upgrade-sensitive file list is a path heuristic. Changes to serialization code in other places are missed, and a rename-only change to a `*Serializer.java` file is flagged.\n- Failures are counted, not triaged. A PR with only known flaky failures still gets a warn until Butler comparison is added.\n- Target branches come from open PRs. A branch that needs CI but has no PR yet is covered by the Branches aspect, not here.\n","code-review":"# Code review\n\n## What is checked\n\nA panel of six review lenses reads the patch. Each lens is an AI reviewer focused on one concern, and each returns findings in the same format. The panel is defined in `cpr/config/panel.json`; every lens is a project agent, so nothing depends on an outside plugin:\n\n| Lens | Focus |\n|---|---|\n| cassandra-standards | The patch against its JIRA ticket (does it do what the ticket asks, and only that) and Cassandra's contribution standards: error handling, project executors and clocks, version gating, backport rules, NEWS.txt. It also runs a security check (auth, roles and permissions, TLS, JMX exposure, UDFs, secrets in logs or virtual tables) that reports nothing when the diff touches no security surface, and it reports PR edits to `.claude/` or `AGENTS.md` |\n| cass-logic-boundary | Conditions and predicates, boundaries and numbers, null and type safety, validation of input |\n| cass-concurrency-lifecycle | Locking and shared state, ordering and lifecycle, cleanup of state and resources |\n| cass-persistence-compat | Serialization and versioning, I/O and crash safety, whether new failure paths are logged at the right level and metrics stay symmetric |\n| cass-completeness-symmetry | Missing counterparts (the read path without the write path, the new option without its docs or tests), API contracts, what a refactor left behind |\n| cass-test-regime | Whether the tests fit Cassandra's testing regime: the right suite for the change, whether the test fails without the fix, whether timing-sensitive tests need repeated runs |\n\nReviewers judge correctness, error handling, testing, logging, and compatibility, and the lenses follow the same list.\n\n**Trusted checklists.** The five `cass-*` lenses work from the checklists the Cassandra project keeps in its own `.claude/skills/` directory. Those are read from `origin/trunk`, resolved to one commit for the whole run, and only from a fixed list of paths. They are never read from the PR's branch or from the base branch, so a patch cannot change how it is reviewed. The report names the commit as \"checklists: apache/cassandra trunk @ \u003csha>\". If a listed file is missing at that commit, the lens that needs it is reported as **missing**; there is no fallback to another copy.\n\n**Tiers.** The amount of checklist each lens receives depends on how many non-test lines the patch changes:\n\n| Tier | Changed non-test lines | What each lens gets |\n|---|---|---|\n| docs-only | Only documentation changed | No lenses run |\n| small | Under 50 | Its shallow checklist |\n| medium | 50 to 1,000 | Shallow checklists plus the targeted categories whose diff signals match the patch (at most 8 across the panel) |\n| large | Over 1,000 | Deep checklists plus a list of focus files ranked by risk; the lens summary names the files it did not review |\n\nEach lens summary states which checklists were applied and what was not reviewed.\n\nThe panel runs only through `/review-pr \u003cN>` in Claude Code. A report made with `cpr review \u003cN>` alone says \"Not run\".\n\n**About this review.** The top of the Code review section says, in plain words, that the findings come from AI reviewers, that they can be wrong, and that committers decide. It then lists the model the lens agents pin (the `model:` line in `.claude/agents/\u003cagent>.md`, for example Sonnet), when the lenses wrote their output, the patch-size tier, the checklist commit, and each lens with what it looks for (the `focus` in `cpr/config/panel.json`). These are recorded when `/review-pr` merges the lens outputs. A review saved before they were recorded shows \"not recorded\". On a PR with no review, the box lists the lenses that would run and how to run them.\n\n## Why\n\n- Reviewers judge correctness, error handling, testing, logging, and compatibility. Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html).\n- The checklists come from apache/cassandra itself, so the lenses ask the questions the project's own review skills ask. Pinning to a commit makes a report reproducible; reading only from trunk keeps a patch from editing its own reviewer.\n- Several lenses often notice the same defect. Merging their findings stops one problem from being counted and listed four times.\n- Two committer +1s are still required whatever an automated review says. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\nEach finding has these fields:\n\n| Field | Meaning |\n|---|---|\n| `id` | Identifier of the finding |\n| `severity` | `blocker`, `major`, `minor`, or `nit` |\n| `location` | File and line in the new file, for example `src/java/org/apache/cassandra/db/Foo.java:42` |\n| `rule` | The rule, standard, or ticket requirement broken |\n| `problem` | What is wrong |\n| `fix` | The smallest change that resolves it |\n| `impact` | Optional. `data-loss`, `crash`, `hang`, `mixed-version-break`, `silent-wrong-result`, `performance`, or `cosmetic` |\n| `confidence` | Optional. `high`, `medium`, or `low`: how sure the lens is that the failure can happen |\n\n**Severity comes from impact and confidence.** When a finding names an impact, `cpr/review.py` sets the severity from this table, whatever severity the lens wrote. If they differ, the report keeps the lens's value as \"was \u003cseverity>\". A finding with no impact keeps its own severity.\n\n| Impact | High confidence | Medium | Low |\n|---|---|---|---|\n| data-loss, crash, hang, mixed-version-break | blocker | major | minor |\n| silent-wrong-result | major | major | minor |\n| performance | minor | minor | nit |\n| cosmetic | nit | nit | nit |\n\nA finding with no concrete way to trigger it is dropped by the lens, not reported as a nit.\n\n**Merging.** Findings from different lenses that describe the same problem are merged into one **issue**. For each pair of findings from different lenses the merger scores how much their problem texts share code identifiers (such as `FileUtils.delete`) and ordinary words, and how much their fixes share identifiers. Findings in the same file get a bonus that is larger the closer the lines are (within 3 lines, within 10 lines); findings at a place that is not a file line, such as the ticket, get a small fixed bonus. Two findings merge only when the text score reaches a floor and the total reaches a threshold, so two different problems on the same line stay separate. Pairs are joined strongest first, and an issue never holds two findings from one lens. The weights, bonuses, line distances, floor, and threshold are in `cpr/config/merge.json`.\n\nAn issue takes the highest severity of its members and lists every lens that reported it, every location, and the member findings. The wording, fix, rule, impact, and confidence come from the most severe member (ties go to the one naming the most identifiers). Fixes from other members that differ are kept as \"also suggested\".\n\nPanel rules (`cpr/review.py`):\n\n- A lens with no output is **missing**; one whose output is not valid JSON in the schema is **invalid**. Neither ever counts as approval.\n- A lens that declines to approve without a blocker or major finding gets a synthesized **major** finding, rule `unexplained-non-approval`. Declining is a verdict and has to be justified.\n- The panel **approves** only when every lens ran, every lens approved, and there is no blocker or major finding. Merging does not change this.\n\nThe report headline reads \"N issues (M findings from K lenses)\", where K counts the lenses that reported at least one finding. \"Must fix\" counts issues, not findings.\n\nEffect on the recommendation: any blocker or major issue gives \"needs contributor work\"; an incomplete panel keeps \"requirements met, code not yet reviewed\"; an approving panel with every requirement met gives \"ready to merge\".\n\nSection badge: unknown when the panel did not run or did not complete, fail when there is a blocker or major issue, warn when there are only minor or nit findings, pass when there are none.\n\nThe Code review section lists the issues first, then each lens's status, approval, summary, and raw findings. Issues with a file location also appear in the Changes view, once per file, naming every lens that reported them.\n\n## How to fix\n\nStart with blocker and major issues. Each names its locations and the smallest fix. If you think an issue is wrong, say why on the JIRA ticket or the PR; the lenses advise reviewers and do not decide anything.\n\n## Limits\n\n- Lenses read the code; they do not build it or run tests. Test evidence comes from CI attached to the ticket.\n- Lenses can be wrong in both directions: they can miss real problems and report false ones. Each issue shows its lenses, rule, and location so a reviewer can check it quickly.\n- Merging is a text-overlap heuristic. Its thresholds were tuned on one real PR (apache/cassandra#5201, where 11 findings became 5 issues), so it can leave a duplicate unmerged or, rarely, join two different problems. The member findings stay visible under each lens.\n- Checklists are upstream's. If trunk changes a checklist, reports made later follow it; the sha in the report says which version was used. Items about APIs that do not exist on a release branch are told to be ignored, but a lens can still apply one.\n- The PR's own files, including apache/cassandra's `CLAUDE.md`, `AGENTS.md`, and `.claude/` skills, are treated as untrusted data. Text that tries to steer the review is reported as a finding, rule `review-steering`.\n- Design acceptability, backport scope, and the merge decision stay with committers.\n","commits":"# Commits and changelog\n\n## What is checked\n\nThe PR's commit messages, their trailers (`Co-authored-by:`, `Assisted-by:`, and similar), signs of undisclosed AI assistance, and whether `CHANGES.txt` has an entry when production code changed, and, for performance PRs, whether the benchmark commit comes before the change.\n\n## Why\n\nThe commit message format is:\n\n```\n\u003cOne sentence description, usually the Jira title or CHANGES.txt summary, no Jira id>\n\n\u003cOptional longer description>\n\npatch by \u003cAuthors>; reviewed by \u003cReviewers> for CASSANDRA-#####\n\nCo-authored-by: Name \u003cemail>\nAssisted-by: AGENT_NAME:MODEL_VERSION\n```\n\nSources: [.github/pull_request_template.md](https://github.com/apache/cassandra/blob/trunk/.github/pull_request_template.md); [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html), \"Commit Message\"; [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), \"Git Workflow\", which adds \"no jira id\" on the first line and the `Assisted-by` trailer.\
