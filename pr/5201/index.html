<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cassandra PR review</title>
<style>
/* ---------------------------------------------------------------------------
   Tokens. Light is the default; dark follows the system unless the reader
   picked light, and is forced when the reader picked dark.
   --------------------------------------------------------------------------- */
:root {
  --bg: #e9edf1;
  --panel: #ffffff;
  --panel-2: #f4f6f8;
  --ink: #16202a;
  --ink-2: #44525f;
  --ink-3: #6f7c88;
  --rule: #d3d9df;
  --rule-strong: #b7c0c8;
  --accent: #245a8c;
  --accent-soft: #e2ecf5;
  --focus: #1f6fd1;
  --nav-bg: #f7f8fa;
  --self-row: #eef4fb;

  --pass: #17663f; --pass-bg: #e2f1e8;
  --warn: #855600; --warn-bg: #fbefd6;
  --fail: #b0251d; --fail-bg: #fbe5e2;
  --unknown: #5c4799; --unknown-bg: #ebe6f6;
  --info: #2c5d7f; --info-bg: #e2edf5;
  --na: #66717c; --na-bg: #eceff2;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 6px;
  --nav-w: 264px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --panel: #151c23; --panel-2: #1b232b;
    --ink: #e3e8ed; --ink-2: #a7b2bd; --ink-3: #7b8793;
    --rule: #28323c; --rule-strong: #3a4652;
    --accent: #84b6e6; --accent-soft: #1a2a3a; --focus: #6aa8f0;
    --nav-bg: #11171d; --self-row: #172535;
    --pass: #5cc98e; --pass-bg: #132a1e;
    --warn: #e5b04a; --warn-bg: #2d2310;
    --fail: #ff7d73; --fail-bg: #3a1715;
    --unknown: #b8a5f3; --unknown-bg: #241d3b;
    --info: #80b8de; --info-bg: #132635;
    --na: #95a0ab; --na-bg: #1d242c;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --panel: #151c23; --panel-2: #1b232b;
  --ink: #e3e8ed; --ink-2: #a7b2bd; --ink-3: #7b8793;
  --rule: #28323c; --rule-strong: #3a4652;
  --accent: #84b6e6; --accent-soft: #1a2a3a; --focus: #6aa8f0;
  --nav-bg: #11171d; --self-row: #172535;
  --pass: #5cc98e; --pass-bg: #132a1e;
  --warn: #e5b04a; --warn-bg: #2d2310;
  --fail: #ff7d73; --fail-bg: #3a1715;
  --unknown: #b8a5f3; --unknown-bg: #241d3b;
  --info: #80b8de; --info-bg: #132635;
  --na: #95a0ab; --na-bg: #1d242c;
}

/* ---------------------------------------------------------------------------
   Base
   --------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 var(--sans);
  font-feature-settings: "tnum" 1;
}
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--panel-2); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
pre code { background: none; border: 0; padding: 0; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
p { margin: 6px 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.muted { color: var(--ink-3); }
.eyebrow { font: 600 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------------------------------------------------------------------------
   Shell: nav + main
   --------------------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh;
  background: linear-gradient(90deg, var(--nav-bg) calc(var(--nav-w) - 1px), var(--rule) calc(var(--nav-w) - 1px), var(--rule) var(--nav-w), transparent var(--nav-w)); }
#nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--nav-bg); border-right: 1px solid var(--rule);
  padding: 18px 12px 18px 14px; display: flex; flex-direction: column; gap: 14px;
}
.nav-head { padding: 0 6px; }
.nav-head .pr-num { font: 700 20px/1.2 var(--sans); letter-spacing: -0.02em; margin-top: 4px; }
.nav-head .pr-num a { color: var(--ink); text-decoration: none; }
.nav-head .pr-num a:hover { text-decoration: underline; }
.nav-verdict { margin-top: 6px; }
#nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
#nav li { margin: 0; }
#nav ol a {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  padding: 7px 8px 7px 10px; border-radius: var(--radius); color: var(--ink-2); text-decoration: none;
  border-left: 3px solid transparent; font-weight: 500;
}
#nav ol a:hover { background: var(--panel-2); color: var(--ink); }
#nav ol a[aria-current="page"] { background: var(--panel); color: var(--ink); border-left-color: var(--accent);
  box-shadow: 0 0 0 1px var(--rule); font-weight: 650; }
.nav-foot { margin-top: auto; padding: 0 6px; font-size: 12px; color: var(--ink-3); }

main { min-width: 0; }
.toolbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 40px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule);
}
.toolbar .crumb { flex: 1; min-width: 0; color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .crumb strong { color: var(--ink); font-weight: 600; }
button.tool {
  font: 500 13px/1 var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--rule-strong);
  border-radius: var(--radius); padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button.tool:hover { border-color: var(--accent); }
#nav-toggle { display: none; }
.content { padding: 28px 40px 64px; max-width: 1120px; }

/* ---------------------------------------------------------------------------
   Sections
   --------------------------------------------------------------------------- */
.report-section { display: none; }
.report-section.active { display: block; }
.sec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.sec-head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.sec-head h2:focus { outline: none; }
.block { margin: 22px 0; }
.block > h3 { font-size: 15px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.block > h3 .count { font: 500 12px var(--mono); color: var(--ink-3); }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.empty { color: var(--ink-3); font-style: italic; }
.notice { border: 1px solid var(--rule-strong); border-left-width: 4px; border-radius: var(--radius); padding: 10px 14px; background: var(--panel); margin: 10px 0; }
.notice.s-fail { border-left-color: var(--fail); }
.notice.s-warn { border-left-color: var(--warn); }
.notice.s-unknown { border-left-color: var(--unknown); }
.notice.s-info { border-left-color: var(--info); }

/* Status badge: color is never the only signal; each badge carries a glyph and a word. */
.badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 600 11.5px/1 var(--mono); letter-spacing: 0.02em; padding: 3px 7px 3px 4px; border-radius: 999px;
  color: var(--c); background: var(--cb); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
}
.badge .g { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
  background: var(--c); color: var(--panel); font: 800 10px/1 var(--sans); }
.s-pass { --c: var(--pass); --cb: var(--pass-bg); }
.s-warn { --c: var(--warn); --cb: var(--warn-bg); }
.s-fail { --c: var(--fail); --cb: var(--fail-bg); }
.s-unknown { --c: var(--unknown); --cb: var(--unknown-bg); }
.s-info { --c: var(--info); --cb: var(--info-bg); }
.s-not-applicable { --c: var(--na); --cb: var(--na-bg); }
.tag { display: inline-block; font: 600 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 3px; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap; }
.tag.blocking { color: var(--ink); border-color: var(--ink); background: var(--panel); }
.tag.owner { border-style: dashed; }

/* ---------------------------------------------------------------------------
   Summary
   --------------------------------------------------------------------------- */
.pr-head h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 8px; overflow-wrap: anywhere; }
.pr-head h1 a { color: var(--ink); text-decoration: none; }
.pr-head h1 a:hover { text-decoration: underline; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13.5px; }
.meta-row > span { white-space: nowrap; }
.meta-row .k { color: var(--ink-3); margin-right: 4px; }

.verdict {
  margin-top: 20px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  border-left: 8px solid var(--c); padding: 16px 20px 14px;
}
.verdict .v-label { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 26px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.15; color: var(--ink); }
.verdict .v-glyph { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--panel); font-size: 18px; font-weight: 800; }
.verdict .v-note { margin: 10px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.verdict .waiting { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.reasons { list-style: none; padding: 0; margin: 14px 0 0; border-top: 1px solid var(--rule); }
.reasons > li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.reasons > li:last-child { border-bottom: 0; padding-bottom: 2px; }
.reasons > li > .badge { align-self: start; justify-self: start; margin-top: 1px; }
.reasons .r-title { font-weight: 650; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.reasons .r-title a { color: var(--ink); }
.reasons .r-body { grid-column: 2; color: var(--ink-2); }
.next { grid-column: 2; margin-top: 4px; background: var(--panel-2); border-radius: 4px; padding: 7px 10px; border: 1px solid var(--rule); }
.next .lead { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink); margin-right: 6px; }

.summary-left { display: grid; gap: 18px; align-content: start; }
.reviewers-card ul { margin: 6px 0 0; padding-left: 18px; }
.reviewers-card li { margin: 4px 0; }
.panel.expert { margin: 0 0 10px; }
.panel.expert ul { margin: 6px 0 0; padding-left: 18px; }
.summary-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); gap: 18px; margin-top: 18px; align-items: start; }
.triage-card .rating { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; text-transform: capitalize; }
.triage-card .pts { font: 500 12.5px var(--mono); color: var(--ink-3); margin-left: 6px; }
.sig { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
.sig li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 4px 0; border-top: 1px dotted var(--rule); margin: 0; }
.sig li .sv { color: var(--ink-3); }
.sig li.scored { color: var(--ink); font-weight: 600; }
.sig li .pp { font: 600 12px var(--mono); }

/* The gate matrix: every check, grouped by section, one row each. */
.matrix { display: flex; flex-direction: column; gap: 12px; }
.matrix-group h4 { font: 600 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px; }
.matrix-group ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.matrix-group li { margin: 0; }
.gate { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.3; }
.gate:hover { border-color: var(--c); }
.gate.blocking { box-shadow: inset 3px 0 0 var(--ink); }
.gate .gk { font: 600 10px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.gate.blocking .gk { color: var(--ink); }
.gate .badge { padding: 2px; }
.gate .badge .w { display: none; }

/* ---------------------------------------------------------------------------
   Checks
   --------------------------------------------------------------------------- */
.checks { display: flex; flex-direction: column; gap: 10px; }
.check { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: var(--radius); padding: 12px 14px; scroll-margin-top: 70px; }
.check.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.check-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.check-head .ct { font-weight: 650; font-size: 15px; }
.check-head .cid { font: 12px var(--mono); color: var(--ink-3); }
.check-head .spacer { flex: 1; }
.check .csum { margin: 6px 0 0; }
.evidence { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.check .next { margin-top: 10px; }

/* ---------------------------------------------------------------------------
   Tables, field lists, details
   --------------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 11px/1.3 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); background: var(--panel-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
.nowrap { white-space: nowrap; }
tr.self td { background: var(--self-row); }
tr.self td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.add { color: var(--pass); } .del { color: var(--fail); }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: 13px; }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); margin: 8px 0; }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; font-size: 13.5px; list-style-position: inside; }
details > summary:hover { background: var(--panel-2); }
details[open] > summary { border-bottom: 1px solid var(--rule); }
details > .d-body { padding: 10px 14px; }
details.inline { border: 0; background: none; margin: 0; }
details.inline > summary { padding: 0; font-weight: 500; color: var(--accent); }
details.inline[open] > summary { border: 0; }
details.inline > .d-body { padding: 6px 0 0; }
details.howto > summary { color: var(--ink-2); }
details.howto > summary::after { content: " — scoring rules and sources"; font-weight: 400; color: var(--ink-3); }
.comment { border-top: 1px solid var(--rule); padding: 10px 0; }
.comment:first-child { border-top: 0; padding-top: 0; }
.comment .who { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }

/* Markdown output */
.md h1 { font-size: 19px; margin: 14px 0 8px; } .md h2 { font-size: 16px; margin: 14px 0 6px; }
.md h3, .md h4, .md h5, .md h6 { font-size: 14px; margin: 12px 0 4px; }
.md > :first-child { margin-top: 0; }
.md table { margin: 8px 0; border: 1px solid var(--rule); }

/* Changes */
.diff-frame { display: block; width: 100%; height: calc(100vh - 190px); min-height: 480px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: #fff; }
.print-only { display: none; }

/* Missing-data banner */
#no-data { display: none; margin: 40px auto; max-width: 640px; padding: 20px 24px; border: 2px solid var(--fail); border-radius: var(--radius); background: var(--panel); }
#no-data h1 { font-size: 20px; color: var(--fail); margin-bottom: 8px; }
body.no-data .shell { display: none; }
body.no-data #no-data { display: block; }

/* ---------------------------------------------------------------------------
   Narrow screens: nav slides in from the left behind a toggle.
   --------------------------------------------------------------------------- */
@media (max-width: 799.98px) {
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .verdict { padding: 14px 14px 12px; border-left-width: 6px; }
  .reasons > li { grid-template-columns: 1fr; }
  .reasons .r-body, .next { grid-column: 1; }
  #nav {
    position: fixed; z-index: 20; left: 0; top: 0; width: min(300px, 86vw); height: 100vh;
    transform: translateX(-100%); visibility: hidden; transition: transform 0.18s ease, visibility 0s linear 0.18s;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }
  body.nav-open #nav { transform: none; visibility: visible; transition: transform 0.18s ease; }
  #nav-scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,0.35); }
  #nav-toggle { display: inline-flex; }
  .toolbar { padding: 8px 16px; }
  .content { padding: 18px 16px 48px; }
  .summary-grid { grid-template-columns: minmax(0, 1fr); }
  .verdict .v-label { font-size: 21px; }
  dl.fields { grid-template-columns: 1fr; gap: 0; }
  dl.fields dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { #nav { transition: none !important; } }

/* ---------------------------------------------------------------------------
   Print: every section in order, no navigation, panels expanded.
   --------------------------------------------------------------------------- */
@media print {
  :root { --bg: #fff; --panel: #fff; --panel-2: #f5f5f5; --nav-bg: #fff; }
  body { background: #fff; font-size: 11.5pt; }
  #nav, #nav-scrim, .toolbar, .no-print, .diff-frame, details > summary::marker { display: none !important; }
  .shell { display: block; background: none; }
  .content { padding: 0; max-width: none; }
  .report-section { display: block !important; break-before: page; }
  .report-section:first-child { break-before: auto; }
  .print-only { display: block; }
  details::details-content { content-visibility: visible; display: block; }
  details > summary { padding: 4px 0; }
  .check, .gate, .verdict, tr { break-inside: avoid; }
  a { color: inherit; }
  .table-wrap { overflow: visible; }
}
</style>
</head>
<body>
<div id="no-data" role="alert">
  <h1>No report data</h1>
  <p>This page is the report template without a report model, or the model failed to load. Generate a report with <code>cpr review &lt;PR number&gt;</code> and open the file it prints.</p>
</div>
<div class="shell">
  <nav id="nav" aria-label="Report sections">
    <div class="nav-head">
      <div class="eyebrow">apache/cassandra review</div>
      <div class="pr-num" id="nav-pr"></div>
      <div class="nav-verdict" id="nav-verdict"></div>
    </div>
    <ol id="nav-list"></ol>
    <div class="nav-foot" id="nav-foot"></div>
  </nav>
  <main id="main">
    <div class="toolbar">
      <button type="button" class="tool" id="nav-toggle" aria-controls="nav" aria-expanded="false"><span aria-hidden="true">&#9776;</span> Sections</button>
      <div class="crumb" id="crumb"></div>
      <button type="button" class="tool" id="theme-toggle" title="Switch colour theme">Theme: system</button>
    </div>
    <div class="content" id="content"></div>

<script id="report-model">window.REPORT_MODEL = {"schema":1,"generated_at":"2026-10-08 01:31 UTC","tool":{"name":"cassandra-pr-review","version":"0.1.0"},"pr":{"number":5201,"url":"https://github.com/apache/cassandra/pull/5201","title":"CASSANDRA-21649: Ensure SSTable files are deleted in order of last-updated timestamp (4.0)","body":"When a node restarts after crashing, we need to clean up any partially-deleted SSTables, but we do a safety check on REMOVE log records to verify that the last-modified timestamps match the actual files on disk. If the timestamps don\u2019t match, we throw an error that the log is corrupted, and the node doesn\u2019t start.\r\n\r\nThe comment in LogFile.verifyRecord() states: \"Because we delete files from oldest to newest, the latest update time should always match.\u201d But this isn\u2019t always true; regular SSTable deletion after compaction always deletes DATA files first, and doesn\u2019t explicitly set the deletion order of other files.\r\n\r\nThis patch ensures SSTable.delete() deletes files in last-modified order, so the overall timestamp never changes on partial deletes. We look up all the file timestamps once, sort the list, and then delete in order.\r\n\r\nThe [Cassandra Jira](https://issues.apache.org/jira/browse/CASSANDRA-21649)","author":"nivykani","author_association":"FIRST_TIME_CONTRIBUTOR","base":"cassandra-4.0","head_ref":"corrupt-log-4.0","head_repo":"nivykani/cassandra","head_sha":"d1095cbdca4173277488e6e93abeb06a35ea0bb8","draft":false,"state":"open","labels":[],"created_at":"2026-09-22T21:24:14Z","updated_at":"2026-09-22T21:24:14Z","additions":8,"deletions":11,"changed_files":1},"jira_key":{"key":"CASSANDRA-21649","sources":["title","body"],"conflicts":[],"mentioned":["CASSANDRA-21649"]},"jira":{"status":"ok","error":null,"ticket":{"key":"CASSANDRA-21649","url":"https://issues.apache.org/jira/browse/CASSANDRA-21649","summary":"Ensure SSTables are deleted in order of last-updated timestamp","status":"Review In P ticket promises additions to LogTransactionTest. Nothing checks the new ordering, and nothing reproduces the crash scenario. That scenario is: write SSTable components with distinct mtimes, write a REMOVE record from the latest mtime, delete only some components in the old DATA-first order, then run LogFile.verifyRecord() or replay. Without such a test, a later change that restores DATA-first deletion would pass CI unnoticed.","fix":"Add a single-node unit test to test/unit/org/apache/cassandra/db/lifecycle/LogTransactionTest.java. Create the component files with explicitly set, distinct lastModified values, where the DATA file is not the oldest and a non-DATA file is the newest. Call SSTable.delete(), or partially delete in the order the code produces, and assert two things. First, the files are removed in ascending mtime order. Second, the max mtime of the remaining files still matches the REMOVE record, so verifyRecord() and the startup cleanup succeed. Confirm the test fails on the base code.","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:112","locations":["src/java/org/apache/cassandra/io/sstable/SSTable.java:112","src/java/org/apache/cassandra/io/sstable/SSTable.java:113","src/java/org/apache/cassandra/db/lifecycle/LogFile.java:258"],"also_fixes":[{"lens":"cassandra-standards","fix":"Keep the timestamp sort, but break ties and special-case ordering explicitly. Document in a comment why DATA no longer goes first. Better, show with a LogTransactionTest case that a partially deleted SSTable is safe, covering a crash with DATA present and other components missing."},{"lens":"cass-persistence-compat","fix":"Add a LogTransactionTest case that deletes in the sorted order, simulates a crash part-way through, and then replays the log. Add a comment documenting why DATA no longer goes first."},{"lens":"cass-completeness-symmetry","fix":"Document the ordering on SSTable.delete(). Add a LogTransactionTest case that deletes partway in sorted order and checks that verification still passes."}],"members":[{"lens":"cass-test-regime","id":"tr-1"},{"lens":"cassandra-standards","id":"cs-2"},{"lens":"cass-persistence-compat","id":"pc-2"},{"lens":"cass-completeness-symmetry","id":"cs-3"}],"impact":null,"confidence":null},{"id":"issue-3","severity":"major","severity_spread":["major"],"lenses":["cassandra-standards"],"rule":"Ticket contract: sort must match how the REMOVE record timestamp is computed","problem":"The sort uses File.lastModified(), which has millisecond or coarser resolution and returns 0 for missing files. Missing files sort first, which is harmless. Files with equal timestamps are ordered by the Set's iteration order, which is arbitrary. The result is correct only because the maximum timestamp is unchanged while any file with the maximum value remains, and that reasoning is not stated. The lookup also builds a new File object per component rather than reusing the existing helpers. LogRecord computes the REMOVE timestamp in a different way and may truncate it, so the two calculations are not shown to agree.","fix":"Add a comment explaining why ties are safe. Confirm the timestamp source matches LogRecord.withExistingFiles/computeUpdateTime, and cover it in the LogTransactionTest additions the ticket calls for.","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:115","locations":["src/java/org/apache/cassandra/io/sstable/SSTable.java:115"],"also_fixes":[],"members":[{"lens":"cassandra-standards","id":"cs-3"}],"impact":"silent-wrong-result","confidence":"medium","severity_corrected":{"from":"minor","to":"major"}},{"id":"issue-4","severity":"major","severity_spread":["major"],"lenses":["cass-completeness-symmetry"],"rule":"Fix-patch: did the fix reach every path that shows the bug (parallel path coverage)","problem":"SSTableTidier.run() still calls delete(datafile) on the DATA file before it calls SSTable.delete(). This is the production compaction-deletion path, and the ticket names it as the cause. DATA is removed first whatever its timestamp. If the node crashes after that delete, the newest remaining lastModified can differ from the REMOVE record. LogFile.verifyRecord() then reports a corrupt log on restart, which is the failure the ticket describes. The new ordering in SSTable.delete() cannot help, because DATA is no longer in discoverComponentsFor(desc) by the time it runs.","fix":"Remove the separate DATA pre-delete in SSTableTidier and let the ordered SSTable.delete() do all the deletes. If the retry-when-DATA-fails behaviour must stay, make SSTable.delete() throw on failure and delete the oldest file first.","location":"src/java/org/apache/cassandra/db/lifecycle/LogTransaction.java:394","locations":["src/java/org/apache/cassandra/db/lifecycle/LogTransaction.java:394"],"also_fixes":[],"members":[{"lens":"cass-completeness-symmetry","id":"cs-1"}],"impact":"silent-wrong-result","confidence":"high"},{"id":"issue-5","severity":"nit","severity_spread":["nit"],"lenses":["cassandra-standards"],"rule":"Code style: avoid needless intermediate structures; comments should say why","problem":"A throwaway HashMap and a separate copy list are built only to feed Comparator.comparingLong(lastModified::get). It also relies on wildcard imports for Map, HashMap, Comparator and ArrayList.","fix":"Collect the (component, lastModified) pairs once, for example in a small list sorted by the timestamp, or sort the components with a Guava Ordering over precomputed values.","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:113","locations":["src/java/org/apache/cassandra/io/sstable/SSTable.java:113"],"also_fixes":[],"members":[{"lens":"cassandra-standards","id":"cs-4"}],"impact":"cosmetic","confidence":"high"}],"issue_counts":{"blocker":0,"major":4,"minor":0,"nit":1},"must_fix":4,"checklists":{"sha":"617fd3b935a0dc869c4c33995a3be78e07bf638a"},"lenses":[{"name":"cassandra-standards","agent":"cassandra-standards-reviewer","status":"ran","approve":false,"summary":"The patch rewrites SSTable.delete() so it looks up each component's lastModified once, sorts the components by it, and deletes them oldest first. The goal is that the latest-update timestamp in a REMOVE log record stays valid after a crash partway through deletion (CASSANDRA-21649). That matches the ticket's stated goal, and as a bug fix it is acceptable for the cassandra-4.0 branch. However, the patch swaps FileUtils.deleteWithConfirm for FileUtils.delete on every component, which silently drops the FSWriteError behaviour. It also removes the deliberate DATA-first and SUMMARY-last ordering without discussing the trade-off. The ticket's test plan (LogTransactionTest additions) has no tests in the diff, and there is no CHANGES.txt entry, but the tool already reported both, so I do not repeat them. No security surface touched.","spec_conformance":"partial","tests_ran":"none","tests_detail":"not run: review-only lens","findings":[{"id":"cs-1","severity":"major","impact":"silent-wrong-result","confidence":"high","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:120","rule":"Error handling: no swallowed failures; file-system errors must surface (FSWriteError / JVMStabilityInspector)","problem":"The old code used FileUtils.deleteWithConfirm, which throws FSWriteError when a delete fails. That error reaches the disk failure policy and the tidier's error handling. The new loop calls FileUtils.delete(String), which just returns File.delete()'s boolean, and the result is ignored. An undeletable component, such as one with a permission or IO error, is now silently skipped. delete() still returns true, the SSTable looks deleted, and the files are leaked. Only SUMMARY was previously deleted without confirmation, because it may legitimately be absent.","fix":"Use FileUtils.deleteWithConfirm for every component except SUMMARY. Keep the tolerant FileUtils.delete for SUMMARY, or skip components whose file does not exist."},{"id":"cs-2","severity":"major","impact":"silent-wrong-result","confidence":"medium","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:112","rule":"Backport safety: a patch-release fix must be minimal and keep existing invariants","problem":"The old code deleted DATA first and SUMMARY last on purpose. Once DATA is gone the SSTable is no longer treated as a complete, openable SSTable, and the remaining components cannot be loaded as a valid but partial table. Timestamp-only ordering removes that guarantee. After a crash partway through, DATA can survive while the index or other components are gone. Any path that scans the directory without the txn log, such as the startup directory listing or the offline tools, may then see a half-present SSTable. The patch neither discusses this nor preserves the DATA-first behaviour where it does not conflict with timestamp order.","fix":"Keep the timestamp sort, but break ties and special-case ordering explicitly. Document in a comment why DATA no longer goes first. Better, show with a LogTransactionTest case that a partially deleted SSTable is safe, covering a crash with DATA present and other components missing."},{"id":"cs-3","severity":"major","impact":"silent-wrong-result","confidence":"medium","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:115","rule":"Ticket contract: sort must match how the REMOVE record timestamp is computed","problem":"The sort uses File.lastModified(), which has millisecond or coarser resolution and returns 0 for missing files. Missing files sort first, which is harmless. Files with equal timestamps are ordered by the Set's iteration order, which is arbitrary. The result is correct only because the maximum timestamp is unchanged while any file with the maximum value remains, and that reasoning is not stated. The lookup also builds a new File object per component rather than reusing the existing helpers. LogRecord computes the REMOVE timestamp in a different way and may truncate it, so the two calculations are not shown to agree.","fix":"Add a comment explaining why ties are safe. Confirm the timestamp source matches LogRecord.withExistingFiles/computeUpdateTime, and cover it in the LogTransactionTest additions the ticket calls for.","severity_corrected":{"from":"minor","to":"major"}},{"id":"cs-4","severity":"nit","impact":"cosmetic","confidence":"high","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:113","rule":"Code style: avoid needless intermediate structures; comments should say why","problem":"A throwaway HashMap and a separate copy list are built only to feed Comparator.comparingLong(lastModified::get). It also relies on wildcard imports for Map, HashMap, Comparator and ArrayList.","fix":"Collect the (component, lastModified) pairs once, for example in a small list sorted by the timestamp, or sort the components with a Guava Ordering over precomputed values."}],"error":null},{"name":"cass-logic-boundary","agent":"cass-logic-boundary","status":"ran","approve":false,"summary":"The patch rewrites SSTable.delete() so it reads each component's lastModified once, sorts the components ascending, and deletes them in that order. The goal is that the SSTable's maximum timestamp survives a partial delete, so LogFile.verifyRecord() still matches after a crash. The sort and ordering logic is sound. Files with equal timestamps tie harmlessly, and a missing file reports 0, so it sorts first and its delete is a no-op. However, the patch also replaces FileUtils.deleteWithConfirm (throws FSWriteError on failure) with FileUtils.delete (ignores File.delete()'s return value). That swallows delete failures for every component. Checklists applied: specialists/logic.md and specialists/boundary.md from refdir. Not reviewed: nothing. Only SSTable.java changed; the other check results in the context are out of my lane.","spec_conformance":"partial","tests_ran":"none","tests_detail":"not run: review-only lens","findings":[{"id":"lb-1","severity":"major","impact":"data-loss","confidence":"medium","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:120","rule":"Error paths that accept failure silently (changed delete semantics); check every return value","problem":"The old code used FileUtils.deleteWithConfirm for DATA and all other components, which throws FSWriteError when a delete fails. Only SUMMARY used the best-effort delete. The new loop calls FileUtils.delete(String) for every component, and that calls File.delete() and discards the boolean. If a delete fails (permissions, I/O error, the file is a directory), SSTable.delete() still returns true and nothing is logged or thrown. The SSTableTidier then treats the sstable as removed and finishes the transaction log, so the leaked files are never retried. Because the loop continues after a failure, newer components can be deleted while an older one remains. The result is a partial SSTable that is no longer tracked, and disk errors go unreported to the disk failure policy. This is the same partial-delete state the ticket is meant to avoid. Which delete failures can occur in practice depends on the filesystem, so I could not confirm how often it fires.","fix":"Keep the failure semantics. Call FileUtils.deleteWithConfirm(desc.filenameFor(component)) for every component. If SUMMARY needs to stay best-effort, keep that exception for SUMMARY only. Skip files that no longer exist rather than treating them as errors.","severity_corrected":{"from":"blocker","to":"major"}}],"error":null},{"name":"cass-concurrency-lifecycle","agent":"cass-concurrency-lifecycle","status":"ran","approve":false,"summary":"The patch rewrites SSTable.delete() so it looks up each component's lastModified once, sorts the components by that value, and deletes them in that order. This is meant to keep the SSTable's max timestamp stable across partial deletes. I applied concurrency.md (the only bundle file) to src/java/org/apache/cassandra/io/sstable/SSTable.java. The sort uses a local snapshot map, not live est timestamp in place until last, as the REMOVE-record check in LogFile.verifyRecord() requires. I applied the resources.md checklist. I checked it against FileUtils.delete and FileUtils.deleteWithConfirm. Nothing was left unreviewed. One finding: the patch swaps the throwing delete call for a swallowing one. I did not check the CHANGES.txt or missing-test gaps, which the context file lists as already checked.","spec_conformance":"partial","tests_ran":"none","tests_detail":"not run: review-only lens","findings":[{"id":"pc-1","severity":"major","impact":"silent-wrong-result","confidence":"high","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:120","rule":"IO and crash safety: error handling must not swallow a disk failure","problem":"The old code deleted every component except SUMMARY with FileUtils.deleteWithConfirm, which throws FSWriteError when a delete fails. The patch deletes every component with FileUtils.delete(String), which returns File.delete()'s boolean and nothing else. The loop ignores that result. Trigger: a read-only filesystem, a permissions error, or a locked file makes a delete fail. SSTable.delete() still returns true, so the tidier treats the SSTable as removed and the transaction log can be finished. The files stay on disk with no log line and no FSWriteError, so the disk-failure policy never runs. The leak the ticket aims to fix can now happen silently. A failed delete of a file in the middle of the order also leaves a later, newer file deleted, which can reproduce the timestamp mismatch on restart.","fix":"Use FileUtils.deleteWithConfirm(desc.filenameFor(component)) for every component. SUMMARY was the only one deleted without confirmation before, and it can stay non-throwing if that was deliberate. At minimum, check the boolean returned by delete and log or throw on failure."},{"id":"pc-2","severity":"major","impact":"silent-wrong-result","confidence":"medium","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:113","rule":"Crash safety: deletion order must match the timestamp recorded in the REMOVE record","problem":"The timestamps are read at delete time, but the REMOVE record was written earlier. LogFile.verifyRecord() compares against the maximum lastModified of the files on disk. Sorting ascending is correct, so the file with the maximum timestamp is deleted last and ties are harmless. A component missing from disk reports lastModified 0 and sorts first, which is harmless. The ordering relies on the sort being ascending and on delete order matching the sorted list. Nothing enforces this beyond the code. The dropped DATA-first rule also changes the partial-delete state. A crash can now leave DATA present while index files are gone, so recovery must always go through the txn log. No regression test covers this; the context file only reports that the patch has no test changes. This does not affect correctness today.","fix":"Add a LogTransactionTest case that deletes in the sorted order, simulates a crash part-way through, and then replays the log. Add a comment documenting why DATA no longer goes first.","severity_corrected":{"from":"minor","to":"major"}}],"error":null},{"name":"cass-completeness-symmetry","agent":"cass-completeness-symmetry","status":"ran","approve":false,"summary":"The PR changes SSTable.delete() to read each component's lastModified, sort the components, and delete the oldest first. I applied absence.md and completeness.md, and reviewed the whole diff (one method). Nothing was left unreviewed. The patch misses the SSTableTidier caller, which deletes DATA first. It also swaps deleteWithConfirm for a delete that ignores failures.","spec_conformance":"partial","tests_ran":"none","tests_detail":"not run: review-only lens","findings":[{"id":"cs-1","severity":"major","impact":"silent-wrong-result","confidence":"high","location":"src/java/org/apache/cassandra/db/lifecycle/LogTransaction.java:394","rule":"Fix-patch: did the fix reach every path that shows the bug (parallel path coverage)","problem":"SSTableTidier.run() still calls delete(datafile) on the DATA file before it calls SSTable.delete(). This is the production compaction-deletion path, and the ticket names it as the cause. DATA is removed first whatever its timestamp. If the node crashes after that delete, the newest remaining lastModified can differ from the REMOVE record. LogFile.verifyRecord() then reports a corrupt log on restart, which is the failure the ticket describes. The new ordering in SSTable.delete() cannot help, because DATA is no longer in discoverComponentsFor(desc) by the time it runs.","fix":"Remove the separate DATA pre-delete in SSTableTidier and let the ordered SSTable.delete() do all the deletes. If the retry-when-DATA-fails behaviour must stay, make SSTable.delete() throw on failure and delete the oldest file first."},{"id":"cs-2","severity":"major","impact":"silent-wrong-result","confidence":"high","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:121","rule":"API contract: error propagation changed by the refactor","problem":"The old code used FileUtils.deleteWithConfirm for every component except SUMMARY. It throws FSWriteError on failure, which feeds the disk failure policy. It also makes SSTableTidier's catch block add the tidier to failedDeletions for a later retry. The new loop calls FileUtils.delete(String) for every component. That returns false and ignores failures such as permission errors. SSTable.delete() still returns true. A failed delete is now silent, the tidier is never retried, and the SSTable files leak until restart.","fix":"Use FileUtils.deleteWithConfirm for every component except SUMMARY, which was lenient before. Alternatively, check the result of delete() and throw on failure."},{"id":"cs-3","severity":"nit","impact":"cosmetic","confidence":"medium","location":"src/java/org/apache/cassandra/db/lifecycle/LogFile.java:258","rule":"Stale comments and tests after the refactor","problem":"The LogFile.verifyRecord comment says files are deleted from oldest to newest. That is true only if the tidier path is fixed (cs-1). The SSTable.delete() javadoc does not state the ordering contract. The patch adds no test, although the ticket plans LogTransactionTest additions. LogRecord leaves STATS out of its timestamp, but the new sort treats STATS like any other component without saying so.","fix":"Document the ordering on SSTable.delete(). Add a LogTransactionTest case that deletes partway in sorted order and checks that verification still passes.","severity_corrected":{"from":"minor","to":"nit"}}],"error":null},{"name":"cass-test-regime","agent":"cass-test-regime","status":"ran","approve":false,"summary":"The patch changes SSTable.delete() in src/java/org/apache/cassandra/io/sstable/SSTable.java. Instead of deleting DATA first and SUMMARY last, it reads each component's lastModified once, sorts the components oldest first, and deletes in that order. This is a bug fix for a node that fails to start after a crash during partial SSTable deletion. I applied the in-JVM dtest skill checklist (.claude/skills/cassandra-injvm-dtest/SKILL.md under refdir) and docs/report/testing.md. The diff contains no test files, although the ticket's test plan says \"additions to LogTransactionTest\". The bug is single-node, so a unit test is the right suite and an in-JVM dtest is not needed. Not reviewed: nothing. The diff is one hunk in one file.","spec_conformance":"partial","tests_ran":"none","tests_detail":"not run: review-only lens","findings":[{"id":"tr-1","severity":"major","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:112","rule":"Bug fix needs a regression test that fails without the fix (ticket plan: additions to LogTransactionTest)","problem":"This is a bug fix, and the PR adds no test at all. The ticket promises additions to LogTransactionTest. Nothing checks the new ordering, and nothing reproduces the crash scenario. That scenario is: write SSTable components with distinct mtimes, write a REMOVE record from the latest mtime, delete only some components in the old DATA-first order, then run LogFile.verifyRecord() or replay. Without such a test, a later change that restores DATA-first deletion would pass CI unnoticed.","fix":"Add a single-node unit test to test/unit/org/apache/cassandra/db/lifecycle/LogTransactionTest.java. Create the component files with explicitly set, distinct lastModified values, where the DATA file is not the oldest and a non-DATA file is the newest. Call SSTable.delete(), or partially delete in the order the code produces, and assert two things. First, the files are removed in ascending mtime order. Second, the max mtime of the remaining files still matches the REMOVE record, so verifyRecord() and the startup cleanup succeed. Confirm the test fails on the base code."},{"id":"tr-2","severity":"minor","location":"src/java/org/apache/cassandra/io/sstable/SSTable.java:120","rule":"Coverage of edge cases and error paths","problem":"Several branches are untested. (a) Components with equal mtimes. File timestamps can be coarse, and ties leave the order arbitrary. (b) A component file that is already missing. lastModified() returns 0, so it sorts first and delete is called on a nonexistent file. (c) The error handling changed. The old code used FileUtils.deleteWithConfirm for most components, which throws on failure. The new code calls FileUtils.delete for every component, so a failed delete is no longer surfaced. Nothing asserts the intended behaviour for these cases.","fix":"Add test cases for tied mtimes, a missing component, and a failing delete. Either restore deleteWithConfirm semantics, or document and assert that the silent delete is intended."}],"error":null}]},"context":{"status":"ok","new_files_only":false,"related_tickets":[{"key":"CASSANDRA-2468","lines":6,"files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"],"summary":"Clean up after failed compaction","status":"Resolved","resoluti ject":"SSTable/SSTableReader cleanup"}],"last_changed":"2013-11-15"}],"untracked_commits":[],"linked_issues":[],"experts":{"src/java/org/apache/cassandra/io/sstable/SSTable.java":[{"person":"maedhroz","name":"Caleb Rackliffe","asf_id":"maedhroz","score":1.23,"patches":1,"reviews":4,"latest":"2026-03-17"},{"person":"smiklosovic","name":"Stefan Miklosovic","asf_id":"smiklosovic","score":1.12,"patches":0,"reviews":4,"latest":"2025-08-29"},{"person":"mck","name":"Michael Semb Wever","asf_id":"mck","score":1.07,"patches":0,"reviews":3,"latest":"2026-03-17"}]},"experts_from":{"src/java/org/apache/cassandra/io/sstable/SSTable.java":"trunk"},"suggested_reviewers":[{"person":"smiklosovic","name":"Stefan Miklosovic","asf_id":"smiklosovic","score":1.12,"patches":0,"reviews":4,"latest":"2025-08-29","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]},{"person":"mck","name":"Michael Semb Wever","asf_id":"mck","score":1.07,"patches":0,"reviews":3,"latest":"2026-03-17","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]},{"person":"mmuzaf","name":"Maxim Muzafarov","asf_id":"mmuzaf","score":1.06,"patches":2,"reviews":0,"latest":"2025-12-21","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]},{"person":"jlewandowski","name":"Jacek Lewandowski","asf_id":"jlewandowski","score":0.97,"patches":3,"reviews":1,"latest":"2023-05-03","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]},{"person":"ycai","name":"Yifan Cai","asf_id":"ycai","score":0.68,"patches":1,"reviews":0,"latest":"2025-08-29","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]}],"already_reviewing":[{"person":"maedhroz","name":"Caleb Rackliffe","asf_id":"maedhroz","score":1.23,"patches":1,"reviews":4,"latest":"2026-03-17","files":["src/java/org/apache/cassandra/io/sstable/SSTable.java"]}],"budget":{"hunks_total":1,"hunks_blamed":1,"hunks_skipped":0,"files_total":1,"files_logged":1,"files_skipped":0},"tickets_error":null},"github_reviews":[],"sections":[{"id":"summary","title":"Summary","status":"fail","docs":["summary"],"checks":[]},{"id":"ticket","title":"JIRA ticket","status":"warn","docs":["jira"],"checks":["jira.key-present","jira.ticket-exists","jira.key-consistent","jira.not-resolved","jira.fix-version"]},{"id":"ci","title":"Branches & CI","status":"fail","docs":["ci","branches"],"checks":["ci.evidence","ci.freshness","ci.profile","ci.failures","branches.coverage"]},{"id":"testing","title":"Testing","status":"fail","docs":["testing"],"checks":["tests.present"]},{"id":"commits","title":"Commits & changelog","status":"warn","docs":["commits"],"checks":["commits.message-format","commits.provenance","changelog.entry","commit.perf-structure"]},{"id":"static","title":"Code style","status":"unknown","docs":["static"],"checks":["static.checkstyle","static.complexity","static.duplication","static.banned-api","static.license-header","static.protected-paths","static.deprecated-since"]},{"id":"compatibility","title":"Compatibility","status":"warn","docs":["compatibility"],"checks":["compat.config-pairing","compat.system-properties","compat.nodetool-help","compat.surfaces"]},{"id":"votes","title":"Reviews & votes","status":"fail","docs":["votes"],"checks":["votes.committer-plus-ones"]},{"id":"triage","title":"Triage","status":"info","docs":["triage"],"checks":[]},{"id":"context","title":"Context","status":"info","docs":["context"],"checks":[]},{"id":"review","title":"Code review","status":"fail","docs":["code-review"],"checks":[]},{"id":"changes","title":"Changes","status":"info","docs":["changes"],"checks":[]},{"id":"about","title":"About","status":"info","docs":[],"checks":[]}],"docs":{"branches":"# Branches\n\n## What is checked\n\nWhether every branch named by the ticket's Fix Versions has a PR. The Branches & CI table shows one row per PR for this ticket (this PR and its siblings): base branch, PR, state, head sha, and the CI summary assigned to that branch, if any.\n\nSibling PRs are found two ways: GitHub PR links recorded on the JIRA ticket, and a GitHub search for the ticket key in apache/cassandra. A found PR counts as a sibling only if its own title, branch, or body resolves to the same ticket key.\n\n## Why\n\n- Open **one PR per target branch**. A fix for several release lines arrives as one PR per branch, linked by the ticket key. Source: observed practice, and the merge workflow in [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html).\n- Fix the oldest applicable branch first, then merge forward: `cassandra-4.0 \u2192 cassandra-4.1 \u2192 cassandra-5.0 \u2192 cassandra-6.0 \u2192 trunk`. Contributors should say which versions they verified as affected, patch the lowest branch, and check the patch merges cleanly upward. Sources: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html); [Contributing code changes](https://cassandra.apache.org/_/development/patches.html), \"Bug Fixes\" (that page lists old branch names; follow its intent).\n- Patch releases on GA branches take bug fixes only. Improvements and features go to trunk only. Source: [Release Lifecycle](https://cwiki.apache.org/confluence/spaces/CASSANDRA/pages/132320437/Release+Lifecycle).\n- CI must cover all affected branches before commit. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\n### `branches.coverage`\n\nAdvisory. Owner: contributor.\n\nEach Fix Version is mapped to a branch the same way as in the JIRA aspect (`5.0.x` \u2192 `cassandra-5.0`; a version with no release branch, such as `7.x`, \u2192 `trunk`). A branch is covered when this PR or an **open** sibling PR targets it.\n\n- **unknown**: JIRA could not be reached.\n- **not-applicable**: no ticket was read, or Fix Version is empty, so the expected branches are unknown.\n- **warn**: at least one Fix Version branch has no PR. Moves the recommendation to \"needs work\".\n- **pass**: every Fix Version branch has a PR.\n\n## How to fix\n\n- Open a PR against each missing branch, using a branch name like `\u003cyou>/CASSANDRA-12345/cassandra-5.0`, and put the ticket key in each PR title so the tool and the ASF bot link them.\n- Backports often differ from the trunk patch. Make each PR apply cleanly to its own base.\n- If a branch does not need the fix (the bug is not present there, or the change is a feature for trunk only), remove that Fix Version from the ticket or explain on the ticket. The check will keep warning until the Fix Versions match the PRs.\n- If a sibling PR exists but is not found, make sure its title or branch carries the same ticket key.\n\n## Limits\n\n- Closed sibling PRs do not count. After a committer pushes one branch and closes its PR, the check may warn for that branch.\n- Patches offered as fork compare links or branch names in JIRA comments, not as PRs, are not found.\n- Fix Versions are taken as the truth. If the ticket's Fix Versions are wrong, the check is wrong in the same way.\n- The check does not judge whether a branch should get the change (bug fix versus feature, end-of-life branches). That decision belongs to the committer.\n- It does not test whether the patch merges forward cleanly.\n","changes":"# Changes\n\n## What is checked\n\nThis section shows the PR's diff. It is a viewer, not a check. The diff runs from the merge base of the PR and its base branch to the PR head, with the PR's GitHub review comments attached to their lines.\n\nThe view is produced by the ide-explain generator from the rustyrazorblade `dev-skills` plugin: a file tree on the left, the diff top right, and an explanation pane bottom right. Files that a check flagged (a fail or warn whose evidence names a file) carry a note in the explanation pane listing the check and what it found.\n\n## Why\n\nReviewers need the code next to the results. A contributor looking at a warning such as \"banned API at line 42\" can open that file and line here. ide-explain is used rather than a custom viewer so that improvements to the plugin reach the report without changes to this tool.\n\n## How each status is decided\n\nThe section badge is **info** when the diff view was produced and **unknown** when it was not.\n\nHow the view is produced:\n\n1. The tool finds the newest installed generator under `~/.claude/plugins/cache/rustyrazorblade-plugins/dev-skills/\u003cversion>/skills/ide-explain/scripts/generate-explain.py`. The environment variable `CPR_IDE_EXPLAIN` overrides the path. The version used is recorded in About.\n2. It runs the generator inside the local clone of apache/cassandra with the merge base, the PR head, the PR number (for review comments), and a per-file notes map built from the check results.\n3. **Size budget**: if the output is larger than 8 MB, the generator runs again limited to `src/`, and the section notes that tests and other files appear only in the file table. If the `src/`-only view is still over 8 MB, no view is embedded.\n4. **Safety**: the output is checked for external scripts, external stylesheets, `@import`, and `fetch(`. If any is found, the view is not embedded. Otherwise the page is stored base64-encoded in the report and loaded into an `\u003ciframe sandbox=\"allow-scripts\">` through `srcdoc`. Without `allow-same-origin`, the embedded page cannot read or change the rest of the report.\n\nWhen there is no view (plugin not installed, the generator failed, too large, or network references found), the section shows a plain list of changed files with additions and deletions, and the reason. The rest of the report is unaffected.\n\n## How to fix\n\nNothing for contributors. If you generate reports yourself and the view is missing, install the `dev-skills` plugin from rustyrazorblade-plugins in Claude Code, or set `CPR_IDE_EXPLAIN` to the path of `generate-explain.py`, then run `cpr review \u003cN>` again.\n\n## Limits\n\n- The view depends on a plugin installed on the machine that built the report. Reports built elsewhere may lack it.\n- On very large PRs only `src/` is shown.\n- The diff is against the merge base, so it can differ from GitHub's \"Files changed\" tab when the base branch has moved.\n- Review comments are those on GitHub when the report was built. JIRA comments are in the JIRA section.\n- Notes come only from checks whose evidence names a file. Checks about the PR as a whole (votes, CI) add no notes.\n","ci":"# CI\n\n## What is checked\n\nWhether pre-commit CI has run for every branch this patch targets, whether it ran on the current PR head, whether it used a profile that covers the change, and how many tests failed.\n\napache/cassandra runs no CI checks on pull requests. CI evidence is the `ci_summary*.html` file that `.build/run-ci` produces and that someone attaches to the JIRA ticket. The tool downloads every attachment whose name contains `ci_summary` and ends in `.html`, and reads the tested commit sha, the branch, the profile, and the pass, fail, and skip counts from it.\n\nEach summary is assigned to a base branch: first by matching its sha to the head sha of this PR or a sibling PR, otherwise by a version (`4.0`, `4.1`, `5.0`, `6.0`) or `trunk` in the branch name it records or in the attachment's file name. When a branch has several summaries, the newest attachment wins.\n\nThe **target branches** are this PR's base plus the base of every open sibling PR (other PRs for the same ticket). The Branches aspect explains how siblings are found.\n\n## Why\n\n- \"Code must not be committed before CI results have been provided for all affected branches.\" Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n- Every patch is expected to carry its CI artifacts, attached to the ticket. Contributors without CI access say so on the ticket and a reviewer or committer runs CI. Sources: [CONTRIBUTING.md](https://github.com/apache/cassandra/blob/trunk/CONTRIBUTING.md), \"Continuous Integration\"; [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) step 4; [CI page](https://cassandra.apache.org/_/development/ci.html).\n- Reviewers check for \"pre-commit CI results attached to the ticket, for all affected branches (up to trunk, if applicable)\" and ask \"are there any regressions?\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), Testing.\n- The `pre-commit w/ upgrades` profile is required whenever the patch could affect upgrades, serialization, or on-disk formats. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Profiles\".\n- Failures are triaged against [Butler](https://butler.cassandra.apache.org) and JIRA to separate new regressions from known flaky tests. A pre-commit run with a few failures is normal if they are shown to be pre-existing or flaky. Source: [CI page](https://cassandra.apache.org/_/development/ci.html), \"Post-commit CI\".\n\n## How each status is decided\n\nThe first three checks share a rule: with no ticket key, a ticket that does not exist, or JIRA unreachable, they report **unknown**, because there is nowhere to read CI from.\n\n### `ci.evidence`\n\n**Blocking.** Owner: committer.\n\n- **unknown**: no ticket to read (see above). The recommendation becomes \"insufficient evidence\".\n- **fail**: at least one target branch has no parsed summary assigned to it (\"CI not yet run\"). The recommendation becomes \"blocked\".\n- **pass**: every target branch has a summary.\n\nSummaries that could not be downloaded, could not be parsed, or could not be assigned to a branch are listed as evidence but do not count.\n\n### `ci.freshness`\n\nAdvisory. Owner: committer.\n\nCompares, for each target branch with a summary, the sha CI tested against that branch's PR head sha.\n\n- **unknown**: no ticket to read.\n- **not-applicable**: no target branch has a summary.\n- **warn** (needs action): CI ran on an older commit for at least one branch. Moves the recommendation to \"needs work\".\n- **warn** (informational): the summary recorded no usable sha (some `run-ci` versions write a placeholder). Shown, but does not change the recommendation.\n- **pass**: every summary's sha matches its PR head.\n\n### `ci.profile`\n\n**Blocking.** Owner: committer.\n\nA file is upgrade-sensitive when it is under `src/java/` and either its path is in messaging (`net/`), SSTable format (`io/sstable/format/`, or `io/sstable/` files named `*Version*`, `*Descriptor*`, `*Component*`, `*Metadata*`), commit log, hints, `SchemaKeyspace`, `SystemKeyspace`, any `*Serializer.java`, or a serializer under `db/rows/`; or its added lines implement `IVersionedSerializer`, `IVersionedAsymmetricSerializer`, or `IPartitionerDependentSerializer`.\n\n- **not-applicable**: no upgrade-sensitive file changed; `pre-commit` is enough.\n- **unknown**: upgrade-sensitive files changed, but there is no ticket to read or no parsed summary for any branch.\n- **fail**: upgrade-sensitive files changed and at least one branch's summary shows no upgrade tests. A summary counts as having upgrade tests when its text mentions `upgrade-dtest`, `upgrade_dtest`, `upgrade-jdk`, or `upgrade_jdk`. The recommendation becomes \"blocked\".\n- **pass**: every branch with a summary ran upgrade tests.\n\n### `ci.failures`\n\nAdvisory. Owner: reviewer.\n\n- **not-applicable**: no parsed summary.\n- **warn**: the newest summaries report one or more failed tests in total. Up to five failing test names per branch are listed. Failures are not yet compared with known flaky tests. Moves the recommendation to \"needs work\".\n- **pass**: zero failures across all summaries.\n\n## How to fix\n\n**Run pre-commit CI for each target branch.** Use `.build/run-ci` against your own Jenkins (`.build/run-ci --only-setup` creates one in your Kubernetes cluster), the project's pre-commit Jenkins, or an employer's. Options and profiles are described in `.build/run-ci.d/README.md` and on the [CI page](https://cassandra.apache.org/_/development/ci.html).\n\nChoose the profile:\n\n- `pre-commit`: the minimum for code changes.\n- `pre-commit w/ upgrades`: when the change touches messaging, serialization, SSTable or commit log formats, hints, or system tables.\n- `packaging`: build or packaging-only changes.\n\n**Attach the results to the JIRA ticket**, one pair per branch: the `ci_summary` HTML file and the `results_details` archive. Open the ticket, choose More \u2192 Attach files (or drag the files onto the ticket). Keep the branch in the file name, for example `ci_summary_\u003cfork>_CASSANDRA-12345-5.0_\u003cbuild>.html`, so the branch can be identified even if the sha does not match. Then add a comment with the totals per branch and an explanation of each failure: pre-existing (link the Butler entry or JIRA ticket), flaky, or fixed in a later commit.\n\n**No CI access?** Say so in a comment on the ticket and ask a committer to run it. `ci.evidence` stays failed until someone attaches results.\n\n**Stale CI**: re-run CI on the current head, or say on the ticket why the later commits do not need it (for example, a comment-only change).\n\n## Limits\n\n- Only `ci_summary` HTML attachments on JIRA are read. Results posted as links (CircleCI workflows, ci-cassandra.apache.org builds), pasted as text in comments, or reported on the fork's GitHub Actions are not seen.\n- A summary whose sha does not match any sibling PR and whose branch and file name contain no version is not assigned to a branch, so it does not count.\n- If a summary's failure count is missing, it is treated as zero failures.\n- Upgrade-test detection is a text search of the summary page. A profile name that does not contain those words is missed.\n- The upgrade-sensitive file list is a path heuristic. Changes to serialization code in other places are missed, and a rename-only change to a `*Serializer.java` file is flagged.\n- Failures are counted, not triaged. A PR with only known flaky failures still gets a warn until Butler comparison is added.\n- Target branches come from open PRs. A branch that needs CI but has no PR yet is covered by the Branches aspect, not here.\n","code-review":"# Code review\n\n## What is checked\n\nA panel of six review lenses reads the patch. Each lens is an AI reviewer focused on one concern, and each returns findings in the same format. The panel is defined in `cpr/config/panel.json`; every lens is a project agent, so nothing depends on an outside plugin:\n\n| Lens | Focus |\n|---|---|\n| cassandra-standards | The patch against its JIRA ticket (does it do what the ticket asks, and only that) and Cassandra's contribution standards: error handling, project executors and clocks, version gating, backport rules, NEWS.txt. It also runs a security check (auth, roles and permissions, TLS, JMX exposure, UDFs, secrets in logs or virtual tables) that reports nothing when the diff touches no security surface, and it reports PR edits to `.claude/` or `AGENTS.md` |\n| cass-logic-boundary | Conditions and predicates, boundaries and numbers, null and type safety, validation of input |\n| cass-concurrency-lifecycle | Locking and shared state, ordering and lifecycle, cleanup of state and resources |\n| cass-persistence-compat | Serialization and versioning, I/O and crash safety, whether new failure paths are logged at the right level and metrics stay symmetric |\n| cass-completeness-symmetry | Missing counterparts (the read path without the write path, the new option without its docs or tests), API contracts, what a refactor left behind |\n| cass-test-regime | Whether the tests fit Cassandra's testing regime: the right suite for the change, whether the test fails without the fix, whether timing-sensitive tests need repeated runs |\n\nReviewers judge correctness, error handling, testing, logging, and compatibility, and the lenses follow the same list.\n\n**Trusted checklists.** The five `cass-*` lenses work from the checklists the Cassandra project keeps in its own `.claude/skills/` directory. Those are read from `origin/trunk`, resolved to one commit for the whole run, and only from a fixed list of paths. They are never read from the PR's branch or from the base branch, so a patch cannot change how it is reviewed. The report names the commit as \"checklists: apache/cassandra trunk @ \u003csha>\". If a listed file is missing at that commit, the lens that needs it is reported as **missing**; there is no fallback to another copy.\n\n**Tiers.** The amount of checklist each lens receives depends on how many non-test lines the patch changes:\n\n| Tier | Changed non-test lines | What each lens gets |\n|---|---|---|\n| docs-only | Only documentation changed | No lenses run |\n| small | Under 50 | Its shallow checklist |\n| medium | 50 to 1,000 | Shallow checklists plus the targeted categories whose diff signals match the patch (at most 8 across the panel) |\n| large | Over 1,000 | Deep checklists plus a list of focus files ranked by risk; the lens summary names the files it did not review |\n\nEach lens summary states which checklists were applied and what was not reviewed.\n\nThe panel runs only through `/review-pr \u003cN>` in Claude Code. A report made with `cpr review \u003cN>` alone says \"Not run\".\n\n## Why\n\n- Reviewers judge correctness, error handling, testing, logging, and compatibility. Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html).\n- The checklists come from apache/cassandra itself, so the lenses ask the questions the project's own review skills ask. Pinning to a commit makes a report reproducible; reading only from trunk keeps a patch from editing its own reviewer.\n- Several lenses often notice the same defect. Merging their findings stops one problem from being counted and listed four times.\n- Two committer +1s are still required whatever an automated review says. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\nEach finding has these fields:\n\n| Field | Meaning |\n|---|---|\n| `id` | Identifier of the finding |\n| `severity` | `blocker`, `major`, `minor`, or `nit` |\n| `location` | File and line in the new file, for example `src/java/org/apache/cassandra/db/Foo.java:42` |\n| `rule` | The rule, standard, or ticket requirement broken |\n| `problem` | What is wrong |\n| `fix` | The smallest change that resolves it |\n| `impact` | Optional. `data-loss`, `crash`, `hang`, `mixed-version-break`, `silent-wrong-result`, `performance`, or `cosmetic` |\n| `confidence` | Optional. `high`, `medium`, or `low`: how sure the lens is that the failure can happen |\n\n**Severity comes from impact and confidence.** When a finding names an impact, `cpr/review.py` sets the severity from this table, whatever severity the lens wrote. If they differ, the report keeps the lens's value as \"was \u003cseverity>\". A finding with no impact keeps its own severity.\n\n| Impact | High confidence | Medium | Low |\n|---|---|---|---|\n| data-loss, crash, hang, mixed-version-break | blocker | major | minor |\n| silent-wrong-result | major | major | minor |\n| performance | minor | minor | nit |\n| cosmetic | nit | nit | nit |\n\nA finding with no concrete way to trigger it is dropped by the lens, not reported as a nit.\n\n**Merging.** Findings from different lenses that describe the same problem are merged into one **issue**. For each pair of findings from different lenses the merger scores how much their problem texts share code identifiers (such as `FileUtils.delete`) and ordinary words, and how much their fixes share identifiers. Findings in the same file get a bonus that is larger the closer the lines are (within 3 lines, within 10 lines); findings at a place that is not a file line, such as the ticket, get a small fixed bonus. Two findings merge only when the text score reaches a floor and the total reaches a threshold, so two different problems on the same line stay separate. Pairs are joined strongest first, and an issue never holds two findings from one lens. The weights, bonuses, line distances, floor, and threshold are in `cpr/config/merge.json`.\n\nAn issue takes the highest severity of its members and lists every lens that reported it, every location, and the member findings. The wording, fix, rule, impact, and confidence come from the most severe member (ties go to the one naming the most identifiers). Fixes from other members that differ are kept as \"also suggested\".\n\nPanel rules (`cpr/review.py`):\n\n- A lens with no output is **missing**; one whose output is not valid JSON in the schema is **invalid**. Neither ever counts as approval.\n- A lens that declines to approve without a blocker or major finding gets a synthesized **major** finding, rule `unexplained-non-approval`. Declining is a verdict and has to be justified.\n- The panel **approves** only when every lens ran, every lens approved, and there is no blocker or major finding. Merging does not change this.\n\nThe report headline reads \"N issues (M findings from K lenses)\", where K counts the lenses that reported at least one finding. \"Must fix\" counts issues, not findings.\n\nEffect on the recommendation: any blocker or major issue gives \"needs contributor work\"; an incomplete panel keeps \"requirements met, code not yet reviewed\"; an approving panel with every requirement met gives \"ready to merge\".\n\nSection badge: unknown when the panel did not run or did not complete, fail when there is a blocker or major issue, warn when there are only minor or nit findings, pass when there are none.\n\nThe Code review section lists the issues first, then each lens's status, approval, summary, and raw findings. Issues with a file location also appear in the Changes view, once per file, naming every lens that reported them.\n\n## How to fix\n\nStart with blocker and major issues. Each names its locations and the smallest fix. If you think an issue is wrong, say why on the JIRA ticket or the PR; the lenses advise reviewers and do not decide anything.\n\n## Limits\n\n- Lenses read the code; they do not build it or run tests. Test evidence comes from CI attached to the ticket.\n- Lenses can be wrong in both directions: they can miss real problems and report false ones. Each issue shows its lenses, rule, and location so a reviewer can check it quickly.\n- Merging is a text-overlap heuristic. Its thresholds were tuned on one real PR (apache/cassandra#5201, where 11 findings became 5 issues), so it can leave a duplicate unmerged or, rarely, join two different problems. The member findings stay visible under each lens.\n- Checklists are upstream's. If trunk changes a checklist, reports made later follow it; the sha in the report says which version was used. Items about APIs that do not exist on a release branch are told to be ignored, but a lens can still apply one.\n- The PR's own files, including apache/cassandra's `CLAUDE.md`, `AGENTS.md`, and `.claude/` skills, are treated as untrusted data. Text that tries to steer the review is reported as a finding, rule `review-steering`.\n- Design acceptability, backport scope, and the merge decision stay with committers.\n","commits":"# Commits and changelog\n\n## What is checked\n\nThe PR's commit messages, their trailers (`Co-authored-by:`, `Assisted-by:`, and similar), signs of undisclosed AI assistance, and whether `CHANGES.txt` has an entry when production code changed, and, for performance PRs, whether the benchmark commit comes before the change.\n\n## Why\n\nThe commit message format is:\n\n```\n\u003cOne sentence description, usually the Jira title or CHANGES.txt summary, no Jira id>\n\n\u003cOptional longer description>\n\npatch by \u003cAuthors>; reviewed by \u003cReviewers> for CASSANDRA-#####\n\nCo-authored-by: Name \u003cemail>\nAssisted-by: AGENT_NAME:MODEL_VERSION\n```\n\nSources: [.github/pull_request_template.md](https://github.com/apache/cassandra/blob/trunk/.github/pull_request_template.md); [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html), \"Commit Message\"; [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md), \"Git Workflow\", which adds \"no jira id\" on the first line and the `Assisted-by` trailer.\n\n- Use `TBD` for reviewers until review finishes. Squash to one commit per branch once the patch has its +1; several commits are fine during review. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) steps 6 and 8.\n- The ASF requires contributors using generative tools to check the tool's terms and the output's provenance, and recommends a `Generated-by:` token. Source: [ASF Generative Tooling Guidance](https://www.apache.org/legal/generative-tooling.html). Cassandra's form is `Assisted-by: AGENT_NAME:MODEL_VERSION`. Source: [AGENTS.md](https://github.com/apache/cassandra/blob/trunk/AGENTS.md).\n- Add a `CHANGES.txt` entry at the top of the version section for the branch, as ` * \u003csummary> (CASSANDRA-NNNNN)`. Only user-impacting changes need one; test-only fixes do not. Source: [Contributing code changes](https://cassandra.apache.org/_/development/patches.html) step 7. Committers often add or fix the entry at commit time.\n\n- A performance change should be measurable on both sides: put the JMH benchmark (under `test/microbench/`) in an earlier commit than the change, so it can run at the parent commit and at the PR head. This is the project owner's convention; most PRs do not follow it yet (a single commit with code and benchmark together is the common case), so only the wrong order asks for action. Source: the static-analysis change design in this repository.\n\n## How each status is decided\n\n### `commits.message-format`\n\nAdvisory and informational: a warn here never changes the recommendation. Owner: contributor.\n\nEvery commit in the PR is checked. A commit has a problem when its first line contains the PR's ticket key, when it has no line matching `patch by \u2026; reviewed by \u2026 for CASSANDRA-N` (case-insensitive, semicolon required), or when that line names a different ticket than the PR.\n\n- **unknown**: the PR has no commits.\n- **warn**: at least one commit has a problem. Each commit is listed with its problems.\n- **pass**: every commit follows the format.\n\n### `commit.perf-structure`\n\nAdvisory. Owner: contributor. Only the wrong order moves the recommendation.\n\nA PR counts as a performance PR when a strong signal fires, or two medium ones do. Strong: a changed file under `test/microbench/`; a JIRA label `performance`; a JIRA component `Test/benchmark`. Medium: the PR title or JIRA summary has a performance keyword (perf, performance, faster, speed up, latency, throughput, allocation, optimize, and similar); the PR description mentions JMH or a benchmark. The evidence names every signal that fired. Commit order comes from the PR's commits, oldest first, ignoring `fixup!` and `squash!` commits; the first commit touching `test/microbench/` is compared with the first touching `src/java/`.\n\n- **not-applicable**: not a performance PR (one medium signal is not enough), or a performance PR with no `src/java` change.\n- **unknown**: the commit list is unavailable (static analysis did not run).\n- **warn** (needs action): the benchmark commit comes after the change.\n- **warn** (note): benchmark and change share a commit, or the PR changes `src/java` with no benchmark.\n- **pass**: the benchmark commit comes first.\n\n### `commits.provenance`\n\nAdvisory. Owner: contributor.\n\nSigns of AI assistance are a head branch starting with `claude/`, `copilot/`, `codex/`, or `cursor/`, or a PR description that mentions `claude`, `copilot`, `chatgpt`, `gpt-N`, `codex`, `cursor`, `gemini`, `llm`, `AI-generated`, or `AI-assisted`.\n\n- **warn**: at least one sign is present and no commit has an `Assisted-by:` or `Generated-by:` trai
