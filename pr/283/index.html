<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cassandra PR review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Design tokens and shared components. One source for the report and the site index: render.py
   inlines this file into both. Colours come from the owner's design (docs/design/report-v2.dc.html).
   No other hex value appears anywhere else in either page. Light theme only. Fonts load from Google
   Fonts when online; the system fallbacks keep both pages readable offline.
   --------------------------------------------------------------------------- */
:root {
  /* Surfaces and ink */
  --bg: #F3F5F8; --panel: #FFFFFF; --soft: #F8FAFC; --soft-2: #F4F6FA; --code-bg: #F0F3F7;
  --ink: #0F2236; --ink-2: #34445A; --ink-3: #56657A;
  --rule: #D9DEE5; --rule-2: #E4E8EE; --rule-3: #EEF1F5; --chip-line: #C9D1DC; --bar-off: #DDE1E7;
  --link: #0B5CAD; --link-hover: #083F78; --hover: #F3F6FA; --flash: rgba(11, 92, 173, .35);

  /* Navigation (dark column) */
  --navy: #0F2236; --navy-active: #1F3A5C; --navy-hover: #172C45; --navy-line: #3A5373;
  --navy-ink: #D3DDEA; --navy-mute: #9DB0C7; --navy-dot: #7E94AF; --on-navy: #FFFFFF;
  --nav-fail: #FF8A5C; --nav-should: #F2C14E; --nav-note: #8FB8EA; --nav-unknown: #C9BDF2; --nav-pass: #4FD1C0; --nav-na: #8A9BB0;

  /* Status chips: text on tint is at least 4.5:1. icon is the stroke colour on light backgrounds. */
  --fail-fg: #8A2606; --fail-bg: #FDEDE6; --fail-icon: #C0360C;
  --should-fg: #5E4300; --should-bg: #FBF3DC; --should-icon: #8C6400;
  --note-fg: #083F78; --note-bg: #E6EEF8; --note-icon: #0B5CAD;
  --pass-fg: #005A52; --pass-bg: #E3F4F1; --pass-icon: #00766C;
  --unknown-fg: #4B3A8C; --unknown-bg: #ECE8F6; --unknown-icon: #5B49A8;
  --na-fg: #56657A; --na-bg: #EEF1F5; --na-icon: #6B7684;

  /* Type scale */
  --sans: 'Red Hat Text', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: 'Red Hat Mono', ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 16px; --fs-lg: 17px; --fs-h2: 22px; --fs-h1: 24px; --fs-verdict: 26px;

  /* Spacing and radii (chips 3px, cards 6px, buttons 8px) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --r-chip: 3px; --r-card: 6px; --r-btn: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-base)/1.55 var(--sans); }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: var(--link-hover); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: var(--r-card); }
code, .mono { font-family: var(--mono); font-size: 0.9em; overflow-wrap: anywhere; }
code { background: var(--code-bg); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
p { margin: 6px 0; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
svg { flex: none; }
[hidden] { display: none !important; }

/* Cards, status chips, counts, tags, buttons: the pieces both pages share */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-card); overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; padding: 3px 10px; border-radius: var(--r-chip); white-space: nowrap; color: var(--c-fg); background: var(--c-bg); }
.chip.wide { width: 104px; flex: none; }
.s-fail { --c-fg: var(--fail-fg); --c-bg: var(--fail-bg); --c-icon: var(--fail-icon); }
.s-should { --c-fg: var(--should-fg); --c-bg: var(--should-bg); --c-icon: var(--should-icon); }
.s-note { --c-fg: var(--note-fg); --c-bg: var(--note-bg); --c-icon: var(--note-icon); }
.s-pass { --c-fg: var(--pass-fg); --c-bg: var(--pass-bg); --c-icon: var(--pass-icon); }
.s-unknown { --c-fg: var(--unknown-fg); --c-bg: var(--unknown-bg); --c-icon: var(--unknown-icon); }
.s-na { --c-fg: var(--na-fg); --c-bg: var(--na-bg); --c-icon: var(--na-icon); }
.tag { display: inline-block; font-size: var(--fs-xs); color: var(--ink-3); border: 1px solid var(--rule); border-radius: var(--r-chip); padding: 1px 8px; white-space: nowrap; height: fit-content; }
.tag.strong { color: var(--ink); border-color: var(--ink-3); }
.count { min-width: 22px; text-align: center; font-size: var(--fs-sm); font-weight: 600; padding: 1px 6px; border-radius: var(--r-chip); color: var(--na-fg); background: var(--na-bg); }
.count.must { color: var(--fail-fg); background: var(--fail-bg); }
.outline-btn { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-md); font-weight: 500; color: var(--link); padding: 10px 14px; min-height: 44px; border: 1px solid var(--chip-line); border-radius: var(--r-btn); background: var(--panel); text-decoration: none; }
.outline-btn:hover { background: var(--hover); color: var(--link); }
.linkbtn { font-size: var(--fs-md); font-weight: 500; color: var(--link); min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.linkbtn:hover { color: var(--link-hover); text-decoration: underline; }
.notice { border: 1px solid var(--rule); border-left-width: 4px; border-radius: var(--r-card); padding: 10px 14px; background: var(--panel); margin: 6px 0; font-size: 15px; overflow-wrap: anywhere; }
.notice.s-fail { border-left-color: var(--fail-icon); } .notice.s-should { border-left-color: var(--should-icon); }
.notice.s-unknown { border-left-color: var(--unknown-icon); } .notice.s-note { border-left-color: var(--note-icon); }
.notice.s-pass { border-left-color: var(--pass-icon); } .notice.s-na { border-left-color: var(--na-icon); }
.notice .why { display: block; color: var(--ink-3); font-size: var(--fs-md); margin-top: 2px; }
.empty { color: var(--ink-3); font-style: italic; }
</style>
<style>
pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; background: var(--soft); border: 1px solid var(--rule-2);
  border-radius: var(--r-card); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; max-width: 100%; }
pre code { background: none; border: 0; padding: 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.chev { transition: transform .15s; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev { transform: rotate(180deg); }
.row:hover { background: var(--hover); }
.stack > *, .gx > *, .cc-body > *, .bg-card > *, .blk, .group-body, .card { min-width: 0; max-width: 100%; }

/* ---------------------------------------------------------------------------
   Shell: dark nav on the left, one scrolling column on the right
   --------------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.navcol { background: var(--navy); }
#nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 24px 14px 24px; display: flex; flex-direction: column; gap: 22px; }
.nav-head { padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-mute); }
.nav-pr { font-size: 22px; font-weight: 700; color: var(--on-navy); text-decoration: none; letter-spacing: -0.01em; }
.nav-pr:hover { color: var(--on-navy); text-decoration: underline; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 3px; }
#nav-toggle { display: none; color: var(--navy-ink); border: 1px solid var(--navy-line); border-radius: 6px; min-height: 44px; padding: 0 14px; align-items: center; gap: 8px; font-size: 15px; }
#nav-body { display: flex; flex-direction: column; gap: 22px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group .eyebrow { padding: 0 8px 6px; }
.nav-link { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 3px; text-decoration: none; font-size: 15px; color: var(--navy-ink); }
.nav-link:hover { background: var(--navy-hover); color: var(--on-navy); }
.nav-link[aria-current="location"] { background: var(--navy-active); color: var(--on-navy); font-weight: 600; }
.nav-link:focus-visible { outline-color: var(--on-navy); }
.nav-link .lbl { flex: 1; min-width: 0; }
.nav-link .cnt { font-size: 12px; color: var(--navy-mute); }
.nav-ic.nav-fail { color: var(--nav-fail); } .nav-ic.nav-should { color: var(--nav-should); } .nav-ic.nav-note { color: var(--nav-note); }
.nav-ic.nav-unknown { color: var(--nav-unknown); } .nav-ic.nav-pass { color: var(--nav-pass); } .nav-ic.nav-na { color: var(--nav-na); }
.nav-dot { flex: none; width: 14px; display: flex; justify-content: center; }
.nav-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-dot); display: block; }
.nav-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--navy-mute); display: flex; flex-direction: column; gap: 2px; }

.col { min-width: 0; }
header.pr { background: var(--panel); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
header.pr .wrap { padding-top: 22px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-3); }
.facts .mono { font-size: 13px; color: var(--ink); }
.facts .tag { font-size: 12px; }
.add { color: var(--pass-icon); } .del { color: var(--fail-icon); }
h1.title { font-size: 24px; font-weight: 600; max-width: 52ch; overflow-wrap: anywhere; }
.ticket-line { margin: 0; font-size: 14px; color: var(--ink-3); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 36px; }
section[id], div[id^="sec-"], div[id^="bg-"], div[id^="check-"], li[id^="check-"] { scroll-margin-top: 12px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-head > div { display: flex; flex-direction: column; gap: 4px; }
h2.sec { font-size: 22px; font-weight: 600; }
.sub { margin: 0; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 16px; }
/* ---------------------------------------------------------------------------
   Verdict and To do
   --------------------------------------------------------------------------- */
.verdict { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding: 18px 24px; }
.verdict-main { display: flex; gap: 14px; align-items: center; flex: 1 1 340px; min-width: 0; }
.v-icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--c-fg); background: var(--c-bg); }
.v-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.v-text h2 { font-size: 26px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.v-text p { margin: 0; color: var(--ink-2); }
.v-text p.note { font-size: 14px; color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
.steps li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 3px; font-size: 14px; font-weight: 500; margin: 0; color: var(--c-fg); background: var(--c-bg); }
.v-extra { border-top: 1px solid var(--rule-2); padding: 0 24px 4px; }
.todo { border-top: 1px solid var(--rule-2); }
.todo-head { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 24px; min-height: 48px; background: var(--soft); }
.todo-head .t { font-weight: 600; }
.todo-head .r { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink-2); }
.todo-head .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--link); }
.role { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule-2); }
.role-name { flex: 0 0 170px; padding: 14px 20px; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; }
.role-name small { font-weight: 400; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.role ul { list-style: none; margin: 0; padding: 0; flex: 1 1 360px; min-width: 0; }
.role li { margin: 0; }
.todo-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 20px 10px 0; min-height: 44px; }
.todo-item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; }
.todo-item .tt { font-weight: 500; }
.todo-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--ink-3); }
.todo-item .loc { font-family: var(--mono); font-size: 12.5px; }
.todo-item .src { padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; font-size: 12px; color: var(--ink-2); }
.todo-item .step-mark { display: inline-flex; color: var(--na-icon); }
.role-name .phase { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.todo-detail { padding: 0 20px 12px 24px; font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.todo-detail p { margin: 0; }
.todo-detail .tg { font-size: 12px; color: var(--ink-3); }
.todo:not(.show-opt) .opt { display: none; }
.todo:not(.show-opt) .role.only-opt { display: none; }
#opt-toggle { width: 100%; padding: 12px 20px; min-height: 44px; font-size: 14px; font-weight: 500; color: var(--link); background: var(--soft); border-top: 1px solid var(--rule-2); }

/* ---------------------------------------------------------------------------
   Check groups
   --------------------------------------------------------------------------- */
.group { border-bottom: 1px solid var(--rule-2); }
.group:last-child { border-bottom: 0; }
.group-head { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px 20px; min-height: 56px; }
.group-head .l { display: flex; align-items: center; gap: 12px; flex: 1 1 280px; min-width: 0; font-weight: 600; font-size: 16px; }
.group-head .r { flex: 999 1 280px; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 15px; }
.group-head .r .sum { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.group-head .r .n { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.group-body { background: var(--soft); padding: 4px 20px 18px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist > li { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: 4px; background: var(--panel); margin: 0; }
.ck-icon { flex: none; margin-top: 2px; width: 20px; display: flex; justify-content: center; }
.ck-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ck-title { font-weight: 500; overflow-wrap: anywhere; }
.ck-sum { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.ck-ev { margin: 2px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.ck-ev.capped:not(.all) > li.more { display: none; }
.ev-more { align-self: flex-start; min-height: 40px; }
.howfix { margin-top: 6px; font-size: 14px; background: var(--soft-2); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.ck-tags { flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ck-flash { box-shadow: 0 0 0 3px var(--flash); }
.gx { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.gx .blk > h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.gx .blk > h3 .count { font-size: 12px; }
.gx .blk h4 { font-size: var(--fs-md); font-weight: 600; margin: 14px 0 6px; }
.gx .blk > h4 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 16px; }
/* Tables (.dtable), field lists, details */
.pm-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
.pm-cat { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--r-card); background: var(--c-bg); color: var(--c-fg); border-left: 3px solid var(--c-icon); min-width: 0; }
.pm-cat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.pm-cat span { font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pm-cat.zero { opacity: .55; }
.pm-table table { table-layout: fixed; }
.pm-table th:nth-child(2) { width: 150px; } .pm-table th:nth-child(3) { width: 100px; } .pm-table th:nth-child(4) { width: 100px; }
.pm-table .mono { overflow-wrap: anywhere; word-break: break-all; }
.pm-rule { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; }
.pm-locs { list-style: none; margin: 4px 0 0; padding: 0; font-size: var(--fs-sm); }
.pm-locs li { padding: 3px 0; border-top: 1px solid var(--rule-2); overflow-wrap: anywhere; }
.pm-locs .mono { font-size: var(--fs-sm); }
.pm-base { font-size: var(--fs-sm); color: var(--ink-2); margin: 8px 0; }
.pm-house, .pm-usual { margin-top: 12px; }
.pm-table tr.pm-untyped td { opacity: .55; }
.pm-table tr.pm-untyped .pm-rule { text-decoration: line-through; text-decoration-thickness: 1px; }
.pm-need { font-size: var(--fs-sm); color: var(--ink-2); }
@media (max-width: 640px) { .pm-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pm-table th:nth-child(n) { width: auto; } }
.cx-score { display: inline-block; min-width: 34px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--r-chip); color: var(--c-fg); background: var(--c-bg); border-left: 3px solid var(--c-icon); }
.cx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); margin: 6px 0 10px; }
.cx-table td:first-child { width: 64px; }
.cx-table .tag { margin-left: 8px; }
.s-crit { --c-fg: var(--on-navy); --c-bg: var(--fail-icon); --c-icon: var(--fail-fg); }
.cx-faded td { opacity: .55; }
.cx-split td { background: var(--soft, transparent); font-size: var(--fs-sm); padding-top: 12px; }
.cx-up { color: var(--fail-fg); font-weight: 600; } .cx-down { color: var(--pass-fg); font-weight: 600; }
.cx-file { font-size: var(--fs-sm); margin-top: 2px; overflow-wrap: anywhere; }
.cx-table td:nth-child(2) { width: 90px; }
.dtable { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--panel); max-width: 100%; }
.dtable table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
.dtable th, .dtable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; overflow-wrap: break-word; }
.dtable th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); background: var(--soft); white-space: nowrap; }
.dtable tbody tr:last-child td { border-bottom: 0; }
.dtable td.num, .dtable th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtable .mono { font-size: var(--fs-sm); overflow-wrap: break-word; }
.dtable tr.self td { background: var(--note-bg); }
.dtable.capped:not(.all) tr.more { display: none; }
.dtable .dt-more { display: flex; width: 100%; justify-content: center; border-top: 1px solid var(--rule-2); background: var(--soft); min-height: 44px; }
.dtable .ck-title { font-weight: 500; }
.dtable .paths { display: flex; flex-direction: column; gap: 2px; }
.nowrap { white-space: nowrap; }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: var(--fs-md); }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--panel); margin: 8px 0; }

<script id="report-model">window.REPORT_MODEL = {"schema":1,"generated_at":"2026-10-10 21:47 UTC","tool":{"name":"cassandra-pr-review","version":"0.1.0"},"pr":{"number":283,"url":"https://github.com/apache/cassandra/pull/283","title":"CASSANDRA-14459: DynamicEndpointSnitch should never prefer latent replicas","body":"This change incorporates the feedback from Ariel and Jason as part of https://issues.apache.org/jira/browse/CASSANDRA-14459.\r\n\r\nThe following is introduced:\r\n\r\n1. Fully pluggable DynamicEndpointSnitch so that we can continue experimenting with new implementations\r\n2. Instead of resetting every 10 minutes, the DES uses active latency probes for replicas that it was asked to rank but has no recent data on. These are rate limited by default to a single probe per second. These latency probes, while not perfect, will correctly detect nodes that are latent due to network conditions, JVM instability (gc/safepoint pauses), and Read threadpool exhaustion.\r\n3. A new opt-in implementation of the DES which uses an exponential moving average instead of a Histogram. Both statistical measures try to develop a noise reduced sample with different tradeoffs, but the main one in favor of DES is that it reacts to extreme outliars faster (e.g. if a node is actively timing out and dropping messages) and generates about 100x less garbage than the histogram approach.","author":"jolynch","author_association":"CONTRIBUTOR","base":"trunk","head_ref":"CASSANDRA-14459","head_repo":"jolynch/cassandra","head_sha":"9dd81e3e8ce73dad7f99e738e84c93237709dc4e","draft":false,"state":"open","labels":["needs-committer"],"created_at":"2018-10-14T22:22:01Z","updated_at":"2026-10-10T16:04:53Z","additions":2235,"deletions":379,"changed_files":42},"jira_key":{"key":"CASSANDRA-14459","sources":["title","branch","body"],"conflicts":[],"mentioned":["CASSANDRA-14459"]},"jira":{"status":"ok","error":null,"ticket":{"key":"CASSANDRA-14459","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459","summary":"DynamicEndpointSnitch should never prefer latent nodes","status":"Patch Available","resolution":null,"issuetype":"Improvement","components":["Legacy/Coordination"],"fix_versions":["7.x"],"since_versions":[],"reviewers":[],"authors":[{"name":"jolynch","display":"Joey Lynch"}],"assignee":[{"name":"jolynch","display":"Joey Lynch"}],"test_doc_plan":"","impacts":[],"description":"The DynamicEndpointSnitch has two unfortunate behaviors that allow it to provide latent hosts as replicas:\r\n # Loses\u00a0all latency information when Cassandra restarts\r\n # Clears latency information entirely every ten minutes (by default), allowing\u00a0global\u00a0queries to be routed to\u00a0_other datacenters_\u00a0(and local queries cross racks/azs)\r\n\r\nThis means that the first few queries after restart/reset could be quite slow compared to average latencies. I propose we solve this by resetting to the minimum observed latency instead of completely clearing the samples and extending the {{isLatencyForSnitch}} idea to a three state variable instead of two, in particular {{YES}}, {{NO}}, {{MAYBE}}. This extension allows {{EchoMessages}} and {{PingMessages}} to send {{MAYBE}} indicating that the DS should use those measurements if it only has one or fewer samples for a host. This fixes both problems because on process restart we send out {{PingMessages}} / {{EchoMessages}} as part of startup, and we would reset to effectively the RTT of the hosts (also at that point normal gossip\u00a0{{EchoMessages}}\u00a0have an opportunity to add an additional latency measurement).\r\n\r\nThis strategy also nicely deals with the \"a host got slow but now it's fine\" problem that the DS resets were (afaik) designed to stop because the {{EchoMessage}}\u00a0ping latency will count only after the reset for that host. Ping latency is a more reasonable lower bound on host latency (as opposed to status quo of zero).","comments":[{"id":"16551064","author":"jolynch","display":"Joey Lynch","created":"2018-07-20T17:58:00.320+0000","body":"Ok based on the feedback I've moved the latency probes into a scheduled executor that runs every second and sends a single message to one node needing latency probes. If no probes are needed then they are not sent. I've gone a step further and posted a follow up commit which replaces all the uses of histograms with a simpler (and 10x more performant) EMA implementation. The second patch is very optional but I know that some folks have mentioned they don't like all the garbage that the Histograms create so I fixed it.\r\n\r\n||trunk||trunk+EMA||\r\n|[patch|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459]|[patch|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459-EMA]|\r\n|[unit tests|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459#diff-f1baf62fd510947bf60e9a9def69810b] [!https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459.png?circle-token= 1102a59698d04899ec971dd36e925928f7b521f5!|https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459]|[unit tests|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459-EMA#diff-f1baf62fd510947bf60e9a9def69810b] [microbenchmark|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459-EMA#diff-f48455469e3cd6a2e225e3cb2b389d93] [!https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459.png?circle-token= 1102a59698d04899ec971dd36e925928f7b521f5!|https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459-EMA]|\r\n","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16551064"},{"id":"16643776","author":"jolynch","display":"Joey Lynch","created":"2018-10-09T17:28:26.631+0000","body":"[~aweisberg] if you have cycles to take a look at this let me know and I can do a quick rebase to fix the merge conflicts and if you want me to open a PR for reviewing purposes I can do that too. Let me know what is easiest for you.","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16643776"},{"id":"16643790","author":"aweisberg","display":"Ariel Weisberg","created":"2018-10-09T17:36:24.328+0000","body":"A PR would be great. I'm still digesting context.","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16643790"},{"id":"16643832","author":"jolynch","display":"Joey Lynch","created":"2018-10-09T18:00:42.590+0000","body":"Ok, I'll get the patch rebased and a PR opened for review today. Please reach out to me if anything is unclear :-)","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16643832"},{"id":"16646932","author":"aweisberg","display":"Ariel Weisberg","created":"2018-10-11T19:09:42.297+0000","body":"I'll try to summarize what I think our current plan is.\r\n * Add active probing to the snitch\r\n * Remove resetting of reservoir\r\n * Deprecate reset interval\r\n * In the map in dynamic snitch wrap the reservoir so we can store extra boolean flags\r\n * Store a volatile boolean flag for whether a score has been requested, check if the flag is not set, and set it when checking the score\r\n * Store a volatile boolean flag for whether a real latency sample has been received, check if the flag is not set, and set it when receiving a real latency sample\r\n * Only send probes to nodes that have been involved in a query (score requested)\u00a0since the last time a probe was sent && have not received a real latency sample since we last checked.\r\n * Add tunable configuring probes sent by each node per second (float?), or alternatively just seconds between probes. Probes could be sent by a dedicated thread blocking on a rate limiter vs. scheduling it with the dynamic snitch update thread. I wonder if the snitch thread ever becomes busy since it updates scores every 100 milliseconds which on a large cluster seems like it could be a lot.\r\n * Add EMA as a pluggable option, but keep the current default\r\n * Thread checking for active probes to send iterates the map and generates a list of all nodes needing a probe. As it iterates the list it unsets the flags. The list is then shuffled. It then sends the probes either rate limited or on a schedule executor.\r\n * Stop using echo message and gossip stage as samples.\r\n * When active probing send the probe over the large message channel and small message channel (response should be routed similarly) and the score will be the worse of the two for that active probe so we can detect if either socket has issues.\r\n\r\n\u00a0","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16646932"},{"id":"16649549","author":"jolynch","display":"Joey Lynch","created":"2018-10-14T22:24:26.545+0000","body":"[~aweisberg] Alright I think that I've accomplished all of the bullet points that you listed . Along the way I made DES 100% pluggable by class name as well as significantly more testable because I know that various folks want to experiment with further improvements and having it be as easy as implementing a new subclass and dropping a jar will make experimentation much easier going forwards... I've also gone ahead and factored out the \"measurement\" parts of the DES into subclasses (default Histogram and new EMA option) from the \"ranking\" parts of the DES in the abstract base class (ranking, probing, etc).\r\n||trunk||\r\n|[Pull Request for Review|https://github.com/apache/cassandra/pull/283]|\r\n|[!https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459.png?circle-token= 1102a59698d04899ec971dd36e925928f7b521f5!|https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459]|\r\n\r\nThere are a couple of points that I'm unsure about:\r\n * I was able to send small + large messages, but trying to pick the maximum result is hard. I think that it should be ok because if there is a serious problem with a stage it'll basically average the \"good\" stage and \"bad\" stage and still get a pretty bad number most likely.\r\n * Right now I've removed the reset interval but I actually think it's a good idea to keep it in and just re-define what it does. Specifically that would be the interval that we get to determine the probe list, vs the probe interval which actually sends a probe. I also think it's nice because we could have the old Histogram implementation as the default, and then users could _opt in_ to the new Histogram or the EMA approach as they want to. This would also remove the somewhat awkward (imo) use of the ping timeout to rate limit how often we get to generate probe lists.\r\n * The current algorithm only sends probes to nodes that were requested recently, but it's still potentially a lot of messages at the default interval of 1s which I know you think is ok but e.g. Jason above didn't like it (e.g. for a 300 * 3 dc 256 vnode cluster operating at LOCAL_ONE CL we'd be essentially sending out a probe per second always since there are so many ranked replicas including remote dcs). We could mitigate this somewhat by changing the local filtering step in {{ReplicaPlans::forRead}} to happen before we ask the DES to rank rather than after (this seems like a good idea regardless).\r\n\r\nWhile I was making it way more testable I ran a quick microbenchmark to show the CPU and memory benefits of the EMA approach. The tradoff of course is that the EMA reacts less quickly when the sample size is small\u00a0and\u00a0way faster when there is a significant outlier (e.g. if there is a single 10s timing the EMA will deprefer that host almost immediately compared to the histogram which ... won't).\r\n{noformat}\r\nBenchmark                                                                      Mode     Cnt       Score       Error   Units\r\nSnitchMetricsBench.emaSnitchThreadedUpdate                                   sample  190609       1.573 \u00b1     0.016   ms/op\r\nSnitchMetricsBench.emaSnitchThreadedUpdate:emaSnitchThreadedUpdate\u00b7p0.00     sample               0.283   163.122 \u00b1    19.745    B/op\r\nSnitchMetricsBench.histogramSnitchThreaded:\u00b7gc.count                         sample       3     273.000              counts\r\nSnitchMetricsBench.histogramSnitchThreaded:\u00b7gc.time                          sample       3     303.000                  ms\r\nSnitchMetricsBench.histogramSnitchUpdate                                     sample   23007       1.303 \u00b1     0.003   ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.00         sample               1.204               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.50         sample               1.268               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.90         sample               1.368               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.95         sample               1.466               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.99         sample               2.121               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.999        sample               2.830               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p0.9999       sample               3.926               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:histogramSnitchUpdate\u00b7p1.00         sample               5.218               ms/op\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.alloc.rate                      sample       3     236.317 \u00b1     3.365  MB/sec\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.alloc.rate.norm                 sample       3  339325.737 \u00b1    47.087    B/op\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.churn.PS_Eden_Space             sample       3     236.374 \u00b1    15.878  MB/sec\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.churn.PS_Eden_Space.norm        sample       3  339407.281 \u00b1 21325.135    B/op\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.churn.PS_Survivor_Space         sample       3       0.142 \u00b1     0.462  MB/sec\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.churn.PS_Survivor_Space.norm    sample       3     203.675 \u00b1   663.495    B/op\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.count                           sample       3     223.000              counts\r\nSnitchMetricsBench.histogramSnitchUpdate:\u00b7gc.time                            sample       3     232.000                  ms\r\n{noformat}\r\nAs you can see the traditional histogram snitch generates 700MBps of garbage vs the EMA which generates 4MBps, and the Histogram snitch was slower at 9.6ms avg vs EMA at 1.5 avg. So while the speed improvement of 6x is nice, the reduced garbage is going to be the really nice part.","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16649549"},{"id":"16661557","author":"jolynch","display":"Joey Lynch","created":"2018-10-24T01:17:44.578+0000","body":"[~aweisberg] Ok I've pushed changes to the branch which I believe address all your comments (including recording only the maximum latencies). I also finished the pluggability work so that we can swap out snitches live as well as implementing the ~20 lines needed to provide a backwards compatible option. To make the snitch more or less equivalent to the old snitch behavior you can do either live reconfiguration:\r\n\r\n{noformat}\r\n$ jmxterm\r\nWelcome to JMX terminal. Type \"help\" for available commands.\r\n$>open localhost:7199\r\n#Connection to localhost:7199 is opened\r\n$>bean org.apache.cassandra.db:type=StorageService\r\n#bean is set to org.apache.cassandra.db:type=StorageService\r\n$>run updateSnitch -t string,string,java.lang.Integer,java.lang.Integer,java.lang.Double null \"DynamicEndpointSnitchLegacyHistogram\" null 5000 null\r\n#calling operation updateSnitch of mbean org.apache.cassandra.db:type=StorageService with params [null, DynamicEndpointSnitchLegacyHistogram, null, 1000, null]\r\n#operation returns: \r\nnull\r\n{noformat}\r\n\r\nOr this can be updated in {{cassandra.yaml}} with the (intentionally) undocumented {{dynamic_snitch_class_name}} option. If a user does set that to not the default probing Histogram, we log a warning that it is not supported. I imagine that this pluggability will allow us to rapidly experiment with different metrics and load balancing implementations in  CASSANDRA-14817.\r\n\r\nSummary of the patch:\r\n# Makes the {{DynamicEndpointSnitch}} pluggable and live swappable (the underlying {{IEndpointSnitch}} already was)\r\n# Refactors {{DynamicEndpointSnitch}} to send latency probes to interesting nodes instead of resetting the samples and losing all latency information\r\n# Refactors {{DynamicEndpointSnitch}} to be a lot more testable so we can test our future changes.\r\n# Provide three implementations, the new default as {{DynamicEndpointSnitchHistogram}} old legacy as {{DynamicEndpointSnitchLegacyHistogram}} and an experimental EMA based snitch as {{DynamicEndpointSnitchEMA}}. All three are run through the dynamic snitching ranking test.\r\n# Adds a bunch of unit tests of all the implementations.\r\n","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16661557"},{"id":"16775785","author":"jolynch","display":"Joey Lynch","created":"2019-02-23T04:02:13.379+0000","body":"Alright, finally got around to writing those messaging service tests you asked for :), although if you're ok with it I'd prefer to refactor the methods to be slightly more unit testable and not even bother doing an e2e on the latency probe components as in my opinion the tests of that are just gnarly (and while I think that they won't flake because I ran them 2k times locally to check for race conditions, those kinds of multi-threading tests just worry me).\r\n\r\nSome notable changes in behavior since the last patch:\r\n * The StartupConnectivityChecker now sends a second ping that counts after all the first round ones come back. While I was testing this patch with CCM I noticed that the first Ping is not very good quality data (since it includes the handshake).\r\n * I refactored {{ScheduledExecutors}}\u00a0so that we can't leak threads out of random STPE's (e.g. DES will not break the jvm dtests because it won't leak a thread). If you don't like this let me know and I can change the close method to be called from {{Instance.java}}\r\n * DES now has microsecond resolution instead of millisecond, I noticed that in my CCM clusters all the nodes have latency 0 (less than a millisecond) which also appears true on many of our production clusters.\r\n * When the DES lacks latency information about a peer we defer to the subsnitch instead of scoring it zero (which will essentially prefer it over everything), we then rely on the latency probes to find out where it belongs\r\n * Refactored and payed down a bunch of tech debt with a lot of tests\r\n\r\nOn my side I'd like to give this more testing using CCM and on a real cluster with real cross datacenter latency to ensure the probes are working as expected, and I'd like to refactor the unit tests of the probe logic so that we don't actually have to hook into the MessagingService (which leads to a bunch of semi-gross test code imo)","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16775785"},{"id":"16840757","author":"bdeggleston","display":"Blake Eggleston","created":"2019-05-15T20:56:30.315+0000","body":"I finished my first round of review of the implementation. I still need to spend some time looking at the tests and docs.\r\n\r\nSome general notes:\r\n * I don't think we need a dynamicsnitch package, the 2 implementations could just live in the locator package.\r\n * I can't find anywhere that we validate the various dynamic snitch values? I didn't look super hard, but if we're not, it would be good to check people are using sane values on startup and jmx update.\r\n * It's probably a good time to rebase onto current trunk.\r\n\r\nScheduledExecutors:\r\n * {{getOrCreateSharedExecutor}} could be private\r\n * shutdown times accumulate in the wait section. ie: if we have 2 executors with a shutdown time of 2 seconds, we'll wait up to 4 seconds for them to stop.\r\n * we should validate shutdown hasn't been called in {{getOrCreateSharedExecutor}}\r\n * I don't see any benefit to making this class lock free. Making the {{getOrCreateSharedExecutor}} and {{shutdownAndWait}} methods synchronized and just using a normal hash map for {{executors}} would make this class easier to reason about. As it stands, you could argue there's some raciness with creating and shutting down at the same time, although it's unlikely to be a problem in practice. I do think I might be borderline nit picking here though.\r\n\r\nStorageService\r\n * {{doLocalReadTest}} method is unused\r\n\r\nMessagingService\r\n * Fix class declaration indentation\r\n * remove unused import\r\n\r\nDynamicEndpointSnitch\r\n * I don't think we need to check {{logger.isTraceEnabled}} before calling {{logger.trace()}}? At least I don't see any toString computation that would happen in the calls.\r\n * The class hierarchy could be improved a bit. There's code in {{DynamicEndpointSnitchHistogram}} that's also used in the legacy snitch, and code in {{DynamicEndpointSnitch}} that's only used in {{DynamicEndpointSnitchHistogram}}. The boundary between DynamicEndpointSnitch and DynamicEndpointSnitchHistogram in particular feels kind of arbitrary.\r\n\r\nDynamicEndpointLegacySnitch\r\n * If\u00a0we're going to keep the old behavior around as a failsafe (and we should), I think we should avoid improving it by changing the reset behavior. Only resetting under some situations intuitively feels like the right thing to do, but it would suck if there were unforeseen problems with it that made it a regression from the 3.x behavior.","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16840757"},{"id":"16971360","author":"jolynch","display":"Joey Lynch","created":"2019-11-11T07:36:55.650+0000","body":"[~bdeggleston]\u00a0alright I finally got this rebase sorted out. The messaging patches and in-jvm dtests conflicted a lot unfortunately; but on the bright side they actually did a lot of the cleanups for us so that was nice. I still have a few test cases to fixup (testScheduleProbes and the DESLongTest), but I figured getting this patch moving again is a good idea.\r\n||trunk||\r\n|[branch|https://github.com/apache/cassandra/compare/trunk...jolynch:CASSANDRA-14459-rebase]|\r\n|[!https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459.png?circle-token= 1102a59698d04899ec971dd36e925928f7b521f5!|https://circleci.com/gh/jolynch/cassandra/tree/CASSANDRA-14459-rebase]|\r\n{quote}Some general notes:\r\n * I don't think we need a dynamicsnitch package, the 2 implementations could just live in the locator package.\r\n * I can't find anywhere that we validate the various dynamic snitch values? I didn't look super hard, but if we're not, it would be good to check people are using sane values on startup and jmx update.\r\n * It's probably a good time to rebase onto current trunk.{quote}\r\nOk I've removed the package and rebased. I've also validated the snitch values in {{applyConfigChanges}} which I believe is called in all paths (constructor, dynamic swap, etc ...).\r\n{quote}ScheduledExecutors:\r\n * {{getOrCreateSharedExecutor}}\u00a0could be private\r\n * shutdown times accumulate in the wait section. ie: if we have 2 executors with a shutdown time of 2 seconds, we'll wait up to 4 seconds for them to stop.\r\n * we should validate shutdown hasn't been called in\u00a0{{getOrCreateSharedExecutor}}\r\n * I don't see any benefit to making this class lock free. Making the\u00a0{{getOrCreateSharedExecutor}}\u00a0and\u00a0{{shutdownAndWait}}\u00a0methods synchronized and just using a normal hash map for\u00a0{{executors}}\u00a0would make this class easier to reason about. As it stands, you could argue there's some raciness with creating and shutting down at the same time, although it's unlikely to be a problem in practice. I do think I might be borderline nit picking here though.{quote}\r\nMy intention for {{getOrCreateSharedExecutor}} is that it is {{public}} so that we can safely create STPEs elsewhere in the codebase without running the risk of failing to shutdown the executors (e.g. during in jvm dtests). Are you just referring to the overloaded one that doesn't provide the constructor?\r\n\r\nI also am not sure I agree we need to validate shutdown since the executors themselves will throw exceptions if a task is scheduled and I can't think of a better thing to do than throw an exception. Curious what you'd prefer we do in that case?\r\n\r\nI've fixed the shutdown slowness you mentioned by re-using the existing shutdown multiple threadpool logic and I've made it just use regular hashmaps.\r\n{quote}StorageService\r\n * {{doLocalReadTest}}\u00a0method is unused{quote}\r\nOops, missed that in the refactors (I was planning on making PingMessage's require a local disk read to make the ping messages a little more realistic but then I decided against it. Removed.\r\n{quote}MessagingService\r\n * Fix class declaration indentation\r\n * remove unused import{quote}\r\nFixed.\r\n{quote}DynamicEndpointSnitch\r\n * I don't think we need to check\u00a0{{logger.isTraceEnabled}}\u00a0before calling\u00a0{{logger.trace()}}? At least I don't see any toString computation that would happen in the calls.\r\n * The class hierarchy could be improved a bit. There's code in\u00a0{{DynamicEndpointSnitchHistogram}}\u00a0that's also used in the legacy snitch, and code in\u00a0{{DynamicEndpointSnitch}}\u00a0that's only used in\u00a0{{DynamicEndpointSnitchHistogram}}. The boundary between DynamicEndpointSnitch and DynamicEndpointSnitchHistogram in particular feels kind of arbitrary.{quote}\r\nAgreed on the logging point, I've taken it out since fwict there isn't any hot path that's doing logging.\r\n\r\nRegarding the class hierarchy I agree now that the whole DES is pluggable these seams don't make much sense (since you can just load your own dsnitch). I've still tried making specific methods protected that I hope to play around with in CASSANDRA-14817 to test out different snitch implementations but I've gotten rid of the inheritance for DES and DESH (leaving only {{DynamicEndpointSnitchLegacy}}). I hope that's acceptable?\r\n{quote}DynamicEndpointLegacySnitch\r\n * If\u00a0we're going to keep the old behavior around as a failsafe (and we should), I think we should avoid improving it by changing the reset behavior. Only resetting under some situations intuitively feels like the right thing to do, but it would suck if there were unforeseen problems with it that made it a regression from the 3.x behavior.{quote}\r\nOk, we will dump the entire map every 10 minutes by default in the Legacy behavior.","url":"https://issues.apache.org/jira/browse/CASSANDRA-14459?focusedCommentId=16971360"}],"comment_count":20}},"branches":[{"branch":"trunk","pr_number":283,"pr_url":"https://github.com/apache/cassandra/pull/283","title":"CASSANDRA-14459: DynamicEndpointSnitch should never prefer latent replicas","is_self":true,"state":"open","draft":false,"head_sha":"9dd81e3e8ce73dad7f99e738e84c93237709dc4e","ci":null}],"ci_unmapped":[],"ci_archives":[],"commits":[{"sha":"6539d50feded7027421fedcb75ef02db03ef3c48","message":"Avoid dropping all data in DynamicSnitch reset\n\nInstead of throwing away all measurements every ten minutes, now we keep\nthe old value and proactively probe nodes that are being requested\nfor ranking but are not getting any latency information using\nexponential backoff. We use these probes to re-incorporate slow nodes\nrather than a blind reset\n\nThis prevents nodes from talking accross datacenters and makes it so that when\nnodes start up they get a latency landscape during the first round of startup\nping messages.","author_name":"Joseph Lynch","login":"jolynch","trailers":[],"url":"https://github.com/apache/cassandra/pull/283/commits/6539d50feded7027421fedcb75ef02db03ef3c48"},{"sha":"3f5abcfdb940b93819bfef25d70fba35e8ef5488","message":"Remove deprecated isLatencyForSnitch and replace with latencyMeasurementType","author_name":"Joseph Lynch","login":"jolynch","trailers":[],"url":"https://github.com/apache/cassandra/pull/283/commits/3f5abcfdb940b93819bfef25d70fba35e8ef5488"},{"sha":"4bbf702f925e2fd82929c878729a699cc2b4074c","message":"Feedback from Review\n\nMakes all the bookeeping into time accounting, adds a ton of unit tests\nand fixes the Legacy behavior to actually be the legacy behavior.","author_name":"Joseph Lynch","login":"jolynch","trailers":[],"url":"https://github.com/apache/cassandra/pull/283/commits/4bbf702f925e2fd82929c878729a699cc2b4074c"},{"sha":"0e36f2be5552db079fcf7bdea7718584ec27d13f","message":"More fixups","author_name":"Joseph Lynch","login":"jolynch","trailers":[],"url":"https://github.com/apache/cassandra/pull/283/commits/0e36f2be5552db079fcf7bdea7718584ec27d13f"},{"sha":"9dd81e3e8ce73dad7f99e738e84c93237709dc4e","message":"Address remaining comments from Ariel","author_name":"Joseph Lynch","login":"jolynch","trailers":[],"url":"https://github.com/apache/cassandra/pull/283/commits/9dd81e3e8ce73dad7f99e738e84c93237709dc4e"}],"files":[{"path":"conf/cassandra.yaml","previous_path":null,"status":"M","additions":9,"deletions":4,"binary":false,"kind":"other","suite":null},{"path":"doc/source/operating/snitch.rst","previous_path":null,"status":"M","additions":8,"deletions":4,"binary":false,"kind":"doc","suite":null},{"path":"src/java/org/apache/cassandra/concurrent/ScheduledExecutors.java","previous_path":null,"status":"M","additions":78,"deletions":10,"binary":false,"kind":"production","suite":null},{"path":"src/java/org/apache/cassandra/config/Config.java","previous_path":null,"st a/pull/283#pullrequestreview-216964862"},{"user":"aweisberg","state":"CHANGES_REQUESTED","association":"CONTRIBUTOR","submitted_at":"2019-03-22T23:29:55Z","url":"https://github.com/apache/cassandra/pull/283#pullrequestreview-217526487"},{"user":"jolynch","state":"COMMENTED","association":"CONTRIBUTOR","submitted_at":"2019-03-29T20:03:14Z","url":"https://github.com/apache/cassandra/pull/283#pullrequestreview-220734649"},{"user":"aweisberg","state":"COMMENTED","association":"CONTRIBUTOR","submitted_at":"2019-04-01T15:22:50Z","url":"https://github.com/apache/cassandra/pull/283#pullrequestreview-221180633"}],"lab_plan":{"status":"plan","reason":null,"markdown":"# Lab Plan: PR 283 CASSANDRA-14459: DynamicEndpointSnitch should never prefer latent replicas (trunk)\n\n> **Not run.** Generated by cassandra-pr-review 0.1.0 from the PR diff on 2026-10-10. No cluster was created, no AWS resource touched, and no command below was executed. Commands are checked against `easy-db-lab commands` (version 12) only for spelling. Review before running.\n\n## Objective\n**1. Kill -9 during compaction.** Hypothesis: on the base build, `kill -9` during compaction can leave state that fails recovery at restart (a node that will not start, or error lines in `system.log`); on the PR build it never does. Success: head restarts cleanly in every cycle and base reproduces the failure at least once.\n\n**2. Lwt contention.** Hypothesis: the changed Paxos or conditional-statement code keeps LWT throughput and p99 under contention at or better than the merge-base. Success: head p99 \u003c= base p99 + 2x the calibration spread and ops/s >= base - 2x the spread, in both A-B pairs; otherwise report no detectable difference.\n\n## Cluster Name\npr283-9dd81e3\n\n## Datacenters\nsingle\n\n## Environment\n3 db + 1 app, i4i.xlarge, trunk (JDK 21). Base = e191aff38505 (apache/cassandra); head = 9dd81e3e8ce7 (jolynch/cassandra).\n\n## Artifacts under test\n| | base | head |\n|---|---|---|\n| repo / ref | apache/cassandra @ e191aff385053bdb5325f15bc6d16d2dc0ee0589 | jolynch/cassandra @ 9dd81e3e8ce73dad7f99e738e84c93237709dc4e |\n| build | `build-cassandra-ref.yml` | `build-cassandra-ref.yml` |\n| installed as | `pr283-base` | `pr283-head` |\n\n## Steps\n\n### 1. Build both refs (owner's machine)\nBuilds run in a cassandra-builds repo whose workflows you can dispatch. The repo below is the default; change `BUILDS` to your fork if you cannot dispatch there. Both refs are full SHAs, never branch names.\n```bash\nBUILDS=rustyrazorblade/cassandra-builds\ngh workflow run build-cassandra-ref.yml -R $BUILDS -f repo=apache/cassandra -f ref=e191aff385053bdb5325f15bc6d16d2dc0ee0589\ngh workflow run build-cassandra-ref.yml -R $BUILDS -f repo=jolynch/cassandra -f ref=9dd81e3e8ce73dad7f99e738e84c93237709dc4e\ngh run list -R $BUILDS -w build-cassandra-ref.yml -L 2\n```\n**Pass:** both runs show `success`, and `gh release view \u003csha> -R $BUILDS` lists a `-bin.tar.gz` for each SHA.\n**Fail:** either run fails; stop here.\n\n### 2. Provision\n```bash\n$EDB init pr283-9dd81e3 --db.count 3 --app.count 1 --db.instance-type i4i.xlarge --app.instance-type i4i.xlarge --up\n$EDB status\n```\n**Pass:** all nodes are up.\n\n### 3. Install both builds on all nodes\n```bash\nURL_BASE=$(gh release view e191aff385053bdb5325f15bc6d16d2dc0ee0589 -R $BUILDS --json assets --jq '.assets[] | select(.name | endswith(\"-bin.tar.gz\")) | .url')\nURL_HEAD=$(gh release view 9dd81e3e8ce73dad7f99e738e84c93237709dc4e -R $BUILDS --json assets --jq '.assets[] | select(.name | endswith(\"-bin.tar.gz\")) | .url')\n$EDB cassandra install pr283-base --java 21 --url \"$URL_BASE\"\n$EDB cassandra install pr283-head --java 21 --url \"$URL_HEAD\"\n```\n**Pass:** both directories exist on db0, db1, db2 (`ssh -F \"$(dirname \"$EDB\")/sshConfig\" db0 ls /usr/local/cassandra`).\n\n### 4. Calibrate (base, 2 x 5 min)\nTwo identical runs on the base build give the error bar for every delta below.\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr283-base\n$EDB cassandra start\n$EDB cassandra nt status\nfor k in 1 2; do\n  $EDB cassandra stress start --name cal-$k --tags \"arm=base,phase=cal,pr=283\" -- KeyValue -r .5 -t 64 -d 5m\n  sleep 360   # stress start returns before the job ends (unverified)\n  $EDB cassandra stress logs cal-$k --tail 40\ndone\n```\n**Record:** ops/s and p99 of both runs. Spread = the difference between them; it is the error bar.\n\n### 5. Arm A (base): start and crash 30 times\nTiny sstables and aggressive compaction maximise obsolete-sstable deletions per minute; each cycle flushes, compacts, then kills the process on one node and restarts it.\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr283-base\n$EDB cassandra start\n$EDB cassandra nt status\n$EDB cassandra cql \"CREATE KEYSPACE IF NOT EXISTS crash WITH replication={'class':'SimpleStrategy','replication_factor':3}\"\n$EDB cassandra stress start --name base-load --tags \"arm=base,pr=283\" -- KeyValue -d 40m -t 64 --rate 30k -r .1 --compaction \"{'class':'SizeTieredCompactionStrategy','min_threshold':2}\"\nfor i in $(seq 1 30); do\n  $EDB cassandra nt --hosts db1 flush\n  $EDB cassandra nt --hosts db1 compact\n  sleep $((RANDOM % 8))\n  $EDB exec run -t cassandra --hosts db1 bash -c \"sudo systemctl kill -s KILL cassandra; exit 0\"\n  $EDB cassandra start --hosts db1\n  $EDB exec run -t cassandra --hosts db1 bash -c \"grep -E -c 'ERROR|Unexpected files detected' /mnt/db1/cassandra/logs/system.log; exit 0\"\ndone\n```\n**Record:** cycles where db1 did not return to UN, and the count of matching log lines per cycle.\n**Unverified until run:** the systemd unit name `cassandra`, whether `start --hosts` waits for UN, and the log path.\n\n### 6. Arm B (head): reset, switch builds, crash 30 times\n```bash\n$EDB cassandra stop\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n$EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n$EDB cassandra use pr283-head\n$EDB cassandra start\n$EDB cassandra nt status\n$EDB cassandra cql \"CREATE KEYSPACE IF NOT EXISTS crash WITH replication={'class':'SimpleStrategy','replication_factor':3}\"\n$EDB cassandra stress start --name head-load --tags \"arm=head,pr=283\" -- KeyValue -d 40m -t 64 --rate 30k -r .1 --compaction \"{'class':'SizeTieredCompactionStrategy','min_threshold':2}\"\nfor i in $(seq 1 30); do\n  $EDB cassandra nt --hosts db1 flush\n  $EDB cassandra nt --hosts db1 compact\n  sleep $((RANDOM % 8))\n  $EDB exec run -t cassandra --hosts db1 bash -c \"sudo systemctl kill -s KILL cassandra; exit 0\"\n  $EDB cassandra start --hosts db1\n  $EDB exec run -t cassandra --hosts db1 bash -c \"grep -E -c 'ERROR|Unexpected files detected' /mnt/db1/cassandra/logs/system.log; exit 0\"\ndone\n```\n**Pass:** head restarts in 30/30 cycles with 0 matching log lines, and base showed at least one failure.\n**Fail:** any failed restart or matching log line on head.\n**Inconclusive:** base shows 0 failures in 30 cycles (the control cannot fail); extend to 100 cycles or mark the result not informative. Do not report this as fixed.\n\n### 7. Measured runs, order A B B A (LWT contention)\nData is wiped between arms. Each job is tagged with its arm and run number.\n```bash\nk=0\nfor arm in base head head base; do\n  k=$((k+1))\n  $EDB cassandra stop\n  $EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 -delete; exit 0\"\n  $EDB exec run -t cassandra bash -c \"find /mnt/db1/cassandra -mindepth 1 | wc -l; exit 0\"   # expect 0 on every node\n  $EDB cassandra use pr283-$arm\n  $EDB cassandra start\n  $EDB cassandra nt status\n  $EDB cassandra stress start --name lwt-$arm-$k --tags \"arm=$arm,run=$k,pr=283\" -- LWT -t 200 -p 1000 -d 20m\n  sleep 1260   # job length plus a minute; stress start returns early (unverified)\n  $EDB cassandra stress logs lwt-$arm-$k --tail 40\n  $EDB cassandra stress start --name locking-$arm-$k --tags \"arm=$arm,run=$k,pr=283\" -- Locking -t 200 -p 1000 -d 20m\n  sleep 1260   # job length plus a minute; stress start returns early (unverified)\n  $EDB cassandra stress logs locking-$arm-$k --tail 40\n  $EDB cassandra nt gcstats\n  $EDB cassandra nt tpstats\n  $EDB cassandra nt compactionstats\n  $EDB exec run -t cassandra bash -c \"grep -c ERROR /mnt/db1/cassandra/logs/system.log; exit 0\"\n  $EDB cassandra stress stop --all --force\ndone\n```\n**Pass:** for every workload, head ops/s and p99 are within 2x the calibration spread of base in both A-B pairs, and head logs no new `ERROR` lines.\n**Fail:** head is outside that spread in both pairs, or logs new errors or timeouts.\n**No detectable difference:** a delta below 2x the calibration spread, or in only one pair.\n**Unverified until run:** the data directory path and whether `stress start` returns before the job ends.\n\n### 8. Collect results\nFill the results table below from the job logs and `nt` output, apply the decision rule from the Objective, and write the verdict (fixed, no detectable difference, regression, or inconclusive) next to it.\n```bash\n$EDB cassandra nt status\n$EDB cassandra stress status\n```\n\n### 9. Teardown\n```bash\n$EDB down --auto-approve\ngh release delete e191aff385053bdb5325f15bc6d16d2dc0ee0589 -R $BUILDS --cleanup-tag --yes\ngh release delete 9dd81e3e8ce73dad7f99e738e84c93237709dc4e -R $BUILDS --cleanup-tag --yes\n```\nPer-SHA releases accumulate; skip the last two lines if another plan uses the same SHA.\n\n## Results table (fill in)\n| arm | run | ops/s | p99 ms | GC ms/s | pending compactions | errors |\n|---|---|---|---|---|---|---|\n| base | 1 |  |  |  |  |  |\n| head | 2 |  |  |  |  |  |\n| head | 3 |  |  |  |  |  |\n| base | 4 |  |  |  |  |  |\n\n## Notes\nScenario **kill -9 during compaction** was chosen by rule `crash-recovery` (1 production file, 5 changed lines).\nScenario **LWT contention** was chosen by rule `paxos-lwt` (1 production file, 5 changed lines).\nChanged paths behind the first scenario: `src/java/org/apache/cassandra/hints/HintsDispatcher.java`.\nNot run because of the cap of 2 scenarios: mixed-version ring (rule `wire-and-format`, 6 files).\nThe failure window can be small: an inconclusive base arm is an expected outcome, not a plan defect.\nEstimated wall clock 4.5 h on 3 + 1 i4i.xlarge instances; confirm on the first real run. Perf deltas count only above 2x the calibration spread and when they appear in both A-B pairs.\nEvery command was checked for spelling only. Items marked 'Unverified until run' are taken from the easy-db-lab plugin documentation and have not been executed by this tool.\n","filename":"plan-283.md","cluster":"pr283-9dd81e3","generated":"2026-10-10","hours":4.5,"scenarios":[{"id":"crash","title":"kill -9 during compaction","rules":["crash-recovery"],"files":1,"lines":5},{"id":"lwt","title":"LWT contention","rules":["paxos-lwt"],"files":1,"lines":5}],"dropped":[{"id":"mixed-version","title":"mixed-version ring","rules":["wire-and-format"],"files":6}]},"build":{"status":"not-built","reason":"No build result for this head. Only PRs by committers are built automatically (`cpr build \u003cN>`); for any other PR the owner approves one head with `cpr build \u003cN> --approve`.","author_is_committer":true},"sections":[{"id":"summary","title":"Summary","status":"fail","docs":["summary"],"checks":[]},{"id":"ticket","title":"JIRA ticket","status":"pass","docs":["jira"],"checks":["jira.key-present","jira.ticket-exists","jira.key-consistent","jira.not-resolved","jira.fix-version"]},{"id":"ci","title":"Branches & CI","status":"fail","docs":["ci","branches"],"checks":["ci.evidence","ci.freshness","ci.profile","ci.failures","branches.coverage"]},{"id":"testing","title":"Testing","status":"pass","docs":["testing"],"checks":["tests.present"]},{"id":"build","title":"Build & coverage","status":"not-applicable","docs":["build"],"checks":["build.compiles","build.tests-pass","build.changed-line-coverage"]},{"id":"labplan","title":"Lab plan","status":"info","docs":["labplan"],"checks":[],"summary":"Plan for kill -9 during compaction and LWT contention (not run)"},{"id":"commits","title":"Commits & changelog","status":"warn","docs":["commits"],"checks":["commits.message-format","commits.provenance","changelog.entry","commit.perf-structure"]},{"id":"static","title":"Code style","status":"warn","docs":["static"],"checks":["static.checkstyle","static.complexity","static.pmd-rules","static.duplication","static.banned-api","static.license-header","static.protected-paths","static.deprecated-since"]},{"id":"compatibility","title":"Compatibility","status":"fail","docs":["compatibility"],"checks":["compat.config-pairing","compat.system-properties","compat.nodetool-help","compat.surfaces"]},{"id":"votes","title":"Reviews & votes","status":"fail","docs":["votes"],"checks":["votes.committer-plus-ones"]},{"id":"triage","title":"Triage","status":"info","docs":["triage"],"checks":[]},{"id":"context","title":"Context","status":"info","docs":["context"],"checks":[]},{"id":"review","title":"Code review","status":"unknown","docs":["code-review"],"checks":[]},{"id":"changes","title":"Changes","status":"unknown","docs":["changes"],"checks":[]},{"id":"about","title":"About","status":"info","docs":[],"checks":[]}],"docs":{"branches":"# Branches\n\n## What is checked\n\nWhether every branch named by the ticket's Fix Versions has a PR. The Branches & CI table shows one row per PR for this ticket (this PR and its siblings): base branch, PR, state, head sha, and the CI summary assigned to that branch, if any.\n\nSibling PRs are found two ways: GitHub PR links recorded on the JIRA ticket, and a GitHub search for the ticket key in apache/cassandra. A found PR counts as a sibling only if its own title, branch, or body resolves to the same ticket key.\n\n## Why\n\n- Open **one PR per target branch**. A fix for several release lines arrives as one PR per branch, linked by the ticket key. Source: observed practice, and the merge workflow in [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html).\n- Fix the oldest applicable branch first, then merge forward: `cassandra-4.0 \u2192 cassandra-4.1 \u2192 cassandra-5.0 \u2192 cassandra-6.0 \u2192 trunk`. Contributors should say which versions they verified as affected, patch the lowest branch, and check the patch merges cleanly upward. Sources: [How to commit](https://cassandra.apache.org/_/development/how_to_commit.html); [Contributing code changes](https://cassandra.apache.org/_/development/patches.html), \"Bug Fixes\" (that page lists old branch names; follow its intent).\n- Patch releases on GA branches take bug fixes only. Improvements and features go to trunk only. Source: [Release Lifecycle](https://cwiki.apache.org/confluence/spaces/CASSANDRA/pages/132320437/Release+Lifecycle).\n- CI must cover all affected branches before commit. Source: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\n## How each status is decided\n\n### `branches.coverage`\n\nAdvisory. Owner: contributor.\n\nEach Fix Version is mapped to a branch the same way as in the JIRA aspect (`5.0.x` \u2192 `cassandra-5.0`; a version with no release branch, such as `7.x`, \u2192 `trunk`). A branch is covered when this PR or an **open** sibling PR targets it.\n\n- **unknown**: JIRA could not be reached.\n- **not-applicable**: no ticket was read, or Fix Version is empty, so the expected branches are unknown.\n- **warn**: at least one Fix Version branch has no PR. Moves the recommendation to \"needs work\".\n- **pass**: every Fix Version branch has a PR.\n\n## How to fix\n\n- Open a PR against each missing branch, using a branch name like `\u003cyou>/CASSANDRA-12345/cassandra-5.0`, and put the ticket key in each PR title so the tool and the ASF bot link them.\n- Backports often differ from the trunk patch. Make each PR apply cleanly to its own base.\n- If a branch does not need the fix (the bug is not present there, or the change is a feature for trunk only), remove that Fix Version from the ticket or explain on the ticket. The check will keep warning until the Fix Versions match the PRs.\n- If a sibling PR exists but is not found, make sure its title or branch carries the same ticket key.\n\n## Limits\n\n- Closed sibling PRs do not count. After a committer pushes one branch and closes its PR, the check may warn for that branch.\n- Patches offered as fork compare links or branch names in JIRA comments, not as PRs, are not found.\n- Fix Versions are taken as the truth. If the ticket's Fix Versions are wrong, the check is wrong in the same way.\n- The check does not judge whether a branch should get the change (bug fix versus feature, end-of-life branches). That decision belongs to the committer.\n- It does not test whether the patch merges forward cleanly.\n","build":"# Build & coverage\n\n## What is checked\n\nThree checks read the result of `cpr build \u003cN>`, which builds the PR head, runs a selection of unit tests with JaCoCo, and saves the outcome for that exact head sha. `cpr review` never builds; it only reads the saved result.\n\n- `build.compiles`: did the PR branch compile.\n- `build.tests-pass`: did the selected unit tests pass.\n- `build.changed-line-coverage`: did the lines the PR added under `src/java` run under those tests.\n\nThe section also shows the tests table (classes, run, failed, errors, skipped, failures), coverage per file with the missed line numbers, the list of selected test classes with the reason each was picked, and any failure we blame on the sandbox rather than on the PR.\n\n**Who gets built.** Building runs the PR author's code, so it is limited. A PR is built automatically only when its author is on the committer roster. For any other PR the section says \"Not built for this head\" until the owner approves that exact head with `cpr build \u003cN> --approve`. Approval covers one head sha; a push needs a new approval.\n\n**The sandbox.** Every step that runs the author's code runs inside macOS `sandbox-exec`: no external network, writes only to the run directory, and no read access to credential directories (`~/.ssh`, `~/.aws`, `~/.gnupg`, GitHub and Claude configuration, the keychain). The build works in a throwaway clone with its own copy of the Maven cache. Only dependency resolution uses the network, and it uses the base commit's build file, which the PR cannot change. Some tests fail only because of the sandbox (for example `transferTo0: Operation not permitted` in streaming tests). Those are reported as unknown, not as failures of the PR.\n\n**Reading the numbers.** Line coverage shows which changed lines ran under the selected tests; it does not show that the fix's behaviour is tested. Read with the test regime lens. The selection is a heuristic (tests the PR changes, name matches, references to changed classes and methods; at most 25 classes; no dtests, long, burn or simulator tests), so a missed line can mean \"the right test was not selected\".\n\n## Why\n\n- Reviewers are asked to confirm that the patch builds and that \"tests exist, are comprehensive, and actually exercise the behaviour\". Source: [How to review](https://cassandra.apache.org/_/development/how_to_review.html), section Testing. CI results attached to JIRA say this for the committer's own run; this section says it for the head the reviewer is looking at.\n- Changed-line coverage is a cheap, objective hint about the second half of that sentence: an added line that no selected test reaches is a line to ask about. In the research run on PR 5212, all 10 added executable lines were missed, which pointed at interrupt-handling code that no test triggers. Source: `docs/research/build-and-coverage.md`, section 4.\n- The owner decided that automatic builds are for committers' PRs only, always sandboxed, because building is executing someone else's code. Source: the `build-and-coverage` OpenSpec change.\n\n## How each status is decided\n\nThe saved result has a `status`: `pass`, `tests-failed`, `build-failed`, `timeout`, `unknown` or `not-built`. The checks use it with the test and coverage data in the same file.\n\nA result counts only if its `head` equals the PR's current head sha. A result for an older head, or no result at all, is treated as not built: all three checks are not-applicable with the reason \"not built\", the section shows no old numbers, and nothing blocks. Unknown results never block either.\n\n### `build.compiles`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: `status` is `build-failed`. The evidence lists the compile error lines (file, line, message) from the run.\n- **pass**: the build ran: status `pass` or `tests-failed`, or status `unknown` with test results recorded (tests cannot run without a build).\n- **unknown**: status `timeout`, or status `unknown` with no test results (the build outcome was never seen). Does not block.\n- **not-applicable**: not built for this head.\n\n### `build.tests-pass`\n\n**Blocking.** Owner: contributor.\n\n- **fail**: status `tests-failed` and at least one failure that is not a sandbox artifact. The evidence names each failing class and method with its first message line.\n- **pass**: status `pass` with tests run and no failures or errors.\n- **unknown**: status `timeout`; status `unknown`; only sandbox artifacts failed; or no test results were recorded. Does not block.\n- **not-applicable**: not built for this head, or the build failed so no tests ran.\n\n### `build.changed-line-coverage`\n\n**Advisory.** Owner: contributor. A warning here is a note and does not move the verdict.\n\n- **warn**: at least one added executable line did not run. The evidence has one row per file, \"covered N/M, missed lines ...\". A line that ran only partly (some branches or instructions never ran) counts as covered and is flagged \"partly\".\n- **pass**: every added executable line ran.\n- **unknown**: coverage was not measured, or a changed file is missing from the JaCoCo report. Does not block.\n- **not-applicable**: not built, the build failed, or the PR adds no executable line under `src/java` (tests, docs and comments only).\n\n## How to fix\n\n- **Compile errors**: fix them and run `ant jar` and `ant build-test` on the branch.\n- **Failing tests**: run the named class with `ant testsome -Dtest.name=\u003cclass> -Dtest.methods=\u003cmethod>`. If it also fails on the base branch, say so on the ticket.\n- **Missed lines**: add a test that reaches them, in the lowest suite that can (see the Testing aspect). If a missed line is deliberately untestable, say why in the PR.\n- **Not built, committer's PR**: run `cpr build \u003cN>`. The `/review-pr` skill does this for you.\n- **Not built, other authors**: the owner runs `cpr build \u003cN> --approve` after reading the diff, then re-renders.\n- **Timeout or unknown**: read the reason shown in the banner; it names a missing JDK (with the install command), a network problem, or a sandbox artifact.\n\n## Limits\n\n- **Selected tests only.** At most 25 unit test classes run. Passing them says nothing about the rest of the suite, dtests, upgrade tests or the simulator.\n- **Coverage is not proof.** A line can run under a test that does not assert anything about it.\n- **Sandbox artifacts are guessed from known messages.** A real failure that looks like a sandbox error is reported as unknown, never as a pass.\n- **One run per head.** Flaky tests are not rerun in this version; a single failure is reported as failed.\n- **macOS only.** The sandbox and JDK handling are for the owner's machine. Builds do not run in the GitHub Action.\n- **Committers' PRs by default.** For every other PR the section is empty until the owner approves a head.\n","changes":"# Changes\n\n## What is checked\n\nThis section shows the PR's diff. It is a viewer, not a check. The diff runs from the merge base of the PR and its base branch to the PR head, with the PR's GitHub review comments attached to their lines.\n\nThe view is produced by the ide-explain generator from the rustyrazorblade `dev-skills` plugin: a file tree on the left, the diff top right, and an explanation pane bottom right. Files that a check flagged (a fail or warn whose evidence names a file) carry a note in the explanation pane listing the check and what it found.\n\n## Why\n\nReviewers need the code next to the results. A contributor looking at a warning such as \"banned API at line 42\" can open that file and line here. ide-explain is used rather than a custom viewer so that improvements to the plugin reach the report without changes to this tool.\n\n## How each status is decided\n\nThe section badge is **info** when the diff view was produced and **unknown** when it was not.\n\nHow the view is produced:\n\n1. The tool finds the newest installed generator under `~/.claude/plugins/cache/rustyrazorblade-plugins/dev-skills/\u003cversion>/skills/ide-explain/scripts/generate-explain.py`. The environment variable `CPR_IDE_EXPLAIN` overrides the path. The version used is recorded in About.\n2. It runs the generator inside the local clone of apache/cassandra with the merge base, the PR head, the PR number (for review comments), and a per-file notes map built from the check results.\n3. **Size budget**: if the output is larger than 8 MB, the generator runs again limited to `src/`, and the section notes that tests and other files appear only in the file table. If the `src/`-only view is still over 8 MB, no view is embedded.\n4. **Safety**: the output is checked for external scripts, external stylesheets, `@import`, and `fetch(`. If any is found, the view is not embedded. Otherwise the page is stored base64-encoded in the report and loaded into an `\u003ciframe sandbox=\"allow-scripts\">` through `srcdoc`. Without `allow-same-origin`, the embedded page cannot read or change the rest of the report.\n\nWhen there is no view (plugin not installed, the generator failed, too large, or network references found), the section shows a plain list of changed files with additions and deletions, and the reason. The rest of the report is unaffected.\n\n## How to fix\n\nNothing for contributors. If you generate reports yourself and the view is missing, install the `dev-skills` plugin from rustyrazorblade-plugins in Claude Code, or set `CPR_IDE_EXPLAIN` to the path of `generate-explain.py`, then run `cpr review \u003cN>` again.\n\n## Limits\n\n- The view depends on a plugin installed on the machine that built the report. Reports built elsewhere may lack it.\n- On very large PRs only `src/` is shown.\n- The diff is against the merge base, so it can differ from GitHub's \"Files changed\" tab when the base branch has moved.\n- Review comments are those on GitHub when the report was built. JIRA comments are in the JIRA section.\n- Notes come only from checks whose evidence names a file. Checks about the PR as a whole (votes, CI) add no notes.\n","ci":"# CI\n\n## What is checked\n\nWhether pre-commit CI has run for every branch this patch targets, whether it ran on the current PR head, whether it used a profile that covers the change, and how many tests failed.\n\napache/cassandra runs no CI checks on pull requests. CI evidence is the `ci_summary*.html` file that `.build/run-ci` produces and that someone attaches to the JIRA ticket. The tool downloads every attachment whose name contains `ci_summary` and ends in `.html`, and reads the tested commit sha, the branch, the profile, and the pass, fail, and skip counts from it.\n
