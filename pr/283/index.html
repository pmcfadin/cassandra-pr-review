; over 2: 1 |\n| Compatibility surfaces touched (see the Compatibility aspect) | 1 per surface |\n| High-risk surfaces among them: messaging, sstable format, commitlog / hints, native protocol, schema / system tables | 1 more per surface |\n| Concurrency-sensitive paths: `concurrent/`, `db/compaction/`, `service/paxos/`, `service/accord/`, `utils/concurrent/`, `tcm/`, `streaming/` | 2 if any production file is under one |\n| Target branches (this PR plus open sibling PRs) | over 2: 1 |\n| Production code changed with no test file changed | 1 |\n\n**Rating**: 5 points or more is hard, 2 to 4 is moderate, 0 or 1 is easy.\n\n**Forced hard**: if any upgrade-sensitive file changed (the same list the CI aspect uses for `ci.profile`: messaging, SSTable format, commit log, hints, schema and system keyspace, serializers), the rating is hard whatever the points, and the report says which files forced it.\n\n**Split suggestion**: when production lines changed exceed 1000, the report suggests splitting and lists the five largest changed files.\n\nTriage has no checks and no pass or fail. Its section badge is always info.\n\n## How to fix\n\nThere is nothing to fix. To make review easier:\n\n- Split unrelated changes, refactors, and whitespace fixes into separate tickets and PRs.\n- For large features, land the work in reviewable steps, or discuss the plan on dev@ or in a CEP first.\n- Explain in the PR description where to start reading and what is mechanical (renames, generated code).\n- Include tests; a missing test adds a point.\n\n## Limits\n\n- Points measure size and risk areas, not difficulty. A one-line change to a Paxos invariant can be harder than 2,000 lines of new tooling.\n- Surfaces and concurrency areas are matched by path prefix.\n- Compatibility surfaces are counted over all changed files, including generated and test-data files that the line count skips.\n- The five largest files in a split suggestion can include tests, even though the threshold counts only production lines.\n- Thresholds are set by this tool, not by the Cassandra project.\n","votes":"# Reviews and votes\n\n## What is checked\n\nHow many Cassandra committers have given the patch a +1, from GitHub reviews and JIRA comments, against the number the project's governance requires.\n\n## Why\n\n- \"Code modifications must have been reviewed by at least one other contributor.\"\n- \"Code modifications require two +1 committer votes (can be author + reviewer).\" A patch from a non-committer needs two committer +1s; a committer's own patch needs one other committer's +1.\n- \"Modifications involving only test code require one +1 vote from a non-author committer.\"\n- Code must not be committed while under active discussion, while a committer has asked for time to review, or with an unresolved reasoned committer -1.\n\nSource for all four: [Cassandra Project Governance](https://cwiki.apache.org/confluence/display/CASSANDRA/Cassandra+Project+Governance).\n\nReviewers usually give their +1 in a JIRA comment, and the ticket's Reviewers field names them. Some approve on GitHub instead. The committer list comes from the ASF: [projects.apache.org](https://projects.apache.org/committee.html?cassandra).\n\n## How each status is decided\n\n### `votes.committer-plus-ones`\n\n**Blocking.** Owner: reviewer.\n\n**What counts as a +1**: a GitHub review in state APPROVED, or a JIRA comment containing `+1` as a separate token (`+1`, `(+1`, `[+1`, but not `+10`).\n\n**Who counts as a committer**, checked in this order and shown next to each vote:\n\n1. An entry in `cpr/data/committer-overrides.json` maps the GitHub or JIRA user to an ASF id on the roster.\n2. JIRA: the commenter's JIRA username is an ASF id on the Cassandra committer roster.\n3. GitHub: the user has authored commits as `\u003casf-id>@apache.org` and that id is on the roster.\n4. GitHub: the review's author association is MEMBER or OWNER (apache organisation members).\n\nThe roster is the `cassandra` group in the ASF's public LDAP data, cached for 24 hours. Each committer counts once, even if they approve on GitHub and comment on JIRA.\n\n**How many are needed**: one if every changed file is a test file, otherwise two. When the PR author is a committer and the change is not test-only, the author counts as one vote.\n\n- **unknown**: the roster could not be loaded and no vote was matched by another rule. Raw +1s are listed. The recommendation becomes \"insufficient evidence\".\n- **fail**: fewer committer +1s than needed. The recommendation becomes \"blocked\".\n- **pass**: enough committer +1s. Non-committer +1s are listed but not counted.\n\nEven with enough votes, the recommendation cannot pass \"requirements met, code not yet reviewed\" in this version.\n\n## How to fix\n\n- Ask for review on the JIRA ticket: set it to Patch Available (\"Submit Patch\") and ask in a comment. If nobody responds, ask on the dev@cassandra.apache.org mailing list or in the #cassandra-dev channel on the ASF Slack.\n- Address review comments, then ask the reviewer to record their +1 on the ticket.\n- If a committer's +1 is not counted, their JIRA username or GitHub account could not be matched to an ASF id. Add a mapping in `cpr/data/committer-overrides.json`.\n- Contributors cannot fix this alone. A fail here is normal for a new PR.\n\n## Limits\n\n- `+1` is found by pattern. \"+1 to the idea\", \"+1 (nb)\", or a quoted +1 from someone else count as votes if the commenter is a committer. Every counted vote links to its source so a human can check it.\n- -1 votes, requests for time to review, and ongoing discussion are not detected.\n- GitHub MEMBER and OWNER mean apache organisation member, which includes committers of other ASF projects. They are counted as `github:\u003clogin>`, so the same person approving on GitHub and commenting on JIRA can be counted twice when no `@apache.org` commit email links the two.\n- A committer whose JIRA username differs from their ASF id is not matched unless an override exists.\n- For test-only changes, the rule needs a non-author committer; the check does not exclude a +1 the author left on their own ticket.\n- Votes on sibling PRs for other branches are not read; only this PR's GitHub reviews and the shared JIRA ticket.\n"},"diffview":{"status":"unavailable","reason":"The rustyrazorblade dev-skills plugin (ide-explain) is not installed.","version":null,"html_b64":null,"omitted":[]},"about":{"not_checked":["`ant check` (checkstyle and RAT) was not run; the static checks here approximate it from the diff.","Tests are built and run only for committers' PRs (or a PR the owner approved) and only a selection of unit tests; otherwise CI evidence comes only from summaries attached to JIRA.","CI failures are counted, not compared against known flaky tests (Butler) yet.","Code review lenses read the diff; they do not build or run tests."],"human_only":["Whether the design and approach are acceptable.","Backport scope: which branches should get the fix.","Whether a new dependency or public API change has dev@ consensus.","The final merge decision."],"inputs":{"fetched_at":"2026-10-10T21:47:56Z","head_sha":"9dd81e3e8ce73dad7f99e738e84c93237709dc4e","merge_base":"e191aff385053bdb5325f15bc6d16d2dc0ee0589","jira_status":"ok","roster_status":"ok","ide_explain_version":null}},"view":{"header":{"first_time_contributor":false},"verdict":{"kind":"blocked","headline":"Not ready to merge","sentence":"The contributor has 1 fix to make. Then a committer runs CI and one committer votes.","note":"","must_count":1,"fix_count":1,"people_count":1},"steps":[{"label":"Ticket","state":"ok","note":"Ticket checks pass"},{"label":"Tests","state":"ok","note":"Tests accompany the change"},{"label":"Code review","state":"unknown","note":"Code review has not run for this PR."},{"label":"CI","state":"later","note":"After the contributor's fixes: CI not yet run for `trunk`"},{"label":"+1 votes (1 of 2)","state":"later","note":"After the contributor's fixes: n (function () {
  "use strict";


  // -------------------------------------------------------------------------
  // Escaping and links. Everything from the model is untrusted text.
  // -------------------------------------------------------------------------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // http(s)/mailto, or no explicit scheme. Normalise the way a browser URL parser does first, so
  // "\x01javascript:" or "java\tscript:" cannot pass as scheme-less.
  function isSafeLinkUrl(url) {
    if (url === null || url === undefined) return false;
    var normalized = String(url)
      .replace(/^[\x00-\x20]+|[\x00-\x20]+$/g, "")
      .replace(/[\t\n\r]/g, "");
    if (!normalized) return false;
    if (/^(https?:|mailto:)/i.test(normalized)) return true;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(normalized)) return false;
    return true;
  }

  // -------------------------------------------------------------------------
  // Markdown: headings, lists, fenced code, inline code, bold/italic, links,
  // pipe tables. Input is escaped first; only our own tags are added.
  // -------------------------------------------------------------------------
  function inlineMD(text) {
    var s = escapeHtml(text);
    var stash = [];
    function keep(html) { stash.push(html); return "\u0001" + (stash.length - 1) + "\u0002"; }
    s = s.replace(/\u0001|\u0002/g, "");
    s = s.replace(/`([^`]+)`/g, function (m, p1) { return keep("<code>" + p1 + "</code>"); });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
      if (!isSafeLinkUrl(url)) return label + " (" + url + ")";
      return keep('<a href="' + url + '" target="_blank" rel="noopener noreferrer">') + label + keep("</a>");
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w])__([^_]+)__(?=[^\w]|$)/g, "$1<strong>$2</strong>");
    s = s.replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?=[^\w*]|$)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\s][^_]*)_(?=[^\w]|$)/g, "$1<em>$2</em>");

          if (dv.version) diffBody.appendChild(h("p", "muted", "Diff view from ide-explain " + dv.version + "."));
        }
      };
      openDiff = function () { if (!ctl.isOpen()) ctl.set(true); };
      append(c, [btn, diffBody]);
    } else {
      append(c, h("div", "notice s-unknown", [h("strong", null, "Diff view unavailable. "), dv.reason || "No reason recorded.",
        h("span", "why", "The file list above still shows every changed file.")]));
    }
    var om = dv.omitted || [];
    if (om.length) append(c, gblock("Left out of the diff view", [list(om, function (o) { return mdInline("span", typeof o === "string" ? o : JSON.stringify(o)); })], om.length));
    if (pr.url && isSafeLinkUrl(pr.url)) append(c, h("p", null, link(String(pr.url).replace(/\/+$/, "") + "/files", "Open the diff on GitHub", "outline-btn self-start")));
    append(c, docsBlock(sectionById.changes));
    return c;
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }
  function downloadText(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function labplanCard() {
    var lp = M.lab_plan || {};
    var sec = sectionById.labplan || {};
    var c = bgCard("labplan", "Lab plan", "full collapsible-card");
    var planned = lp.status === "plan";
    var head = h("button", "cc-head row", [h("span", "tt", [h("b", null, "Lab plan"),
      h("span", null, sec.summary || (planned ? "A generated plan for a lab run." : "No lab plan: " + (lp.reason || "not applicable") + "."))]),
      h("span", "r", [planned ? h("span", "tag", "Not run") : h("span", "tag", "No plan"), chev(16)])]);
    head.type = "button";
    var body = h("div", "cc-body");
    if (!planned) {
      append(body, h("div", "notice s-note", ["No lab plan: " + (lp.reason || "not applicable") + ".",
        h("span", "why", "A plan is generated when the diff touches code a test cluster can exercise.")]));
    } else {
      append(body, h("div", "notice s-should labplan-banner", [h("strong", null, "Not run. "),
        "This plan was generated from the diff. No cluster was created and no command was executed. Run it with ",
        h("code", null, "/easy-db-lab:run plan.md <cluster-dir>"), " only after reading it."]));
      var scn = (lp.scenarios || []).map(function (s) {
        return h("li", null, [h("strong", null, s.title), " (rule ", h("code", null, (s.rules || []).join(", ")), "; " +
          plural(s.files, "file") + ", " + plural(s.lines, "line") + ")"]);
      });
      var rows = [["Cluster name", h("span", "mono", lp.cluster)], ["Estimated wall clock", lp.hours + " h"]];
      if ((lp.dropped || []).length) rows.push(["Not chosen (cap)", lp.dropped.map(function (d) { return d.title; }).join(", ")]);
      append(body, gblock("Scenarios", [h("div", "panel", [h("ul", null, scn), fields(rows)])], scn.length));
      var status = h("span", "muted", "");
      status.setAttribute("role", "status");
      var copy = h("button", "outline-btn", "Copy plan");
      copy.type = "button";
      copy.id = "labplan-copy";
      copy.addEventListener("click", function () {
        copyText(lp.markdown, function (ok) { status.textContent = ok ? "Copied." : "Copy failed: select the text below."; });
      });
      var dl = h("button", "outline-btn", "Download " + lp.filename);
      dl.type = "button";
      dl.id = "labplan-download";
      dl.addEventListener("click", function () { downloadText(lp.filename, lp.markdown); });
      append(body, h("div", "actions no-print", [copy, dl, status]));
      var shown = String(lp.markdown).split("\n").map(function (l) { return l.replace(/^>\s?/, ""); }).join("\n");
      append(body, gblock("Plan", [h("div", "panel labplan-plan", md(shown))]));
      append(body, gblock("Raw plan.md", [details("Show raw markdown", h("pre", null, lp.markdown), {})]));
    }
    append(body, docsBlock(sec));
    append(c, [head, body]);
    collapsible(head, body, false);
    return c;
  }

  function renderBackground() {
    var sec = h("section", "stack");
    sec.id = "background";
    sec.setAttribute("aria-labelledby", "bg-h");
    var h2 = h("h2", "sec", "Background for reviewers");
    h2.id = "bg-h";
    append(sec, h("div", "sec-head", h("div", null, [h2, h("p", "sub", "Information only. Nothing here passes or fails.")])));
    var grid = h("div", "bg-grid");
    [effortCard, peopleCard, historyCard, filesCard, labplanCard].forEach(function (fn) {
      try { grid.appendChild(fn()); } catch (e) {
        if (typeof console !== "undefined") console.error(e);
        grid.appendChild(h("div", "bg-card full", h("div", "notice s-fail", [h("strong", null, "This card failed to render. "), String(e && e.message || e)])));
      }
    });
    sec.appendChild(grid);
    return sec;
  }

  // -------------------------------------------------------------------------
  // Glossary and footer (About lives here)
  // -------------------------------------------------------------------------
  var GLOSSARY = [
    ["Must fix", "The PR cannot merge until this is done."],
    ["Should fix", "Not required to merge, but reviewers will likely ask for it."],
    ["Note", "Worth knowing. Nobody has to act on it."],
    ["Unknown", "The tool could not read what it needed, so it cannot say."],
    ["Not needed", "The check does not apply to this change."],
    ["Committer", "A project member who can merge code and run CI."],
    ["+1 vote", "A committer says “I approve this change.” Two are needed."],
    ["CI", "Continuous integration: the full automated test run."],
    ["Fix Version", "The release versions in JIRA where this fix will ship."],
    ["Blocker / major / minor", "How serious a code review finding is. Blockers and majors must be fixed."],
    ["Lens", "One automated reviewer that looks at the code for one kind of problem."],
    ["Review effort", "How much work a human review will take: easy, moderate or hard."],
    ["Lab plan", "A generated plan for trying the change on a test cluster. It is not run for you."],
    ["Diff view", "The code changes with the tool's notes beside them."]
  ];
  function renderGlossary() {
    var sec = h("section", "card");
    sec.id = "glossary";
    sec.setAttribute("aria-labelledby", "gl-h");
    var head = h("button", "cc-head row", [h("span", "tt", [h("b", null, "Words used in this report"), h("span", null, "Short explanations of project terms")]), chev(16)]);
    head.type = "button";
    head.querySelector(".tt b").id = "gl-h";
    var dl = h("dl", "gloss", GLOSSARY.map(function (g) { return h("div", null, [h("dt", null, g[0]), h("dd", null, g[1])]); }));
    append(sec, [head, dl]);
    collapsible(head, dl, false);
    return sec;
  }
  function renderFooter() {
    var tool = M.tool || {};
    var a = M.about || {};
    var inp = a.inputs || {};
    var f = h("footer", "ft");
    append(f, h("div", "line", [
      h("span", null, "Made by " + (tool.name || "cassandra-pr-review") + " " + (tool.version || "") + " on " + (M.generated_at || "")),
      h("span", null, ["Reviewed commit ", h("span", "mono", short(pr.head_sha, 7))]),
      h("span", null, "This tool only reads. It never changes GitHub or JIRA.")]));
    var body = h("div", "cc-body");
    append(body, h("div", "panel", fields([
      ["Tool", (tool.name || "") + " " + (tool.version || "")], ["Generated", M.generated_at], ["Model schema", String(M.schema)]
    ].concat(Object.keys(inp).map(function (k) {
      var v = inp[k];
      var label = k.replace(/_/g, " ");
      label = label.charAt(0).toUpperCase() + label.slice(1);
      return [label, v === null || v === undefined ? null : h("span", /sha|merge_base/.test(k) ? "mono" : null, String(v))];
    })))));
    append(body, gblock("Not checked by this tool", [list(a.not_checked || [], function (x) { return mdInline("span", x); })], (a.not_checked || []).length));
    append(body, gblock("Needs a human", [list(a.human_only || [], function (x) { return mdInline("span", x); })], (a.human_only || []).length));
    var btn = h("button", "linkbtn", [h("span", null, "About this report"), chev(14)]);
    btn.type = "button";
    btn.id = "about-toggle";
    append(f, [btn, body]);
    body.id = "about";
    collapsible(btn, body, false);
    return f;
  }

  // -------------------------------------------------------------------------
  // Build the page
  // -------------------------------------------------------------------------
  document.title = "PR #" + pr.number + ": " + (pr.title || "") + " — Cassandra PR review";
  append(document.getElementById("nav-pr"), (function () { var a = link(pr.url, "PR #" + pr.number, "nav-pr"); return a; })());
  append(document.getElementById("nav-pill"), h("span", "chip pill s-" + vKind, verdict.headline));

  renderHeader();
  var mainEl = document.getElementById("main");
  var renderers = [renderStatus, renderChecks, renderFindings, renderBackground, renderGlossary];
  renderers.forEach(function (fn) {
    try { mainEl.appendChild(fn()); } catch (e) {
      if (typeof console !== "undefined") console.error(e);
      mainEl.appendChild(h("div", "notice s-fail", [h("strong", null, "A section failed to render. "), String(e && e.message || e)]));
    }
  });
  mainEl.appendChild(renderFooter());

  // -------------------------------------------------------------------------
  // Navigation: grouped links with status icons
  // -------------------------------------------------------------------------
  var navLinks = {};
  var navOrder = [];
  function navItem(id, label, href, kind, count) {
    var a = h("a", "nav-link");
    a.href = href;
    var mark;
    if (kind) {
      mark = svg(kind, 14, 3.2, wordOfKind(kind));
      mark.setAttribute("class", "nav-ic nav-" + kind);
    } else mark = h("span", "nav-dot", h("i"));
    append(a, [mark, h("span", "lbl", label), count ? h("span", "cnt", String(count)) : null]);
    navLinks[id] = a;
    navOrder.push({ id: id, el: null, href: href });
    return a;
  }
  var navBody = document.getElementById("nav-body");
  function navGroup(label, items) {
    navBody.appendChild(h("div", "nav-group", [h("div", "eyebrow", label)].concat(items)));
  }
  var todoMust = (V.todo && V.todo.must_count) || 0;
  navGroup("Overview", [navItem("status", "Status", "#status"), navItem("next", "To do", "#next", null, todoMust || "")]);
  navGroup("Checks", (V.groups || []).map(function (g) {
    var n = g.is_review ? ((M.review || {}).issues || []).length : ((sectionById[g.id] || {}).checks || []).length;
    return navItem("g-" + g.id, g.title, g.is_review ? "#findings" : "#sec-" + g.id, kindOfWord(g.word), g.is_review && (M.review || {}).status !== "ran" ? "" : n);
  }));
  navGroup("Background", [
    navItem("bg-effort", "Review effort", "#bg-effort", null, (M.triage || {}).rating ? (M.triage.rating.charAt(0).toUpperCase() + M.triage.rating.slice(1)) : ""),
    navItem("bg-people", "Who knows this code", "#bg-people"),
    navItem("bg-history", "History", "#bg-history"),
    navItem("changes", "Files changed", "#changes", null, (M.files || []).length),
    navItem("labplan", "Lab plan", "#labplan")
  ]);
  navGroup("Help", [navItem("glossary", "Words used here", "#glossary")]);
  var foot = h("div", "nav-foot", [h("span", null, "Made " + (M.generated_at || "")), h("span", null, ["Commit ", h("span", "mono", short(pr.head_sha, 7))])]);
  navBody.appendChild(foot);
  navOrder.forEach(function (n) { n.el = document.getElementById(n.href.slice(1)); });
  navOrder = navOrder.filter(function (n) { return n.el; });

  // Narrow screens: the nav is a top bar; the Sections button shows or hides its list.
  var navEl = document.getElementById("nav");
  var navToggle = document.getElementById("nav-toggle");
  navToggle.addEventListener("click", function () {
    var on = !navEl.classList.contains("open");
    navEl.classList.toggle("open", on);
    navToggle.setAttribute("aria-expanded", on ? "true" : "false");
  });
  function closeNav() {
    navEl.classList.remove("open");
    navToggle.setAttribute("aria-expanded", "false");
  }

  // -------------------------------------------------------------------------
  // Deep links (D3). A hash opens its target and everything around it.
  // -------------------------------------------------------------------------
  var LEGACY = { summary: "status", review: "findings", triage: "bg-effort", context: "bg-people", about: "about",
    ticket: "sec-ticket", ci: "sec-ci", testing: "sec-testing", build: "sec-build", commits: "sec-commits", static: "sec-static",
    compatibility: "sec-compatibility", votes: "sec-votes", labplan: "labplan", changes: "changes" };
  var spyLockUntil = 0;
  function setActive(id) {
    Object.keys(navLinks).forEach(function (k) {
      if (k === id) navLinks[k].setAttribute("aria-current", "location"); else navLinks[k].removeAttribute("aria-current");
    });
  }
  function keyForHref(href) {
    var key = null;
    Object.keys(navLinks).forEach(function (k) { if (navLinks[k].getAttribute("href") === href) key = k; });
    return key;
  }
  function go(raw) {
    var id = decodeURIComponent(String(raw || "").replace(/^#/, ""));
    if (!id) return;
    if (!document.getElementById(id) && LEGACY[id]) id = LEGACY[id];
    var el = document.getElementById(id);
    if (!el) return;
    openAncestors(el);
    if (el._ctl) el._ctl.set(true);
    var own = el.matches(".group, .bg-card, #glossary, #next") ? el.querySelector(":scope > .cbody") : null; // a group, the lab plan, the glossary or the To do panel
    if (own && own._ctl) own._ctl.set(true);
    if (id === "changes") openDiff();
    el.scrollIntoView({ block: "start" });
    if (el.tagName === "LI") { el.classList.add("ck-flash"); setTimeout(function () { el.classList.remove("ck-flash"); }, 1600); }
    var hit = null;
    navOrder.forEach(function (n) { if (n.el === el || n.el.contains(el)) hit = n; });
    var key = hit && keyForHref(hit.href);
    if (key) { spyLockUntil = Date.now() + 800; setActive(key); }
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a || a.getAttribute("href") === "#") return;
    ev.preventDefault();
    var href = a.getAttribute("href");
    closeNav();
    try { if (location.hash !== href) history.pushState(null, "", href); } catch (e) { location.hash = href; return; }
    go(href);
  });
  window.addEventListener("hashchange", function () { go(location.hash); });

  // Scroll-spy: highlight the last target whose top has passed 30% of the viewport.
  function spy() {
    if (Date.now() < spyLockUntil) return;
    var line = window.innerHeight * 0.3, cur = navOrder.length ? navOrder[0] : null;
    navOrder.forEach(function (n) { if (n.el.getBoundingClientRect().top <= line) cur = n; });
    // At the very bottom the last items can never reach the line; the last one is current then.
    if (navOrder.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) cur = navOrder[navOrder.length - 1];
    if (!cur) return;
    var key = keyForHref(cur.href);
    if (key) setActive(key);
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function () { spy(); }, { rootMargin: "0px 0px -70% 0px", threshold: [0, 1] });
    navOrder.forEach(function (n) { io.observe(n.el); });
  }
  window.addEventListener("scroll", function () { if (Date.now() >= spyLockUntil) spy(); }, { passive: true });
  setActive("status");
  if (location.hash && location.hash.length > 1) go(location.hash); else spy();

  // Print: open every <details> while printing, then restore.
  var reopened = [];
  window.addEventListener("beforeprint", function () {
    reopened = Array.prototype.filter.call(document.querySelectorAll("details:not([open])"), function (d) { d.open = true; return true; });
  });
  window.addEventListener("afterprint", function () {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  });
})();
</script>
</body>
