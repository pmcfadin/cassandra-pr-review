// cpr's own Gradle init script (trusted: it ships with cpr, never with the PR). `cpr build` passes it with -I.
//
// cprResolve    resolve every resolvable configuration of every project (the networked step at the merge-base)
// cprProjects   write build/cpr/projects.tsv: one "<project path>\t<dir relative to the root>\t<java|->" line per project
// cprClasspath  write build/cpr/classpath/<project path>.txt: the main and test runtime classpath, one file per line
//
// JaCoCo is applied to every Java project with an XML report, and every Test task is finalized by it. That is wired
// after each project's own build script, so it never touches a configuration the script still edits.
allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('java')) {
            p.pluginManager.apply('jacoco')
            p.tasks.withType(JacocoReport).configureEach { r -> r.reports.xml.required = true }
            p.tasks.withType(Test).configureEach { t -> t.finalizedBy(p.tasks.named('jacocoTestReport')) }
        }
    }
    p.tasks.register('cprResolve') {
        doLast {
            p.configurations.findAll { it.canBeResolved }.each { c ->
                try {
                    c.incoming.artifactView { lenient = true }.files.files
                } catch (e) {
                    println "cprResolve: ${p.path}:${c.name}: ${e.message}"
                }
            }
        }
    }
    p.tasks.register('cprClasspath') {
        doLast {
            def sets = p.extensions.findByName('sourceSets')
            if (sets == null) {
                return
            }
            def files = [] as LinkedHashSet
            ['main', 'test'].each { name ->
                def s = sets.findByName(name)
                if (s != null) {
                    try {
                        files.addAll(s.runtimeClasspath.files)
                    } catch (e) {
                        println "cprClasspath: ${p.path}:${name}: ${e.message}"
                    }
                }
            }
            def out = p.rootProject.file("build/cpr/classpath/${p.path == ':' ? 'root' : p.path.substring(1).replace(':', '.')}.txt")
            out.parentFile.mkdirs()
            out.text = files.collect { it.absolutePath }.join('\n') + '\n'
        }
    }
}

rootProject { r ->
    r.tasks.register('cprProjects') {
        doLast {
            def out = r.file('build/cpr/projects.tsv')
            out.parentFile.mkdirs()
            out.text = r.allprojects.collect {
                "${it.path}\t${r.relativePath(it.projectDir)}\t${it.plugins.hasPlugin('java') ? 'java' : '-'}"
            }.join('\n') + '\n'
        }
    }
}
