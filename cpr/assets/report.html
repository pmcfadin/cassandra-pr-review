<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cassandra PR review</title>
<style>
/*REPORT_FONTS*/
/* ---------------------------------------------------------------------------
   Tokens. Light is the default; dark follows the system unless the reader
   picked light, and is forced when the reader picked dark. The look is an
   inspection sheet: navy ink, a dark navigation rail, and status colours that
   differ in lightness as well as hue (teal, ochre, vermilion).
   --------------------------------------------------------------------------- */
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --panel-2: #f7f9fb;
  --ink: #0f2236;
  --ink-2: #34445a;
  --ink-3: #56657a;
  --rule: #d9dee5;
  --rule-strong: #c2cbd6;
  --accent: #0b5cad;
  --accent-soft: #e6eef8;
  --focus: #0b5cad;
  --self-row: #eef4fb;

  --pass: #00695f; --pass-bg: #e3f4f1;
  --warn: #7a5600; --warn-bg: #fbf3dc;
  --fail: #b02f09; --fail-bg: #fdede6;
  --unknown: #5c4799; --unknown-bg: #ebe6f6;
  --info: #0b5cad; --info-bg: #e6eef8;
  --na: #5f6b7a; --na-bg: #eef1f5;

  /* The navigation rail is dark in both themes. */
  --nav-bg: #0f2236; --nav-ink: #d3ddea; --nav-ink-3: #9db0c7; --nav-hover: #172e48; --nav-active: #1f3a5c; --nav-rule: #22364b;

  --mono: "Red Hat Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Red Hat Text", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 4px;
  --nav-w: 264px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1724; --panel: #12202f; --panel-2: #172a3d;
    --ink: #e4ebf3; --ink-2: #aebccc; --ink-3: #8597ab;
    --rule: #22364b; --rule-strong: #2f4760;
    --accent: #7db3ec; --accent-soft: #15304a; --focus: #7db3ec;
    --self-row: #15304a;
    --pass: #4fd1c0; --pass-bg: #0e2e2b;
    --warn: #f2c14e; --warn-bg: #2e2410;
    --fail: #ff8a5c; --fail-bg: #3a1a10;
    --unknown: #b8a5f3; --unknown-bg: #241d3b;
    --info: #7db3ec; --info-bg: #132b44;
    --na: #95a3b3; --na-bg: #1a2838;
    --nav-bg: #07111c; --nav-hover: #10233a; --nav-active: #183552; --nav-rule: #1a2c40;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1724; --panel: #12202f; --panel-2: #172a3d;
  --ink: #e4ebf3; --ink-2: #aebccc; --ink-3: #8597ab;
  --rule: #22364b; --rule-strong: #2f4760;
  --accent: #7db3ec; --accent-soft: #15304a; --focus: #7db3ec;
  --self-row: #15304a;
  --pass: #4fd1c0; --pass-bg: #0e2e2b;
  --warn: #f2c14e; --warn-bg: #2e2410;
  --fail: #ff8a5c; --fail-bg: #3a1a10;
  --unknown: #b8a5f3; --unknown-bg: #241d3b;
  --info: #7db3ec; --info-bg: #132b44;
  --na: #95a3b3; --na-bg: #1a2838;
  --nav-bg: #07111c; --nav-hover: #10233a; --nav-active: #183552; --nav-rule: #1a2c40;
}

/* ---------------------------------------------------------------------------
   Base
   --------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  font-feature-settings: "tnum" 1;
}
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--panel-2); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
pre code { background: none; border: 0; padding: 0; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
p { margin: 6px 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.muted { color: var(--ink-3); }
.eyebrow { font: 600 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------------------------------------------------------------------------
   Shell: nav + main
   --------------------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh;
  background: linear-gradient(90deg, var(--nav-bg) calc(var(--nav-w) - 1px), var(--rule) calc(var(--nav-w) - 1px), var(--rule) var(--nav-w), transparent var(--nav-w)); }
#nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--nav-bg); color: var(--nav-ink); border-right: 1px solid var(--nav-rule);
  padding: 20px 12px 18px 14px; display: flex; flex-direction: column; gap: 16px;
  /* Status colours tuned for the dark rail, in both themes. */
  --pass: #4fd1c0; --pass-bg: #0e2e2b; --warn: #f2c14e; --warn-bg: #2e2410; --fail: #ff8a5c; --fail-bg: #3a1a10;
  --unknown: #b8a5f3; --unknown-bg: #241d3b; --info: #7db3ec; --info-bg: #132b44; --na: #95a3b3; --na-bg: #1a2838;
  --panel: var(--nav-bg); --focus: #7db3ec;
}
#nav .eyebrow { color: var(--nav-ink-3); }
.nav-head { padding: 0 6px; }
.nav-head .pr-num { font: 700 21px/1.2 var(--sans); letter-spacing: -0.01em; margin-top: 4px; }
.nav-head .pr-num a { color: #ffffff; text-decoration: none; }
.nav-head .pr-num a:hover { text-decoration: underline; }
.nav-verdict { margin-top: 8px; }
.nav-todo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding: 8px 10px;
  border: 1px solid var(--nav-rule); border-radius: var(--radius); color: #ffffff; text-decoration: none; font-weight: 600; }
.nav-todo:hover { background: var(--nav-hover); }
.nav-todo .n { font: 700 12px/1 var(--mono); color: var(--fail); background: var(--fail-bg); padding: 3px 6px; border-radius: 3px; }
#nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
#nav li { margin: 0; }
#nav ol a {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-height: 38px;
  padding: 6px 8px 6px 10px; border-radius: var(--radius); color: var(--nav-ink); text-decoration: none;
  border-left: 3px solid transparent; font-weight: 500;
}
#nav ol a:hover { background: var(--nav-hover); color: #ffffff; }
#nav ol a[aria-current="page"] { background: var(--nav-active); color: #ffffff; border-left-color: #7db3ec; font-weight: 650; }
#nav ol a .badge { border-color: transparent; }
.nav-foot { margin-top: auto; padding: 0 6px; font-size: 12px; color: var(--nav-ink-3); }

main { min-width: 0; }
.toolbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 40px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule);
}
.toolbar .crumb { flex: 1; min-width: 0; color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .crumb strong { color: var(--ink); font-weight: 600; }
button.tool {
  font: 500 13px/1 var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--rule-strong);
  border-radius: var(--radius); padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button.tool:hover { border-color: var(--accent); }
#nav-toggle { display: none; }
.content { padding: 28px 40px 64px; max-width: 1120px; }

/* ---------------------------------------------------------------------------
   Sections
   --------------------------------------------------------------------------- */
.report-section { display: none; }
.report-section.active { display: block; }
.sec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.sec-head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.sec-head h2:focus { outline: none; }
.block { margin: 22px 0; }
.block > h3 { font-size: 15px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.block > h3 .count { font: 500 12px var(--mono); color: var(--ink-3); }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.empty { color: var(--ink-3); font-style: italic; }
.labplan-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.labplan-plan .md { overflow-x: auto; }
.lead { font-size: 15px; margin-bottom: 10px; }
.notice { border: 1px solid var(--rule-strong); border-left-width: 4px; border-radius: var(--radius); padding: 10px 14px; background: var(--panel); margin: 10px 0; }
.notice.s-fail { border-left-color: var(--fail); }
.notice.s-warn { border-left-color: var(--warn); }
.notice.s-unknown { border-left-color: var(--unknown); }
.notice.s-info { border-left-color: var(--info); }

/* Status badge: color is never the only signal; each badge carries a glyph and a word. */
.badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 600 11.5px/1 var(--mono); letter-spacing: 0.02em; padding: 3px 7px 3px 4px; border-radius: 3px;
  color: var(--c); background: var(--cb); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
}
.badge .g { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
  background: var(--c); color: var(--panel); font: 800 10px/1 var(--sans); }
.s-pass { --c: var(--pass); --cb: var(--pass-bg); }
.s-warn { --c: var(--warn); --cb: var(--warn-bg); }
.s-fail { --c: var(--fail); --cb: var(--fail-bg); }
.s-unknown { --c: var(--unknown); --cb: var(--unknown-bg); }
.s-info { --c: var(--info); --cb: var(--info-bg); }
.s-not-applicable { --c: var(--na); --cb: var(--na-bg); }
.tag { display: inline-block; font: 600 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 3px; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap; }
.tag.blocking { color: var(--ink); border-color: var(--ink); background: var(--panel); }
.tag.owner { border-style: dashed; }

/* ---------------------------------------------------------------------------
   Summary
   --------------------------------------------------------------------------- */
.pr-head .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--ink-3); font-size: 14px; }
.pr-head .meta-row > span { white-space: nowrap; }
.pr-head h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; margin: 6px 0 0; max-width: 60ch; overflow-wrap: anywhere; }
.pr-head h1 a { color: var(--ink); text-decoration: none; }
.pr-head h1 a:hover { text-decoration: underline; }

/* Next step / Fix: the action a reader takes, used by check cards, issues, and to-do items. */
.next { margin-top: 6px; background: var(--panel-2); border-radius: var(--radius); padding: 8px 11px; border: 1px solid var(--rule); color: var(--ink); }
.next .lead { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink); margin-right: 8px; }

/* Status card: verdict + one sentence + merge steps, then the collapsed To do bar. */
.verdict { margin-top: 20px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.verdict .v-main { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 18px 22px; }
.verdict .v-head { display: flex; align-items: center; gap: 14px; flex: 1 1 340px; min-width: 0; }
.verdict .v-glyph { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: var(--cb); color: var(--c); font-size: 22px; font-weight: 800; }
.verdict .v-text { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; color: var(--ink); }
.verdict .v-note { margin: 2px 0 0; font-size: 16px; color: var(--ink-2); }
.verdict .review-headline { margin: 2px 0 0; font-size: 14px; color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
.steps li { margin: 0; }
.steps a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; min-height: 32px; border-radius: 3px;
  font-size: 14px; font-weight: 600; text-decoration: none; color: var(--c); background: var(--cb); }
.steps a:hover { box-shadow: inset 0 0 0 1px var(--c); }
.steps .sg { font-weight: 800; }

details.todo { scroll-margin-top: 64px; border: 0; border-top: 1px solid var(--rule); border-radius: 0; margin: 0; background: var(--panel-2); }
details.todo > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 22px; min-height: 48px;
  list-style: none; font-weight: 400; font-size: 15px; }
details.todo > summary::-webkit-details-marker { display: none; }
details.todo > summary .t-title { font-weight: 700; }
details.todo > summary .t-owner { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
details.todo > summary .t-n { min-width: 22px; text-align: center; font: 700 12.5px/1 var(--mono); color: var(--fail); background: var(--fail-bg);
  padding: 4px 6px; border-radius: 3px; }
details.todo > summary .t-toggle { margin-left: auto; color: var(--accent); font-size: 14px; font-weight: 600; }
details.todo > summary .t-toggle::after { content: "Show"; }
details.todo[open] > summary .t-toggle::after { content: "Hide"; }
details.todo[open] > summary { border-bottom: 1px solid var(--rule); }
details.todo > .d-body { padding: 0; background: var(--panel); }
.todo-group { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.todo-group:last-child { border-bottom: 0; }
.todo-group > h3 { flex: 0 0 150px; padding: 14px 22px; font-size: 15px; font-weight: 700; }
.todo-group > ul { list-style: none; margin: 0; padding: 0; flex: 1 1 360px; min-width: 0; }
.todo-group li { margin: 0; }
details.todo-item { border: 0; border-radius: 0; margin: 0; background: none; }
details.todo-item > summary { display: flex; align-items: center; gap: 10px; padding: 10px 22px 10px 0; min-height: 44px; font-weight: 500; font-size: 15px; list-style: none; }
details.todo-item > summary::-webkit-details-marker { display: none; }
details.todo-item > summary::after { content: "▾"; margin-left: auto; color: var(--ink-3); }
details.todo-item[open] > summary::after { content: "▴"; }
details.todo-item[open] > summary { border: 0; }
details.todo-item > .d-body { padding: 0 22px 14px 25px; color: var(--ink-2); }
details.todo-item > .d-body > p { margin: 0 0 6px; }
.todo-item .ti-g { flex: none; font-weight: 800; color: var(--c); width: 15px; text-align: center; }
.todo-more { display: block; width: 100%; text-align: left; padding: 12px 22px; min-height: 44px; border: 0; border-top: 1px solid var(--rule);
  background: var(--panel-2); color: var(--accent); font: 600 14px/1.3 var(--sans); cursor: pointer; }
.todo-optional[hidden] { display: none; }
.todo-empty { padding: 14px 22px; margin: 0; color: var(--ink-2); }

.summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 22px; align-items: start; }
.summary-cards .panel { display: flex; flex-direction: column; gap: 8px; }
.reviewers-card ul { margin: 0; padding-left: 18px; }
.reviewers-card li { margin: 4px 0; }
.panel.expert { margin: 0 0 10px; }
.panel.expert ul { margin: 6px 0 0; padding-left: 18px; }
.triage-card .rating { font-size: 20px; font-weight: 700; text-transform: capitalize; }
.triage-card .pts { font: 500 12.5px var(--mono); color: var(--ink-3); margin-left: 6px; }
.triage-card .why { margin: 0; color: var(--ink-2); font-size: 14px; }
.summary-more { margin-top: 22px; }
.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 28px; margin: 0; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--ink-2); }

/* The gate matrix: every check, grouped by section, one row each. */
.matrix { display: flex; flex-direction: column; gap: 12px; }
.matrix-group h4 { font: 600 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px; }
.matrix-group ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.matrix-group li { margin: 0; }
.gate { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: 13.5px; line-height: 1.3; }
.gate:hover { border-color: var(--c); }
.gate.blocking { box-shadow: inset 3px 0 0 var(--ink); }
.gate .gk { font: 600 10px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.gate.blocking .gk { color: var(--ink); }
.gate .badge { padding: 2px; }
.gate .badge .w { display: none; }

/* ---------------------------------------------------------------------------
   Checks
   --------------------------------------------------------------------------- */
.checks { display: flex; flex-direction: column; gap: 10px; }
.check { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: var(--radius); padding: 12px 14px; scroll-margin-top: 70px; }
.check.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.check-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.check-head .ct { font-weight: 650; font-size: 15px; }
.check-head .cid { font: 12px var(--mono); color: var(--ink-3); }
.check-head .spacer { flex: 1; }
.check .csum { margin: 6px 0 0; }
.evidence { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.check .next { margin-top: 10px; }

/* ---------------------------------------------------------------------------
   Tables, field lists, details
   --------------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 11px/1.3 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); background: var(--panel-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
.nowrap { white-space: nowrap; }
tr.self td { background: var(--self-row); }
tr.self td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.add { color: var(--pass); } .del { color: var(--fail); }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: 13px; }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); margin: 8px 0; }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; font-size: 13.5px; list-style-position: inside; }
details > summary:hover { background: var(--panel-2); }
details[open] > summary { border-bottom: 1px solid var(--rule); }
details > .d-body { padding: 10px 14px; }
details.inline { border: 0; background: none; margin: 0; }
details.inline > summary { padding: 0; font-weight: 500; color: var(--accent); }
details.inline[open] > summary { border: 0; }
details.inline > .d-body { padding: 6px 0 0; }
details.howto > summary { color: var(--ink-2); }
details.howto > summary::after { content: " — scoring rules and sources"; font-weight: 400; color: var(--ink-3); }
.comment { border-top: 1px solid var(--rule); padding: 10px 0; }
.comment:first-child { border-top: 0; padding-top: 0; }
.comment .who { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }

/* Markdown output */
.md h1 { font-size: 19px; margin: 14px 0 8px; } .md h2 { font-size: 16px; margin: 14px 0 6px; }
.md h3, .md h4, .md h5, .md h6 { font-size: 14px; margin: 12px 0 4px; }
.md > :first-child { margin-top: 0; }
.md table { margin: 8px 0; border: 1px solid var(--rule); }

/* Changes */
.diff-frame { display: block; width: 100%; height: calc(100vh - 190px); min-height: 480px; border: 1px solid var(--rule-strong); border-radius: var(--radius); background: #fff; }
.print-only { display: none; }

/* Missing-data banner */
#no-data { display: none; margin: 40px auto; max-width: 640px; padding: 20px 24px; border: 2px solid var(--fail); border-radius: var(--radius); background: var(--panel); }
#no-data h1 { font-size: 20px; color: var(--fail); margin-bottom: 8px; }
body.no-data .shell { display: none; }
body.no-data #no-data { display: block; }

/* ---------------------------------------------------------------------------
   Narrow screens: nav slides in from the left behind a toggle.
   --------------------------------------------------------------------------- */
@media (max-width: 799.98px) {
  .shell { grid-template-columns: minmax(0, 1fr); background: none; }
  .verdict .v-main { padding: 16px; }
  details.todo > summary, .todo-more { padding-left: 16px; padding-right: 16px; }
  .todo-group > h3 { flex-basis: 100%; padding: 12px 16px 0; }
  details.todo-item > summary { padding-left: 16px; }
  details.todo-item > .d-body { padding-left: 41px; }
  #nav {
    position: fixed; z-index: 20; left: 0; top: 0; width: min(300px, 86vw); height: 100vh;
    transform: translateX(-100%); visibility: hidden; transition: transform 0.18s ease, visibility 0s linear 0.18s;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }
  body.nav-open #nav { transform: none; visibility: visible; transition: transform 0.18s ease; }
  #nav-scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,0.35); }
  #nav-toggle { display: inline-flex; }
  .toolbar { padding: 8px 16px; }
  .content { padding: 18px 16px 48px; }
  .verdict .v-text { font-size: 22px; }
  dl.fields { grid-template-columns: 1fr; gap: 0; }
  dl.fields dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { #nav { transition: none !important; } }

/* ---------------------------------------------------------------------------
   Print: every section in order, no navigation, panels expanded.
   --------------------------------------------------------------------------- */
@media print {
  :root { --bg: #fff; --panel: #fff; --panel-2: #f5f5f5; --nav-bg: #fff; }
  body { background: #fff; font-size: 11.5pt; }
  #nav, #nav-scrim, .toolbar, .no-print, .diff-frame, details > summary::marker { display: none !important; }
  .shell { display: block; background: none; }
  .content { padding: 0; max-width: none; }
  .report-section { display: block !important; break-before: page; }
  .report-section:first-child { break-before: auto; }
  .print-only { display: block; }
  .todo-optional[hidden] { display: block; }
  .todo-more, details.todo > summary .t-toggle { display: none; }
  details::details-content { content-visibility: visible; display: block; }
  details > summary { padding: 4px 0; }
  .check, .gate, .verdict, tr { break-inside: avoid; }
  a { color: inherit; }
  .table-wrap { overflow: visible; }
}
</style>
</head>
<body>
<div id="no-data" role="alert">
  <h1>No report data</h1>
  <p>This page is the report template without a report model, or the model failed to load. Generate a report with <code>cpr review &lt;PR number&gt;</code> and open the file it prints.</p>
</div>
<div class="shell">
  <nav id="nav" aria-label="Report sections">
    <div class="nav-head">
      <div class="eyebrow">apache/cassandra review</div>
      <div class="pr-num" id="nav-pr"></div>
      <div class="nav-verdict" id="nav-verdict"></div>
      <div id="nav-todo-slot"></div>
    </div>
    <ol id="nav-list"></ol>
    <div class="nav-foot" id="nav-foot"></div>
  </nav>
  <main id="main">
    <div class="toolbar">
      <button type="button" class="tool" id="nav-toggle" aria-controls="nav" aria-expanded="false"><span aria-hidden="true">&#9776;</span> Sections</button>
      <div class="crumb" id="crumb"></div>
      <button type="button" class="tool" id="theme-toggle" title="Switch colour theme">Theme: system</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<!--REPORT_MODEL-->
<script>
(function () {
  "use strict";

  // -------------------------------------------------------------------------
  // Escaping and links. Everything from the model is untrusted text.
  // -------------------------------------------------------------------------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // http(s)/mailto, or no explicit scheme. Normalise the way a browser URL parser does first, so
  // "\x01javascript:" or "java\tscript:" cannot pass as scheme-less.
  function isSafeLinkUrl(url) {
    if (url === null || url === undefined) return false;
    var normalized = String(url)
      .replace(/^[\x00-\x20]+|[\x00-\x20]+$/g, "")
      .replace(/[\t\n\r]/g, "");
    if (!normalized) return false;
    if (/^(https?:|mailto:)/i.test(normalized)) return true;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(normalized)) return false;
    return true;
  }

  // -------------------------------------------------------------------------
  // Markdown: headings, lists, fenced code, inline code, bold/italic, links,
  // pipe tables. Input is escaped first; only our own tags are added.
  // -------------------------------------------------------------------------
  function inlineMD(text) {
    var s = escapeHtml(text);
    var stash = [];
    function keep(html) { stash.push(html); return "\u0001" + (stash.length - 1) + "\u0002"; }
    s = s.replace(/\u0001|\u0002/g, "");
    s = s.replace(/`([^`]+)`/g, function (m, p1) { return keep("<code>" + p1 + "</code>"); });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
      if (!isSafeLinkUrl(url)) return label + " (" + url + ")";
      return keep('<a href="' + url + '" target="_blank" rel="noopener noreferrer">') + label + keep("</a>");
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w])__([^_]+)__(?=[^\w]|$)/g, "$1<strong>$2</strong>");
    s = s.replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?=[^\w*]|$)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\s][^_]*)_(?=[^\w]|$)/g, "$1<em>$2</em>");
    s = s.replace(/\u0001(\d+)\u0002/g, function (m, i) { return stash[Number(i)]; });
    return s;
  }

  function splitTableRow(line) {
    var t = line.trim();
    if (t.charAt(0) === "|") t = t.slice(1);
    if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1);
    return t.split("|").map(function (c) { return c.trim(); });
  }

  var TABLE_SEP_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  var HEADING_RE = /^(#{1,6})\s+(.*)$/;
  var UL_RE = /^\s*[-*+]\s+(.*)$/;
  var OL_RE = /^\s*\d+[.)]\s+(.*)$/;
  var FENCE_RE = /^\s*(```|~~~)(.*)$/;

  function renderMarkdown(src) {
    var lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
    var html = "";
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(FENCE_RE);
      if (fence) {
        var mark = fence[1], code = [];
        i++;
        while (i < lines.length && lines[i].trim().indexOf(mark) !== 0) { code.push(lines[i]); i++; }
        i++;
        html += "<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>";
        continue;
      }
      var heading = line.match(HEADING_RE);
      if (heading) {
        var level = Math.min(6, heading[1].length + 2); // nest under the section's h2/h3
        html += "<h" + level + ">" + inlineMD(heading[2]) + "</h" + level + ">";
        i++;
        continue;
      }
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && TABLE_SEP_RE.test(lines[i + 1])) {
        var head = splitTableRow(line), rows = [];
        i += 2;
        while (i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) { rows.push(splitTableRow(lines[i])); i++; }
        html += '<div class="table-wrap"><table><thead><tr>' +
          head.map(function (c) { return "<th>" + inlineMD(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inlineMD(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
          "</tbody></table></div>";
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      if (UL_RE.test(line) || OL_RE.test(line)) {
        var ordered = !UL_RE.test(line), re = ordered ? OL_RE : UL_RE, items = [];
        while (i < lines.length && re.test(lines[i])) { items.push(lines[i].replace(re, "$1")); i++; }
        var tag = ordered ? "ol" : "ul";
        html += "<" + tag + ">" + items.map(function (it) { return "<li>" + inlineMD(it) + "</li>"; }).join("") + "</" + tag + ">";
        continue;
      }
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !HEADING_RE.test(lines[i]) &&
             !UL_RE.test(lines[i]) && !OL_RE.test(lines[i]) && !FENCE_RE.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      html += "<p>" + para.map(inlineMD).join("<br>") + "</p>";
    }
    return html;
  }

  // -------------------------------------------------------------------------
  // DOM helpers. Text always goes in through textContent.
  // -------------------------------------------------------------------------
  function h(tag, cls, children) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    append(e, children);
    return e;
  }
  function append(e, children) {
    if (children === null || children === undefined || children === false) return e;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) { append(e, c); return; }
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    });
    return e;
  }
  function trustedHtml(tag, cls, html) { // only for output of inlineMD/renderMarkdown, which escape
    var e = h(tag, cls);
    e.innerHTML = html;
    return e;
  }
  function md(src) { return trustedHtml("div", "md", renderMarkdown(src)); }
  function mdInline(tag, src, cls) { return trustedHtml(tag || "span", cls, inlineMD(src)); }
  function link(url, text, cls) {
    if (!isSafeLinkUrl(url)) return h("span", cls, text);
    var a = h("a", cls, text);
    a.href = String(url);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }
  function short(sha, n) { return sha ? String(sha).slice(0, n || 10) : ""; }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function details(title, body, opts) {
    var d = h("details", (opts && opts.cls) || null);
    if (opts && opts.open) d.open = true;
    append(d, h("summary", null, title));
    append(d, h("div", "d-body", body));
    return d;
  }
  function block(title, children, count) {
    return h("div", "block", [h("h3", null, [title, count !== undefined ? h("span", "count", String(count)) : null])].concat(children));
  }
  function table(headers, rows, opts) {
    var t = h("table");
    var tr = h("tr");
    headers.forEach(function (hd) {
      var th = h("th", /^(\+|−|Passed|Failed|Total|Points|Lines|Size)/.test(hd) ? "num" : null, hd);
      th.scope = "col";
      tr.appendChild(th);
    });
    append(t, h("thead", null, tr));
    var tb = h("tbody");
    rows.forEach(function (r) {
      var row = h("tr", r.cls || null);
      r.cells.forEach(function (c) {
        var td = h("td", c && c.num ? "num" : null);
        append(td, c && c.node !== undefined ? c.node : c);
        row.appendChild(td);
      });
      tb.appendChild(row);
    });
    t.appendChild(tb);
    return h("div", "table-wrap" + ((opts && opts.cls) ? " " + opts.cls : ""), t);
  }
  function fields(pairs) {
    var dl = h("dl", "fields");
    pairs.forEach(function (p) {
      if (!p) return;
      dl.appendChild(h("dt", null, p[0]));
      var v = p[1];
      dl.appendChild(h("dd", null, (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) ? h("span", "muted", "not set") : v));
    });
    return dl;
  }
  function list(items, render) {
    var ul = h("ul");
    items.forEach(function (it) { ul.appendChild(h("li", null, render(it))); });
    return ul;
  }
  function empty(text) { return h("p", "empty", text); }

  var STATUS = {
    "pass": { g: "✓", w: "Pass" },
    "warn": { g: "!", w: "Warning" },
    "fail": { g: "✕", w: "Fail" },
    "unknown": { g: "?", w: "Unknown" },
    "info": { g: "i", w: "Info" },
    "not-applicable": { g: "–", w: "N/A" }
  };
  function st(s) { return STATUS[s] ? s : "unknown"; }
  function badge(status, label) {
    var s = st(status);
    var b = h("span", "badge s-" + s, [h("span", "g", STATUS[s].g), h("span", "w", label || STATUS[s].w)]);
    b.lastChild.previousSibling.setAttribute("aria-hidden", "true");
    b.title = STATUS[s].w;
    return b;
  }
  function ownerLabel(o) { return o ? o.charAt(0).toUpperCase() + o.slice(1) : "Unassigned"; }
  function kindTag(blocking) { return h("span", "tag" + (blocking ? " blocking" : ""), blocking ? "Blocking" : "Advisory"); }

  // -------------------------------------------------------------------------
  // Model
  // -------------------------------------------------------------------------
  var M = window.REPORT_MODEL;
  if (!M || typeof M !== "object" || !Array.isArray(M.sections)) {
    document.body.classList.add("no-data");
    if (typeof console !== "undefined") console.error("report: window.REPORT_MODEL is missing or malformed");
    return;
  }

  var pr = M.pr || {};
  var checks = Array.isArray(M.checks) ? M.checks : [];
  var checkById = {};
  checks.forEach(function (c) { checkById[c.id] = c; });
  var sectionOfCheck = {};
  M.sections.forEach(function (s) { (s.checks || []).forEach(function (id) { sectionOfCheck[id] = s.id; }); });
  var sectionIds = M.sections.map(function (s) { return s.id; });
  var sectionById = {};
  M.sections.forEach(function (s) { sectionById[s.id] = s; });

  // Path classification, mirroring cpr/paths.py.
  var TEST_SUITES = [
    ["test/unit/", "Unit (test/unit)"], ["test/distributed/", "In-JVM dtest (test/distributed)"],
    ["test/burn/", "Burn (test/burn)"], ["test/long/", "Long (test/long)"],
    ["test/microbench/", "Microbench (test/microbench)"], ["test/simulator/", "Simulator (test/simulator)"],
    ["test/harry/", "Harry (test/harry)"], ["test/memory/", "Memory (test/memory)"],
    ["test/anttasks/", "Ant tasks (test/anttasks)"], ["pylib/cqlshlib/test/", "cqlsh (pylib/cqlshlib/test)"]
  ];
  function isTest(p) { return p.indexOf("test/") === 0 || p.indexOf("/test/") !== -1; }
  function testSuite(p) {
    for (var i = 0; i < TEST_SUITES.length; i++) if (p.indexOf(TEST_SUITES[i][0]) === 0) return TEST_SUITES[i][1];
    return isTest(p) ? "Other tests" : null;
  }
  function fileLines(f) { return (Number(f.additions) || 0) + (Number(f.deletions) || 0); }

  function prCommitUrl(sha) {
    return pr.url && isSafeLinkUrl(pr.url) ? String(pr.url).replace(/\/+$/, "") + "/commits/" + encodeURIComponent(sha) : null;
  }
  function ghUser(login) { return login ? "https://github.com/" + encodeURIComponent(login) : null; }
  function ghTree(repo, ref) {
    if (!repo || !ref) return null;
    return "https://github.com/" + String(repo).split("/").map(encodeURIComponent).join("/") + "/tree/" + String(ref).split("/").map(encodeURIComponent).join("/");
  }

  // -------------------------------------------------------------------------
  // Check cards
  // -------------------------------------------------------------------------
  function nextStep(action, owner) {
    return h("div", "next", [h("span", "lead", "Next step"), mdInline("span", action), " ",
      h("span", "tag owner", "Who acts: " + ownerLabel(owner))]);
  }
  function checkCard(c) {
    var card = h("article", "check s-" + st(c.status));
    card.id = "check-" + c.id;
    append(card, h("div", "check-head", [badge(c.status), h("span", "ct", c.title || c.id), h("span", "cid", c.id),
      h("span", "spacer"), kindTag(c.blocking), h("span", "tag owner", "Owner: " + ownerLabel(c.owner))]));
    if (c.summary) append(card, mdInline("p", c.summary, "csum"));
    var ev = Array.isArray(c.evidence) ? c.evidence : [];
    if (ev.length) {
      var ul = h("ul", "evidence");
      ev.forEach(function (e) {
        var li = h("li");
        if (e && e.url && isSafeLinkUrl(e.url)) {
          var a = trustedHtml("a", null, inlineMD(e.text || e.url));
          a.href = String(e.url); a.target = "_blank"; a.rel = "noopener noreferrer";
          li.appendChild(a);
        } else {
          li.appendChild(mdInline("span", (e && e.text) || ""));
          if (e && e.url) append(li, [" ", h("span", "muted", "(" + e.url + ")")]);
        }
        ul.appendChild(li);
      });
      append(card, ul);
    }
    if (c.action) append(card, nextStep(c.action, c.owner));
    return card;
  }
  function checksBlock(sec) {
    var ids = sec.checks || [];
    if (!ids.length) return null;
    var cs = ids.map(function (id) { return checkById[id]; }).filter(Boolean);
    var order = { "fail": 0, "unknown": 1, "warn": 2, "pass": 3, "not-applicable": 4 };
    cs.sort(function (a, b) { return (order[a.status] - order[b.status]) || ((b.blocking ? 1 : 0) - (a.blocking ? 1 : 0)); });
    return block("Checks", [h("div", "checks", cs.map(checkCard))], cs.length);
  }
  function docsBlock(sec) {
    var aspects = sec.docs || [];
    if (!aspects.length) return null;
    return h("div", "block", aspects.map(function (a) {
      var doc = (M.docs || {})[a];
      var title = aspects.length > 1 ? "How this is judged: " + a : "How this is judged";
      return details(title, doc ? md(doc) : empty("No document for " + a + "."), { cls: "howto" });
    }));
  }

  // -------------------------------------------------------------------------
  // Files
  // -------------------------------------------------------------------------
  var STATUS_WORD = { A: "added", M: "modified", D: "deleted", R: "renamed", C: "copied", T: "type changed" };
  function fileTable(files) {
    if (!files.length) return empty("No files in the model.");
    return table(["Path", "Status", "+ Added", "− Deleted"], files.map(function (f) {
      var path = [h("span", "mono", f.path)];
      if (f.previous_path) append(path[0], h("span", "muted", " (from " + f.previous_path + ")"));
      var stw = STATUS_WORD[String(f.status || "").charAt(0)] || f.status || "";
      return { cells: [{ node: path }, stw + (f.binary ? " (binary)" : ""),
        { num: true, node: h("span", "add", "+" + (f.additions || 0)) }, { num: true, node: h("span", "del", "−" + (f.deletions || 0)) }] };
    }));
  }

  // -------------------------------------------------------------------------
  // Sections
  // -------------------------------------------------------------------------
  var verdictStatus = (sectionById.summary && sectionById.summary.status) || "unknown";

  // -------------------------------------------------------------------------
  // Summary: the answer first (can it merge, what is missing, who acts), then
  // detail on demand. Plain words for contributors new to the project.
  // -------------------------------------------------------------------------
  var STEPS = [["ticket", "Ticket"], ["testing", "Tests"], ["build", "Build"], ["review", "Code review"], ["ci", "CI"], ["votes", "+1 votes"]];
  var OWNER_ORDER = ["contributor", "committer", "reviewer"];
  var OWNER_PHRASE = { contributor: "the contributor", committer: "a committer", reviewer: "reviewers" };
  var OWNER_TITLE = { contributor: "Contributor", committer: "Committer", reviewer: "Reviewers" };
  var VERDICT_NOTE = {
    "draft": "This PR is a draft. Treat this report as early feedback, not a merge decision.",
    "needs-work": "Every blocking check passes. The contributor still has fixes to make.",
    "insufficient-evidence": "Some required inputs could not be read, so the tool cannot say whether the requirements are met.",
    "awaiting-review": "The contributor's part is done. What remains is for reviewers or committers.",
    "requirements-met-unreviewed": "Code review has not run yet. The merge requirements pass, but no review lens has read the code, so this is not a ready-to-merge verdict.",
    "ready": "Every blocking requirement passes and every review lens approved. A committer makes the final call."
  };
  var GLOSSARY = [
    ["Blocking", "The PR cannot merge until this passes."],
    ["Advisory", "A request or a note. It does not stop the merge by itself."],
    ["Committer", "A project member who can merge code and run CI."],
    ["+1 vote", "A committer approves the change. Two are needed."],
    ["CI", "The full automated test run. Results are attached to the JIRA ticket."],
    ["Fix Version", "The release versions in JIRA where this fix will ship."],
    ["Lens", "One automated reviewer that reads the code for one kind of problem."],
    ["Blocker, major, minor, nit", "How serious a code review issue is. Blockers and majors must be fixed."],
    ["Pass, Warning, Fail", "The check passed, needs attention, or did not pass."],
    ["Unknown, N/A", "The check could not be decided, or does not apply to this PR."]
  ];

  function ownerKey(o) { return OWNER_ORDER.indexOf(o) >= 0 ? o : (o || "other"); }
  function ownerTitle(o) { return OWNER_TITLE[o] || ownerLabel(o); }
  function joinWords(words) {
    if (words.length < 2) return words.join("");
    return words.slice(0, -1).join(", ") + " and " + words[words.length - 1];
  }
  function issueOfFinding(fid) {
    var issues = (M.review && M.review.issues) || [];
    for (var i = 0; i < issues.length; i++) {
      var it = issues[i];
      if (it.id === fid || (it.members || []).some(function (m) { return m.id === fid; })) return it;
    }
    return null;
  }
  function isBlockingReason(r) {
    var c = r.check ? checkById[r.check] : null;
    return typeof r.blocking === "boolean" ? r.blocking : (c ? !!c.blocking : false);
  }
  // One to-do item: a short title, and the detail it opens to.
  function todoFromReason(r) {
    var item = { owner: ownerKey(r.owner), status: r.status, must: isBlockingReason(r) };
    if (r.finding) {
      var iss = issueOfFinding(r.finding);
      var sev = (iss && iss.severity) || r.severity || "";
      var loc = (iss && iss.location) || String(r.summary || "").split(" — ")[0];
      var file = String(loc || "").split("/").pop();
      item.title = "Fix the " + (sev ? sev + " " : "") + "code review issue" + (file ? " in " + file : "");
      item.body = [iss ? mdInline("p", iss.problem) : (r.summary ? mdInline("p", r.summary) : null),
        (iss ? iss.fix : r.action) ? h("div", "next", [h("span", "lead", "Fix"), mdInline("span", iss ? iss.fix : r.action)]) : null];
      item.href = "#review";
      item.label = "Code review";
    } else {
      item.title = r.title || r.check || "";
      item.body = [r.summary ? mdInline("p", r.summary) : null, r.action ? nextStep(r.action, r.owner) : null];
      item.check = r.check;
      item.href = r.check && sectionOfCheck[r.check] ? "#" + sectionOfCheck[r.check] : null;
      item.label = item.href ? sectionById[sectionOfCheck[r.check]].title : null;
    }
    return item;

    } catch (e) {
      if (typeof console !== "undefined") console.error(e);
      body = [h("div", "notice s-fail", [h("strong", null, "This section failed to render. "), String(e && e.message || e)])];
    }
    append(el, body.filter(Boolean));
    content.appendChild(el);
    sectionEls[s.id] = el;
  });

  // -------------------------------------------------------------------------
  // Routing: one section at a time, current section in location.hash.
  // -------------------------------------------------------------------------
  var crumb = document.getElementById("crumb");
  var current = null, pendingCheck = null, focusHeading = false;
  function show(id) {
    var openTodo = id === "todo" && sectionEls.summary;
    if (openTodo) id = "summary";
    if (!sectionEls[id]) id = sectionEls.summary ? "summary" : sectionIds[0];
    if (current !== id) {
      Object.keys(sectionEls).forEach(function (k) {
        sectionEls[k].classList.toggle("active", k === id);
        if (k === id) navLinks[k].setAttribute("aria-current", "page"); else navLinks[k].removeAttribute("aria-current");
      });
      current = id;
      crumb.textContent = "";
      append(crumb, ["PR #" + pr.number + " · ", h("strong", null, sectionById[id].title)]);
      window.scrollTo(0, 0);
    }
    if (pendingCheck) {
      var card = document.getElementById("check-" + pendingCheck);
      pendingCheck = null;
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.classList.add("flash");
        setTimeout(function () { card.classList.remove("flash"); }, 1600);
      }
    } else if (openTodo) {
      var td = document.getElementById("todo");
      td.open = true;
      td.scrollIntoView({ block: "start" });
      td.querySelector("summary").focus({ preventScroll: true });
    } else if (focusHeading) {
      var hd = document.getElementById("h-" + id);
      if (hd) hd.focus({ preventScroll: true });
    }
    focusHeading = false;
  }
  function route() { show(decodeURIComponent((location.hash || "").replace(/^#/, ""))); }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a) return;
    pendingCheck = a.getAttribute("data-check");
    focusHeading = true;
    closeNav();
    if (a.getAttribute("href") === location.hash) { ev.preventDefault(); show(location.hash.slice(1)); }
  });
  if (!location.hash || (!sectionEls[location.hash.slice(1)] && location.hash !== "#todo")) {
    try { history.replaceState(null, "", "#summary"); } catch (e) { /* file:// in some browsers */ }
  }
  route();

  // -------------------------------------------------------------------------
  // Narrow-screen nav
  // -------------------------------------------------------------------------
  var navToggle = document.getElementById("nav-toggle");
  var scrim = null;
  function openNav() {
    document.body.classList.add("nav-open");
    navToggle.setAttribute("aria-expanded", "true");
    scrim = h("div");
    scrim.id = "nav-scrim";
    scrim.addEventListener("click", closeNav);
    document.body.appendChild(scrim);
    var cur = navLinks[current];
    if (cur) cur.focus();
  }
  function closeNav() {
    if (!document.body.classList.contains("nav-open")) return;
    document.body.classList.remove("nav-open");
    navToggle.setAttribute("aria-expanded", "false");
    if (scrim) { scrim.remove(); scrim = null; }
  }
  navToggle.addEventListener("click", function () {
    if (document.body.classList.contains("nav-open")) { closeNav(); navToggle.focus(); } else openNav();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && document.body.classList.contains("nav-open")) { closeNav(); navToggle.focus(); }
  });

  // -------------------------------------------------------------------------
  // Theme: system -> light -> dark, remembered per browser.
  // -------------------------------------------------------------------------
  var THEMES = ["system", "light", "dark"];
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = "Theme: " + t;
    themeBtn.setAttribute("aria-label", "Colour theme: " + t + ". Activate to change.");
  }
  var theme = "system";
  try { theme = localStorage.getItem("cpr-theme") || "system"; } catch (e) { /* storage blocked */ }
  if (THEMES.indexOf(theme) < 0) theme = "system";
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    try { localStorage.setItem("cpr-theme", theme); } catch (e) { /* storage blocked */ }
  });

  // -------------------------------------------------------------------------
  // Print: open every <details> while printing, then restore.
  // -------------------------------------------------------------------------
  var reopened = [];
  window.addEventListener("beforeprint", function () {
    reopened = Array.prototype.filter.call(document.querySelectorAll("details:not([open])"), function (d) { d.open = true; return true; });
  });
  window.addEventListener("afterprint", function () {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  });
})();
</script>
</body>
</html>
