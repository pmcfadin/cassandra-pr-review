<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cassandra PR review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!--TOKENS-->
<style>
pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; background: var(--soft); border: 1px solid var(--rule-2);
  border-radius: var(--r-card); padding: 12px 14px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; max-width: 100%; }
pre code { background: none; border: 0; padding: 0; }
ul, ol { margin: 6px 0; padding-left: 22px; }
li { margin: 2px 0; }
.chev { transition: transform .15s; }
[aria-expanded="true"] > .chev, [aria-expanded="true"] .chev { transform: rotate(180deg); }
.row:hover { background: var(--hover); }
.stack > *, .gx > *, .cc-body > *, .bg-card > *, .blk, .group-body, .card { min-width: 0; max-width: 100%; }

/* ---------------------------------------------------------------------------
   Shell: dark nav on the left, one scrolling column on the right
   --------------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.navcol { background: var(--navy); }
#nav { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 24px 14px 24px; display: flex; flex-direction: column; gap: 22px; }
.nav-head { padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--navy-mute); }
.nav-pr { font-size: 22px; font-weight: 700; color: var(--on-navy); text-decoration: none; letter-spacing: -0.01em; }
.nav-pr:hover { color: var(--on-navy); text-decoration: underline; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 3px; }
#nav-toggle { display: none; color: var(--navy-ink); border: 1px solid var(--navy-line); border-radius: 6px; min-height: 44px; padding: 0 14px; align-items: center; gap: 8px; font-size: 15px; }
#nav-body { display: flex; flex-direction: column; gap: 22px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group .eyebrow { padding: 0 8px 6px; }
.nav-link { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 3px; text-decoration: none; font-size: 15px; color: var(--navy-ink); }
.nav-link:hover { background: var(--navy-hover); color: var(--on-navy); }
.nav-link[aria-current="location"] { background: var(--navy-active); color: var(--on-navy); font-weight: 600; }
.nav-link:focus-visible { outline-color: var(--on-navy); }
.nav-link .lbl { flex: 1; min-width: 0; }
.nav-link .cnt { font-size: 12px; color: var(--navy-mute); }
.nav-ic.nav-fail { color: var(--nav-fail); } .nav-ic.nav-should { color: var(--nav-should); } .nav-ic.nav-note { color: var(--nav-note); }
.nav-ic.nav-unknown { color: var(--nav-unknown); } .nav-ic.nav-pass { color: var(--nav-pass); } .nav-ic.nav-na { color: var(--nav-na); }
.nav-dot { flex: none; width: 14px; display: flex; justify-content: center; }
.nav-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-dot); display: block; }
.nav-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--navy-mute); display: flex; flex-direction: column; gap: 2px; }

.col { min-width: 0; }
header.pr { background: var(--panel); border-bottom: 1px solid var(--rule); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
header.pr .wrap { padding-top: 22px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-3); }
.facts .mono { font-size: 13px; color: var(--ink); }
.facts .tag { font-size: 12px; }
.add { color: var(--pass-icon); } .del { color: var(--fail-icon); }
h1.title { font-size: 24px; font-weight: 600; max-width: 52ch; overflow-wrap: anywhere; }
.ticket-line { margin: 0; font-size: 14px; color: var(--ink-3); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 36px; }
section[id], div[id^="sec-"], div[id^="bg-"], div[id^="check-"], li[id^="check-"] { scroll-margin-top: 12px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-head > div { display: flex; flex-direction: column; gap: 4px; }
h2.sec { font-size: 22px; font-weight: 600; }
.sub { margin: 0; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 16px; }
/* ---------------------------------------------------------------------------
   Verdict and To do
   --------------------------------------------------------------------------- */
.verdict { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding: 18px 24px; }
.verdict-main { display: flex; gap: 14px; align-items: center; flex: 1 1 340px; min-width: 0; }
.v-icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--c-fg); background: var(--c-bg); }
.v-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.v-text h2 { font-size: 26px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.v-text p { margin: 0; color: var(--ink-2); }
.v-text p.note { font-size: 14px; color: var(--ink-3); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
.steps li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 3px; font-size: 14px; font-weight: 500; margin: 0; color: var(--c-fg); background: var(--c-bg); }
.v-extra { border-top: 1px solid var(--rule-2); padding: 0 24px 4px; }
.todo { border-top: 1px solid var(--rule-2); }
.todo-head { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 12px 24px; min-height: 48px; background: var(--soft); }
.todo-head .t { font-weight: 600; }
.todo-head .r { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ink-2); }
.todo-head .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--link); }
.role { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule-2); }
.role-name { flex: 0 0 170px; padding: 14px 20px; font-weight: 600; font-size: 15px; display: flex; flex-direction: column; }
.role-name small { font-weight: 400; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.role ul { list-style: none; margin: 0; padding: 0; flex: 1 1 360px; min-width: 0; }
.role li { margin: 0; }
.todo-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 20px 10px 0; min-height: 44px; }
.todo-item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; }
.todo-item .tt { font-weight: 500; }
.todo-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 13px; color: var(--ink-3); }
.todo-item .loc { font-family: var(--mono); font-size: 12.5px; }
.todo-item .src { padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; font-size: 12px; color: var(--ink-2); }
.todo-item .step-mark { display: inline-flex; color: var(--na-icon); }
.role-name .phase { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.todo-detail { padding: 0 20px 12px 24px; font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.todo-detail p { margin: 0; }
.todo-detail .tg { font-size: 12px; color: var(--ink-3); }
.todo:not(.show-opt) .opt { display: none; }
.todo:not(.show-opt) .role.only-opt { display: none; }
#opt-toggle { width: 100%; padding: 12px 20px; min-height: 44px; font-size: 14px; font-weight: 500; color: var(--link); background: var(--soft); border-top: 1px solid var(--rule-2); }

/* ---------------------------------------------------------------------------
   Check groups
   --------------------------------------------------------------------------- */
.group { border-bottom: 1px solid var(--rule-2); }
.group:last-child { border-bottom: 0; }
.group-head { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px 20px; min-height: 56px; }
.group-head .l { display: flex; align-items: center; gap: 12px; flex: 1 1 280px; min-width: 0; font-weight: 600; font-size: 16px; }
.group-head .r { flex: 999 1 280px; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 15px; }
.group-head .r .sum { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.group-head .r .n { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.group-body { background: var(--soft); padding: 4px 20px 18px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist > li { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: 4px; background: var(--panel); margin: 0; }
.ck-icon { flex: none; margin-top: 2px; width: 20px; display: flex; justify-content: center; }
.ck-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ck-title { font-weight: 500; overflow-wrap: anywhere; }
.ck-sum { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.ck-ev { margin: 2px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.ck-ev.capped:not(.all) > li.more { display: none; }
.ev-more { align-self: flex-start; min-height: 40px; }
.howfix { margin-top: 6px; font-size: 14px; background: var(--soft-2); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.ck-tags { flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ck-flash { box-shadow: 0 0 0 3px var(--flash); }
.gx { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.gx .blk > h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.gx .blk > h3 .count { font-size: 12px; }
.gx .blk h4 { font-size: var(--fs-md); font-weight: 600; margin: 14px 0 6px; }
.gx .blk > h4 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 16px; }
/* Tables (.dtable), field lists, details */
.pm-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
.pm-cat { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--r-card); background: var(--c-bg); color: var(--c-fg); border-left: 3px solid var(--c-icon); min-width: 0; }
.pm-cat b { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.pm-cat span { font-size: var(--fs-sm); overflow-wrap: anywhere; }
.pm-cat.zero { opacity: .55; }
.pm-table table { table-layout: fixed; }
.pm-table th:nth-child(2) { width: 150px; } .pm-table th:nth-child(3) { width: 100px; } .pm-table th:nth-child(4) { width: 100px; }
.pm-table .mono { overflow-wrap: anywhere; word-break: break-all; }
.pm-rule { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; }
.pm-locs { list-style: none; margin: 4px 0 0; padding: 0; font-size: var(--fs-sm); }
.pm-locs li { padding: 3px 0; border-top: 1px solid var(--rule-2); overflow-wrap: anywhere; }
.pm-locs .mono { font-size: var(--fs-sm); }
.pm-base { font-size: var(--fs-sm); color: var(--ink-2); margin: 8px 0; }
.pm-house, .pm-usual { margin-top: 12px; }
.pm-table tr.pm-untyped td { opacity: .55; }
.pm-table tr.pm-untyped .pm-rule { text-decoration: line-through; text-decoration-thickness: 1px; }
.pm-need { font-size: var(--fs-sm); color: var(--ink-2); }
@media (max-width: 640px) { .pm-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pm-table th:nth-child(n) { width: auto; } }
.cx-score { display: inline-block; min-width: 34px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--r-chip); color: var(--c-fg); background: var(--c-bg); border-left: 3px solid var(--c-icon); }
.cx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); margin: 6px 0 10px; }
.cx-table td:first-child { width: 64px; }
.cx-table .tag { margin-left: 8px; }
.s-crit { --c-fg: var(--on-navy); --c-bg: var(--fail-icon); --c-icon: var(--fail-fg); }
.cx-faded td { opacity: .55; }
.cx-split td { background: var(--soft, transparent); font-size: var(--fs-sm); padding-top: 12px; }
.cx-up { color: var(--fail-fg); font-weight: 600; } .cx-down { color: var(--pass-fg); font-weight: 600; }
.cx-file { font-size: var(--fs-sm); margin-top: 2px; overflow-wrap: anywhere; }
.cx-table td:nth-child(2) { width: 90px; }
.dtable { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--panel); max-width: 100%; }
.dtable table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
.dtable th, .dtable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; overflow-wrap: break-word; }
.dtable th { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); background: var(--soft); white-space: nowrap; }
.dtable tbody tr:last-child td { border-bottom: 0; }
.dtable td.num, .dtable th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtable .mono { font-size: var(--fs-sm); overflow-wrap: break-word; }
.dtable tr.self td { background: var(--note-bg); }
.dtable.capped:not(.all) tr.more { display: none; }
.dtable .dt-more { display: flex; width: 100%; justify-content: center; border-top: 1px solid var(--rule-2); background: var(--soft); min-height: 44px; }
.dtable .ck-title { font-weight: 500; }
.dtable .paths { display: flex; flex-direction: column; gap: 2px; }
.nowrap { white-space: nowrap; }
dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.fields dt { color: var(--ink-3); font-size: var(--fs-md); }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
details { border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--panel); margin: 8px 0; }
details > summary { cursor: pointer; padding: 10px 14px; min-height: 44px; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: var(--fs-md); color: var(--link); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
details > summary:hover { background: var(--hover); }
details[open] > summary { border-bottom: 1px solid var(--rule-2); }
details > .d-body { padding: 10px 14px; overflow-wrap: anywhere; }
details.inline { border: 0; background: none; margin: 0; }
details.inline > summary { padding: 0; min-height: 0; }
details.inline[open] > summary { border: 0; }
details.inline > .d-body { padding: 6px 0 0; }
/* "How this is judged": the same quiet collapsible card in every group */
details.howto { background: var(--soft); }
details.howto > summary { color: var(--ink-2); font-weight: 600; }
details.howto > summary::after { content: " \2014  scoring rules and sources"; font-weight: 400; color: var(--ink-3); white-space: pre; }
details.howto > .d-body { background: var(--panel); border-radius: 0 0 var(--r-card) var(--r-card); }
.empty .why { display: block; font-style: normal; font-size: var(--fs-md); }
.self-start { align-self: flex-start; }
.comment { border-top: 1px solid var(--rule-2); padding: 10px 0; }
.comment:first-child { border-top: 0; padding-top: 0; }
.comment .who { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.md h1 { font-size: 19px; margin: 14px 0 8px; } .md h2 { font-size: 17px; margin: 14px 0 6px; }
.md h3, .md h4, .md h5, .md h6 { font-size: 15px; margin: 12px 0 4px; }
.md > :first-child { margin-top: 0; }
.md { overflow-wrap: anywhere; }

/* ---------------------------------------------------------------------------
   Code review findings
   --------------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; align-items: center; }
.sevchip { padding: 4px 12px; border-radius: 3px; font-weight: 600; background: var(--rule-3); color: var(--ink-2); }
.sevchip.blocker { background: var(--fail-icon); color: var(--on-navy); }
.sevchip.major { background: var(--fail-bg); color: var(--fail-fg); }
.finding { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.finding-head { width: 100%; display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; min-height: 56px; }
.sev { flex: none; width: 70px; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 0; border-radius: 6px; background: var(--rule-3); color: var(--ink-2); }
.sev.blocker { background: var(--fail-icon); color: var(--on-navy); } .sev.major { background: var(--fail-bg); color: var(--fail-fg); }
.finding-head .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.finding-head .hl { font-weight: 600; overflow-wrap: anywhere; }
.finding-head .loc { font-family: var(--mono); font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.finding-body { padding: 0 20px 20px 104px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.finding-body .lab { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.finding-body p { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); overflow-wrap: anywhere; }
.finding-body .full { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.lens-card { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 16px; margin: 8px 0; }
.lens-card { overflow-wrap: anywhere; min-width: 0; }
.lens-card h4 { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lens-card .fd { border-top: 1px solid var(--rule-2); padding: 10px 0 0; margin-top: 10px; }
.lens-card .fd .t { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: 500; }

/* ---------------------------------------------------------------------------
   Background cards
   --------------------------------------------------------------------------- */
.bg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.bg-card { overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bg-card.full { grid-column: 1 / -1; }
.bg-card h3 { font-size: 17px; font-weight: 600; }
.bg-card .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rating { font-size: 14px; font-weight: 600; color: var(--note-fg); background: var(--note-bg); padding: 2px 10px; border-radius: 3px; text-transform: capitalize; }
.bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bar i { height: 6px; border-radius: 3px; background: var(--bar-off); display: block; }
.bar i.on { background: var(--link); }
.bg-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.sig { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sig li { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-3); margin: 0; }
.sig li .v { text-align: right; overflow-wrap: anywhere; }
.sig li .why { display: block; font-size: 13px; color: var(--ink-3); }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.people li { display: flex; gap: 12px; align-items: center; margin: 0; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--rule-3); color: var(--ink-2); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.avatar.involved { background: var(--note-bg); color: var(--note-fg); }
.people .who { display: flex; flex-direction: column; min-width: 0; }
.people .who .nm { font-weight: 500; overflow-wrap: anywhere; }
.people .who small { font-size: 13px; color: var(--ink-3); }
.hist { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.hist + .hist { border-top: 1px solid var(--rule-3); padding-top: 12px; }
.hist .a { font-weight: 500; } .hist .b { color: var(--ink-2); overflow-wrap: anywhere; } .hist .c { color: var(--ink-3); font-size: 13px; }
.filelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.filelist li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; margin: 0; }
.filelist .p { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.filelist .st { font-size: 12px; color: var(--ink-3); }
.filelist .d { white-space: nowrap; }
.diff-wrap { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: var(--r-card); overflow: hidden; background: var(--panel); }
.diff-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--rule-2); font-size: var(--fs-md); }
.diff-bar b { font-weight: 600; }
.diff-bar span { color: var(--ink-3); font-size: var(--fs-sm); }
.diff-frame { display: block; width: 100%; height: 80vh; min-height: 480px; border: 0; background: var(--panel); }
.diff-wrap > .notice, .diff-wrap > p { margin: 10px 14px; }
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bg-card.collapsible-card { padding: 0; gap: 0; }
.collapsible-card > .cc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; min-height: 56px; }
.cc-head .tt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cc-head .r { display: inline-flex; align-items: center; gap: 10px; }
.card > .cc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; min-height: 56px; }
.cc-head .tt b { font-weight: 600; font-size: 17px; }
.cc-head .tt span { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.cc-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
dl.gloss { margin: 0; padding: 0 20px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 28px; }
dl.gloss div { display: flex; flex-direction: column; gap: 2px; }
dl.gloss dt { font-weight: 600; } dl.gloss dd { margin: 0; font-size: 15px; color: var(--ink-2); }
footer.ft { font-size: 13px; color: var(--ink-3); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule); padding-top: 16px; }
footer.ft .line { display: flex; flex-wrap: wrap; gap: 6px 20px; }
footer.ft .mono { color: var(--ink); }
footer.ft .about { background: var(--panel); }
footer.ft .about ul { margin: 4px 0; }
.print-only { display: none; }

#no-data { display: none; margin: 40px auto; max-width: 640px; padding: 20px 24px; border: 2px solid var(--fail-icon); border-radius: 6px; background: var(--panel); }
#no-data h1 { font-size: 20px; color: var(--fail-fg); margin-bottom: 8px; }
body.no-data .app { display: none; }
body.no-data #no-data { display: block; }

/* ---------------------------------------------------------------------------
   Phone width: the nav becomes a top bar with a Sections button; nothing scrolls sideways.
   --------------------------------------------------------------------------- */
@media (max-width: 799.98px) {
  .app { display: block; }
  #nav { position: static; max-height: none; padding: 14px 16px; gap: 12px; }
  .nav-head { padding: 0; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .nav-head .eyebrow { flex-basis: 100%; }
  #nav-toggle { display: inline-flex; margin-left: auto; }
  #nav-body { display: none; }
  #nav.open #nav-body { display: flex; }
  .wrap, main { padding-left: 16px; padding-right: 16px; }
  main { gap: 28px; padding-top: 18px; }
  .verdict { padding: 16px; }
  .v-text h2 { font-size: 22px; }
  h1.title { font-size: 21px; }
  .todo-head { padding: 12px 16px; }
  .role-name { flex-basis: 100%; padding: 12px 16px 0; }
  .todo-item { padding-left: 16px; }
  .todo-detail { padding-left: 16px; }
  .group-head { padding: 14px 16px; }
  .group-body { padding: 4px 12px 14px; }
  .checklist > li { flex-wrap: wrap; }
  .ck-tags { flex-direction: row; flex-wrap: wrap; align-items: center; flex-basis: 100%; padding-left: 32px; }
  .finding-head { padding: 14px 16px; gap: 10px; }
  .sev { width: 62px; }
  .finding-body { padding: 0 16px 16px 16px; }
  /* Tables stack: each row is a small card of label/value pairs, so nothing scrolls sideways. */
  .dtable { overflow: visible; border: 0; background: none; }
  .dtable table, .dtable tbody, .dtable tr, .dtable td { display: block; width: 100%; }
  .dtable thead { display: none; }
  .dtable tr { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-card); margin-bottom: 8px; padding: 4px 12px; }
  .dtable.capped:not(.all) tr.more { display: none; }
  .dtable td { display: block; border: 0; padding: 6px 0; overflow-wrap: anywhere; }
  .dtable td::before { content: attr(data-label); display: block; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1px; }
  .dtable td.num { text-align: left; white-space: normal; }
  .dtable td.blank { display: none; }
  .dtable tr.self { border-color: var(--note-icon); background: var(--note-bg); }
  .dtable tr.self td { background: none; }
  .dtable .dt-more { border: 1px solid var(--rule); border-radius: var(--r-card); min-height: 44px; }
  .outline-btn, .linkbtn, details > summary { min-height: 44px; }
  .diff-frame { height: 70vh; min-height: 360px; }
  .actions .outline-btn { flex: 1 1 auto; justify-content: center; }
  dl.fields { grid-template-columns: 1fr; gap: 0; }
  dl.fields dd { margin-bottom: 8px; }
  .bg-card { padding: 16px; }
  .cc-head, .collapsible-card > .cc-head { padding: 14px 16px; }
  .cc-body { padding: 0 16px 16px; }
  dl.gloss { padding: 0 16px 16px; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

/* ---------------------------------------------------------------------------
   Print: everything expanded, no navigation, diff view replaced by the file list
   --------------------------------------------------------------------------- */
@media print {
  body { background: var(--panel); font-size: 11.5pt; }
  .navcol, .no-print, .diff-wrap, .chev { display: none !important; }
  .app { display: block; }
  main, .wrap { max-width: none; padding-left: 0; padding-right: 0; }
  [hidden].cbody { display: block !important; }
  .todo .opt { display: flex !important; }
  .todo .role.only-opt { display: flex !important; }
  details::details-content { content-visibility: visible; display: block; }
  .card, .finding, .bg-card, .checklist > li, .dtable tr { break-inside: avoid; }
  .dtable.capped tr.more { display: table-row !important; }
  .ck-ev.capped > li.more { display: list-item !important; }
  .ev-more { display: none !important; }
  .dt-more { display: none !important; }
  .print-only { display: block; }
  a { color: inherit; }
}

</div>
<!--REPORT_MODEL-->
<script>
(function () {
  "use strict";


  // -------------------------------------------------------------------------
  // Escaping and links. Everything from the model is untrusted text.
  // -------------------------------------------------------------------------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")

  var TABLE_CAP = 20;
  function table(headers, rows, opts) {

    var tr = h("tr");

      th.scope = "col";
      tr.appendChild(th);

      tb.appendChild(row);
    });

    var box = h("div", "dtable" + (capped ? " capped" : "") + ((opts && opts.cls) ? " " + opts.cls : ""), t);

  }
  function list(items, render) {

  }
  function empty(text, fill) { return h("p", "empty", fill ? [text, h("span", "why", fill)] : text); }

  // -------------------------------------------------------------------------
  // Status words, kinds and icons (design D2). Colour is never the only signal:
  // every status carries an icon shape and a word.
  // -------------------------------------------------------------------------
  var WORD_KIND = { "Must fix": "fail", "Should fix": "should", "Note": "note", "Unknown": "unknown", "Passed": "pass", "Not needed": "na" };
  var STATUS_KIND = { "pass": "pass", "fail": "fail", "warn": "should", "unknown": "unknown", "info": "note", "not-applicable": "na" };

  function kindOfStatus(s) { return STATUS_KIND[s] || "unknown"; }
  function wordOfKind(k) { return { fail: "Must fix", should: "Should fix", note: "Note", pass: "Passed", na: "Not needed" }[k] || "Unknown"; }

  var CIRCLE = "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z";
  var ICONS = {
    fail: ["M7 7l10 10M17 7L7 17"],
    should: ["M12 4L2.5 20h19z", "M12 10v4M12 17v.5"],
    note: [CIRCLE, "M12 11v5M12 7.5v.5"],
    unknown: [CIRCLE, "M9.7 9.7a2.4 2.4 0 1 1 3.6 2.1c-.8.5-1.3 1-1.3 1.9M12 16.5v.5"],
    pass: ["M5 12.5l4.5 4.5L19 7.5"],
    na: ["M6 12h12"],
    chev: ["M6 9l6 6 6-6"],
    blocked: ["M8 8l8 8M16 8l-8 8"],
    waiting: ["M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z", "M12 8v4l3 2"],
    ready: ["M5 12.5l4.5 4.5L19 7.5"],
    draft: ["M6 12h12"]

    s.setAttribute("height", String(size));
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", String(sw));

  function monthYear(d) {

  // -------------------------------------------------------------------------
  // Collapsible regions: a real button with aria-expanded controls a hidden panel.
  // -------------------------------------------------------------------------

  // -------------------------------------------------------------------------
  // Model
  // -------------------------------------------------------------------------

    if (typeof console !== "undefined") console.error("report: window.REPORT_MODEL is missing or malformed");
    return;

    var on = !navEl.classList.contains("open");
    navEl.classList.toggle("open", on);
    navToggle.setAttribute("aria-expanded", on ? "true" : "false");
  });
  function closeNav() {
    navEl.classList.remove("open");
    navToggle.setAttribute("aria-expanded", "false");
  }

  // -------------------------------------------------------------------------
  // Deep links (D3). A hash opens its target and everything around it.
  // -------------------------------------------------------------------------
  var LEGACY = { summary: "status", review: "findings", triage: "bg-effort", context: "bg-people", about: "about",
    ticket: "sec-ticket", ci: "sec-ci", testing: "sec-testing", build: "sec-build", commits: "sec-commits", static: "sec-static",
    compatibility: "sec-compatibility", votes: "sec-votes", labplan: "labplan", changes: "changes" };
  var spyLockUntil = 0;
  function setActive(id) {
    Object.keys(navLinks).forEach(function (k) {
      if (k === id) navLinks[k].setAttribute("aria-current", "location"); else navLinks[k].removeAttribute("aria-current");
    });
  }
  function keyForHref(href) {
    var key = null;
    Object.keys(navLinks).forEach(function (k) { if (navLinks[k].getAttribute("href") === href) key = k; });
    return key;
  }
  function go(raw) {
    var id = decodeURIComponent(String(raw || "").replace(/^#/, ""));
    if (!id) return;
    if (!document.getElementById(id) && LEGACY[id]) id = LEGACY[id];
    var el = document.getElementById(id);
    if (!el) return;
    openAncestors(el);
    if (el._ctl) el._ctl.set(true);
    var own = el.matches(".group, .bg-card, #glossary, #next") ? el.querySelector(":scope > .cbody") : null; // a group, the lab plan, the glossary or the To do panel
    if (own && own._ctl) own._ctl.set(true);
    if (id === "changes") openDiff();
    el.scrollIntoView({ block: "start" });
    if (el.tagName === "LI") { el.classList.add("ck-flash"); setTimeout(function () { el.classList.remove("ck-flash"); }, 1600); }
    var hit = null;
    navOrder.forEach(function (n) { if (n.el === el || n.el.contains(el)) hit = n; });
    var key = hit && keyForHref(hit.href);
    if (key) { spyLockUntil = Date.now() + 800; setActive(key); }
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a || a.getAttribute("href") === "#") return;
    ev.preventDefault();
    var href = a.getAttribute("href");
    closeNav();
    try { if (location.hash !== href) history.pushState(null, "", href); } catch (e) { location.hash = href; return; }
    go(href);
  });
  window.addEventListener("hashchange", function () { go(location.hash); });

  // Scroll-spy: highlight the last target whose top has passed 30% of the viewport.
  function spy() {
    if (Date.now() < spyLockUntil) return;
    var line = window.innerHeight * 0.3, cur = navOrder.length ? navOrder[0] : null;
    navOrder.forEach(function (n) { if (n.el.getBoundingClientRect().top <= line) cur = n; });
    // At the very bottom the last items can never reach the line; the last one is current then.
    if (navOrder.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) cur = navOrder[navOrder.length - 1];
    if (!cur) return;
    var key = keyForHref(cur.href);
    if (key) setActive(key);
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function () { spy(); }, { rootMargin: "0px 0px -70% 0px", threshold: [0, 1] });
    navOrder.forEach(function (n) { io.observe(n.el); });
  }
  window.addEventListener("scroll", function () { if (Date.now() >= spyLockUntil) spy(); }, { passive: true });
  setActive("status");
  if (location.hash && location.hash.length > 1) go(location.hash); else spy();

  // Print: open every <details> while printing, then restore.
  var reopened = [];
  window.addEventListener("beforeprint", function () {
    reopened = Array.prototype.filter.call(document.querySelectorAll("details:not([open])"), function (d) { d.open = true; return true; });
  });
  window.addEventListener("afterprint", function () {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  });
})();
</script>
</body>
</html>
